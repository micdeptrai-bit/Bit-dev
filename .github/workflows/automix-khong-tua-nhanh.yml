name: Automix - không tua nhanh / không đổi tốc độ khi chuyển bài

# Chạy tay: tab Actions -> chọn workflow này -> Run workflow.
# Một file duy nhất: patch nằm ngay trong file này (diff dạng chữ thường, KHÔNG nén/base64)
# nên đọc và duyệt được từng dòng. Workflow áp patch lên bản checkout, chạy test, build APK.
# Mặc định KHÔNG commit gì vào repo. Bật "push_branch" nếu muốn đẩy sang nhánh để mở PR.
#
# Mục tiêu: Automix KHÔNG BAO GIỜ đổi tốc độ nhạc. Hết cảnh bài vọt lên rồi tụt xuống khi chuyển bài.
# Có 3 chỗ làm đổi tốc độ, patch tắt cả 3:
#   1. TransitionPlanner.incomingRateFor: trước đây kéo tốc độ bài mới (tới ~10%) cho khớp BPM bài cũ,
#      rồi CrossfadeController hạ từ từ về 1.0 sau khi mix xong. Giờ luôn 1.0 (cờ TEMPO_STRETCH_ENABLED).
#   2. CrossfadeController phase lock: giật tốc độ bài mới +-3% liên tục để canh beat. Giờ tắt.
#   3. Loop mix: ramp "tempo chủ" từ BPM bài cũ sang BPM bài mới (tối đa 2.5 BPM/ô nhịp, tới 24 ô nhịp)
#      bằng Signalsmith Stretch. Đây là chỗ nghe tua nhanh rõ nhất khi hai bài lệch BPM nhiều.
#      Giờ loop mix chỉ chạy khi hai bài cùng tempo (lệch <= 0.6 BPM, không nghe được); cặp lệch BPM
#      rơi về crossfade/filter thường. LoopMix.plan có tham số mới maxTempoGapBpm (mặc định không giới
#      hạn nên test cũ của planner thuần giữ nguyên), CrossfadeController truyền LOOP_MAX_TEMPO_GAP_BPM.
#   4. Test: 3 test cũ đòi bài mới bị kéo tốc độ -> đổi thành đòi 1.0; thêm 1 test cho cổng loop mix.
#
# Hệ quả cần biết: không còn beatmatch bằng kéo tempo, nên cặp lệch BPM nghe là fade thường.
# Patch này chạy được cùng automix-fixes.yml (đã thử áp chồng, không đụng hunk nhau). Đừng chạy chung với
# workflow automix-* khác nếu chúng cũng sửa incomingRateFor / adaptiveOverlap / phaseLock.

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Chạy test của module shared trước khi build (khuyến nghị)"
        type: boolean
        default: true
      build_apk:
        description: "Build APK dev benchmark (R8 + baseline profile, ký bằng khoá debug)"
        type: boolean
        default: true
      push_branch:
        description: "Đẩy bản đã vá sang nhánh automix-no-speedup (để bạn mở PR). Tắt = không commit gì"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: automix-no-speedup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FIX_BRANCH: automix-no-speedup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the patch
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/automix-no-speedup.patch" <<'PATCH_EOF'
          diff --git a/shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/TransitionPlanner.kt b/shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/TransitionPlanner.kt
          --- a/shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/TransitionPlanner.kt
          +++ b/shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/TransitionPlanner.kt
          @@ -1147,7 +1147,18 @@
            */
           @Suppress("UNUSED_PARAMETER")
           private fun incomingRateFor(mediaRatio: Double, advanced: Boolean): Double =
          -    roundRate(clamp(mediaRatio, MIN_INCOMING_RATE, MAX_INCOMING_RATE))
          +    if (TEMPO_STRETCH_ENABLED) {
          +        roundRate(clamp(mediaRatio, MIN_INCOMING_RATE, MAX_INCOMING_RATE))
          +    } else {
          +        1.0
          +    }
          +
          +/**
          + * When false, Automix never changes playback speed: no tempo stretch on the
          + * incoming track and no ease-back afterwards. Transitions are timing,
          + * filtering and fades only.
          + */
          +private const val TEMPO_STRETCH_ENABLED = false
           
           /** The audible outgoing deck is never tempo-shifted. */
           private fun outgoingRateFor(mediaRatio: Double, advanced: Boolean): Double =
          @@ -1325,6 +1336,7 @@
                   // The timeline ratio the blend runs at; [mixPlan] splits it between
                   // the two players. Advanced stretches anything a speed-up can meet.
                   incomingPlaybackRate = when {
          +            !TEMPO_STRETCH_ENABLED -> 1.0
                       traits != null -> if (traits.tempoFar) 1.0 else roundRate(1 / ratio)
                       1 / ratio in MIN_INCOMING_RATE..MAX_INCOMING_RATE -> roundRate(1 / ratio)
                       else -> 1.0
          diff --git a/shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/LoopMix.kt b/shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/LoopMix.kt
          --- a/shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/LoopMix.kt
          +++ b/shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/LoopMix.kt
          @@ -170,6 +170,13 @@
                   sungIn: List<Span>? = null,
                   outVideo: Boolean = false,
                   inVideo: Boolean = false,
          +        /**
          +         * The widest tempo gap, in BPM (after folding to double or half time), the
          +         * loop mix may bridge. The mix ramps its master tempo across that gap, which
          +         * is heard as the music speeding up or slowing down; a caller that wants no
          +         * audible speed change passes a small value and the pair gets no loop mix.
          +         */
          +        maxTempoGapBpm: Double = Double.POSITIVE_INFINITY,
                   /** Filled with why there is no plan, when there isn't one. */
                   why: StringBuilder? = null,
               ): Plan? {
          @@ -207,6 +214,10 @@
           
                   val fold = doubleArrayOf(1.0, 2.0, 0.5).minBy { abs(ln(inBpm / it / outBpm)) }
                   val target = inBpm / fold
          +        val tempoGap = abs(target - outBpm)
          +        if (tempoGap > maxTempoGapBpm) {
          +            return null.also { why?.append("tempo gap ${(tempoGap * 10).roundToInt() / 10.0} BPM would need a speed ramp") }
          +        }
                   val rampBars = ceil(abs(target - outBpm) / MAX_BPM_PER_BAR).toInt().coerceIn(MIN_RAMP_BARS, MAX_RAMP_BARS)
                   // the incoming loop lets go only at its own loop boundary: round the mix up to whole incoming loops
                   val inLoopOutBars = inPick.bars / fold
          diff --git a/app/src/main/java/com/music/bitchord/playback/CrossfadeController.kt b/app/src/main/java/com/music/bitchord/playback/CrossfadeController.kt
          --- a/app/src/main/java/com/music/bitchord/playback/CrossfadeController.kt
          +++ b/app/src/main/java/com/music/bitchord/playback/CrossfadeController.kt
          @@ -429,7 +429,9 @@
                   val echoTailMs = (echoTailSeconds(echoSeconds) * 1000).toFloat()
           
                   /** Hold the two beats in phase by nudging the incoming track's speed. */
          -        val phaseLock = advanced && lockPhase
          +        // Phase lock works by nudging the incoming speed up and down, which is
          +        // audible as a speed wobble, so it stays off: Automix never touches speed.
          +        val phaseLock = false
           
                   val swapAt = onBeat(bassSwapFraction.coerceIn(0.05, 0.95))
           
          @@ -2484,6 +2486,7 @@
                       earliestOutSec = player.currentPosition / 1000.0 + LOOP_SETUP_SECONDS,
                       sungOut = outLyrics.spans,
                       sungIn = inLyrics.spans,
          +            maxTempoGapBpm = LOOP_MAX_TEMPO_GAP_BPM,
                       why = why,
                   )
                   loopPlanKey = key
          @@ -4284,6 +4287,13 @@
                   const val LOOP_MIN_LEAD_MS = 9_000L
                   const val LOOP_BUILD_TIMEOUT_MS = 8_000L
           
          +        /**
          +         * The widest tempo gap the loop mix may bridge. Its master tempo ramps across the gap,
          +         * which is heard as the music speeding up or slowing down, so only pairs already at the
          +         * same tempo (a gap this small is below what a listener can hear) get a loop mix.
          +         */
          +        const val LOOP_MAX_TEMPO_GAP_BPM = 0.6
          +
                   /** After the incoming player starts, how long its clock settles before it is measured against the deck. */
                   const val LOOP_ALIGN_SETTLE_SECONDS = 1.2
                   const val LOOP_ALIGN_ROUNDS = 3
          diff --git a/shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/PhraseBarAutomixTest.kt b/shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/PhraseBarAutomixTest.kt
          --- a/shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/PhraseBarAutomixTest.kt
          +++ b/shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/PhraseBarAutomixTest.kt
          @@ -88,12 +88,12 @@
               }
           
               @Test
          -    fun aSlowerIncomingSongIsStillSpedUpToMatchUnderPhraseMode() {
          +    fun aSlowerIncomingSongIsNotSpedUpUnderPhraseMode() {
                   val current = track("a", 120.0, "C major", vocal = 0.1)
                   val next = track("b", 111.0, "C major", vocal = 0.1)
                   val plan = plan(current, next, PHRASE_BARS_SHORT)
                   assertEquals(TransitionStyle.DJ_BLEND, plan.transitionStyle)
          -        assertEquals(120.0 / 111.0, plan.incomingPlaybackRate, 1e-3)
          +        assertEquals(1.0, plan.incomingPlaybackRate, "Automix never changes playback speed")
                   assertEquals(1.0, plan.outgoingPlaybackRate, "an audible deck must never change speed")
               }
           
          diff --git a/shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/AdvancedAutomixPlannerTest.kt b/shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/AdvancedAutomixPlannerTest.kt
          --- a/shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/AdvancedAutomixPlannerTest.kt
          +++ b/shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/AdvancedAutomixPlannerTest.kt
          @@ -140,12 +140,12 @@
               }
           
               @Test
          -    fun aSlowerIncomingSongIsSpedUpToMatch() {
          +    fun aSlowerIncomingSongIsNotSpedUp() {
                   val current = track("a", 120.0, "C major", vocal = 0.1)
                   val next = track("b", 111.0, "C major", vocal = 0.1)
                   val plan = plan(current, next, advanced = true)
                   assertEquals(TransitionStyle.DJ_BLEND, plan.transitionStyle, "8% apart should now beat-match")
          -        assertEquals(120.0 / 111.0, plan.incomingPlaybackRate, 1e-3)
          +        assertEquals(1.0, plan.incomingPlaybackRate, "Automix never changes playback speed")
                   assertEquals(1.0, plan.outgoingPlaybackRate)
               }
           
          @@ -158,9 +158,9 @@
                   assertEquals(TransitionStyle.DJ_FILTER, plan.transitionStyle)
                   assertEquals(1.0, plan.incomingPlaybackRate, "past the window the incoming song keeps its tempo")
                   assertEquals(1.0, plan.outgoingPlaybackRate, "an audible deck must never change speed")
          -        // Inside the window (130: slowed by 7.7%) both modes slow the incoming song down.
          +        // Inside the window (130) the incoming song is still left at its own tempo.
                   val near = track("c", 130.0, "C major", vocal = 0.1)
          -        assertTrue(plan(current, near, advanced = false).incomingPlaybackRate < 1.0)
          +        assertEquals(1.0, plan(current, near, advanced = false).incomingPlaybackRate)
                   assertEquals(1.0, plan(current, near, advanced = true).outgoingPlaybackRate)
               }
           
          diff --git a/shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/LoopMixTest.kt b/shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/LoopMixTest.kt
          --- a/shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/LoopMixTest.kt
          +++ b/shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/LoopMixTest.kt
          @@ -117,6 +117,24 @@
               }
           
               @Test
          +    fun refusesATempoRampWhenTheCallerAllowsNoSpeedChange() {
          +        val out = analysis(120.0, 200.0)
          +        val why = StringBuilder()
          +        val refused = LoopMix.plan(
          +            out, out.duration, analysis(134.0, 180.0), 180.0, 0.0, clear, clear,
          +            maxTempoGapBpm = 0.6, why = why,
          +        )
          +        assertNull(refused)
          +        assertTrue("speed ramp" in why.toString(), why.toString())
          +        // the same tempo needs no ramp, so it still gets its loop mix
          +        val same = LoopMix.plan(
          +            out, out.duration, analysis(120.0, 180.0), 180.0, 0.0, clear, clear,
          +            maxTempoGapBpm = 0.6,
          +        )
          +        assertNotNull(same)
          +    }
          +
          +    @Test
               fun cutsEachLoopOnDetectedDownbeatsTempoDriftAndAll() {
                   // a live-played song: the beat stretches 0.5% over the minute, so a constant grid would miss
                   val beats = ArrayList<Double>()
          PATCH_EOF

      - name: Apply the patch
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/automix-no-speedup.patch"
          if git apply --reverse --check "$P" 2>/dev/null; then
            echo "::notice::Patch đã có sẵn trong nhánh này, bỏ qua bước áp."
            echo "APPLIED=already" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! git apply --check "$P"; then
            echo "::error::Patch không áp được lên nhánh này (file đã bị sửa khác bản gốc). Chạy trên bản main gốc, hoặc gỡ các thay đổi xung đột."
            exit 1
          fi
          git apply "$P"
          echo "APPLIED=yes" >> "$GITHUB_ENV"
          git apply --stat "$P"
          {
            echo "## Automix no speed change"
            echo
            echo "Đã áp patch:"
            echo
            git diff --stat | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the patch locally
        if: ${{ env.APPLIED == 'yes' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- shared app
          git commit -m "Automix: never change playback speed (no tempo stretch, no phase-lock nudges, no loop-mix ramp)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties

      - run: chmod +x gradlew

      - name: Shared tests
        if: ${{ inputs.run_tests }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest 2>&1 | tee build.log

      - name: Build the release-like dev APK
        if: ${{ inputs.build_apk }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDevBenchmark 2>&1 | tee -a build.log

      - name: Upload the arm64 APK
        if: ${{ inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-automix-no-speedup-arm64
          path: app/build/outputs/apk/dev/benchmark/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload the test reports
        if: ${{ always() && inputs.run_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-reports
          path: shared/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload the build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Push the patched code to a branch
        if: ${{ inputs.push_branch && env.APPLIED == 'yes' }}
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin "HEAD:refs/heads/${FIX_BRANCH}"
          echo "Đã đẩy sang nhánh \`${FIX_BRANCH}\`. Mở PR từ nhánh đó vào ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
