           /** How long the Automix window takes to fade in or out. */
           private const val WINDOW_FADE_MS = 500
           
          PATCH_EOF

      - name: Apply the patches
        shell: bash
        run: |
          set -euo pipefail
          APPLIED=already
          for P in "$RUNNER_TEMP/automix-manual-mix.patch"; do
            if git apply --reverse --check "$P" 2>/dev/null; then
              echo "Đã có sẵn trong repo, bỏ qua: $P"
              continue
            fi
            if ! git apply --check "$P"; then
              echo "::error::Patch $(basename "$P") không áp được lên bản này (một trong các file đã bị sửa so với bản đã dùng để viết patch). Gửi lại các file bị nêu ở trên để mình làm lại patch."
              exit 1
            fi
            git apply "$P"
            APPLIED=yes
            echo "Đã áp: $(basename "$P")"
          done
          echo "APPLIED=$APPLIED" >> "$GITHUB_ENV"
          {
            echo "## Automix: dòng trạng thái loop mix + gom cài đặt"
            echo
            echo "Kết quả áp patch: $APPLIED"
            echo
            git status --short | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the patch locally
        if: ${{ env.APPLIED == 'yes' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app shared sharedUi native
          git commit -m "Automix: loop verdict line, advanced settings fold, per-pair manual mix window"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties

      - run: chmod +x gradlew

      - name: Shared tests
        if: ${{ inputs.run_tests }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest 2>&1 | tee build.log

      - name: Pre-fetch libusb (GitHub release downloads keep returning 504)
        run: |
          # CMake tai libusb 1.0.27 tu trang release cua GitHub luc cau hinh, va trang do dang tra 504.
          # Thu lan luot: GitHub, SourceForge, kho goi Debian (cung mot file, kiem tra bang ma bam SHA256 ma
          # CMakeLists da ghim). Het cach thi git clone dung tag v1.0.27 va dong goi lai (khi do bo dong ghim ma bam).
          D="$HOME/libusb-cache"
          F="$D/libusb-1.0.27.tar.bz2"
          SHA="ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575"
          GH="https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2"
          CM=app/src/main/cpp/CMakeLists.txt
          mkdir -p "$D"
          OK=0
          for round in 1 2; do
            for U in "$GH" \
                     "https://downloads.sourceforge.net/project/libusb/libusb-1.0/libusb-1.0.27/libusb-1.0.27.tar.bz2" \
                     "https://deb.debian.org/debian/pool/main/libu/libusb-1.0/libusb-1.0_1.0.27.orig.tar.bz2"; do
              if curl -fsSL --retry 2 --retry-delay 3 --max-time 120 -o "$F" "$U" \
                 && echo "$SHA  $F" | sha256sum -c - > /dev/null 2>&1; then
                echo "Da tai libusb tu: $U"
                OK=1
                break 2
              fi
              echo "Khong tai duoc (hoac sai ma bam) tu: $U"
              rm -f "$F"
            done
            sleep 15
          done
          if [ "$OK" = 1 ]; then
            sed -i "s#$GH#file://$F#" "$CM"
          else
            echo "Ca ba nguon tai deu hong, thu git clone tag v1.0.27"
            for i in 1 2 3; do
              rm -rf "$D/libusb-1.0.27"
              if git clone --depth 1 --branch v1.0.27 https://github.com/libusb/libusb.git "$D/libusb-1.0.27"; then
                rm -rf "$D/libusb-1.0.27/.git"
                tar -C "$D" -cjf "$D/libusb-git.tar.bz2" libusb-1.0.27
                # Ban dong goi lai khong cung ma bam voi ban phat hanh, nen bo dong ghim ma bam.
                sed -i "s#$GH#file://$D/libusb-git.tar.bz2#; s#URL_HASH SHA256=$SHA)#)#" "$CM"
                echo "Da dung libusb tu git clone"
                break
              fi
              sleep 20
            done
          fi
          sed -n '/FetchContent_Declare(libusb/,/FetchContent_MakeAvailable(libusb)/p' "$CM"

      - name: Build the release-like dev APK
        if: ${{ inputs.build_apk }}
        shell: bash
        run: |
          set -o pipefail
          # GitHub tra loi 504 tam thoi cho cac lan tai: thu lai toi 3 lan, moi lan cach 30 giay.
          for attempt in 1 2 3; do
            if ./gradlew assembleDevBenchmark 2>&1 | tee -a build.log; then
              exit 0
            fi
            echo "Build attempt $attempt failed" | tee -a build.log
            sleep 30
          done
          exit 1

      - name: Upload the arm64 APK
        if: ${{ inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-automix-manual-mix-arm64
          path: app/build/outputs/apk/dev/benchmark/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload the test reports
        if: ${{ always() && inputs.run_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-reports
          path: shared/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload the build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Push the patched code to a branch
        if: ${{ inputs.push_branch && env.APPLIED == 'yes' }}
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin "HEAD:refs/heads/${FIX_BRANCH}"
          echo "Đã đẩy sang nhánh \`${FIX_BRANCH}\`. Mở PR từ nhánh đó vào ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
