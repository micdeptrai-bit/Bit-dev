name: Gemini dịch lời sang tiếng Việt - xưng hô chuẩn (APK, cập nhật đè)

# BẢN v5 (sửa lỗi "bấm cập nhật trong app lại đẻ thêm một app"):
#   NGUYÊN NHÂN: workflow này luôn ép tên gói thành com.bit.dev, còn "Bit-dev ALL-IN-ONE" mặc định build com.music.bitchord (bản prod).
#   Cả hai đều đăng lên CÙNG kênh Releases (--latest) với cùng tiền tố file "Bit-", và hộp thoại cập nhật trong app KHÔNG kiểm tra tên gói,
#   chỉ tải APK của release mới nhất. Release mới nhất khác tên gói với app đang cài thì Android coi là app KHÁC và cài thành app mới.
#   CÁCH SỬA: input installed_version (mặc định 1.9.1.31 = bản đang cài). Ngay đầu job, workflow tải APK của release v<installed_version>,
#   đọc tên gói + versionCode của nó, rồi build đúng gói đó với versionCode cao hơn. Chạy nó không bao giờ đổi tên gói so với app trên máy.
#   Không tìm thấy release đó thì DỪNG ngay (trước khi build lâu). Để trống installed_version = theo release mới nhất.
#   v6.1: sửa lỗi bước "Decide the package name" chết im lặng (exit 2) trên runner ubuntu-26.04: runner chạy bash với -e nên ls không thấy
#   aapt2 là cả bước thoát. Giờ tắt -e trong bước đó + ghim runs-on: ubuntu-24.04 (có sẵn Android SDK như các bản build trước).
#   v6.2: repo chỉ còn 1 release (v1.9.1.33, gói com.music.bitchord, do ALL-IN-ONE đăng) nên "auto" không tìm được bản 1.9.1.31 để biết gói.
#   Mặc định package_name giờ là com.bit.dev (gói của app "Bit Dev" đang cài), không cần tìm release nữa.
#   v6.3: build hỏng ở :app:mergeDevReleaseResources (Duplicate resources lock_screen_player). Base đã tự có màn khoá (lockscreen.patch trong
#   automix-all-in-one) nên bước "màn khoá iOS 26" của file này thêm bản thứ hai, trùng chuỗi và đè LockScreenLauncher. Giờ bước đó tự bỏ qua khi base đã có.
#   Muốn ép tay: input package_name = com.bit.dev / com.music.bitchord / com.dev.bitchord. Chữ ký cũng được so với APK của bản đang cài.

# BẢN v4 của gemini-vi-lyrics-lite.yml: viết lại prompt xưng hô cho Gemini. Cùng cách chạy, cùng APK, cùng cách cài đè.
#
# MỚI TRONG BẢN NÀY: MÀN KHOÁ KIỂU iOS 26 (bước "Add the iOS 26 lock screen", chạy sau bước prompt Gemini, trước bước đánh số bản dựng).
#   - Thêm LockScreenActivity (Compose) hiện đè lên màn khoá hệ thống khi bật màn hình lúc máy đang khoá và Bit Dev đang phát nhạc.
#   - Giao diện theo 3 ảnh mẫu: nền Canvas / ảnh bìa toàn màn hình, giờ + ngày một dòng, thẻ kính mờ điều khiển, đèn pin + camera, vuốt lên để mở khoá.
#   - Mở bằng startActivity trực tiếp, không được thì bằng thông báo full-screen-intent (Android 10+ chặn mở Activity từ nền).
#   - Có công tắc trong Cài đặt (mặc định BẬT) và nút mở trang cấp quyền. Máy Xiaomi / HyperOS, OPPO, vivo cần thêm quyền
#     "Hiển thị trên màn hình khoá" + "Hiển thị cửa sổ bật lên khi chạy nền" trong Thông tin ứng dụng.
#   - Vẫn cùng gói com.bit.dev, cùng khoá ký, versionCode cao hơn: app cũ nhận bản mới qua Releases và cài đè như trước.
#
# THAY ĐỔI SO VỚI BẢN LITE v3:
#   - Prompt dịch tiếng Việt viết lại bằng TIẾNG ANH (đầu ra vẫn là tiếng Việt), chia 3 khối:
#       1. PRONOUN PLAN: bắt Gemini xác định TRƯỚC khi dịch: ai hát (giới tính, vai), hát cho ai, quan hệ + sắc thái. Có thứ tự bằng chứng:
#          SONG NOTES > dấu hiệu rõ trong lời (my man, boyfriend, queen, sir, he/she chỉ người yêu...) > thể loại/ngữ cảnh >
#          gợi ý yếu (baby, honey, bro, tên nghệ sĩ: không bao giờ tự quyết). Cấm mặc định "anh - em" hay giả định người hát là nam.
#          Có bảng chọn cặp theo quan hệ: tình nhân, chia tay, bạn bè, diss/rap, đám đông, cha mẹ - con, cầu nguyện, tự thoại, cổ trang,
#          và cặp trung tính (tôi - người, tớ - cậu, mình - bạn) khi không đủ dấu hiệu.
#       2. PRONOUN FORMS: đại từ sở hữu (tim anh, mắt em), xưng gọi baby/babe theo cặp, ngôi thứ ba đúng giới + đúng sắc thái
#          (anh ấy/hắn, cô ấy/ả), chúng ta/chúng mình/tụi mình/chúng tôi, không trộn sắc thái (tao - em, tôi - mày).
#       3. STYLE + OUTPUT: "analysis" (tối đa 40 từ, có mẫu: Singer/Listener/Cues/Register/Exceptions) + "pair" (hỗ trợ cặp thứ hai cho song ca).
#   - Lượt rà xưng hô (review_pass) dùng chung khối PRONOUN FORMS, kiểm cả sở hữu, xưng gọi, ngôi thứ ba, chúng ta. Chỉ sửa từ sai.
#   - Prompt tra cứu (use_search) hỏi thêm: giới tính nghệ sĩ, song ca/khách mời, người được gọi là ai.
#   - temperature giữ 0.3 (bản lite nâng lên 0.4): thấp hơn thì đại từ ổn định hơn giữa các dòng/đoạn.
#   - CACHE_VERSION 3 -> 5: bản dịch xưng hô sai làm bằng prompt cũ (kể cả bản lite, cache 4) không còn được dùng lại.
#   - Cách tính số bản dựng đổi sang đúng cách của "Bit Dev APK": đọc MỌI tag (có phân trang), lỗi API thì dừng thay vì đoán số.
#   - MỚI: bước kiểm tra APK trước khi đăng: sai tên gói (không phải com.bit.dev), sai versionName/versionCode là DỪNG (khỏi đẻ thêm app
#     hay bị Android coi là hạ phiên bản). Và so chữ ký với APK của release hiện tại: lệch thì cảnh báo.
#
# CẬP NHẬT ĐÈ, KHÔNG ĐẺ THÊM APP: package com.bit.dev, tên "Bit Dev", cùng khoá ký với workflow "Bit Dev APK", versionCode
# (39 + số bản dựng) luôn lớn hơn mọi tag hiện có, file tên Bit-v<số>_arm64-v8a.apk đăng lên Releases (--latest) của chính repo này.
# App cũ hỏi releases/latest, thấy bản mới, tải và cài đè ngay trong app (giữ nguyên dữ liệu).
#
# Chạy tay: tab Actions -> chọn workflow này -> Run workflow.
# Một file duy nhất, KHÔNG commit gì vào repo. APK đăng lên Releases (tạo một tag mới, không đổi mã nguồn).
#
# LÀM GÌ:
#   0. Dựng lại nền: chạy các bước của "automix-manual-mix (2).yml" (nó tự dựng all-in-one rồi áp patch có sẵn
#      tính năng "Dịch lời bằng Gemini"). Bỏ qua nếu LyricsTranslation.kt trong repo đã có Gemini.
#   1. Vá LyricsTranslation.kt (bản v4), khi dịch sang TIẾNG VIỆT:
#      - Prompt dịch giả/lyricist với PRONOUN PLAN: Gemini chốt người hát, người nghe và MỘT cặp xưng hô (trường
#        "analysis" + "pair") TRƯỚC khi viết lời. Bài dài chia nhiều đoạn: cặp xưng hô đoạn trước được truyền sang đoạn sau.
#      - Lượt rà xưng hô (input review_pass, mặc định TẮT): một lời gọi riêng chỉ sửa đại từ lệch khỏi cặp đã chốt. Lỗi/hết giờ/lệch số
#        dòng thì giữ bản dịch đầu.
#      - Tra cứu bài hát bằng Google Search (input use_search, mặc định TẮT cho nhanh): nhận diện bài, câu chuyện, ai
#        hát cho ai, nghĩa tiếng lóng. Một lần cho cả bài. Lỗi/hết giờ thì dịch như cũ.
#      - Thời gian chờ tối đa: dịch 150 giây (nâng cả readTimeout, vì Http.client mặc định chỉ 30 giây), rà 60 giây,
#        tra cứu 75 giây. Các ngôn ngữ đích khác vẫn dùng prompt tiếng Anh cũ.
#      - Dòng Gemini trả về rỗng: giữ dòng gốc thay vì bỏ cả bài rồi rơi về Google Dịch.
#      - safetySettings: HARASSMENT, HATE_SPEECH, SEXUALLY_EXPLICIT, DANGEROUS_CONTENT đều BLOCK_NONE.
#   2. Đổi tên gói/phiên bản/updater y như "Bit Dev APK", build assembleDevRelease, kiểm tra APK, đăng lên Releases.
#
# Input thinking_budget: giới hạn "token suy nghĩ" của Gemini. Để trống = không đụng tới.
#   Gemini Flash: nhập 0 để tắt hẳn. Gemini Pro không cho tắt (nhập 0 sẽ lỗi, rồi app rơi về Google Dịch).
# Nếu vẫn thấy xưng hô lệch: bật review_pass (và use_search nếu bài ít người biết). SAU KHI CÀI APK: Cài đặt, "Dịch lời bằng Gemini", dán mã API.
#
# CẦN CÓ trong .github/workflows: "automix-manual-mix (2).yml" và "automix-all-in-one (2).yml" (đúng tên, hoặc đổi ở input).

on:
  workflow_dispatch:
    inputs:
      base_file:
        description: "Workflow chứa phần Gemini cần dựng lại (trong .github/workflows)"
        type: string
        default: "automix-manual-mix (2).yml"
      chain_file:
        description: "Workflow all-in-one mà base_file cần (trong .github/workflows)"
        type: string
        default: "automix-all-in-one (2).yml"
      skip_base:
        description: "Bỏ qua bước dựng lại nền (chỉ bật khi repo đã chứa sẵn phần Gemini)"
        type: boolean
        default: false
      use_search:
        description: "Tra cứu bài hát bằng Google Search trước khi dịch (chính xác hơn nhưng chậm hơn, tốn quota). Tắt = nhanh hơn"
        type: boolean
        default: false
      review_pass:
        description: "Bật lượt rà xưng hô riêng sau khi dịch (chính xác hơn nhưng tốn thêm một lời gọi). Tắt = tiết kiệm token"
        type: boolean
        default: false
      thinking_budget:
        description: "Giới hạn token suy nghĩ của Gemini. Để trống = không đổi. Gemini Flash: 0 = tắt suy nghĩ (tiết kiệm nhất), 1024 = nhẹ. Gemini Pro: không nhập 0"
        type: string
        default: ""
      installed_version:
        description: "Phiên bản app ĐANG CÀI trên máy (vd 1.9.1.31). Workflow đọc tên gói + versionCode từ APK của release v<phiên bản> này để build đúng gói đó, nên cập nhật ĐÈ chứ không đẻ app mới. Để trống = theo release mới nhất"
        type: string
        default: "1.9.1.31"
      package_name:
        description: "Tên gói của APK. Mặc định com.bit.dev = app tên Bit Dev (bản build từ workflow này). auto = đọc từ APK của release installed_version (chỉ dùng được khi release đó còn trong repo). Ép tay thì chọn đúng gói của app đang cài: Bit Dev = com.bit.dev | BitChord = com.music.bitchord | BitChord Dev = com.dev.bitchord"
        type: choice
        options:
          - com.bit.dev
          - auto
          - com.music.bitchord
          - com.dev.bitchord
        default: com.bit.dev
      publish_release:
        description: "Đăng APK lên mục Releases (cần để app cập nhật trong app được). Tắt = chỉ có file ở Artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: gemini-vi-lyrics-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gemini-vi:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BIT_DEV_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decide the package name from the INSTALLED app (sai gói = Android cài thành app MỚI)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_PKG: ${{ inputs.package_name }}
          INSTALLED_VERSION: ${{ inputs.installed_version }}
        run: |
          set -uo pipefail
          set +e   # runner chạy bash với -e; tắt đi để lệnh ls/grep không tìm thấy gì không làm cả bước chết im lặng
          WANT_PKG="${WANT_PKG:-auto}"
          INST="${INSTALLED_VERSION:-}"; INST="${INST//[[:space:]]/}"; INST="${INST#v}"
          if [ -n "$INST" ] && ! [[ "$INST" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::installed_version '$INST' sai định dạng (ví dụ đúng: 1.9.1.31)."
            exit 1
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2="$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$AAPT2" ]; then
            AAPT2="$(find /usr/local/lib/android /opt /usr/lib/android-sdk -name aapt2 -type f 2>/dev/null | sort -V | tail -n 1)"
          fi
          echo "SDK=$SDK | aapt2=${AAPT2:-không thấy}"
          if [ -z "$AAPT2" ]; then
            if [ "$WANT_PKG" = "auto" ]; then
              echo "::error::Không thấy aapt2 trên runner nên không đọc được tên gói của APK. Chọn tay package_name."
              exit 1
            fi
            echo "::warning::Không thấy aapt2 trên runner, bỏ qua bước đọc APK cũ, dùng gói chọn tay."
          fi
          badge() { "$AAPT2" dump badging "$1" 2>/dev/null; }
          apk_pkg() { badge "$1" | grep -oP "package: name='\K[^']+" | head -n 1; }
          apk_code() { badge "$1" | grep -oP "versionCode='\K[0-9]+" | head -n 1; }

          # 1) APK của đúng bản đang cài (release tag v<installed_version>): tên gói + versionCode của app trên máy.
          REF_PKG=""; REF_CODE=0
          if [ -n "$INST" ] && [ -n "$AAPT2" ]; then
            RD="$RUNNER_TEMP/installed-apk"; rm -rf "$RD"; mkdir -p "$RD"
            # Thử tag v<ver> và <ver>; không có thì tìm release nào có tag / tên / tên file chứa đúng số phiên bản.
            TAGS_TRY="v$INST $INST"
            FOUND_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[] | select(((.tag_name // "") + " " + (.name // "") + " " + ([.assets[].name] | join(" "))) | contains("'"$INST"'")) | .tag_name' 2>/dev/null | head -n 1)"
            if [ -n "$FOUND_TAG" ]; then TAGS_TRY="$FOUND_TAG $TAGS_TRY"; fi
            for T in $TAGS_TRY; do
              gh release download "$T" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RD" --clobber > /dev/null 2>&1 && break
            done
            RF="$(ls "$RD"/Bit-*.apk "$RD"/*.apk 2>/dev/null | head -n 1)"
            if [ -n "$RF" ]; then
              REF_PKG="$(apk_pkg "$RF")"; REF_CODE="$(apk_code "$RF")"; REF_CODE="${REF_CODE:-0}"
              echo "REF_APK=$RF" >> "$GITHUB_ENV"
            fi
          fi

          # 2) Chọn gói: chọn tay > gói của bản đang cài > gói của release mới nhất.
          PKG=""; SRC=""
          if [ "$WANT_PKG" != "auto" ]; then
            PKG="$WANT_PKG"; SRC="chọn tay ở input package_name"
          elif [ -n "$REF_PKG" ]; then
            PKG="$REF_PKG"; SRC="đọc từ APK của release v$INST (bản đang cài trên máy)"
          elif [ -n "$INST" ]; then
            REL="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 2>&1 | head -n 40)"
            echo "Các release hiện có trong repo:"; echo "$REL"
            {
              echo "### Không thấy APK của bản đang cài v$INST"
              echo "Release hiện có trong repo:"
              echo '```'; echo "$REL"; echo '```'
              echo "Cách làm: chạy lại và chọn package_name theo TÊN app trên máy: Bit Dev = com.bit.dev | BitChord = com.music.bitchord | BitChord Dev = com.dev.bitchord. Hoặc sửa installed_version cho đúng một phiên bản có trong danh sách trên."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Không thấy release nào chứa APK của v$INST nên không biết app trên máy là gói nào. Chạy lại và chọn tay package_name (theo tên app trên máy), hoặc sửa installed_version. Danh sách release ở trên và ở Summary."
            exit 1
          fi

          # 3) APK của release mới nhất: dùng làm gói dự phòng (khi installed_version để trống) và để biết versionCode cao nhất cùng gói.
          LAT_PKG=""; LAT_CODE=0
          if [ -n "$AAPT2" ]; then
            LD="$RUNNER_TEMP/latest-apk"; rm -rf "$LD"; mkdir -p "$LD"
            if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'Bit-*.apk' --dir "$LD" --clobber > /dev/null 2>&1; then
              LF="$(ls "$LD"/*.apk 2>/dev/null | head -n 1)"
              if [ -n "$LF" ]; then LAT_PKG="$(apk_pkg "$LF")"; LAT_CODE="$(apk_code "$LF")"; LAT_CODE="${LAT_CODE:-0}"; fi
            fi
          fi
          if [ -z "$PKG" ]; then
            if [ -n "$LAT_PKG" ]; then
              PKG="$LAT_PKG"; SRC="đọc từ APK của release mới nhất"
            else
              PKG="com.bit.dev"; SRC="mặc định (không đọc được APK nào)"
              echo "::warning::Không đọc được tên gói từ release nào, dùng mặc định com.bit.dev. Nếu app trên máy là gói khác, chạy lại và chọn tay package_name."
            fi
          fi
          if ! [[ "$PKG" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "::error::Tên gói '$PKG' không hợp lệ."
            exit 1
          fi

          # 4) versionCode phải cao hơn mọi bản cùng gói đã biết (bản đang cài + release mới nhất), nếu không Android báo hạ phiên bản.
          MAXC=0
          if [ "$REF_PKG" = "$PKG" ] && (( REF_CODE > MAXC )); then MAXC=$REF_CODE; fi
          if [ "$LAT_PKG" = "$PKG" ] && (( LAT_CODE > MAXC )); then MAXC=$LAT_CODE; fi
          MIN_CODE=0; if (( MAXC > 0 )); then MIN_CODE=$(( MAXC + 1 )); fi

          echo "APP_PKG=$PKG" >> "$GITHUB_ENV"
          echo "MIN_CODE=$MIN_CODE" >> "$GITHUB_ENV"
          {
            echo "- Tên gói của APK: $PKG ($SRC). App trên máy phải cùng gói này thì mới cập nhật đè, khác gói là Android cài thêm app mới."
            echo "- Bản đang cài (installed_version): ${INST:-không khai} | gói đọc được: ${REF_PKG:-?} (versionCode ${REF_CODE}) | release mới nhất: gói ${LAT_PKG:-?} (versionCode ${LAT_CODE}) | versionCode tối thiểu cho bản này: ${MIN_CODE}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Tên gói: $PKG ($SRC) | versionCode tối thiểu: $MIN_CODE"
          if [ -n "$REF_PKG" ] && [ -n "$LAT_PKG" ] && [ "$REF_PKG" != "$LAT_PKG" ]; then
            echo "::warning::Release mới nhất ($LAT_PKG) KHÁC gói bản đang cài ($REF_PKG): có workflow khác đã đăng APK gói khác vào kênh cập nhật. Bản build lần này dùng gói $PKG."
          fi

      - name: Rebuild the base (all-in-one + Gemini translation)
        if: ${{ !inputs.skip_base }}
        shell: bash
        env:
          BASE_FILE: ${{ inputs.base_file }}
          CHAIN_FILE: ${{ inputs.chain_file }}
        run: |
          set -euo pipefail
          LT=shared/src/jvmSharedMain/kotlin/com/music/bitchord/data/lyrics/LyricsTranslation.kt
          if grep -q "GEMINI_ENDPOINT" "$LT"; then
            echo "Repo đã có Gemini trong LyricsTranslation.kt, bỏ qua bước dựng lại."
            exit 0
          fi
          cat > "$RUNNER_TEMP/replay_base.py" <<'REPLAY_EOF'
          import os, re, subprocess, sys

          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "--break-system-packages", "pyyaml"])
              import yaml

          name = os.environ["BASE_FILE"]
          chain = os.environ["CHAIN_FILE"]
          path = os.path.join(".github", "workflows", name)
          if not os.path.isfile(path):
              sys.exit(f"::error::Không thấy .github/workflows/{name}. Workflow này cần file đó để có sẵn phần Gemini (hoặc nhập đúng tên ở input base_file).")

          doc = yaml.safe_load(open(path, encoding="utf8"))
          steps = next(iter(doc["jobs"].values()))["steps"]
          first = next((i for i, s in enumerate(steps) if s.get("name") == "Rebuild the all-in-one features"), None)
          last = next((i for i, s in enumerate(steps) if s.get("name") == "Commit the patch locally"), None)
          if first is None or last is None or last <= first:
              sys.exit(f"::error::{name} không có cấu trúc như mong đợi (bước 'Rebuild the all-in-one features' ... 'Commit the patch locally'). Gửi lại file đó để mình chỉnh.")

          EXPR = "$" + "{{"
          CHAIN_RE = re.compile(r"\$\{\{\s*inputs\.chain_file\s*\}\}")
          OTHER_RE = re.compile(r"\$\{\{\s*inputs\.\w+(\s*&&\s*inputs\.\w+)*\s*\}\}")

          todo = [s for s in steps[first:last] if s.get("run")]
          print(f"Dựng lại {len(todo)} bước từ {name}")
          for s in todo:
              run = CHAIN_RE.sub(lambda m: chain, s["run"])
              run = OTHER_RE.sub("true", run)
              if EXPR in run:
                  sys.exit(f"::error::Bước '{s.get('name')}' còn biểu thức GitHub chưa xử lý được.")
              env = dict(os.environ)
              for k, v in (s.get("env") or {}).items():
                  env[k] = CHAIN_RE.sub(lambda m: chain, str(v))
              print(f"::group::{s.get('name')}", flush=True)
              r = subprocess.run(["bash", "-eo", "pipefail", "-c", run], env=env)
              print("::endgroup::", flush=True)
              if r.returncode != 0:
                  sys.exit(f"::error::Bước '{s.get('name')}' của {name} lỗi (mã {r.returncode}).")
          print("Đã dựng xong bản nền (all-in-one + Gemini).")

          REPLAY_EOF
          python3 "$RUNNER_TEMP/replay_base.py"

      - name: Apply the Vietnamese lyricist prompt to Gemini (nhận diện xưng hô + lượt rà xưng hô)
        shell: bash
        env:
          USE_SEARCH: ${{ inputs.use_search }}
          USE_REVIEW: ${{ inputs.review_pass }}
          THINKING_BUDGET: ${{ inputs.thinking_budget }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/vi_prompt.py" <<'VI_EOF'
          import os, re, sys

          USE_SEARCH = os.environ.get("USE_SEARCH", "false").strip().lower() == "true"
          USE_REVIEW = os.environ.get("USE_REVIEW", "false").strip().lower() == "true"
          THINKING = os.environ.get("THINKING_BUDGET", "").strip()
          if THINKING and not re.fullmatch(r"-?\d+", THINKING):
              sys.exit("::error::thinking_budget phải là số nguyên (hoặc để trống).")

          PATH = "shared/src/jvmSharedMain/kotlin/com/music/bitchord/data/lyrics/LyricsTranslation.kt"
          src = open(PATH, encoding="utf8").read()

          if "GEMINI_CONTEXT_INSTRUCTION" in src:
              print("Bản vá Gemini (xưng hô) đã có sẵn, bỏ qua.")
              sys.exit(0)
          if "GEMINI_ENDPOINT" not in src or "requestGemini" not in src:
              sys.exit("::error::LyricsTranslation.kt chưa có phần Gemini (patch automix-manual-mix chưa được áp).")

          BRACES_BEFORE = src.count("{") - src.count("}")
          PARENS_BEFORE = src.count("(") - src.count(")")


          def once(text, old, new, what):
              n = text.count(old)
              if n != 1:
                  sys.exit(f"::error::Không vá được '{what}': tìm thấy {n} chỗ khớp (cần đúng 1). Gửi lại LyricsTranslation.kt để mình chỉnh.")
              return text.replace(old, new)


          def line_bounds(text, needle, what):
              n = text.count(needle)
              if n != 1:
                  sys.exit(f"::error::Không vá được '{what}': tìm thấy {n} chỗ khớp (cần đúng 1).")
              pos = text.index(needle)
              start = text.rfind("\n", 0, pos) + 1
              end = text.index("\n", pos) + 1
              indent = re.match(r"[ \t]*", text[start:end]).group(0)
              return start, end, indent


          def replace_line(text, needle, lines, what):
              start, end, indent = line_bounds(text, needle, what)
              return text[:start] + "".join((indent + l if l else "") + "\n" for l in lines) + text[end:]


          def insert_before(text, needle, lines, what):
              start, _, indent = line_bounds(text, needle, what)
              return text[:start] + "".join((indent + l if l else "") + "\n" for l in lines) + text[start:]


          def insert_after(text, needle, lines, what):
              _, end, indent = line_bounds(text, needle, what)
              return text[:end] + "".join((indent + l if l else "") + "\n" for l in lines) + text[end:]


          # ---------------------------------------------------------------------------------------------
          # 1) Hằng số: prompt dịch giả tiếng Việt (v2) + prompt tra cứu bài hát
          # ---------------------------------------------------------------------------------------------
          CONSTS = r'''    private const val GEMINI_MAX_CHARS = 7_000
              private const val GEMINI_CONTEXT_MAX_CHARS = 1_500
              // Tra cứu bài hát bằng Google Search trước khi dịch: chính xác hơn nhưng chậm hơn và tốn quota (chọn lúc chạy workflow).
              private const val GEMINI_USE_SEARCH = __USE_SEARCH__
              // Lượt rà xưng hô riêng sau khi dịch: tốn thêm một lời gọi (chọn lúc chạy workflow).
              private const val GEMINI_USE_REVIEW = __USE_REVIEW__

              // Prompt viết bằng tiếng Anh (ít token, Gemini hiểu tốt); đầu ra vẫn là tiếng Việt.
              // Chia 3 khối để dùng lại: NHẬN DIỆN (ai hát, hát cho ai, chọn cặp) + DẠNG ĐẠI TỪ (dùng chung với lượt rà) + phong cách/JSON.
              private val GEMINI_VI_PRONOUN_PLAN = """
                  PRONOUN PLAN (decide this BEFORE writing any line)
                  Read the whole song, then settle:
                  1. SINGER (the "I"): gender, age feel, role (lover, ex, friend, child, parent, rapper, narrator, crowd, worshipper).
                  2. LISTENER (the "you"): lover, ex, friend, rival, family member, crowd, oneself, God, or a place/thing.
                  3. RELATION + REGISTER: tender, casual, cold, hostile, respectful, playful, street, solemn.

                  Evidence, strongest first:
                  a. SONG NOTES or a pair locked in a previous part: trust them, unless the lyrics plainly contradict them.
                  b. Explicit cues: how the singer labels themself (girl, boy, man, woman, mama, daddy, wife, husband, king, queen); how the singer labels the listener (my man, my girl, boyfriend, girlfriend, baby girl, sir, ma'am, mom, bro, sis); he/she/his/her aimed at the loved one.
                  c. Context: genre and delivery (love ballad, breakup, diss or battle rap, party, hymn, lullaby); who begs, flexes, scolds or comforts whom.
                  d. Weak hints that never decide alone: baby, babe, honey, darling, dear, love, girl/boy/bro between friends, and the artist's name.
                  "He" for the loved one with no cue about the singer usually means a woman is singing (em - anh); "she" usually means a man (anh - em). Same-sex songs exist, so explicit cues always win.
                  Never default to a male singer or to "anh - em". If cues are truly missing, use the neutral options below.

                  CHOOSE ONE PAIR (singer - listener)
                  - Lovers, tender: man to woman anh - em; woman to man em - anh; same-sex lovers: anh - em, em - anh, chị - em or em - chị, following the age and role feel.
                  - Romantic but gender unknown: drop the subject where Vietnamese allows; otherwise tôi - người (poetic, sad), tớ - cậu (young, sweet), mình - bạn (plain). Do not guess anh - em.
                  - Ex or bitter breakup: tôi - anh or tôi - em (a cold "tôi" signals distance); furious: tao - mày.
                  - Friends: tớ - cậu (young, soft), mình - bạn or tôi - bạn (neutral), tao - mày (very casual, street).
                  - Rival, diss, hate, flexing: tao - mày; for groups tao - tụi mày / chúng mày / bọn mày.
                  - Crowd, party, anthem: tôi or mình - mọi người / các bạn.
                  - Parent to child: mẹ - con or ba - con; child to parent: con - mẹ or con - ba; grandparent: bà or ông - cháu; to an elder: cháu - cô / chú / bác.
                  - Prayer, God, spirit, fate: con - Chúa / Người / Trời.
                  - Self-talk with no listener: tôi or mình (self-scolding may use mày).
                  - Solemn, epic, ancient, fantasy: ta - ngươi or ta - người.
                  - Poetic "you" that is a city, the night, a memory: tôi - em or tôi - người.
              """.trimIndent()

              private val GEMINI_VI_PRONOUN_FORMS = """
                  PRONOUN FORMS (every line must agree with the locked pair)
                  - Self-reference, address and possessives all use the pair: "my heart" = "tim anh" in anh - em, never "tim tôi" or "tim em"; "your eyes" = "mắt em". Never mix registers (tao - em, tôi - mày) unless the lyrics do.
                  - Vocatives follow the pair: baby/babe/honey = "em" when the singer is anh, "anh" when the singer is em, "người ơi" in poetic neutral songs.
                  - Third person: he = anh ấy / chàng (tender) or hắn / gã / thằng đó (hostile); she = cô ấy / nàng (tender) or ả / con đó (hostile); an unknown person = người ấy; they = họ / bọn họ / tụi nó. Always match the real gender and the register.
                  - We/us = chúng ta (includes the listener), chúng mình (intimate), tụi mình (casual), chúng tôi (excludes the listener). You (plural) = các bạn / mọi người / tụi mày.
                  - Change the pair only when the speaker or listener truly changes (duet, dialogue, a verse aimed at someone else). Each voice then keeps its own pair, and "analysis" must say so.
                  - Dropping a pronoun is fine when rhythm or poetry prefers it. Never switch pair mid-song just to dodge an awkward line.
              """.trimIndent()

              private val GEMINI_VI_INSTRUCTION = """
                  You are a professional lyricist-translator. Translate song lyrics into natural, singable Vietnamese.
              """.trimIndent() + "\n\n" + GEMINI_VI_PRONOUN_PLAN + "\n\n" + GEMINI_VI_PRONOUN_FORMS + "\n\n" + """
                  STYLE
                  - Keep meaning and emotion, never word by word. Turn imagery and metaphor into natural, concise, rhythmic, poetic Vietnamese lyrics; light rhyme when it fits. Do not invent plot.
                  - Render slang, swearing and double meanings with Vietnamese slang of the same register. No softening, no censoring. Keep names and brands unchanged.
                  - Translate foreign phrases mixed into the song too. Keep only pure vocalizations (oh, yeah, la la la) and lines already in Vietnamese.
                  - Before answering, recheck every line: self-reference, address, possessives, he/she and tense.

                  OUTPUT: one JSON object with keys in this order:
                  - "analysis": max 40 words, format "Singer: ...; Listener: ...; Cues: ...; Register: ...; Exceptions: ...". Example: "Singer: woman (cue: my man); Listener: her lover; Cues: he/him; Register: tender, sad; Exceptions: none." Never put it in "lines".
                  - "pair": the main pair as "singer - listener", e.g. "em - anh". Add a second pair only for a duet or a real change, e.g. "em - anh / anh - em".
                  - "source": ISO 639-1 code of the main sung language.
                  - "lines": exactly one translated string per input line, same order. Never merge, split, drop, add or leave a line empty. No explanations.
              """.trimIndent()

              // Bước tra cứu (có Google Search) chạy trước khi dịch. Chỉ model đọc nên viết tiếng Anh, ngắn.
              private val GEMINI_CONTEXT_INSTRUCTION = """
                  You are a music researcher. Use Google Search to identify the song (title, artist) and what it is about. Trust only what you find or can infer from the lyrics; otherwise write "unknown".
                  Reply in English, max 130 words, short bullets: Song; Story; Singer persona (gender, age feel, role; artist gender; duet or featured voices); Listener (who is addressed, gender, relationship); Suggested Vietnamese pronoun pair (with exceptions per section); Slang and metaphors (with meaning).
                  Do not translate or quote the lyrics.
              """.trimIndent()

              // Lượt rà xưng hô (chỉ khi bật review_pass): chỉ nhận kế hoạch + bản dịch, sửa đại từ lệch.
              private val GEMINI_REVIEW_INSTRUCTION = """
                  You are a Vietnamese lyric editor who fixes ONLY pronouns. Input JSON: "plan" (the locked pair and analysis, including any stated change of speaker or listener) and "translated" (lines).
                  Check every line against the plan and fix any word that deviates: self-reference, address, possessives, vocatives, third person (gender and register), we/us. Leave a line unchanged when it is already correct.
                  Change only the wrong pronoun words. Keep the meaning, rhythm and every other word. Do not add pronouns to lines that drop them.
              """.trimIndent() + "\n\n" + GEMINI_VI_PRONOUN_FORMS + "\n\n" + """
                  Return {"lines": [...]} with the same number of lines in the same order, none empty, no explanations.
              """.trimIndent()
          '''
          src = once(src, "    private const val GEMINI_MAX_CHARS = 7_000\n", CONSTS.replace("__USE_SEARCH__", "true" if USE_SEARCH else "false").replace("__USE_REVIEW__", "true" if USE_REVIEW else "false"), "hằng GEMINI_MAX_CHARS")

          # ---------------------------------------------------------------------------------------------
          # 2) Prompt tiếng Anh cũ vẫn dùng cho ngôn ngữ đích khác; chọn prompt theo ngôn ngữ đích
          # ---------------------------------------------------------------------------------------------
          src = once(src, 'val instruction = "You translate song lyrics.', 'val englishInstruction = "You translate song lyrics.', "prompt tiếng Anh")

          m = re.search(r'^([ \t]*)\+?[^\n]*ignoring the mixed-in foreign lines\."\n', src, re.M)
          if not m or len(re.findall(r'ignoring the mixed-in foreign lines\."\n', src)) != 1:
              sys.exit("::error::Không tìm thấy cuối prompt tiếng Anh trong requestGemini.")
          base_ind = re.search(r'^([ \t]*)val englishInstruction', src, re.M).group(1)
          pick = (
              base_ind + 'val vietnamese = target.startsWith("vi", ignoreCase = true)\n'
              + base_ind + 'val instruction = if (vietnamese) GEMINI_VI_INSTRUCTION else englishInstruction\n'
              + base_ind + '// Tiếng Việt: buộc Gemini chốt xưng hô vào trường "analysis" trước khi viết các dòng dịch.\n'
              + base_ind + 'val planFirst = vietnamese\n'
          )
          src = src[:m.end()] + pick + src[m.end():]

          # Ghi chú tra cứu được nối vào system instruction.
          src = once(src, 'put("text", instruction)', 'put("text", withSongNotes(instruction, context))', "systemInstruction")

          # requestGemini nhận thêm ghi chú bài hát (mặc định null).
          rg = re.compile(r"(private suspend fun requestGemini\(\n(?P<i>[ \t]*)slots: List<TextSlot>,\n[ \t]*target: String,\n[ \t]*settings: GeminiSettings,\n)")
          mm = rg.search(src)
          if not mm or len(rg.findall(src)) != 1:
              sys.exit("::error::Không tìm thấy chữ ký hàm requestGemini để thêm tham số ghi chú.")
          src = src[:mm.end()] + mm.group("i") + "context: String? = null,\n" + src[mm.end():]

          # ---------------------------------------------------------------------------------------------
          # 3) Schema: thêm "analysis" (đứng đầu) khi dịch tiếng Việt
          # ---------------------------------------------------------------------------------------------
          src = insert_after(src, 'putJsonObject("properties") {', [
              '    if (planFirst) putJsonObject("analysis") { put("type", "STRING") }',
              '    if (planFirst) putJsonObject("pair") { put("type", "STRING") }',
          ], 'schema properties')
          # "required" trước (khi 'add(JsonPrimitive("source"))' còn duy nhất), rồi mới chèn propertyOrdering.
          src = insert_before(src, 'add(JsonPrimitive("source"))', [
              'if (planFirst) add(JsonPrimitive("analysis"))',
              'if (planFirst) add(JsonPrimitive("pair"))',
          ], 'required analysis')
          src = insert_before(src, 'putJsonArray("required") {', [
              'if (planFirst) putJsonArray("propertyOrdering") {',
              '    add(JsonPrimitive("analysis"))',
              '    add(JsonPrimitive("pair"))',
              '    add(JsonPrimitive("source"))',
              '    add(JsonPrimitive("lines"))',
              '}',
          ], 'propertyOrdering')

          # ---------------------------------------------------------------------------------------------
          # 4) temperature, safetySettings
          # ---------------------------------------------------------------------------------------------
          # temperature giữ nguyên 0.3: thấp hơn thì chọn đại từ ổn định hơn giữa các dòng và giữa các đoạn.

          gm = re.findall(r'^([ \t]*)putJsonObject\("generationConfig"\) \{\n', src, re.M)
          if len(gm) != 1:
              sys.exit(f"::error::Không vá được 'generationConfig': tìm thấy {len(gm)} chỗ (cần đúng 1).")
          i = gm[0]
          SAFETY = (
              f'{i}putJsonArray("safetySettings") {{\n'
              f'{i}    // Lời bài hát đầy tiếng lóng, chửi thề và nghĩa đôi: không để bộ lọc của Gemini chặn.\n'
              f'{i}    listOf(\n'
              f'{i}        "HARM_CATEGORY_HARASSMENT",\n'
              f'{i}        "HARM_CATEGORY_HATE_SPEECH",\n'
              f'{i}        "HARM_CATEGORY_SEXUALLY_EXPLICIT",\n'
              f'{i}        "HARM_CATEGORY_DANGEROUS_CONTENT",\n'
              f'{i}    ).forEach {{ category ->\n'
              f'{i}        addJsonObject {{\n'
              f'{i}            put("category", category)\n'
              f'{i}            put("threshold", "BLOCK_NONE")\n'
              f'{i}        }}\n'
              f'{i}    }}\n'
              f'{i}}}\n'
          )
          anchor = f'{i}putJsonObject("generationConfig") {{\n'
          src = once(src, anchor, SAFETY + anchor, "generationConfig")
          # Giới hạn token suy nghĩ (để trống = không đổi).
          if THINKING:
              src = insert_after(src, 'putJsonObject("generationConfig") {', [
                  f'    putJsonObject("thinkingConfig") {{ put("thinkingBudget", {int(THINKING)}) }}',
              ], "thinkingConfig")

          # ---------------------------------------------------------------------------------------------
          # 5) Timeout dài hơn. Http.client có readTimeout 30 giây: Gemini chỉ trả về khi viết xong cả bài,
          #    nên phải nâng cả readTimeout chứ không chỉ callTimeout.
          # ---------------------------------------------------------------------------------------------
          src = once(
              src,
              ".callTimeout(45, TimeUnit.SECONDS)\n",
              ".callTimeout(150, TimeUnit.SECONDS)\n            .readTimeout(150, TimeUnit.SECONDS)\n",
              "callTimeout Gemini",
          )
          src = once(src, ".connectTimeout(8, TimeUnit.SECONDS)\n", ".connectTimeout(10, TimeUnit.SECONDS)\n", "connectTimeout Gemini")
          src = insert_before(src, "private val client by lazy {", [
              "// Bước tra cứu bài hát (Google Search) cũng cần thời gian; hết giờ thì dịch tiếp không có ghi chú.",
              "private val geminiContextClient by lazy {",
              "    geminiClient.newBuilder()",
              "        .callTimeout(75, TimeUnit.SECONDS)",
              "        .readTimeout(75, TimeUnit.SECONDS)",
              "        .build()",
              "}",
              "// Lượt rà xưng hô ngắn hơn lượt dịch; hết giờ thì giữ bản dịch đầu.",
              "private val geminiReviewClient by lazy {",
              "    geminiClient.newBuilder()",
              "        .callTimeout(60, TimeUnit.SECONDS)",
              "        .readTimeout(60, TimeUnit.SECONDS)",
              "        .build()",
              "}",
          ], "client Google")

          # ---------------------------------------------------------------------------------------------
          # 6) Tra cứu bài hát một lần cho cả bài (mọi đoạn chia nhỏ dùng chung một ghi chú, nên xưng hô khớp nhau)
          # ---------------------------------------------------------------------------------------------
          src = insert_before(src, "val texts = mutableListOf<String>()", [
              "// Chỉ tiếng Việt cần chốt xưng hô. Tra cứu (nếu bật) chạy một lần, dùng chung cho mọi đoạn; lỗi hay hết giờ thì dịch không có ghi chú.",
              'val vietnamese = target.startsWith("vi", ignoreCase = true)',
              "val context = if (GEMINI_USE_SEARCH && vietnamese) researchSong(slots, settings) else null",
              "var carried = context",
          ], "researchSong call")
          src = replace_line(src, "val answer = requestGemini(chunk, target, settings) ?: return null", [
              "val first = requestGemini(chunk, target, settings, carried) ?: return null",
              "// Tiếng Việt: một lượt rà riêng chỉ để bắt lỗi xưng hô. Lỗi hay lệch số dòng thì giữ bản dịch đầu.",
              "val answer = if (GEMINI_USE_REVIEW && vietnamese && first.plan.isNotBlank()) {",
              "    reviewPronouns(chunk, first.texts, first.plan, settings)",
              "        ?.let { GeminiAnswer(it, first.sourceLanguage, first.plan) } ?: first",
              "} else {",
              "    first",
              "}",
              "// Đoạn sau giữ đúng cặp xưng hô đã chốt ở đoạn trước.",
              "if (answer.plan.isNotBlank()) {",
              '    carried = listOfNotNull(context, "Pronouns locked in the previous part, keep:\\n" + answer.plan).joinToString("\\n\\n")',
              "}",
          ], "gọi requestGemini")

          HELPERS = r'''    /** Ghi chú tra cứu nối vào cuối system instruction; không có ghi chú thì giữ nguyên. */
              private fun withSongNotes(instruction: String, notes: String?): String =
                  if (notes.isNullOrBlank()) {
                      instruction
                  } else {
                      instruction + "\n\nSONG NOTES (researched; use for pronouns and context; do not translate or output):\n" + notes
                  }

              /**
               * Hỏi Gemini (có Google Search) về bài hát trước khi dịch: tên, câu chuyện, ai hát cho ai, nghĩa tiếng lóng,
               * cặp xưng hô nên dùng. Null khi lỗi hay hết giờ, khi đó vẫn dịch bình thường, chỉ thiếu ghi chú.
               */
              private suspend fun researchSong(slots: List<TextSlot>, settings: GeminiSettings): String? {
                  val lyric = slots.joinToString("\n") { it.text }.take(GEMINI_MAX_CHARS)
                  val body = buildJsonObject {
                      putJsonObject("systemInstruction") {
                          putJsonArray("parts") { addJsonObject { put("text", GEMINI_CONTEXT_INSTRUCTION) } }
                      }
                      putJsonArray("contents") {
                          addJsonObject {
                              put("role", "user")
