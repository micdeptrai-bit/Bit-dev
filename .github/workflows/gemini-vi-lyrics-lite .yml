          /**
           * Màn khoá kiểu iOS 26 cho Bit Dev.
           *
           * Nền là clip Canvas (Spotify / Apple / Tidal) toàn màn hình, không có thì dùng ảnh bìa phóng to.
           * Phía trên là giờ + ngày một dòng, phía dưới là thẻ kính mờ (tên bài, nghệ sĩ, thanh tua, ⏮ ⏯ ⏭, âm lượng),
           * hai nút tròn đèn pin / camera và thanh home. Vuốt lên để mở khoá.
           */
          class LockScreenActivity : ComponentActivity() {

              private val torchOn = mutableStateOf(false)
              private var torchId: String? = null
              private var cameraManager: CameraManager? = null
              private val torchCallback = object : CameraManager.TorchCallback() {
                  override fun onTorchModeChanged(cameraId: String, enabled: Boolean) {
                      if (cameraId == torchId) torchOn.value = enabled
                  }
              }

              private val unlockReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      finishAndRemoveTask()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  alive = true
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true)
                  } else {
                      @Suppress("DEPRECATION")
                      window.addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED)
                  }
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(AndroidColor.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(AndroidColor.TRANSPARENT),
                  )
                  LockScreenLauncher.cancelNotification(this)

                  ContextCompat.registerReceiver(
                      this,
                      unlockReceiver,
                      IntentFilter(Intent.ACTION_USER_PRESENT),
                      ContextCompat.RECEIVER_NOT_EXPORTED,
                  )

                  cameraManager = getSystemService(CameraManager::class.java)
                  torchId = runCatching {
                      cameraManager?.cameraIdList?.firstOrNull { id ->
                          val c = cameraManager!!.getCameraCharacteristics(id)
                          c.get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true &&
                              c.get(CameraCharacteristics.LENS_FACING) == CameraCharacteristics.LENS_FACING_BACK
                      }
                  }.getOrNull()
                  runCatching { cameraManager?.registerTorchCallback(torchCallback, Handler(Looper.getMainLooper())) }

                  setContent {
                      val appFont by AppSettings.appFont.collectAsStateWithLifecycle()
                      BitChordTheme(darkTheme = true, font = appFont) {
                          LockScreenRoot(
                              torchAvailable = torchId != null,
                              torchOn = torchOn.value,
                              onToggleTorch = ::toggleTorch,
                              onCamera = ::openCamera,
                              onUnlock = ::unlock,
                              onNothingToShow = { finishAndRemoveTask() },
                          )
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  // Mở khoá bằng vân tay / khuôn mặt trước khi Activity kịp đăng ký receiver: đừng ở lại đè lên màn hình chính.
                  val keyguard = getSystemService(KeyguardManager::class.java)
                  if (keyguard != null && !keyguard.isKeyguardLocked) finishAndRemoveTask()
              }

              override fun onDestroy() {
                  alive = false
                  runCatching { unregisterReceiver(unlockReceiver) }
                  runCatching { cameraManager?.unregisterTorchCallback(torchCallback) }
                  super.onDestroy()
              }

              private fun unlock() {
                  val keyguard = getSystemService(KeyguardManager::class.java)
                  if (keyguard == null || !keyguard.isKeyguardLocked) {
                      finishAndRemoveTask()
                      return
                  }
                  keyguard.requestDismissKeyguard(
                      this,
                      object : KeyguardManager.KeyguardDismissCallback() {
                          override fun onDismissSucceeded() {
                              finishAndRemoveTask()
                          }
                      },
                  )
              }

              private fun toggleTorch() {
                  val id = torchId ?: return
                  runCatching { cameraManager?.setTorchMode(id, !torchOn.value) }
              }

              private fun openCamera() {
                  val secure = Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA_SECURE)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  try {
                      startActivity(secure)
                  } catch (_: Exception) {
                      try {
                          startActivity(
                              Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA)
                                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                          )
                      } catch (_: Exception) {
                      }
                  }
              }

              companion object {
                  @Volatile
                  var alive: Boolean = false
              }
          }

          // ---------------------------------------------------------------------------------------------
          // Giao diện
          // ---------------------------------------------------------------------------------------------

          @Composable
          private fun LockScreenRoot(
              torchAvailable: Boolean,
              torchOn: Boolean,
              onToggleTorch: () -> Unit,
              onCamera: () -> Unit,
              onUnlock: () -> Unit,
              onNothingToShow: () -> Unit,
          ) {
              val context = LocalContext.current
              val controller = rememberMediaController()
              val state = rememberPlayerState(controller)
              val song = state.song

              // playWhenReady đổi ngay khi bấm, không chờ player thật sự phát (bài YouTube phải resolve vài giây).
              var playWhenReady by remember { mutableStateOf(false) }
              DisposableEffect(controller) {
                  val c = controller ?: return@DisposableEffect onDispose {}
                  playWhenReady = c.playWhenReady
                  val listener = object : Player.Listener {
                      override fun onPlayWhenReadyChanged(ready: Boolean, reason: Int) {
                          playWhenReady = ready
                      }
                  }
                  c.addListener(listener)
                  onDispose { c.removeListener(listener) }
              }

              // Không còn gì để hiện (hàng đợi trống) thì thôi, trả lại màn khoá hệ thống.
              LaunchedEffect(controller, song) {
                  val c = controller ?: return@LaunchedEffect
                  if (song == null) {
                      delay(2500)
                      if (c.currentMediaItem == null) onNothingToShow()
                  }
              }

              // --- Canvas ---
              val animated by AppSettings.animatedCanvas.collectAsStateWithLifecycle()
              val overCellular by AppSettings.canvasOverCellular.collectAsStateWithLifecycle()
              val metered by AppSettings.meteredConnection.collectAsStateWithLifecycle()
              val canvasAllowed = animated && (metered != true || overCellular)
              var canvas by remember(song?.videoId) { mutableStateOf<CanvasArtwork?>(null) }
              LaunchedEffect(song?.videoId, canvasAllowed) {
                  canvas = null
                  val s = song ?: return@LaunchedEffect
                  if (!canvasAllowed) return@LaunchedEffect
                  val found = CanvasRepository.cached(s) ?: CanvasRepository.canvasFor(s)
                  // Bản 3:4 của Apple hợp với màn hình dọc hơn bản vuông.
                  canvas = found?.let { c ->
                      val tall = c.portraitUrl
                      if (tall != null) c.copy(url = tall, fallbackUrl = c.url, portraitUrl = null) else c
                  }
              }

              // --- Yêu thích (đọc từ snapshot mà service đã công bố cho widget) ---
              var liked by remember { mutableStateOf(false) }
              var canLike by remember { mutableStateOf(false) }
              var likeTick by remember { mutableStateOf(0) }
              LaunchedEffect(song?.videoId, likeTick) {
                  repeat(3) {
                      runCatching { MediaWidgetSnapshot.load(context) }.getOrNull()?.let {
                          liked = it.isLiked
                          canLike = it.canLike
                      }
                      delay(600)
                  }
              }

              // --- Thanh tua ---
              var scrub by remember { mutableStateOf<Float?>(null) }
              val durationMs = state.durationMs.coerceAtLeast(0L)
              val positionMs = state.position.positionMs.coerceAtLeast(0L)
              val fraction = scrub ?: if (durationMs > 0) (positionMs.toFloat() / durationMs).coerceIn(0f, 1f) else 0f
              val shownMs = scrub?.let { (it * durationMs).toLong() } ?: positionMs

              // --- Âm lượng ---
              val audio = remember { context.getSystemService(AudioManager::class.java) }
              var volume by remember { mutableFloatStateOf(0f) }
              var volumeDragging by remember { mutableStateOf(false) }
              LaunchedEffect(audio) {
                  while (true) {
                      if (!volumeDragging && audio != null) {
                          val max = audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC).coerceAtLeast(1)
                          volume = audio.getStreamVolume(AudioManager.STREAM_MUSIC).toFloat() / max
                      }
                      delay(400)
                  }
              }

              // --- Vuốt lên để mở khoá ---
              val density = LocalDensity.current
              val unlockThresholdPx = with(density) { 140.dp.toPx() }
              var dragY by remember { mutableFloatStateOf(0f) }
              val shownDrag by animateFloatAsState(targetValue = dragY, label = "unlockDrag")

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.Black)
                      .pointerInput(Unit) {
                          detectVerticalDragGestures(
                              onDragEnd = {
                                  val unlock = dragY < -unlockThresholdPx
                                  dragY = 0f
                                  if (unlock) onUnlock()
                              },
                              onDragCancel = { dragY = 0f },
                              onVerticalDrag = { change, amount ->
                                  dragY = (dragY + amount).coerceAtMost(0f)
                                  change.consume()
                              },
                          )
                      },
              ) {
                  // Nền: ảnh bìa phóng đầy màn hình, clip Canvas đè lên khi đã có khung hình đầu tiên.
                  Crossfade(targetState = song?.artworkAt(1080) ?: song?.thumbnailUrl, label = "lockArt") { art ->
                      if (art != null) {
                          AsyncImage(
                              model = art,
                              contentDescription = null,
                              contentScale = ContentScale.Crop,
                              modifier = Modifier.fillMaxSize(),
                          )
                      }
                  }
                  canvas?.let {
                      AndroidCanvasArtworkPlayer(
                          canvas = it,
                          isPlaying = playWhenReady,
                          modifier = Modifier.fillMaxSize(),
                          frameCapturePx = 0,
                      )
                  }
                  // Tối nhẹ ở đỉnh và đáy để chữ dễ đọc trên mọi ảnh.
                  Box(
                      Modifier
                          .fillMaxSize()
                          .background(
                              Brush.verticalGradient(
                                  0f to Color.Black.copy(alpha = 0.30f),
                                  0.28f to Color.Transparent,
                                  0.50f to Color.Transparent,
                                  1f to Color.Black.copy(alpha = 0.70f),
                              ),
                          ),
                  )

                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .statusBarsPadding()
                          .navigationBarsPadding()
                          .graphicsLayer {
                              translationY = shownDrag
                              alpha = (1f + shownDrag / (unlockThresholdPx * 2f)).coerceIn(0.25f, 1f)
                          },
                      horizontalAlignment = Alignment.CenterHorizontally,
                  ) {
                      Spacer(Modifier.height(40.dp))
                      ClockHeader()
                      Spacer(Modifier.weight(1f))

                      // ---- Thẻ kính mờ ----
                      val cardShape = RoundedCornerShape(30.dp)
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 14.dp)
                              .clip(cardShape)
                              .background(
                                  Brush.verticalGradient(
                                      listOf(Color.White.copy(alpha = 0.20f), Color.White.copy(alpha = 0.11f)),
                                  ),
                              )
                              .border(
                                  1.dp,
                                  Brush.verticalGradient(
                                      listOf(Color.White.copy(alpha = 0.45f), Color.White.copy(alpha = 0.08f)),
                                  ),
                                  cardShape,
                              )
                              .padding(horizontal = 20.dp, vertical = 16.dp),
                      ) {
                          Box(Modifier.fillMaxWidth()) {
                              Column(
                                  modifier = Modifier
                                      .align(Alignment.Center)
                                      .padding(horizontal = 30.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                              ) {
                                  Text(
                                      text = song?.title.orEmpty(),
                                      color = Color.White,
                                      fontSize = 17.sp,
                                      fontWeight = FontWeight.SemiBold,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis,
                                      textAlign = TextAlign.Center,
                                  )
                                  Text(
                                      text = song?.artist.orEmpty(),
                                      color = Color.White.copy(alpha = 0.68f),
                                      fontSize = 16.sp,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis,
                                      textAlign = TextAlign.Center,
                                  )
                              }
                              WaveformIcon(
                                  playing = playWhenReady,
                                  modifier = Modifier.align(Alignment.TopEnd),
                              )
                          }
                          Spacer(Modifier.height(10.dp))
                          GlassSlider(
                              fraction = fraction,
                              enabled = durationMs > 0,
                              onChange = { scrub = it },
                              onChangeFinished = { f ->
                                  controller?.seekTo((f * durationMs).toLong())
                                  scrub = null
                              },
                          )
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                              Text(formatTime(shownMs), color = Color.White.copy(alpha = 0.6f), fontSize = 13.sp)
                              Text(
                                  "-" + formatTime((durationMs - shownMs).coerceAtLeast(0L)),
                                  color = Color.White.copy(alpha = 0.6f),
                                  fontSize = 13.sp,
                              )
                          }
                          Spacer(Modifier.height(6.dp))
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.SpaceBetween,
                          ) {
                              PlainButton(
                                  size = 44.dp,
                                  onClick = {
                                      if (canLike && controller != null) {
                                          liked = !liked
                                          controller.sendCustomCommand(
                                              SessionCommand(ACTION_TOGGLE_FAVORITE, Bundle.EMPTY),
                                              Bundle.EMPTY,
                                          )
                                          likeTick++
                                      }
                                  },
                              ) {
                                  Icon(
                                      imageVector = if (liked) SfIcons.StarFill else SfIcons.Star,
                                      contentDescription = null,
                                      tint = Color.White.copy(alpha = if (canLike) 0.85f else 0.35f),
                                      modifier = Modifier.size(26.dp),
                                  )
                              }
                              PlainButton(
                                  size = 56.dp,
                                  onClick = {
                                      controller?.let {
                                          it.seekToPreviousMediaItem()
                                          if (it.playbackState == Player.STATE_IDLE) it.prepare()
                                      }
                                  },
                              ) { TransportGlyph(Glyph.PREV, Modifier.size(width = 38.dp, height = 26.dp)) }
                              PlainButton(
                                  size = 64.dp,
                                  onClick = {
                                      controller?.let {
                                          if (it.playWhenReady) {
                                              it.pause()
                                          } else {
                                              if (it.playbackState == Player.STATE_IDLE) it.prepare()
                                              it.play()
                                          }
                                      }
                                  },
                              ) {
                                  TransportGlyph(
                                      if (playWhenReady) Glyph.PAUSE else Glyph.PLAY,
                                      Modifier.size(width = 34.dp, height = 36.dp),
                                  )
                              }
                              PlainButton(
                                  size = 56.dp,
                                  onClick = {
                                      controller?.let {
                                          it.seekToNextMediaItem()
                                          if (it.playbackState == Player.STATE_IDLE) it.prepare()
                                      }
                                  },
                              ) { TransportGlyph(Glyph.NEXT, Modifier.size(width = 38.dp, height = 26.dp)) }
                              Box(Modifier.size(44.dp), contentAlignment = Alignment.Center) {
                                  SpeakerGlyph(
                                      waves = 2,
                                      modifier = Modifier.size(26.dp),
                                      tint = Color.White.copy(alpha = 0.55f),
                                  )
                              }
                          }
                          Spacer(Modifier.height(10.dp))
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              SpeakerGlyph(0, Modifier.size(16.dp), Color.White.copy(alpha = 0.6f))
                              Spacer(Modifier.width(10.dp))
                              GlassSlider(
                                  fraction = volume,
                                  modifier = Modifier.weight(1f),
                                  onChange = { f ->
                                      volumeDragging = true
                                      volume = f
                                      if (audio != null) {
                                          val max = audio.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                                          runCatching {
                                              audio.setStreamVolume(
                                                  AudioManager.STREAM_MUSIC,
                                                  (f * max).roundToInt().coerceIn(0, max),
                                                  0,
                                              )
                                          }
                                      }
                                  },
                                  onChangeFinished = { volumeDragging = false },
                              )
                              Spacer(Modifier.width(10.dp))
                              SpeakerGlyph(2, Modifier.size(20.dp), Color.White.copy(alpha = 0.6f))
                          }
                      }

                      Spacer(Modifier.height(26.dp))
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 44.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                      ) {
                          if (torchAvailable) {
                              RoundButton(active = torchOn, onClick = onToggleTorch) {
                                  FlashlightGlyph(Modifier.size(24.dp), if (torchOn) Color.Black.copy(alpha = 0.85f) else Color.White)
                              }
                          } else {
                              Spacer(Modifier.size(52.dp))
                          }
                          RoundButton(active = false, onClick = onCamera) {
                              CameraGlyph(Modifier.size(26.dp), Color.White)
                          }
                      }
                      Spacer(Modifier.height(18.dp))
                      Box(
                          Modifier
                              .width(134.dp)
                              .height(5.dp)
                              .clip(CircleShape)
                              .background(Color.White.copy(alpha = 0.9f)),
                      )
                      Spacer(Modifier.height(8.dp))
                  }
              }
          }

          @Composable
          private fun ClockHeader() {
              val context = LocalContext.current
              var now by remember { mutableLongStateOf(System.currentTimeMillis()) }
              LaunchedEffect(Unit) {
                  while (true) {
                      now = System.currentTimeMillis()
                      delay(1000)
                  }
              }
              val locale = Locale.getDefault()
              val is24 = DateFormat.is24HourFormat(context)
              val minute = now / 60_000L
              val time = remember(minute, is24) {
                  java.text.SimpleDateFormat(
                      DateFormat.getBestDateTimePattern(locale, if (is24) "Hm" else "hm"),
                      locale,
                  ).format(java.util.Date(now))
              }
              val date = remember(now / 3_600_000L) {
                  java.text.SimpleDateFormat(
                      DateFormat.getBestDateTimePattern(locale, "EEEdMMM"),
                      locale,
                  ).format(java.util.Date(now))
              }
              Row(verticalAlignment = Alignment.CenterVertically) {
                  Text(time, color = Color.White, fontSize = 26.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.width(18.dp))
                  Text(date, color = Color.White.copy(alpha = 0.92f), fontSize = 26.sp, fontWeight = FontWeight.SemiBold)
              }
          }

          private fun formatTime(ms: Long): String {
              val total = (ms / 1000L).coerceAtLeast(0L)
              return String.format(Locale.US, "%d:%02d", total / 60, total % 60)
          }

          @Composable
          private fun PlainButton(size: androidx.compose.ui.unit.Dp, onClick: () -> Unit, content: @Composable () -> Unit) {
              Box(
                  modifier = Modifier
                      .size(size)
                      .clickable(
                          interactionSource = remember { MutableInteractionSource() },
                          indication = null,
                          onClick = onClick,
                      ),
                  contentAlignment = Alignment.Center,
              ) { content() }
          }

          @Composable
          private fun RoundButton(active: Boolean, onClick: () -> Unit, content: @Composable () -> Unit) {
              Box(
                  modifier = Modifier
                      .size(52.dp)
                      .clip(CircleShape)
                      .background(if (active) Color.White.copy(alpha = 0.92f) else Color.White.copy(alpha = 0.16f))
                      .border(1.dp, Color.White.copy(alpha = 0.18f), CircleShape)
                      .clickable(
                          interactionSource = remember { MutableInteractionSource() },
                          indication = null,
                          onClick = onClick,
                      ),
                  contentAlignment = Alignment.Center,
              ) { content() }
          }

          /** Thanh trượt mảnh kiểu iOS: kéo hoặc chạm để chọn vị trí. */
          @Composable
          private fun GlassSlider(
              fraction: Float,
              onChange: (Float) -> Unit,
              onChangeFinished: (Float) -> Unit,
              modifier: Modifier = Modifier,
              enabled: Boolean = true,
          ) {
              var widthPx by remember { mutableFloatStateOf(1f) }
              val change by rememberUpdatedState(onChange)
              val finished by rememberUpdatedState(onChangeFinished)
              Box(
                  modifier = modifier
                      .fillMaxWidth()
                      .height(28.dp)
                      .onSizeChanged { widthPx = it.width.toFloat().coerceAtLeast(1f) }
                      .pointerInput(enabled) {
                          if (!enabled) return@pointerInput
                          detectTapGestures { offset ->
                              val f = (offset.x / widthPx).coerceIn(0f, 1f)
                              change(f)
                              finished(f)
                          }
                      }
                      .pointerInput(enabled) {
                          if (!enabled) return@pointerInput
                          var last = 0f
                          detectHorizontalDragGestures(
                              onDragStart = { o ->
                                  last = (o.x / widthPx).coerceIn(0f, 1f)
                                  change(last)
                              },
                              onDragEnd = { finished(last) },
                              onDragCancel = { finished(last) },
                              onHorizontalDrag = { c, _ ->
                                  last = (c.position.x / widthPx).coerceIn(0f, 1f)
                                  change(last)
                                  c.consume()
                              },
                          )
                      },
                  contentAlignment = Alignment.CenterStart,
              ) {
                  Box(
                      Modifier
                          .fillMaxWidth()
                          .height(6.dp)
                          .clip(CircleShape)
                          .background(Color.White.copy(alpha = 0.28f)),
                  )
                  Box(
                      Modifier
                          .fillMaxWidth(fraction.coerceIn(0f, 1f))
                          .height(6.dp)
                          .clip(CircleShape)
                          .background(Color.White.copy(alpha = 0.88f)),
                  )
              }
          }

          @Composable
          private fun WaveformIcon(playing: Boolean, modifier: Modifier = Modifier) {
              val transition = rememberInfiniteTransition(label = "wave")
              val a by transition.animateFloat(
                  initialValue = 0.30f, targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(520, easing = LinearEasing), RepeatMode.Reverse), label = "a",
              )
              val b by transition.animateFloat(
                  initialValue = 0.45f, targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(410, easing = LinearEasing), RepeatMode.Reverse), label = "b",
              )
              val c by transition.animateFloat(
                  initialValue = 0.25f, targetValue = 0.95f,
                  animationSpec = infiniteRepeatable(tween(680, easing = LinearEasing), RepeatMode.Reverse), label = "c",
              )
              val d by transition.animateFloat(
                  initialValue = 0.40f, targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(470, easing = LinearEasing), RepeatMode.Reverse), label = "d",
              )
              val heights = if (playing) listOf(a, b, c, d, a * 0.8f) else listOf(0.3f, 0.5f, 0.8f, 0.5f, 0.3f)
              Canvas(modifier.size(width = 26.dp, height = 22.dp)) {
                  val n = heights.size
                  val barW = size.width / (n * 2f - 1f)
                  heights.forEachIndexed { i, h ->
                      val bh = size.height * h
                      drawRoundRect(
                          color = Color.White.copy(alpha = 0.55f),
                          topLeft = Offset(i * 2f * barW, (size.height - bh) / 2f),
                          size = Size(barW, bh),
                          cornerRadius = CornerRadius(barW / 2f, barW / 2f),
                      )
                  }
              }
          }

          private enum class Glyph { PLAY, PAUSE, PREV, NEXT }

          @Composable
          private fun TransportGlyph(glyph: Glyph, modifier: Modifier = Modifier, tint: Color = Color.White) {
              Canvas(modifier) {
                  val w = size.width
                  val h = size.height
                  val round = Stroke(width = w * 0.07f, join = StrokeJoin.Round, cap = StrokeCap.Round)
                  fun triangle(x0: Float, x1: Float, pointsRight: Boolean): Path = Path().apply {
                      if (pointsRight) {
                          moveTo(x0, 0.08f * h); lineTo(x1, 0.5f * h); lineTo(x0, 0.92f * h)
                      } else {
                          moveTo(x1, 0.08f * h); lineTo(x0, 0.5f * h); lineTo(x1, 0.92f * h)
                      }
                      close()
                  }
                  fun filled(p: Path) {
                      drawPath(p, tint)
                      drawPath(p, tint, style = round)
                  }
                  when (glyph) {
                      Glyph.PLAY -> filled(triangle(0.22f * w, 0.92f * w, true))
                      Glyph.PAUSE -> {
                          val bw = 0.27f * w
                          val r = CornerRadius(0.09f * w, 0.09f * w)
                          drawRoundRect(tint, Offset(0.10f * w, 0.04f * h), Size(bw, 0.92f * h), r)
                          drawRoundRect(tint, Offset(0.63f * w, 0.04f * h), Size(bw, 0.92f * h), r)
                      }
                      Glyph.PREV -> {
                          filled(triangle(0.03f * w, 0.50f * w, false))
                          filled(triangle(0.50f * w, 0.97f * w, false))
                      }
                      Glyph.NEXT -> {
                          filled(triangle(0.03f * w, 0.50f * w, true))
                          filled(triangle(0.50f * w, 0.97f * w, true))
                      }
                  }
              }
          }

          @Composable
          private fun SpeakerGlyph(waves: Int, modifier: Modifier, tint: Color) {
              Canvas(modifier) {
                  val w = size.width
                  val h = size.height
                  val body = Path().apply {
                      moveTo(0.05f * w, 0.38f * h)
                      lineTo(0.28f * w, 0.38f * h)
                      lineTo(0.50f * w, 0.18f * h)
                      lineTo(0.50f * w, 0.82f * h)
                      lineTo(0.28f * w, 0.62f * h)
                      lineTo(0.05f * w, 0.62f * h)
                      close()
                  }
                  drawPath(body, tint)
                  for (i in 1..waves) {
                      val r = (0.16f + 0.13f * i) * w
                      drawArc(
                          color = tint,
                          startAngle = -45f,
                          sweepAngle = 90f,
                          useCenter = false,
                          topLeft = Offset(0.5f * w - r, 0.5f * h - r),
                          size = Size(2f * r, 2f * r),
                          style = Stroke(width = w * 0.09f, cap = StrokeCap.Round),
                      )
                  }
              }
          }

          @Composable
          private fun FlashlightGlyph(modifier: Modifier, tint: Color) {
              Canvas(modifier) {
                  val w = size.width
                  val h = size.height
                  drawRoundRect(tint, Offset(0.26f * w, 0.04f * h), Size(0.48f * w, 0.24f * h), CornerRadius(0.06f * w, 0.06f * w))
                  drawRoundRect(tint, Offset(0.34f * w, 0.28f * h), Size(0.32f * w, 0.66f * h), CornerRadius(0.08f * w, 0.08f * w))
                  drawRoundRect(
                      Color.Black.copy(alpha = 0.35f),
                      Offset(0.46f * w, 0.42f * h),
                      Size(0.08f * w, 0.18f * h),
                      CornerRadius(0.04f * w, 0.04f * w),
                  )
              }
          }

          @Composable
          private fun CameraGlyph(modifier: Modifier, tint: Color) {
              Canvas(modifier) {
                  val w = size.width
                  val h = size.height
                  drawRoundRect(tint, Offset(0.30f * w, 0.14f * h), Size(0.28f * w, 0.16f * h), CornerRadius(0.05f * w, 0.05f * w))
                  drawRoundRect(tint, Offset(0.06f * w, 0.24f * h), Size(0.88f * w, 0.62f * h), CornerRadius(0.14f * w, 0.14f * w))
                  drawCircle(Color.Black.copy(alpha = 0.55f), radius = 0.19f * w, center = Offset(0.5f * w, 0.55f * h))
                  drawCircle(tint, radius = 0.12f * w, center = Offset(0.5f * w, 0.55f * h))
              }
          }
          KT_ACTIVITY_EOF
          cat > app/src/main/res/values/lock_screen_strings.xml <<'LS_STRINGS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="lock_screen_player" translatable="false">Màn khoá kiểu iOS 26</string>
              <string name="lock_screen_player_subtitle" translatable="false">Khoá máy lúc đang phát nhạc: nền Canvas hoặc ảnh bìa toàn màn hình, thẻ điều khiển kính mờ, vuốt lên để mở khoá</string>
              <string name="lock_screen_player_permission" translatable="false">Cấp quyền hiện trên màn khoá</string>
              <string name="lock_screen_player_permission_subtitle" translatable="false">Nếu màn khoá mới không hiện: bật Hiển thị trên ứng dụng khác, và quyền hiện trên màn hình khoá của hãng máy</string>
          </resources>
          LS_STRINGS_EOF
          cat > "$RUNNER_TEMP/patch_ios26.py" <<'IOS26_PY_EOF'
          import re, sys

          def read(p):
              return open(p, encoding="utf8").read()

          def write(p, s):
              open(p, "w", encoding="utf8").write(s)

          def fail(msg):
              sys.exit(f"::error::{msg}")

          # ---------------------------------------------------------------- AndroidManifest.xml (bắt buộc)
          MF = "app/src/main/AndroidManifest.xml"
          s = read(MF)
          if "LockScreenActivity" in s:
              print("Manifest đã có LockScreenActivity, bỏ qua.")
          else:
              perm_anchor = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
              if s.count(perm_anchor) != 1:
                  fail("Không tìm được dòng POST_NOTIFICATIONS trong AndroidManifest.xml để thêm quyền màn khoá.")
              extra_perms = (
                  perm_anchor
                  + '\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />'
                  + '\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />'
              )
              s = s.replace(perm_anchor, extra_perms)
              if s.count("</application>") != 1:
                  fail("AndroidManifest.xml không có đúng một thẻ </application>.")
              activity = '''
                  <!-- Màn khoá kiểu iOS 26: hiện đè lên màn khoá hệ thống khi đang phát nhạc. -->
                  <activity
                      android:name=".lockscreen.LockScreenActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:launchMode="singleInstance"
                      android:taskAffinity=""
                      android:showWhenLocked="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode"
                      android:theme="@style/Theme.BitChord" />
          '''
              s = s.replace("</application>", activity + "    </application>")
              write(MF, s)
              print("Đã thêm LockScreenActivity + quyền vào AndroidManifest.xml")

          # ---------------------------------------------------------------- BitChordApplication.kt (bắt buộc)
          APP = "app/src/main/java/com/music/bitchord/BitChordApplication.kt"
          s = read(APP)
          if "LockScreenLauncher" in s:
              print("Application đã gọi LockScreenLauncher, bỏ qua.")
          else:
              anchor = "    override fun onCreate() {\n        super.onCreate()\n"
              if s.count(anchor) != 1:
                  fail("Không vá được BitChordApplication.onCreate (tìm thấy %d chỗ khớp, cần đúng 1)." % s.count(anchor))
              s = s.replace(anchor, anchor + "        com.music.bitchord.lockscreen.LockScreenLauncher.init(this)\n")
              write(APP, s)
              print("Đã gọi LockScreenLauncher.init trong BitChordApplication.onCreate")

          # ---------------------------------------------------------------- SettingsSheet.kt (không bắt buộc: lỗi thì chỉ cảnh báo, màn khoá vẫn bật mặc định)
          SS = "app/src/main/java/com/music/bitchord/ui/screens/SettingsSheet.kt"
          try:
              s = read(SS)
              if "lock_screen_player" in s:
                  print("SettingsSheet đã có công tắc màn khoá, bỏ qua.")
              else:
                  a1 = "    val animatedCanvas by AppSettings.animatedCanvas.collectAsStateWithLifecycle()\n"
                  a2 = "            val animatedCoverArtTitle = stringResource(R.string.animated_cover_art)\n"
                  if s.count(a1) != 1 or s.count(a2) != 1:
                      raise RuntimeError("không thấy chỗ gắn (a1=%d, a2=%d)" % (s.count(a1), s.count(a2)))
                  s = s.replace(
                      a1,
                      a1 + "    val lockScreenPlayer by com.music.bitchord.lockscreen.LockScreenSettings.enabled.collectAsStateWithLifecycle()\n",
                  )
                  rows = '''            val lockScreenContext = androidx.compose.ui.platform.LocalContext.current
                      val lockScreenTitle = stringResource(R.string.lock_screen_player)
                      row(lockScreenTitle, "lock", "screen", "khoá", "màn khoá", "ios", "canvas") {
                          SettingsRow(
                              icon = SfIcons.Lock,
                              title = lockScreenTitle,
                              subtitle = stringResource(R.string.lock_screen_player_subtitle),
                              trailing = {
                                  IosSwitch(
                                      checked = lockScreenPlayer,
                                      onCheckedChange = { com.music.bitchord.lockscreen.LockScreenSettings.set(lockScreenContext, it) },
                                  )
                              },
                              onClick = {
                                  com.music.bitchord.lockscreen.LockScreenSettings.set(lockScreenContext, !lockScreenPlayer)
                              },
                          )
                      }
                      if (lockScreenPlayer) {
                          val lockScreenPermTitle = stringResource(R.string.lock_screen_player_permission)
                          row(lockScreenPermTitle, "permission", "overlay", "quyền", divided = false) {
                              SettingsRow(
                                  icon = SfIcons.Lock,
                                  title = lockScreenPermTitle,
                                  subtitle = stringResource(R.string.lock_screen_player_permission_subtitle),
                                  trailing = { Chevron() },
                                  onClick = {
                                      com.music.bitchord.lockscreen.LockScreenLauncher.openPermissionSettings(lockScreenContext)
                                  },
                              )
                          }
                      }
          '''
                  s = s.replace(a2, rows + a2)
                  write(SS, s)
                  print("Đã thêm công tắc 'Màn khoá kiểu iOS 26' vào Cài đặt")
          except Exception as e:
              print(f"::warning::Không gắn được công tắc vào Cài đặt ({e}). Màn khoá vẫn hoạt động, mặc định BẬT.")
          IOS26_PY_EOF
          python3 "$RUNNER_TEMP/patch_ios26.py"
          {
            echo
            echo "### Màn khoá kiểu iOS 26"
            echo "- Nền: clip Canvas (Spotify / Apple / Tidal) toàn màn hình, không có thì ảnh bìa phóng đầy màn hình"
            echo "- Giờ + ngày một dòng ở trên, thẻ kính mờ (tên bài, nghệ sĩ, thanh tua, trước / phát-dừng / sau, sao yêu thích, âm lượng)"
            echo "- Nút tròn đèn pin + camera, thanh home, vuốt lên để mở khoá (hỏi PIN / vân tay như thường)"
            echo "- Tự hiện khi bật màn hình lúc máy đang khoá và Bit Dev đang phát nhạc. Bật / tắt: Cài đặt, Màn khoá kiểu iOS 26"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pick a build number newer than every existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Cùng cách tính với workflow "Bit Dev APK": số lớn nhất trong MỌI tag dạng x.y.z.N của repo + 1 (không dùng run_number
          # trần vì mỗi workflow đếm riêng), để versionCode luôn cao hơn bản đang cài, nếu không Android từ chối cài đè (coi là hạ
          # phiên bản). Lỗi gọi API thì dừng hẳn (không đoán số) để khỏi đăng nhầm một bản thấp hơn.
          TAGS="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq '.[].tag_name')"
          MAX=0
          while IFS= read -r T; do
            if [[ "$T" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+\.([0-9]+)$ ]]; then
              X=$(( 10#${BASH_REMATCH[1]} ))
              if (( X > MAX )); then MAX=$X; fi
            fi
          done <<< "$TAGS"
          N=$(( MAX + 1 ))
          if (( N < GITHUB_RUN_NUMBER )); then N=$GITHUB_RUN_NUMBER; fi
          echo "BUILD_N=$N" >> "$GITHUB_ENV"
          echo "Số bản dựng: $N (số lớn nhất trong các tag trước đó: $MAX)" >> "$GITHUB_STEP_SUMMARY"

      - name: Patch (rename, version, updater)
        env:
          RUN: ${{ env.BUILD_N }}
        run: |
          sed -i "s/com\.dev\.bitchord/${APP_PKG}/g; s/BitChord Dev/Bit Dev/g" \
            app/build.gradle.kts app/src/dev/AndroidManifest.xml wearos/build.gradle.kts tv/build.gradle.kts
          sed -i '/UPDATE_APK_PREFIX/s/BitChord-/Bit-/' app/build.gradle.kts
          sed -i 's#repos/[A-Za-z0-9_-]*/[A-Za-z0-9_-]*/releases/latest#repos/${{ github.repository }}/releases/latest#' \
            app/src/main/java/com/music/bitchord/data/AppUpdateChecker.kt
          python3 - <<'PY'
          import os, re
          run = int(os.environ["RUN"])
          s = open("build.gradle.kts").read()
          m = re.search(r'(?:bitchordVersionName"\] = |baseVersion = )"([0-9.]+)"', s)
          ver = f"{m.group(1)}.{run}"
          code = max(39 + run, int(os.environ.get("MIN_CODE", "0") or 0))
          s = re.sub(r'extra\["bitchordVersionCode"\][^\n]*', f'extra["bitchordVersionCode"] = {code}', s)
          s = re.sub(r'extra\["bitchordVersionName"\] = [^\n]*(\n    if [^\n]*)?',
                     f'extra["bitchordVersionName"] = "{ver}"', s)
          open("build.gradle.kts", "w").write(s)
          open(os.environ["GITHUB_ENV"], "a").write(f"VER={ver}\n")
          PY

      # Neu repo co secret thi dung secret, khong thi dung key dev nhung san ben duoi.

      - name: Setup Secrets (Keystore & local.properties)
        env:
          S_LASTFM_KEY: ${{ secrets.LASTFM_API_KEY }}
          S_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          S_LISTEN: ${{ secrets.LISTEN_TOGETHER_SERVER }}
          S_KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "LASTFM_API_KEY=$S_LASTFM_KEY"
            echo "LASTFM_SECRET=$S_LASTFM_SECRET"
            echo "LISTEN_TOGETHER_SERVER=$S_LISTEN"
          } > local.properties
          KS_B64="$S_KS_B64"; KS_PASS="$S_KS_PASS"; KEY_ALIAS="$S_KEY_ALIAS"; KEY_PASS="$S_KEY_PASS"
          if [ -z "$KS_B64" ]; then
            KS_B64=''
            KS_PASS='M8rnSCC3C4TkChAh'
            KEY_ALIAS='bitdev'
            KEY_PASS='M8rnSCC3C4TkChAh'
          fi
          echo "$KS_B64" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - run: chmod +x gradlew
      - name: Pre-fetch libusb (GitHub release downloads keep returning 504)
        run: |
          # CMake tai libusb 1.0.27 tu trang release cua GitHub luc cau hinh, va trang do dang tra 504.
          # Thu lan luot: GitHub, SourceForge, kho goi Debian (cung mot file, kiem tra bang ma bam SHA256 ma
          # CMakeLists da ghim). Het cach thi git clone dung tag v1.0.27 va dong goi lai (khi do bo dong ghim ma bam).
          D="$HOME/libusb-cache"
          F="$D/libusb-1.0.27.tar.bz2"
          SHA="ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575"
          GH="https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2"
          CM=app/src/main/cpp/CMakeLists.txt
          mkdir -p "$D"
          OK=0
          for round in 1 2; do
            for U in "$GH" \
                     "https://downloads.sourceforge.net/project/libusb/libusb-1.0/libusb-1.0.27/libusb-1.0.27.tar.bz2" \
                     "https://deb.debian.org/debian/pool/main/libu/libusb-1.0/libusb-1.0_1.0.27.orig.tar.bz2"; do
              if curl -fsSL --retry 2 --retry-delay 3 --max-time 120 -o "$F" "$U" \
                 && echo "$SHA  $F" | sha256sum -c - > /dev/null 2>&1; then
                echo "Da tai libusb tu: $U"
                OK=1
                break 2
              fi
              echo "Khong tai duoc (hoac sai ma bam) tu: $U"
              rm -f "$F"
            done
            sleep 15
          done
          if [ "$OK" = 1 ]; then
            sed -i "s#$GH#file://$F#" "$CM"
          else
            echo "Ca ba nguon tai deu hong, thu git clone tag v1.0.27"
            for i in 1 2 3; do
              rm -rf "$D/libusb-1.0.27"
              if git clone --depth 1 --branch v1.0.27 https://github.com/libusb/libusb.git "$D/libusb-1.0.27"; then
                rm -rf "$D/libusb-1.0.27/.git"
                tar -C "$D" -cjf "$D/libusb-git.tar.bz2" libusb-1.0.27
                # Ban dong goi lai khong cung ma bam voi ban phat hanh, nen bo dong ghim ma bam.
                sed -i "s#$GH#file://$D/libusb-git.tar.bz2#; s#URL_HASH SHA256=$SHA)#)#" "$CM"
                echo "Da dung libusb tu git clone"
                break
              fi
              sleep 20
            done
          fi
          sed -n '/FetchContent_Declare(libusb/,/FetchContent_MakeAvailable(libusb)/p' "$CM"

      - name: Build the dev release APK (thu lai khi GitHub tra loi loi tam thoi)
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleDevRelease; then
              exit 0
            fi
            echo "Build attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: Verify the APK will update in place (same package, higher version, same signature)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set +e
          APK="$(ls app/build/outputs/apk/dev/release/*.apk | head -n 1)"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2="$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1)"
          APKSIGNER="$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)"

          # 1) Tên gói + phiên bản: sai là DỪNG. Sai tên gói = Android cài thành app MỚI cạnh app cũ (đúng thứ không được xảy ra).
          if [ -z "$AAPT2" ]; then
            echo "::warning::Không thấy aapt2 trên runner, bỏ qua kiểm tra tên gói/phiên bản."
          else
            BADGE="$("$AAPT2" dump badging "$APK" 2>/dev/null)"
            PKG="$(grep -oP "package: name='\K[^']+" <<< "$BADGE" | head -n 1)"
            CODE="$(grep -oP "versionCode='\K[0-9]+" <<< "$BADGE" | head -n 1)"
            NAME="$(grep -oP "versionName='\K[^']+" <<< "$BADGE" | head -n 1)"
            WANT="$(grep -oP 'bitchordVersionCode"\] = \K[0-9]+' build.gradle.kts | head -n 1)"
            echo "APK: gói=$PKG versionCode=$CODE versionName=$NAME | cần: $APP_PKG $WANT $VER"
            if [ "$PKG" != "$APP_PKG" ]; then
              echo "::error::APK có tên gói '$PKG' (cần $APP_PKG). Cài lên sẽ thành app MỚI chứ không đè app cũ. Dừng, không đăng."
              exit 1
            fi
            if [ "$CODE" != "$WANT" ] || [ "$NAME" != "$VER" ]; then
              echo "::error::Phiên bản trong APK ($NAME / $CODE) không khớp bản định đăng ($VER / $WANT). Dừng, không đăng."
              exit 1
            fi
            echo "- APK đúng gói ${APP_PKG}, v${NAME} (versionCode ${CODE}): cài đè lên app đang dùng" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 2) Chữ ký: so với APK của release hiện tại. Lệch thì Android báo xung đột chữ ký và KHÔNG cài đè được. Chỉ cảnh báo.
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::Không thấy apksigner trên runner, bỏ qua so sánh chữ ký."
          else
            PREVDIR="$RUNNER_TEMP/prev-apk"
            rm -rf "$PREVDIR"; mkdir -p "$PREVDIR"
            if [ -n "${REF_APK:-}" ] && [ -f "${REF_APK:-}" ]; then cp "$REF_APK" "$PREVDIR/installed.apk"; fi
            if ls "$PREVDIR"/*.apk > /dev/null 2>&1 || gh release download --repo "$GITHUB_REPOSITORY" --pattern 'Bit-*.apk' --dir "$PREVDIR" --clobber > /dev/null 2>&1; then
              PREV="$(ls "$PREVDIR"/*.apk 2>/dev/null | head -n 1)"
              cert() { "$APKSIGNER" verify --print-certs "$1" 2>/dev/null | grep -m1 -i 'certificate SHA-256 digest' | awk '{print $NF}'; }
              A="$(cert "$APK")"
              B="$([ -n "$PREV" ] && cert "$PREV")"
              if [ -n "$A" ] && [ "$A" = "$B" ]; then
                echo "- Chữ ký trùng với release hiện tại (${A:0:16}...): app cũ cập nhật đè được" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::Chữ ký APK mới khác APK của release hiện tại. Nếu app đang cài được ký bằng khoá kia thì Android sẽ không cho cài đè. Kiểm tra secret KEYSTORE_BASE64 / KEY_ALIAS."
                echo "- CẢNH BÁO: chữ ký khác release hiện tại (mới ${A:0:16}..., cũ ${B:0:16}...)" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "Chưa có release nào có APK Bit-*.apk để so chữ ký (lần đăng đầu?)."
            fi
          fi

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: bit-dev-gemini-arm64
          path: app/build/outputs/apk/dev/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/dev/release/*.apk | head -1)
          # Tên file phải bắt đầu bằng UPDATE_APK_PREFIX ("Bit-") thì hộp thoại cập nhật trong app mới nhận.
          cp "$APK" "Bit-v${VER}_arm64-v8a.apk"
          gh release delete "v${VER}" --cleanup-tag --yes || true
          gh release create "v${VER}" "Bit-v${VER}_arm64-v8a.apk" \
            --target "$GITHUB_SHA" --latest --title "Bit Dev v${VER}" \
            --notes "Build #${{ github.run_number }}: màn khoá kiểu iOS 26 (nền Canvas / ảnh bìa toàn màn hình, thẻ kính mờ, vuốt lên để mở khoá; bật tắt trong Cài đặt) + dịch lời bằng Gemini với prompt xưng hô mới. Cùng app Bit Dev, cài đè lên bản cũ, giữ nguyên dữ liệu."
          echo "Đã đăng lên Releases: v${VER}" >> "$GITHUB_STEP_SUMMARY"
