          package com.music.bitchord.lockscreen

          import android.app.Application
          import android.app.KeyguardManager
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import com.music.bitchord.R
          import com.music.bitchord.widget.MediaWidgetSnapshot
          import kotlinx.coroutines.flow.MutableStateFlow

          /**
           * Bật/tắt màn khoá kiểu iOS 26. Lưu riêng một file prefs để không đụng vào AppSettings.
           */
          object LockScreenSettings {
              private const val PREFS = "bitchord_lockscreen"
              private const val KEY_ENABLED = "enabled"

              val enabled = MutableStateFlow(true)

              fun init(context: Context) {
                  enabled.value = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getBoolean(KEY_ENABLED, true)
              }

              fun set(context: Context, value: Boolean) {
                  enabled.value = value
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit().putBoolean(KEY_ENABLED, value).apply()
              }
          }

          /**
           * Nghe sự kiện bật màn hình. Nếu máy đang khoá và Bit Dev đang phát nhạc thì mở
           * [LockScreenActivity] đè lên màn khoá của hệ thống.
           *
           * Android 10+ chặn app mở Activity từ nền, nên có hai đường:
           *  1. startActivity trực tiếp (chạy được khi app có quyền "hiển thị trên ứng dụng khác" hoặc hãng máy cho phép);
           *  2. nếu sau ~0,6 giây Activity vẫn chưa lên thì đăng một thông báo full-screen-intent (màn khoá đang hiện
           *     nên hệ thống sẽ mở Activity thay vì hiện thông báo).
           */
          object LockScreenLauncher {

              private const val CHANNEL_ID = "lock_screen_player"
              private const val NOTIFICATION_ID = 0x4C53
              private val main = Handler(Looper.getMainLooper())
              private var registered = false

              fun init(app: Application) {
                  if (registered) return
                  registered = true
                  LockScreenSettings.init(app)
                  val receiver = object : BroadcastReceiver() {
                      override fun onReceive(context: Context, intent: Intent) {
                          when (intent.action) {
                              Intent.ACTION_SCREEN_ON -> onScreenOn(context.applicationContext)
                              Intent.ACTION_USER_PRESENT -> cancelNotification(context.applicationContext)
                          }
                      }
                  }
                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_SCREEN_ON)
                      addAction(Intent.ACTION_USER_PRESENT)
                  }
                  ContextCompat.registerReceiver(app, receiver, filter, ContextCompat.RECEIVER_NOT_EXPORTED)
              }

              private fun onScreenOn(context: Context) {
                  if (!LockScreenSettings.enabled.value) return
                  val keyguard = context.getSystemService(KeyguardManager::class.java) ?: return
                  if (!keyguard.isKeyguardLocked) return
                  val snapshot = runCatching { MediaWidgetSnapshot.load(context) }.getOrNull() ?: return
                  if (!snapshot.hasTrack || !snapshot.isPlaying) return
                  show(context)
              }

              private fun intentFor(context: Context) = Intent(context, LockScreenActivity::class.java).addFlags(
                  Intent.FLAG_ACTIVITY_NEW_TASK or
                      Intent.FLAG_ACTIVITY_NO_ANIMATION or
                      Intent.FLAG_ACTIVITY_REORDER_TO_FRONT,
              )

              private fun show(context: Context) {
                  runCatching { context.startActivity(intentFor(context)) }
                  main.postDelayed({
                      if (!LockScreenActivity.alive && LockScreenSettings.enabled.value) {
                          postFullScreenNotification(context)
                      }
                  }, 600L)
              }

              private fun postFullScreenNotification(context: Context) {
                  val nm = context.getSystemService(NotificationManager::class.java) ?: return
                  if (Build.VERSION.SDK_INT >= 34 && !nm.canUseFullScreenIntent()) return
                  if (Build.VERSION.SDK_INT >= 26) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Màn khoá kiểu iOS 26",
                          NotificationManager.IMPORTANCE_HIGH,
                      ).apply {
                          setSound(null, null)
                          enableVibration(false)
                          setShowBadge(false)
                          lockscreenVisibility = android.app.Notification.VISIBILITY_SECRET
                      }
                      nm.createNotificationChannel(channel)
                  }
                  val pending = PendingIntent.getActivity(
                      context,
                      0,
                      intentFor(context),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE,
                  )
                  val notification = NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_notification_logo)
                      .setContentTitle("Bit Dev")
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setVisibility(NotificationCompat.VISIBILITY_SECRET)
                      .setSilent(true)
                      .setOnlyAlertOnce(true)
                      .setAutoCancel(true)
                      .setTimeoutAfter(4000L)
                      .setFullScreenIntent(pending, true)
                      .build()
                  runCatching { nm.notify(NOTIFICATION_ID, notification) }
              }

              fun cancelNotification(context: Context) {
                  runCatching {
                      context.getSystemService(NotificationManager::class.java)?.cancel(NOTIFICATION_ID)
                  }
              }

              /** Mở trang cấp quyền còn thiếu: "hiển thị trên ứng dụng khác", rồi full-screen intent, rồi thông tin app. */
              fun openPermissionSettings(context: Context) {
                  val pkg = context.packageName
                  val uri = Uri.parse("package:$pkg")
                  val candidates = ArrayList<Intent>()
                  if (!Settings.canDrawOverlays(context)) {
                      candidates += Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, uri)
                  }
                  if (Build.VERSION.SDK_INT >= 34) {
                      val nm = context.getSystemService(NotificationManager::class.java)
                      if (nm != null && !nm.canUseFullScreenIntent()) {
                          candidates += Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT, uri)
                      }
                  }
                  candidates += Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, uri)
                  for (intent in candidates) {
                      try {
                          context.startActivity(intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          return
                      } catch (_: Exception) {
                      }
                  }
              }
          }
          KT_LAUNCHER_EOF
          cat > "$D/LockScreenActivity.kt" <<'KT_ACTIVITY_EOF'
