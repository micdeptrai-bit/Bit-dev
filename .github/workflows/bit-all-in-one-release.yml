          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.compose.collectAsStateWithLifecycle
          import com.music.bitchord.ui.player.PlayerPlatform
          import com.music.bitchord.ui.player.ThinSlider
          import java.util.Locale

          /**
           * The one card at the bottom of the lock-screen player: title and artist, the
           * scrubber, the transport and the volume, all on a single pane of liquid glass
           * (v2 folds the volume bar in, which also halves the blur work behind it).
           */
          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          internal fun TransportCard(
              glass: GlassSource,
              title: String,
              artist: String,
              isPlaying: Boolean,
              positionMs: Long,
              durationMs: Long,
              onPrevious: () -> Unit,
              onPlayPause: () -> Unit,
              onNext: () -> Unit,
              onSeekFraction: (Float) -> Unit,
              modifier: Modifier = Modifier,
          ) {
              val shape = RoundedCornerShape(36.dp)
              // The fraction under the finger while scrubbing; null the rest of the time.
              var scrub by remember { mutableStateOf<Float?>(null) }
              val progress = if (durationMs > 0L) {
                  (positionMs.toFloat() / durationMs.toFloat()).coerceIn(0f, 1f)
              } else {
                  0f
              }
              val scrubbing = scrub
              val shownPosition = if (scrubbing != null && durationMs > 0L) (scrubbing * durationMs).toLong() else positionMs
              val digits = TextStyle(fontFeatureSettings = "tnum")

              GlassSurface(
                  glass = glass,
                  shape = shape,
                  modifier = modifier
                      .fillMaxWidth()
                      .padding(horizontal = 28.dp),
                  contentPadding = PaddingValues(start = 22.dp, end = 22.dp, top = 16.dp, bottom = 12.dp),
              ) {
                  // A long title drifts sideways instead of ending in an ellipsis.
                  Text(
                      text = title,
                      color = Color.White,
                      fontSize = 19.sp,
                      fontWeight = FontWeight.Bold,
                      maxLines = 1,
                      overflow = TextOverflow.Clip,
                      modifier = Modifier.basicMarquee(),
                  )
                  Text(
                      text = artist,
                      color = Color.White.copy(alpha = 0.72f),
                      fontSize = 14.sp,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis,
                  )
                  Spacer(Modifier.height(8.dp))
                  ThinSlider(
                      value = scrubbing ?: progress,
                      onValueChange = { scrub = it },
                      onValueChangeFinished = {
                          val target = scrub
                          scrub = null
                          if (target != null) onSeekFraction(target)
                      },
                      idleHeight = 6.dp,
                      activeHeight = 11.dp,
                      modifier = Modifier.fillMaxWidth(),
                  )
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                  ) {
                      Text(
                          text = formatTime(shownPosition),
                          color = Color.White.copy(alpha = 0.66f),
                          fontSize = 12.sp,
                          style = digits,
                      )
                      Text(
                          text = "-" + formatTime((durationMs - shownPosition).coerceAtLeast(0L)),
                          color = Color.White.copy(alpha = 0.66f),
                          fontSize = 12.sp,
                          style = digits,
                      )
                  }
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(top = 2.dp),
                      horizontalArrangement = Arrangement.SpaceEvenly,
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      ControlButton(onClick = onPrevious, touch = 56.dp) {
                          Icon(Icons.Rounded.SkipPrevious, contentDescription = null, tint = Color.White, modifier = Modifier.size(36.dp))
                      }
                      ControlButton(onClick = onPlayPause, touch = 68.dp) {
                          GlassDisc(size = 56.dp) {
                              Crossfade(targetState = isPlaying, animationSpec = tween(180), label = "playPause") { playing ->
                                  Icon(
                                      imageVector = if (playing) Icons.Rounded.Pause else Icons.Rounded.PlayArrow,
                                      contentDescription = null,
                                      tint = Color.White,
                                      modifier = Modifier.size(38.dp),
                                  )
                              }
                          }
                      }
                      ControlButton(onClick = onNext, touch = 56.dp) {
                          Icon(Icons.Rounded.SkipNext, contentDescription = null, tint = Color.White, modifier = Modifier.size(36.dp))
                      }
                  }
                  Spacer(Modifier.height(6.dp))
                  VolumeBar()
              }
          }

          /** A transport button with no ripple: it dips under the finger and springs back. */
          @Composable
          private fun ControlButton(onClick: () -> Unit, touch: Dp, content: @Composable () -> Unit) {
              val source = remember { MutableInteractionSource() }
              val pressed by source.collectIsPressedAsState()
              val scale by animateFloatAsState(
                  targetValue = if (pressed) 0.84f else 1f,
                  animationSpec = spring(dampingRatio = Spring.DampingRatioMediumBouncy, stiffness = Spring.StiffnessMedium),
                  label = "controlPress",
              )
              Box(
                  modifier = Modifier
                      .size(touch)
                      .graphicsLayer {
                          scaleX = scale
                          scaleY = scale
                      }
                      .clickable(interactionSource = source, indication = null, onClick = onClick),
                  contentAlignment = Alignment.Center,
              ) {
                  content()
              }
          }

          /**
           * The phone's media volume, between a quiet and a loud speaker, on the same bar
           * the player's own volume uses. It follows the hardware keys and changes
           * of output, and never fights the finger that is moving it.
           */
          @Composable
          private fun VolumeBar(modifier: Modifier = Modifier) {
              val volume = remember { PlayerPlatform.host.volume }
              val systemLevel by volume.level.collectAsStateWithLifecycle()
              var level by remember { mutableFloatStateOf(systemLevel) }
              var dragging by remember { mutableStateOf(false) }

              LaunchedEffect(Unit) { volume.refresh() }
              LaunchedEffect(systemLevel) {
                  if (!dragging) level = systemLevel
              }

              Row(
                  modifier = modifier.fillMaxWidth(),
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  Icon(
                      Icons.AutoMirrored.Rounded.VolumeDown,
                      contentDescription = null,
                      tint = Color.White.copy(alpha = 0.6f),
                      modifier = Modifier.size(22.dp),
                  )
                  Spacer(Modifier.width(10.dp))
                  ThinSlider(
                      value = level,
                      onValueChange = {
                          dragging = true
                          level = it
                          volume.set(it)
                      },
                      onValueChangeFinished = {
                          dragging = false
                          volume.refresh()
                      },
                      idleHeight = 6.dp,
                      activeHeight = 10.dp,
                      modifier = Modifier.weight(1f),
                  )
                  Spacer(Modifier.width(10.dp))
                  Icon(
                      Icons.AutoMirrored.Rounded.VolumeUp,
                      contentDescription = null,
                      tint = Color.White.copy(alpha = 0.6f),
                      modifier = Modifier.size(22.dp),
                  )
              }
          }

          private fun formatTime(ms: Long): String {
              val totalSeconds = (ms / 1000L).coerceAtLeast(0L)
              return String.format(Locale.ROOT, "%d:%02d", totalSeconds / 60L, totalSeconds % 60L)
          }
