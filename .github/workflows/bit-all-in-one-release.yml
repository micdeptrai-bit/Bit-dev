name: "Bit-dev ALL-IN-ONE: Automix + Canvas + Màn hình khóa Liquid Glass v2 + AI DJ + engine native → build, ký, release, tự cập nhật"
# BẢN SỬA: input bit_dev_app (mặc định BẬT) build đúng app Bit Dev đang cài (gói com.bit.dev, khoá ký của Bit Dev APK) để cập nhật ĐÈ,
# không còn đẻ thêm app com.music.bitchord. Có thêm chốt chặn: cùng gói mà khác chữ ký / versionCode thấp hơn bản đang phát thì dừng trước khi đăng.
# Runner ghim ubuntu-24.04 (ubuntu-latest giờ là 26.04, thiếu Android SDK ở đường dẫn cũ).
# Ảnh bìa màn khoá v2: nằm giữa clock và player, chiếm hết bề rộng, mép trái/phải để nguyên (không mờ), mép trên/dưới luôn mờ 20% chiều cao ảnh kể cả khi ẩn đồng hồ và player. Thẻ player nhỏ gọn hơn vào bản sao mờ của chính ảnh.

# ======================================================================================
# MỘT FILE duy nhất. Chạy tay: Actions -> chọn workflow này -> Run workflow.
# Mọi thay đổi chỉ áp vào bản sao tạm trên máy chủ lúc build (KHÔNG commit gì vào repo).
#
# THỨ TỰ ÁP DỤNG
#   1. Automix v2-v6 + Canvas                 (patch nhúng sẵn)
#   2. Màn hình khóa gốc                       (patch nhúng sẵn: manifest, cài đặt, chuỗi, công tắc)
#   2b. MÀN HÌNH KHÓA V2 (lockscreen_v2)       ghi đè 3 file cũ + thêm 3 file mới:
#        - Khởi chạy ổn định hơn: chờ keyguard ổn định rồi kiểm tra lại, chống bắn trùng, neo overlay cho Android 15+,
#          bọc mọi bước trong try/catch.
#        - Activity tự đóng nếu player không kết nối / không có bài; dừng video Canvas, poll vị trí và đồng hồ khi
#          màn hình không hiện; yêu cầu mở khóa lỗi thì chỉ đóng, không kẹt màn hình đen.
#        - Thiết kế lại giữ nguyên Liquid Glass: kính có thấu kính phóng nhẹ, viền sáng + viền mảnh bên trong, ánh sáng
#          đọng ở đáy; thẻ điều khiển gộp luôn thanh âm lượng; nút play dạng đĩa kính; công tắc kính; sheet chọn đồng hồ
#          dạng kính; thanh vuốt mở khóa.
#        - Mép trên/dưới của ảnh bìa và Canvas mờ dần như màn khóa iOS 26: mép trên chỉ khi đồng hồ hiện, mép dưới chỉ khi
#          trình phát hiện. Ảnh vuông giữ đúng tỉ lệ theo chiều ngang (không phóng to cắt chủ thể), mép dưới/trên tan vào ảnh nền mờ.
#        - Đồng hồ: bỏ 15 kiểu cũ nhạt nhẽo, còn 8 kiểu Liquid Glass: LIQUID, GLASS, LEON (mới), FROSTED, CARDS,
#          COMPACT, RING, ANALOG. Kiểu đã lưu mà không còn thì tự về LIQUID.
#   3. Bước 1-3 AI DJ (mix_layer) và bước 4 engine native duy nhất (native_engine)
#   4. Build APK arm64 (mặc định bản prod = com.music.bitchord, cùng tên gói với app chính), ký bằng khóa release của repo,
#      đặt tên Bit-v<ver>_arm64-v8a.apk
#   5. Tạo GitHub Release (latest) -> app cũ tự thấy bản mới (AppUpdateChecker đọc releases/latest)
#   6. Xóa release + tag cũ, xóa các lần chạy workflow cũ (và artifact đi kèm)
#
# CẬP NHẬT ĐÈ LÊN APP ĐANG DÙNG (không thêm app mới)
#   Android chỉ cài ĐÈ (giữ nguyên dữ liệu) khi APK mới có CÙNG tên gói và CÙNG chữ ký với bản đang cài.
#   - Tên gói: chọn app_variant.
#       prod      = com.music.bitchord        app chính của repo (MẶC ĐỊNH). Đây là bản để cập nhật đè.
#       dev       = com.dev.bitchord           app "BitChord Dev".
#       benchmark = com.dev.bitchord.benchmark2  app RIÊNG nằm cạnh app chính, không bao giờ đè được app chính.
#   - Chữ ký: dùng đúng 4 secret mà android.yml của repo đang dùng:
#       KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#     Nếu app đang cài được build bằng khóa đó thì bản mới đè được. Thiếu secret: workflow vẫn build và ký bằng khóa dự phòng
#     (secret UPDATE_KEYSTORE_BASE64, hoặc khóa lưu trong cache của repo), kèm cảnh báo, vì khóa đó CHỈ đè được các bản
#     do chính workflow này build, không đè được app đã cài từ khóa khác.
#   - Phiên bản: app so tag của release mới nhất (releases/latest) với versionName đang cài. Workflow tự tăng
#     (1.9.1 -> 1.9.2 -> ...) và ghi vào build nên bản nào cũng được coi là "mới hơn". Ô "version" cho phép đặt tay.
#   - Trước khi release, workflow kiểm tra APK: đúng tên gói của app_variant, đúng versionName/versionCode.
#   - Tên file APK phải bắt đầu bằng "Bit-" và kết thúc _arm64-v8a.apk: đó là cách AppUpdateChecker tìm bản tải.
#
# CÔNG TẮC
#   lockscreen_v2  : dùng màn hình khóa v2. Build Kotlin lỗi ở phần này -> chạy lại với false để có màn hình khóa cũ.
#   mix_layer      : bước 1-3 AI DJ. Lỗi thì chạy lại với false.
#   echo_cut       : kiểu ECHO_CUT.
#   native_engine  : MỘT engine native cho mọi chuyển bài (bước 4). Lỗi thì chạy lại với false.
#   run_tests      : test module shared (fail không chặn build APK).
#   app_variant    : prod (mặc định, cập nhật đè app chính) | dev | benchmark (app riêng).
#   build_apk      : build APK arm64.
#   publish_release: tạo release, app tự nhận cập nhật.
#   keep_old_releases: giữ bao nhiêu release cũ (0 = xóa hết, chỉ còn bản mới).
#   clean_old_runs : xóa các lần chạy workflow đã xong (mọi workflow, trừ lần này) và artifact của chúng.
#   version / release_notes: đặt tay phiên bản (vd 1.10.0) / thêm ghi chú vào cửa sổ cập nhật trong app.
# Nếu build lỗi: tải artifact "build-log" (chỉ có khi lỗi) rồi gửi lại để sửa.
# ======================================================================================

on:
  workflow_dispatch:
    inputs:
      app_variant:
        description: "Bản build: prod = app chính com.music.bitchord (cập nhật ĐÈ lên app đang dùng) | dev = com.dev.bitchord | benchmark = app riêng com.dev.bitchord.benchmark2"
        type: choice
        options:
          - prod
          - dev
          - benchmark
        default: prod
      bit_dev_app:
        description: "Build đúng app Bit Dev đang cài (gói com.bit.dev, cùng khoá ký với workflow Bit Dev APK) để bản mới CÀI ĐÈ lên nó, không đẻ thêm app. Bật thì bỏ qua app_variant. Tắt = build theo app_variant như cũ (prod = com.music.bitchord)"
        type: boolean
        default: true
      lockscreen_v2:
        description: "Màn hình khóa v2: ổn định hơn, Liquid Glass thiết kế lại, đồng hồ mới (có Leon). Tắt nếu build lỗi để về bản cũ"
        type: boolean
        default: true
      mix_layer:
        description: "Cài bước 1-3 AI DJ (chọn bài, kiểu cắt, engine overlap). Tắt nếu build lỗi"
        type: boolean
        default: true
      echo_cut:
        description: "Bật kiểu ECHO_CUT (echo-out đè lên intro êm). Tắt nếu nghe dở"
        type: boolean
        default: true
      native_engine:
        description: "MỘT engine native cho mọi chuyển bài: tempo ramp, EQ 3 band, filter, echo trên một clock. Tắt nếu build lỗi"
        type: boolean
        default: true
      run_tests:
        description: "Chạy toàn bộ test module shared (lâu hơn; test fail không chặn build APK)"
        type: boolean
        default: false
      build_apk:
        description: "Build APK arm64 theo app_variant"
        type: boolean
        default: true
      publish_release:
        description: "Tạo GitHub Release để app cũ tự nhận cập nhật"
        type: boolean
        default: true
      keep_old_releases:
        description: "Số release cũ giữ lại (0 = xóa hết, chỉ còn bản mới)"
        type: string
        default: "0"
      clean_old_runs:
        description: "Xóa các lần chạy workflow cũ (mọi workflow) và artifact của chúng"
        type: boolean
        default: true
      version:
        description: "Đặt tay phiên bản, ví dụ 1.10.0 (để trống = tự tăng từ bản mới nhất)"
        type: string
        default: ""
      release_notes:
        description: "Ghi chú thêm hiện trong cửa sổ cập nhật của app (tùy chọn)"
        type: string
        default: ""

# contents: tạo release + tag, xóa release cũ. actions: xóa lần chạy cũ.
permissions:
  contents: write
  actions: write

# Hai lần chạy cùng lúc sẽ giẫm lên nhau khi xóa/tạo release.
concurrency:
  group: bit-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4


      - name: Apply the combined changes
        run: |
          echo "" | base64 -d | tar -xz
          patch -p1 --no-backup-if-mismatch < automix-dj-base.patch
          rm automix-dj-base.patch

