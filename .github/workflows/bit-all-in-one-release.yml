              private fun blendPlanFor(
                  player: ExoPlayer,
                  current: MediaItem,
                  next: MediaItem,
                  plan: TransitionPlan,
                  currentAnalysis: TrackAnalysis,
                  nextAnalysis: TrackAnalysis,
                  durationMs: Long,
                  nextDurationMs: Long,
                  state: SmartAnalysis,
              ): BlendMix.Plan? {
                  if (!BlendMix.enabled || plan.blocked) return null
                  val pair = "${current.mediaId}->${next.mediaId}"
                  if (pair == overlapBlockedPair) return null
                  val refusal = loopRefusalFor(player, current, next, state)
                  val blend = if (refusal == null) {
                      BlendMix.fromPlan(plan, currentAnalysis, nextAnalysis, durationMs / 1000.0, nextDurationMs / 1000.0)
                  } else {
                      null
                  }
                  val tooLate = blend != null && blend.takeover * 1000 - player.currentPosition < OVERLAP_MIN_LEAD_MS
                  val verdict = "$pair: " + when {
                      refusal != null -> "no blend mix ($refusal)"
                      blend == null -> "no blend mix (planner's ${plan.reason} doesn't fit)"
                      tooLate -> "no blend mix (too late to set up)"
                      else -> "blend mix ${blendLabel(blend)} at ${"%.2f".format(Locale.ROOT, blend.takeover)}s"
                  }
