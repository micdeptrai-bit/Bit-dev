          cat > 'shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/OverlapMix.kt' <<'KT_EOF'
          package com.music.bitchord.playback.smart

          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.sin

          /**
           * A transition that is not a loop mix, rendered by the same native renderer
           * instead of two players and volume ramps: the outgoing song hands over to a
           * deck a few seconds before the move, the incoming song runs on its own deck,
           * and the renderer does the gain (equal power), and the echo, on one clock.
           *
           * This first cut covers the [CutGesture]s the planner picks for pairs it cannot
           * beatmatch. Both decks play at rate 1 (no stretch), so the mix is the music
           * exactly as it is, with sample-exact edges.
           *
           * Pure: reads a [TransitionPlan] and two analyses, returns a [Plan], and lays
           * it out as a [Clock] and the renderer's gain curves. No audio, no players.
           */
          object OverlapMix {
              /** Master switch. Off: every cut stays on the planner's two-player path, exactly as before. */
              var enabled: Boolean = false

              /** Seconds of outgoing music the renderer plays before the move starts, so the splice is long settled. */
              const val TAKEOVER_LEAD_SECONDS = 4.0

              /** Seconds after the move ends before the incoming player takes over from its deck (it needs time to align). */
              const val SETTLE_SECONDS = 3.0

              /** The takeover can't be earlier than this into the outgoing song. */
              const val MIN_TAKEOVER_SECONDS = 1.0

              /** Music that must remain in the incoming song after the handover. */
              const val CLEARANCE_SECONDS = 5.0

              /** Seconds the echo's send ramps up over at the start of an echo-out, in beats. */
              private const val ECHO_RAMP_BEATS = 1.0

              /** How fast the echo send closes at the end of the overlap. */
              private const val ECHO_CLOSE_SECONDS = 0.05

              /** Echo feedback: five repeats later (see [echoTailSeconds]) it is about -30 dB. */
              const val ECHO_FEEDBACK = 0.5f
              const val ECHO_RETURN = 0.8f

              private const val FADE_POINTS = 8
              private const val MAX_BEATS = 512

              data class Plan(
                  val gesture: CutGesture,
                  /** Outgoing track second at mix t0. */
                  val takeover: Double,
                  /** Mix seconds at which the move starts and ends. */
                  val cutStart: Double,
                  val cutEnd: Double,
                  /** Incoming track second at mix [cutStart]. */
                  val inCue: Double,
                  /** Seconds per beat of each song, for the scrubber's pulse. */
                  val outBeat: Double,
                  val inBeat: Double,
                  /** Echo delay in seconds; 0 for no echo. */
                  val echoSeconds: Double,
                  /** Seconds the echo keeps ringing after [cutEnd]. */
                  val tail: Double,
              ) {
                  val echo: Boolean get() = echoSeconds > 0.0
              }

              /** A piecewise-linear curve over mix seconds, as the renderer takes it. */
              class Curve(val times: DoubleArray, val values: FloatArray)

              /**
               * The overlap mix for a cut the planner already chose ([plan]'s reason is a
               * [CutGesture]'s), or null when the cut does not fit the renderer: the move
               * starts too early in the song to take over before it, the echo's tail would
               * run past the file, or too little of the incoming song is left.
               */
              fun fromCut(
                  plan: TransitionPlan,
                  analysis: TrackAnalysis,
                  nextAnalysis: TrackAnalysis,
                  length: Double,
                  nextLength: Double,
              ): Plan? {
                  if (!enabled || plan.blocked) return null
                  val gesture = when (plan.reason.removePrefix("before-")) {
                      CutGesture.QUICK_CUT.reason -> CutGesture.QUICK_CUT
                      CutGesture.DROP_CUT.reason -> CutGesture.DROP_CUT
                      CutGesture.ECHO_CUT.reason -> CutGesture.ECHO_CUT
                      else -> return null
                  }
                  val takeover = plan.transitionStart - TAKEOVER_LEAD_SECONDS
                  if (takeover < MIN_TAKEOVER_SECONDS) return null
                  val cutStart = TAKEOVER_LEAD_SECONDS
                  val cutEnd = plan.transitionEnd - takeover
                  if (cutEnd <= cutStart) return null
                  val echo = if (gesture == CutGesture.ECHO_CUT) plan.echoSeconds.orZero() else 0.0
                  val tail = if (echo > 0.0) echoTailSeconds(echo) else 0.0
                  if (length > 0.0 && takeover + cutEnd + tail > length - 0.25) return null
                  val inCue = plan.incomingCueTime
                  if (!inCue.isFinite() || inCue < 0.0) return null
                  val handoverTrack = inCue + (cutEnd + SETTLE_SECONDS - cutStart)
                  if (nextLength > 0.0 && handoverTrack > nextLength - CLEARANCE_SECONDS) return null
                  return Plan(
                      gesture = gesture,
                      takeover = takeover,
                      cutStart = cutStart,
                      cutEnd = cutEnd,
                      inCue = inCue,
                      outBeat = beatOf(plan.beatSeconds, analysis),
                      inBeat = beatOf(0.0, nextAnalysis),
                      echoSeconds = echo,
                      tail = tail,
                  )
              }

              private fun beatOf(given: Double, analysis: TrackAnalysis): Double {
                  if (given > 0.0) return given
                  val interval = analysis.beatInterval.orZero()
                  if (interval > 0.0) return interval
                  val bpm = analysis.bpm.orZero()
                  return if (bpm > 0.0) 60.0 / bpm else 0.5
              }

              // ---- The renderer's curves -----------------------------------------------------------------

              /** The outgoing deck's gain: joins the song at t0 (over the sink's own [handover]), then an equal-power fall. */
              fun outGain(plan: Plan, handover: Double): Curve {
                  val times = ArrayList<Double>()
                  val values = ArrayList<Float>()
                  times += -handover; values += 0f
                  times += 0.0; values += 1f
                  times += plan.cutStart; values += 1f
                  for (i in 1..FADE_POINTS) {
                      val f = i.toDouble() / FADE_POINTS
                      times += plan.cutStart + (plan.cutEnd - plan.cutStart) * f
                      values += if (i == FADE_POINTS) 0f else cos(PI / 2 * f).toFloat()
                  }
                  return Curve(times.toDoubleArray(), values.toFloatArray())
              }

              /** The incoming deck's gain: silent until the move, an equal-power rise, then full. */
              fun inGain(plan: Plan): Curve {
                  val times = ArrayList<Double>()
                  val values = ArrayList<Float>()
                  times += 0.0; values += 0f
                  times += plan.cutStart; values += 0f
                  for (i in 1..FADE_POINTS) {
                      val f = i.toDouble() / FADE_POINTS
                      times += plan.cutStart + (plan.cutEnd - plan.cutStart) * f
                      values += if (i == FADE_POINTS) 1f else sin(PI / 2 * f).toFloat()
                  }
                  return Curve(times.toDoubleArray(), values.toFloatArray())
              }

              /**
               * What the outgoing deck feeds its echo: nothing until the move, a beat's
               * ramp up, full to the end of the overlap, then closed so the repeats ring
               * out on their own. Null when the gesture has no echo.
               */
              fun echoSend(plan: Plan): Curve? {
                  if (!plan.echo) return null
                  val ramp = minOf(plan.outBeat * ECHO_RAMP_BEATS, (plan.cutEnd - plan.cutStart) / 2)
                  return Curve(
                      doubleArrayOf(0.0, plan.cutStart, plan.cutStart + ramp, plan.cutEnd, plan.cutEnd + ECHO_CLOSE_SECONDS),
                      floatArrayOf(0f, 0f, 1f, 1f, 0f),
                  )
              }

              // ---- The clock -------------------------------------------------------------------------------

              class Clock(val plan: Plan) : MixTimeline {
                  override val takeoverSeconds: Double get() = plan.takeover
                  override val releaseAt: Double get() = plan.cutEnd
                  override val handoffAt: Double get() = (plan.cutStart + plan.cutEnd) / 2
                  override val elementAt: Double = plan.cutEnd + SETTLE_SECONDS
                  override val elementTrackTime: Double = plan.inCue + (elementAt - plan.cutStart)

                  /** The outgoing song's beats up to the end of the move, the incoming song's after it. */
                  override val beatTimes: DoubleArray = run {
                      val times = ArrayList<Double>()
                      var t = 0.0
                      times += t
                      while (t < elementAt + 1.0 && times.size < MAX_BEATS) {
                          t += if (t < plan.cutEnd - 1e-9) plan.outBeat else plan.inBeat
                          times += t
                      }
                      times.toDoubleArray()
                  }

                  override fun beatAt(t: Double): Pair<Int, Double> {
                      if (t < 0) return -1 to 0.0
                      var low = 0
                      var high = beatTimes.size - 1
                      while (low < high) {
                          val mid = (low + high + 1) ushr 1
                          if (beatTimes[mid] <= t) low = mid else high = mid - 1
                      }
                      val k = low
                      if (k + 1 >= beatTimes.size) return k to 0.0
                      return k to minOf(1.0, (t - beatTimes[k]) / (beatTimes[k + 1] - beatTimes[k]))
                  }

                  override fun positionAt(side: LoopMix.Side, t: Double): Double? {
                      if (t < 0) return null
                      return when (side) {
                          LoopMix.Side.OUT -> if (t < plan.cutEnd + plan.tail) plan.takeover + t else null
                          LoopMix.Side.IN -> if (t >= plan.cutStart) plan.inCue + (t - plan.cutStart) else null
                      }
                  }
              }
          }
          KT_EOF
          mkdir -p "$(dirname 'shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/OverlapMixTest.kt')"
          cat > 'shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/OverlapMixTest.kt' <<'KT_EOF'
          package com.music.bitchord.playback.smart

          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.sin
          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertNotNull
          import kotlin.test.assertNull
          import kotlin.test.assertTrue

          class OverlapMixTest {

              private fun track(
                  id: String,
                  bpm: Double,
                  key: String,
                  vocal: Double,
                  duration: Double = 200.0,
                  energy: (Double) -> Double = { 1.0 },
              ): TrackAnalysis {
                  val beat = 60.0 / bpm
                  val downbeats = generateSequence(0.5) { it + 4 * beat }.takeWhile { it < duration - 1 }.toList()
                  val curve = (0 until (duration * 2).toInt()).map { EnergySample(it / 2.0, energy(it / 2.0)) }
                  return TrackAnalysis(
                      status = TrackAnalysis.STATUS_READY,
                      trackId = id,
                      duration = duration,
                      bpm = bpm,
                      beatInterval = beat,
                      beatConfidence = 0.9,
                      downbeats = downbeats,
                      phraseBoundaries = downbeats.filterIndexed { index, _ -> index % 8 == 0 },
                      firstBeat = 0.5,
                      key = key,
                      keyConfidence = 0.9,
                      audibleStartTime = 0.5,
                      contentEndTime = duration - 2,
                      mixInTime = downbeats[4],
                      energyCurve = curve,
                      vocalProbability = vocal,
                  )
              }

              private fun cut(current: TrackAnalysis, next: TrackAnalysis): TransitionPlan? = TransitionRepertoire.plan(
                  analysis = current,
                  nextAnalysis = next,
                  length = current.duration,
                  nextLength = next.duration,
                  finalMixAnchor = current.contentEndTime,
                  advanced = true,
              )

              /** Runs [block] with the overlap engine and the echo gesture on, whatever the build's defaults are. */
              private inline fun <T> overlapOn(enabled: Boolean = true, block: () -> T): T {
                  val before = OverlapMix.enabled
                  val echoBefore = TransitionRepertoire.echoCutEnabled
                  OverlapMix.enabled = enabled
                  TransitionRepertoire.echoCutEnabled = true
                  try {
                      return block()
                  } finally {
                      OverlapMix.enabled = before
                      TransitionRepertoire.echoCutEnabled = echoBefore
                  }
              }

              private fun overlapOf(current: TrackAnalysis, next: TrackAnalysis): OverlapMix.Plan? {
                  val plan = cut(current, next) ?: return null
                  return OverlapMix.fromCut(plan, current, next, current.duration, next.duration)
              }

              @Test
              fun aQuickCutBecomesAnOverlapMixOnTheSameEdges() = overlapOn {
                  val current = track("a", 120.0, "C major", vocal = 0.9)
                  val next = track("b", 94.0, "F♯ major", vocal = 0.9)
                  val cutPlan = assertNotNull(cut(current, next))
                  val overlap = assertNotNull(OverlapMix.fromCut(cutPlan, current, next, current.duration, next.duration))
                  assertEquals(CutGesture.QUICK_CUT, overlap.gesture)
                  assertEquals(OverlapMix.TAKEOVER_LEAD_SECONDS, overlap.cutStart, 1e-9)
                  // The mix's clock puts the move on the planner's own edges.
                  assertEquals(cutPlan.transitionStart, overlap.takeover + overlap.cutStart, 1e-9)
                  assertEquals(cutPlan.transitionEnd, overlap.takeover + overlap.cutEnd, 1e-9)
                  assertEquals(cutPlan.incomingCueTime, overlap.inCue, 1e-9)
                  assertTrue(!overlap.echo)
                  assertEquals(0.0, overlap.tail)
              }

              @Test
              fun anEchoOutKeepsItsDelayAndItsTail() = overlapOn {
                  val current = track("a", 120.0, "C major", vocal = 0.1)
                  val next = track("b", 94.0, "C major", vocal = 0.1) { if (it < 12.0) 0.2 else 1.0 }
                  val overlap = assertNotNull(overlapOf(current, next))
                  assertEquals(CutGesture.ECHO_CUT, overlap.gesture)
                  assertEquals(0.5, overlap.echoSeconds, 1e-9)
                  assertEquals(echoTailSeconds(0.5), overlap.tail, 1e-9)
                  val send = assertNotNull(OverlapMix.echoSend(overlap))
                  assertEquals(0f, send.values.first())
                  assertEquals(0f, send.values.last())
                  assertTrue(send.times.last() > overlap.cutEnd, "the send closes after the overlap, so the repeats ring on")
                  assertTrue(send.times.toList().zipWithNext().all { (a, b) -> b >= a }, "times rise")
              }

              @Test
              fun offWhenSwitchedOffAndForPlansThatAreNotCuts() {
                  val current = track("a", 120.0, "C major", vocal = 0.9)
                  val next = track("b", 94.0, "F♯ major", vocal = 0.9)
                  val cutPlan = assertNotNull(cut(current, next))
                  overlapOn(enabled = false) {
                      assertNull(OverlapMix.fromCut(cutPlan, current, next, current.duration, next.duration))
                  }
                  overlapOn {
                      assertNull(OverlapMix.fromCut(cutPlan.copy(reason = "before-unmixable-crossfade"), current, next, 200.0, 200.0))
                      assertNull(OverlapMix.fromCut(cutPlan.copy(blocked = true), current, next, 200.0, 200.0))
                      assertNotNull(OverlapMix.fromCut(cutPlan, current, next, current.duration, next.duration))
                  }
              }

              @Test
              fun anEchoTailThatWouldRunPastTheFileIsRefused() = overlapOn {
                  val current = track("a", 120.0, "C major", vocal = 0.1)
                  val next = track("b", 94.0, "C major", vocal = 0.1) { if (it < 12.0) 0.2 else 1.0 }
                  val cutPlan = assertNotNull(cut(current, next))
                  assertNotNull(OverlapMix.fromCut(cutPlan, current, next, current.duration, next.duration))
                  assertNull(OverlapMix.fromCut(cutPlan, current, next, cutPlan.transitionEnd + 0.5, next.duration))
              }

              @Test
              fun aSongTooShortAfterTheHandoverIsRefused() = overlapOn {
                  val current = track("a", 120.0, "C major", vocal = 0.9)
                  val next = track("b", 94.0, "F♯ major", vocal = 0.9)
                  val cutPlan = assertNotNull(cut(current, next))
                  assertNull(OverlapMix.fromCut(cutPlan, current, next, current.duration, cutPlan.incomingCueTime + 6.0))
              }

              @Test
              fun theClockHandsOverInTheMiddleOfTheMoveAndTheIncomingPlayerTakesOverAfter() = overlapOn {
                  val overlap = assertNotNull(overlapOf(track("a", 120.0, "C major", 0.9), track("b", 94.0, "F♯ major", 0.9)))
                  val clock = OverlapMix.Clock(overlap)
                  assertEquals(overlap.takeover, clock.takeoverSeconds)
                  assertTrue(clock.handoffAt > overlap.cutStart && clock.handoffAt < overlap.cutEnd)
                  assertTrue(clock.elementAt > overlap.cutEnd)
                  // The incoming player's track position at its takeover continues the deck's, at rate 1.
                  assertEquals(overlap.inCue + (clock.elementAt - overlap.cutStart), clock.elementTrackTime, 1e-9)
                  assertEquals(overlap.inCue, clock.positionAt(LoopMix.Side.IN, overlap.cutStart)!!, 1e-9)
                  assertEquals(clock.elementTrackTime, clock.positionAt(LoopMix.Side.IN, clock.elementAt)!!, 1e-9)
                  assertEquals(overlap.takeover, clock.positionAt(LoopMix.Side.OUT, 0.0)!!, 1e-9)
                  assertNull(clock.positionAt(LoopMix.Side.IN, overlap.cutStart - 1.0))
                  assertNull(clock.positionAt(LoopMix.Side.OUT, -0.1))
                  assertNull(clock.positionAt(LoopMix.Side.OUT, overlap.cutEnd + overlap.tail + 0.1))
              }

              @Test
              fun theBeatClockRisesAndCoversTheWholeMix() = overlapOn {
                  val overlap = assertNotNull(overlapOf(track("a", 120.0, "C major", 0.9), track("b", 94.0, "F♯ major", 0.9)))
                  val clock = OverlapMix.Clock(overlap)
                  assertEquals(0.0, clock.beatTimes.first())
                  assertTrue(clock.beatTimes.size >= 2)
                  assertTrue(clock.beatTimes.toList().zipWithNext().all { (a, b) -> b > a })
                  assertTrue(clock.beatTimes.last() >= clock.elementAt)
                  assertEquals(-1, clock.beatAt(-0.5).first)
                  assertEquals(0, clock.beatAt(0.1).first)
                  // Before the move the beat is the outgoing song's (0.5 s), after it the incoming song's.
                  assertEquals(0.5, clock.beatTimes[1] - clock.beatTimes[0], 1e-9)
                  val late = clock.beatAt(clock.elementAt).first
                  assertEquals(60.0 / 94.0, clock.beatTimes[late + 1] - clock.beatTimes[late], 1e-9)
              }

              @Test
              fun theGainCurvesAreEqualPowerAndMeetAtTheHandoverEdges() = overlapOn {
                  val overlap = assertNotNull(overlapOf(track("a", 120.0, "C major", 0.9), track("b", 94.0, "F♯ major", 0.9)))
                  val out = OverlapMix.outGain(overlap, LoopMix.HANDOVER_SEC)
                  val inn = OverlapMix.inGain(overlap)
                  assertEquals(0f, out.values.first())
                  assertEquals(1f, out.values[1])
                  assertEquals(0f, out.values.last())
                  assertEquals(0f, inn.values.first())
                  assertEquals(1f, inn.values.last())
                  assertTrue(out.times.toList().zipWithNext().all { (a, b) -> b >= a })
                  assertTrue(inn.times.toList().zipWithNext().all { (a, b) -> b >= a })
                  // At every point inside the move the two gains carry (nearly) constant power.
                  val span = overlap.cutEnd - overlap.cutStart
                  for (step in 1 until 8) {
                      val t = overlap.cutStart + span * step / 8
                      val o = out.values[out.times.indexOfFirst { abs(it - t) < 1e-9 }]
                      val i = inn.values[inn.times.indexOfFirst { abs(it - t) < 1e-9 }]
                      assertEquals(1.0, (o * o + i * i).toDouble(), 1e-5, "power at step $step")
                      assertEquals(cos(PI / 2 * step / 8), o.toDouble(), 1e-5)
                      assertEquals(sin(PI / 2 * step / 8), i.toDouble(), 1e-5)
                  }
              }
          }
