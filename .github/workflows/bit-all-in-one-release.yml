          // Host test for the one native mix engine: the three-band EQ, the filter pair, the tempo ramp and the
          // master's soft knee, each measured on a tone through a real deck. Built and run by the workflow.
          #include <algorithm>
          #include <cmath>
          #include <cstdio>
          #include <functional>
          #include <vector>

          #include "loopmix/loop_mix_renderer.h"

          using bitchord::loopmix::Deck;
          using bitchord::loopmix::Renderer;

          namespace {

          constexpr int kRate = 48000;
          constexpr double kPi = 3.14159265358979323846;

          std::vector<float> tone(double hz, double seconds, float amplitude) {
            std::vector<float> out(size_t(seconds * kRate));
            for (size_t i = 0; i < out.size(); ++i) out[i] = amplitude * float(std::sin(2 * kPi * hz * double(i) / kRate));
            return out;
          }

          void play(Deck& deck, const std::vector<float>& samples, double seconds) {
            deck.left = samples;
            deck.right = samples;
            deck.regionStart = 0;
            deck.loopStart = 0;
            deck.loopEnd = 0;
            deck.releaseAt = 1e18;
            deck.knotTimes = {0.0, seconds * kRate};
            deck.knotPositions = {0.0, seconds * kRate};
            deck.runOn = false;
            deck.stopAt = seconds;
            deck.preroll = 0.4;
            deck.level = 1.f;
          }

          std::vector<float> render(Renderer& renderer, double seconds) {
            renderer.prepare();
            std::vector<float> interleaved(2 * 1024), left;
            const int64_t first = renderer.firstFrame();
            for (int64_t frame = first; frame < int64_t(seconds * kRate); frame += 1024) {
              renderer.render(frame, interleaved.data(), 1024);
              for (int i = 0; i < 1024; ++i) left.push_back(interleaved[2 * i]);
            }
            // Index 0 of the result is mix frame 0.
            return std::vector<float>(left.begin() + std::min<int64_t>(-first, left.size()), left.end());
          }

          double rms(const std::vector<float>& x, double fromSeconds, double toSeconds) {
            const size_t a = size_t(fromSeconds * kRate), b = std::min(x.size(), size_t(toSeconds * kRate));
            double sum = 0;
            for (size_t i = a; i < b; ++i) sum += double(x[i]) * x[i];
            return std::sqrt(sum / std::max<size_t>(1, b - a));
          }

          /** The level of a [hz] tone through one deck set up by [configure], in dB against the same tone untouched. */
          double gainDb(double hz, const std::function<void(Deck&)>& configure) {
            const double seconds = 5.0;
            const auto samples = tone(hz, seconds + 1.0, 0.4f);
            Renderer plain(kRate);
            play(plain.deck(0), samples, seconds);
            const double reference = rms(render(plain, seconds), 2.0, 4.0);
            Renderer shaped(kRate);
            play(shaped.deck(0), samples, seconds);
            configure(shaped.deck(0));
            const double level = rms(render(shaped, seconds), 2.0, 4.0);
            return 20 * std::log10(std::max(level, 1e-9) / reference);
          }

          void flat(bitchord::loopmix::Envelope& e, float value) {
            e.times = {0.0, 100.0};
            e.values = {value, value};
          }

          }  // namespace

          int main() {
            int failures = 0;
            auto expect = [&](bool ok, const char* what, double value) {
              std::printf("%s  %-62s %8.2f\n", ok ? "ok  " : "FAIL", what, value);
              if (!ok) ++failures;
            };

            // A deck with nothing set is transparent.
            expect(std::fabs(gainDb(440, [](Deck&) {})) < 0.05, "no EQ, no filter: transparent (dB)", gainDb(440, [](Deck&) {}));

            // Low band: a kick-killing shelf takes the bass down and leaves the mids alone.
            const double lowCut = gainDb(80, [](Deck& d) { flat(d.lowDb, -24.f); });
            const double lowKeep = gainDb(3000, [](Deck& d) { flat(d.lowDb, -24.f); });
            expect(lowCut < -18.0, "low band -24 dB: 80 Hz is cut by at least 18 dB", lowCut);
            expect(std::fabs(lowKeep) < 1.5, "low band -24 dB: 3 kHz stays within 1.5 dB", lowKeep);

            // Mid band: a bell at 1 kHz.
            const double midCut = gainDb(1000, [](Deck& d) { flat(d.midDb, -9.f); });
            const double midKeep = gainDb(100, [](Deck& d) { flat(d.midDb, -9.f); });
            expect(midCut < -7.5 && midCut > -10.5, "mid band -9 dB: 1 kHz drops by about 9 dB", midCut);
            expect(std::fabs(midKeep) < 1.0, "mid band -9 dB: 100 Hz stays within 1 dB", midKeep);

            // High band: a shelf at 4 kHz.
            const double highCut = gainDb(10000, [](Deck& d) { flat(d.highDb, -12.f); });
            const double highKeep = gainDb(200, [](Deck& d) { flat(d.highDb, -12.f); });
            expect(highCut < -9.0, "high band -12 dB: 10 kHz is cut by at least 9 dB", highCut);
            expect(std::fabs(highKeep) < 1.0, "high band -12 dB: 200 Hz stays within 1 dB", highKeep);

            // The filter pair.
            const double lp = gainDb(8000, [](Deck& d) { flat(d.lowPassHz, 1000.f); });
            const double lpKeep = gainDb(200, [](Deck& d) { flat(d.lowPassHz, 1000.f); });
            expect(lp < -25.0, "low-pass 1 kHz: 8 kHz is cut by at least 25 dB", lp);
            expect(std::fabs(lpKeep) < 1.0, "low-pass 1 kHz: 200 Hz stays within 1 dB", lpKeep);
            const double hp = gainDb(60, [](Deck& d) { flat(d.highPassHz, 500.f); });
            const double hpKeep = gainDb(4000, [](Deck& d) { flat(d.highPassHz, 500.f); });
            expect(hp < -25.0, "high-pass 500 Hz: 60 Hz is cut by at least 25 dB", hp);
            expect(std::fabs(hpKeep) < 1.0, "high-pass 500 Hz: 4 kHz stays within 1 dB", hpKeep);
            const double open = gainDb(5000, [](Deck& d) { flat(d.lowPassHz, 20000.f); flat(d.highPassHz, 20.f); });
            expect(std::fabs(open) < 0.05, "open filters (20 kHz / 20 Hz) are transparent", open);

            // A sweep (an envelope that moves) must stay finite and settle where it was sent.
            {
              const double seconds = 6.0;
              Renderer r(kRate);
              play(r.deck(0), tone(3000, seconds + 1.0, 0.4f), seconds);
              auto& d = r.deck(0);
              d.lowPassHz.times = {0.0, 3.0};
              d.lowPassHz.values = {18000.f, 300.f};
              d.lowPassHz.exponential = true;
              d.lowDb.times = {1.0, 2.0};
              d.lowDb.values = {0.f, -24.f};
              d.midDb.times = {1.0, 4.0};
              d.midDb.values = {0.f, -6.f};
              const auto out = render(r, seconds);
              bool finite = true;
              for (float v : out) finite = finite && std::isfinite(v);
              expect(finite, "a moving EQ and filter sweep stays finite", finite ? 1 : 0);
              expect(rms(out, 4.5, 5.5) < 0.06 * rms(out, 0.6, 0.9), "the low-pass sweep closes a 3 kHz tone down to a 300 Hz floor",
                     rms(out, 4.5, 5.5) / std::max(1e-9, rms(out, 0.6, 0.9)));
            }

            // The tempo ramp: knots at 1.1x must advance the heard position 1.1x as fast.
            {
              const double seconds = 6.0;
              Renderer r(kRate);
              play(r.deck(0), tone(220, 8.0, 0.4f), seconds);
              auto& d = r.deck(0);
              d.knotTimes = {0.0, 5.0 * kRate};
              d.knotPositions = {0.0, 5.5 * kRate};
              d.stopAt = 6.0;
              render(r, 4.9);
              const double heard = d.heard.load();
              expect(std::fabs(heard - 4.9 * 1.1) < 0.1, "tempo ramp at 1.1x: the deck has heard 1.1x the mix time", heard);
            }

            // Two loud decks in phase: the master's soft knee keeps the sum finite and under full scale.
            {
              const double seconds = 4.0;
              Renderer r(kRate);
              play(r.deck(0), tone(330, seconds + 1.0, 0.8f), seconds);
              play(r.deck(1), tone(330, seconds + 1.0, 0.8f), seconds);
              const auto out = render(r, seconds);
              float peak = 0;
              for (float v : out) peak = std::max(peak, std::fabs(v));
              expect(peak <= 1.0f && peak > 0.85f, "two decks at 0.8 sum under full scale (peak)", peak);
            }

            std::printf(failures == 0 ? "mix engine test OK\n" : "mix engine test FAILED\n");
            return failures == 0 ? 0 : 1;
          }
          MIX_ENGINE_TEST_EOF
          mkdir -p "$(dirname 'shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/BlendMix.kt')"
          cat > 'shared/src/commonMain/kotlin/com/music/bitchord/playback/smart/BlendMix.kt' <<'BLEND_MIX_EOF'
          package com.music.bitchord.playback.smart

          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.round
          import kotlin.math.sin
          import kotlin.math.sqrt

          /**
           * Every Automix blend (equal power, DJ blend with a bass swap, filter ride, echo out) rendered by the one
           * native engine, instead of two players with volume and filter ramps.
           *
           * The outgoing song hands over to a deck a few seconds before the blend; the incoming song runs on its own
           * deck; the renderer plays the whole overlap on one sample clock: both tempo ramps (so the two decks can never
           * drift out of phase), a gain per deck, a three-band EQ and a low-pass/high-pass pair per deck, and the echo.
           * The curves here are the old per-tick rides sampled across the blend: the same shapes and constants, now data.
           *
           * Pure: reads a [TransitionPlan] and two analyses, returns a [Plan], and lays it out as a [Clock] and
           * [Curves]. No audio, no players.
           */
          object BlendMix {
              /** Master switch. Off: every blend stays on the planner's two-player path, exactly as before. */
              var enabled: Boolean = false

              /** Seconds of outgoing music the renderer plays before the blend starts, so the splice is long settled. */
              const val MIN_LEAD_SECONDS = 4.0

              /** Extra seconds of outgoing music between the takeover and the start of its tempo ramp. */
              private const val RAMP_RUN_IN_SECONDS = 2.0

              /** Seconds after the incoming tempo is back at 1x before the incoming player takes over from its deck. */
              const val SETTLE_SECONDS = 3.0

              const val MIN_TAKEOVER_SECONDS = 1.0

              /** Music that must remain in the incoming song after the handover. */
              const val CLEARANCE_SECONDS = 5.0

              /** The longest the incoming tempo takes to come back to 1x after the blend. */
              private const val MAX_EASE_SECONDS = 12.0
              private const val TEMPO_STEP_PER_BEAT = 0.0075
              private const val MAX_RAMP_BEATS = 16
              private const val MAX_RATE = 1.25
              private const val MIN_RATE = 0.8

              /** Spacing of the tempo knots handed to the renderer, in mix seconds. */
              private const val KNOT_STEP = 0.1
              private const val CURVE_POINTS = 96
              private const val MAX_BEATS = 512

              /** The bass kill of the low band, at its deepest: what the old rides did with a 200 Hz high-pass. */
              const val BASS_KILL_DB = -26f

              /** The mid and high bands only move when the vocals of the two songs collide, scaled by how much. */
              private const val CLASH_MID_DB = -5f
              private const val CLASH_ENTRY_MID_DB = -4f
              private const val CLASH_HIGH_DB = -3f

              private const val OPEN_HZ = 20_000.0
              private const val OFF_HZ = 20.0
              private const val ECHO_CLOSE_SECONDS = 0.02

              // The shapes the rides were tuned with, carried over unchanged.
              private const val BASS_SWAP_WIDTH = 0.10
              private const val SWAP_BEATS = 0.5
              private const val FILTER_BASS_SWAP_AT = 0.5
              private const val ENTRY_OPEN_BY = 0.6
              private const val VOCAL_SAFE_ENTRY_OPEN_BY = 0.78
              private const val BLEND_ENTRY_OPEN_BY = 0.45
              private const val BLEND_ENTRY_CLASH_OPEN_BY = 0.7
              private const val BLEND_EXIT_FROM = 0.3
              private const val BLEND_EXIT_CLASH_FROM = 0.12
              private const val ECHO_KILL_BEATS = 4.0
              private const val ECHO_LEVEL = 0.5
              private const val ECHO_DECAY = 0.4
              private const val HANDOFF_AT = 0.5
              private const val FILTER_ENTRY_HZ = 7_000.0
              private const val FILTER_FLOOR_HZ = 300.0
              private const val FILTER_SWEEP_SHAPE = 0.75
              private const val ENTRY_HIGH_PASS_HZ = 1_200.0
              private const val ENTRY_SHAPE = 0.35
              private const val VOCAL_SEPARATION_FLOOR_HZ = 1_600.0
              private const val VOCAL_SEPARATION_HIGH_PASS_HZ = 700.0
              private const val VOCAL_SAFE_ENTRY_HIGH_PASS_HZ = 2_400.0
              private const val VOCAL_SAFE_EXIT_SHAPE = 0.55
              private const val FALLBACK_HANDOFF_ENTRY_HZ = 900.0
              private const val FALLBACK_HANDOFF_FLOOR_HZ = 1_600.0
              private const val FALLBACK_HANDOFF_SHAPE = 0.8
              private const val BLEND_ENTRY_HIGH_PASS_HZ = 520.0
              private const val BLEND_ENTRY_CLASH_HIGH_PASS_HZ = 950.0
              private const val BLEND_EXIT_LOW_PASS_HZ = 2_200.0
              private const val BLEND_EXIT_CLASH_LOW_PASS_HZ = 1_100.0
              private const val FILTER_RISE_SHAPE = 0.8
              private const val FILTER_FALL_SHAPE = 1.6
              private const val VOCAL_SAFE_RISE_SHAPE = 1.65
              private const val VOCAL_SAFE_FALL_SHAPE = 0.65

              /**
               * The style half of a plan with every fraction resolved once, onto the nearest beat or bar of the overlap
               * when its grid is trusted. This is the old controller's `Render`, moved here so the curves can be data.
               */
              class Shape(
                  val style: TransitionStyle = TransitionStyle.EQUAL_POWER,
                  val bassSwap: Boolean = false,
                  bassSwapFraction: Double = 0.7,
                  val filterSweep: Double = 0.0,
                  val filterVariant: FilterTransitionVariant = FilterTransitionVariant.SWEEP,
                  vocalOverlap: Double = 0.0,
                  /** The overlap's length in outgoing beats; 0 when the grid is not trusted. */
                  beats: Double = 0.0,
                  echoDelay: Double = 0.0,
              ) {
                  private val grid = if (beats >= 2.0) beats else 0.0
                  val clash = vocalOverlap.coerceIn(0.0, 1.0)

                  /** Echo the outgoing track out rather than fading or filtering it away. Needs the grid it repeats on. */
                  val echo = grid > 0 && echoDelay > 0.0

                  /** The delay the repeats come at, in seconds; 0 when there is no echo. */
                  val echoSeconds = if (echo) echoDelay else 0.0

                  val swapAt = onBeat(bassSwapFraction.coerceIn(0.05, 0.95))
                  val swapWidth = if (grid > 0) SWAP_BEATS / grid else 2 * BASS_SWAP_WIDTH
                  val swapFrom = if (grid > 0) swapAt - swapWidth else swapAt - BASS_SWAP_WIDTH
                  val entryOpenBy = onBar(
                      when (filterVariant) {
                          FilterTransitionVariant.SWEEP -> ENTRY_OPEN_BY
                          FilterTransitionVariant.BASS_HANDOFF -> 0.38
                          FilterTransitionVariant.ECHO_RIDE -> 0.52
                      },
                  )
                  val vocalEntryOpenBy = onBar(entryOpenBy + (VOCAL_SAFE_ENTRY_OPEN_BY - entryOpenBy) * clash)
                  val blendEntryOpenBy = onBar(BLEND_ENTRY_OPEN_BY + (BLEND_ENTRY_CLASH_OPEN_BY - BLEND_ENTRY_OPEN_BY) * clash)
                  val blendExitFrom = onBar(BLEND_EXIT_FROM + (BLEND_EXIT_CLASH_FROM - BLEND_EXIT_FROM) * clash)
                  val filterSwapAt = onBar(
                      when (filterVariant) {
                          FilterTransitionVariant.SWEEP -> FILTER_BASS_SWAP_AT
                          FilterTransitionVariant.BASS_HANDOFF -> 0.43
                          FilterTransitionVariant.ECHO_RIDE -> 0.58
                      },
                  )

                  /** Where the dry outgoing signal is killed and only its echo goes on; the send opens a beat before. */
                  val echoAt = onBar(FILTER_ECHO_AT)
                  val echoFrom = if (grid > 0) echoAt - 1.0 / grid else echoAt
                  val echoKill = if (grid > 0) ECHO_KILL_BEATS / grid else 0.0

                  /** How much of the DJ fader curve a blend keeps: all of it unless the vocals collide head-on. */
                  val holdFaders = 1.0 - clash

                  /** Where a held outgoing fader starts to fall: no later than the midpoint, a bar before the end at most. */
                  val fallFrom = min(swapAt, min(0.5, if (grid > 0) 1.0 - 4.0 / grid else 0.5)).coerceAtLeast(0.0)

                  /** Where (as a fraction of the blend) the session moves to the incoming track. */
                  val handoffAt = when {
                      style == TransitionStyle.DJ_BLEND && bassSwap -> swapAt
                      style == TransitionStyle.DJ_FILTER && filterVariant == FilterTransitionVariant.BASS_HANDOFF -> filterSwapAt
                      else -> HANDOFF_AT
                  }

                  private fun onBeat(fraction: Double): Double =
                      if (grid > 0) (round(fraction * grid) / grid).coerceIn(1.0 / grid, 1.0 - 1.0 / grid) else fraction

                  private fun onBar(fraction: Double): Double =
                      if (grid >= 8.0) {
                          (round(fraction * grid / 4.0) * 4.0 / grid).coerceIn(4.0 / grid, 1.0 - 4.0 / grid)
                      } else {
                          onBeat(fraction)
                      }
              }

              data class Plan(
                  /** Outgoing track second at mix t0. */
                  val takeover: Double,
                  /** Mix seconds at which the tempo ramp of the outgoing song starts (the blend start when it has none). */
                  val rampStart: Double,
                  /** Mix seconds at which the blend starts and ends. */
                  val fadeStart: Double,
                  val fadeEnd: Double,
                  /** Outgoing tempo from [fadeStart] on (1.0 = natural). */
                  val outRate: Double,
                  /** Incoming track second at mix [fadeStart]. */
                  val inCue: Double,
                  /** Incoming tempo through the blend; it eases back to 1.0 over [easeSeconds] after [fadeEnd]. */
                  val inRate: Double,
                  val easeSeconds: Double,
                  /** Seconds per beat of each song at its natural tempo, for the scrubber's pulse. */
                  val outBeat: Double,
                  val inBeat: Double,
                  /** Echo delay in seconds; 0 for no echo. */
                  val echoSeconds: Double,
                  /** Seconds the echo keeps ringing after [fadeEnd]. */
                  val tail: Double,
                  val shape: Shape,
              ) {
                  val echo: Boolean get() = echoSeconds > 0.0
                  val fadeSeconds: Double get() = fadeEnd - fadeStart
                  val easeEnd: Double get() = fadeEnd + easeSeconds

                  /** Seconds of the outgoing song heard from the takeover to mix time [t]. */
                  fun outElapsed(t: Double): Double {
                      if (t <= rampStart) return t
                      val length = fadeStart - rampStart
                      if (t <= fadeStart) {
                          val d = t - rampStart
                          val speed = 1.0 + (outRate - 1.0) * d / length
                          return rampStart + d * (1.0 + speed) / 2.0
                      }
                      return rampStart + length * (1.0 + outRate) / 2.0 + outRate * (t - fadeStart)
                  }

                  /** Seconds of the incoming song heard from its cue (mix [fadeStart]) to mix time [t]; negative before. */
                  fun inElapsed(t: Double): Double {
                      if (t <= fadeEnd) return inRate * (t - fadeStart)
                      val base = inRate * (fadeEnd - fadeStart)
                      if (easeSeconds <= 0.0) return base + (t - fadeEnd)
                      val d = min(t - fadeEnd, easeSeconds)
                      val speed = inRate + (1.0 - inRate) * d / easeSeconds
                      return base + d * (inRate + speed) / 2.0 + max(0.0, t - easeEnd)
                  }

                  /** How fast the outgoing / incoming song is playing at mix time [t], 1.0 being natural. */
                  fun outSpeed(t: Double): Double = when {
                      t <= rampStart -> 1.0
                      t < fadeStart -> 1.0 + (outRate - 1.0) * (t - rampStart) / (fadeStart - rampStart)
                      else -> outRate
                  }

                  fun inSpeed(t: Double): Double = when {
                      t <= fadeEnd -> inRate
                      easeSeconds > 0.0 && t < easeEnd -> inRate + (1.0 - inRate) * (t - fadeEnd) / easeSeconds
                      else -> 1.0
                  }
              }

              /** A piecewise-linear curve over mix seconds, as the renderer takes it. */
              class Curve(val times: DoubleArray, val values: FloatArray) {
                  /** True when every value sits within [tolerance] of [neutral], so the renderer need not be sent it at all. */
                  fun isFlat(neutral: Float, tolerance: Float = 0.001f): Boolean = values.all { abs(it - neutral) <= tolerance }
              }

              /** Everything the renderer is sent for a blend. Each envelope is null when it would be flat. */
              class Curves(
                  val outGain: Curve,
                  val inGain: Curve,
                  val outLowDb: Curve?,
                  val outMidDb: Curve?,
                  val outHighDb: Curve?,
                  val outLowPassHz: Curve?,
                  val outHighPassHz: Curve?,
                  val inLowDb: Curve?,
                  val inMidDb: Curve?,
                  val inHighDb: Curve?,
                  val inLowPassHz: Curve?,
                  val inHighPassHz: Curve?,
                  val echoSend: Curve?,
              )

              /**
               * The blend for a plan the planner already chose, or null when it does not fit the renderer: the blend is
               * not a mix at all (gapless, cut, loop), the blend starts too early in the song to take over before it, the
               * echo's tail would run past the file, or too little of the incoming song is left after the handover.
               */
              fun fromPlan(
                  plan: TransitionPlan,
                  analysis: TrackAnalysis,
                  nextAnalysis: TrackAnalysis,
                  length: Double,
                  nextLength: Double,
              ): Plan? {
                  if (!enabled || plan.blocked) return null
                  if (plan.transitionStyle == TransitionStyle.GAPLESS) return null
                  // Cuts are the OverlapMix's, loops the LoopMix's; a fallback plan is a plain fade of an unanalysed pair.
                  if (plan.reason.contains("smart-cut") || plan.reason.contains("loop") || plan.reason.contains("fallback")) return null
                  val fade = plan.fadeSeconds
                  if (!fade.isFinite() || fade < 0.5) return null
                  val inCue = plan.incomingCueTime
                  if (!inCue.isFinite() || inCue < 0.0) return null
                  if (!plan.transitionStart.isFinite() || plan.transitionStart <= 0.0) return null

                  val outBeat = beatOf(plan.beatSeconds, analysis)
                  val inBeat = beatOf(0.0, nextAnalysis)
                  val outRate = plan.outgoingPlaybackRate.orZero().let { if (it <= 0.0) 1.0 else it.coerceIn(MIN_RATE, MAX_RATE) }
                  var inRate = plan.incomingPlaybackRate.orZero().let { if (it <= 0.0) 1.0 else it.coerceIn(MIN_RATE, MAX_RATE) }
                  val outRamps = abs(outRate - 1.0) > 0.0005
                  if (abs(inRate - 1.0) <= 0.0005) inRate = 1.0

                  // The outgoing tempo ramp: a beat per step, so many beats before the blend.
                  val rampBeats = if (outRamps) ceil(abs(outRate - 1.0) / TEMPO_STEP_PER_BEAT).toInt().coerceIn(1, MAX_RAMP_BEATS) else 0
                  val rampSeconds = rampBeats * outBeat
                  val lead = max(MIN_LEAD_SECONDS, rampSeconds + RAMP_RUN_IN_SECONDS)
                  val heardBeforeBlend = (lead - rampSeconds) + rampSeconds * (1.0 + (if (outRamps) outRate else 1.0)) / 2.0
                  val takeover = plan.transitionStart - heardBeforeBlend
                  if (takeover < MIN_TAKEOVER_SECONDS) return null

                  val shape = Shape(
                      style = plan.transitionStyle,
                      bassSwap = plan.bassSwap,
                      bassSwapFraction = plan.bassSwapFraction,
                      filterSweep = plan.filterSweep,
                      filterVariant = plan.filterVariant,
                      vocalOverlap = plan.vocalOverlap,
                      beats = if (plan.beatSeconds > 0.0) fade / plan.beatSeconds else 0.0,
                      echoDelay = plan.echoSeconds.orZero(),
                  )
                  val echo = if (shape.echo) shape.echoSeconds else 0.0
                  val tail = if (echo > 0.0) echoTailSeconds(echo) else 0.0
                  val fadeStart = lead
                  val fadeEnd = lead + fade
                  if (length > 0.0 && plan.transitionStart + (if (outRamps) outRate else 1.0) * (fade + tail) > length - 0.25) return null

                  val easeSeconds = if (inRate != 1.0) min(MAX_EASE_SECONDS, abs(inRate - 1.0) / TEMPO_STEP_PER_BEAT * inBeat) else 0.0
                  val result = Plan(
                      takeover = takeover,
                      rampStart = fadeStart - rampSeconds,
                      fadeStart = fadeStart,
                      fadeEnd = fadeEnd,
                      outRate = if (outRamps) outRate else 1.0,
                      inCue = inCue,
                      inRate = inRate,
                      easeSeconds = easeSeconds,
                      outBeat = outBeat,
                      inBeat = inBeat,
                      echoSeconds = echo,
                      tail = tail,
                      shape = shape,
                  )
                  val clock = Clock(result)
                  if (nextLength > 0.0 && clock.elementTrackTime > nextLength - CLEARANCE_SECONDS) return null
                  return result
              }

              private fun beatOf(given: Double, analysis: TrackAnalysis): Double {
                  if (given > 0.0) return given
                  val interval = analysis.beatInterval.orZero()
                  if (interval > 0.0) return interval
                  val bpm = analysis.bpm.orZero()
                  return if (bpm > 0.0) 60.0 / bpm else 0.5
              }

              // ---- The rides, as functions of progress through the blend ----------------------------------

              private class Side(
                  var lowPassHz: Double = OPEN_HZ,
                  var highPassHz: Double = OFF_HZ,
                  /** 0..1: how far the low band is killed. */
                  var bassKill: Double = 0.0,
                  var midDb: Double = 0.0,
                  var highDb: Double = 0.0,
              )

              private fun glide(from: Double, to: Double, amount: Double): Double =
                  from * (to / from).pow(amount.coerceIn(0.0, 1.0))

              private fun entryHighPass(progress: Double, amount: Double, topHz: Double, openBy: Double): Double {
                  val remaining = (1.0 - progress / openBy).coerceIn(0.0, 1.0)
                  return glide(OFF_HZ, topHz, amount * remaining.pow(ENTRY_SHAPE))
              }

              private fun riseGain(p: Double) = sin(p.coerceIn(0.0, 1.0) * PI / 2.0)

              private fun fallGain(p: Double) = cos(p.coerceIn(0.0, 1.0) * PI / 2.0)

              private fun held(shape: Shape, plain: Double, dj: Double) = plain + (dj - plain) * shape.holdFaders

              private fun mixRise(shape: Shape, p: Double): Double {
                  val styled = when (shape.style) {
                      TransitionStyle.DJ_BLEND ->
                          if (shape.bassSwap) held(shape, riseGain(p), riseGain(p / shape.swapAt)) else riseGain(p)
                      TransitionStyle.DJ_FILTER -> riseGain(p.pow(FILTER_RISE_SHAPE))
                      else -> riseGain(p)
                  }
                  val vocalSafe = riseGain(p.pow(VOCAL_SAFE_RISE_SHAPE))
                  return styled + (vocalSafe - styled) * shape.clash
              }

              private fun mixFall(shape: Shape, p: Double): Double {
                  if (shape.echo) return 1.0
                  val styled = when (shape.style) {
                      TransitionStyle.DJ_BLEND ->
                          if (!shape.bassSwap) {
                              fallGain(p)
                          } else {
                              val from = shape.fallFrom
                              held(shape, fallGain(p), if (p <= from) 1.0 else fallGain((p - from) / (1.0 - from)))
                          }
                      TransitionStyle.DJ_FILTER -> fallGain(p.pow(FILTER_FALL_SHAPE))
                      else -> fallGain(p)
                  }
                  val vocalSafe = fallGain(p.pow(VOCAL_SAFE_FALL_SHAPE))
                  return styled + (vocalSafe - styled) * shape.clash
              }

              /** The outgoing dry level in an echo out: whole until the echo beat, gone [Shape.echoKill] after. */
              private fun echoDry(shape: Shape, p: Double): Double =
                  if (shape.echoKill > 0.0) 1.0 - ((p - shape.echoAt) / shape.echoKill).coerceIn(0.0, 1.0) else if (p >= shape.echoAt) 0.0 else 1.0

              /** How loud the outgoing track actually is at [p], for the headroom trim: its fader, or in an echo out the louder of dry and repeats. */
              private fun outgoingLevel(shape: Shape, p: Double, fadeSeconds: Double): Double {
                  if (!shape.echo) return mixFall(shape, p)
                  val sinceEcho = (p - shape.echoAt) * fadeSeconds
                  val repeats = if (sinceEcho > 0.0) sinceEcho / shape.echoSeconds else 0.0
                  val wet = if (sinceEcho > 0.0) ECHO_LEVEL * ECHO_DECAY.pow(repeats) else 0.0
                  return max(echoDry(shape, p), wet)
              }

              private fun headroomFor(incomingGain: Double, outgoingGain: Double): Double {
                  val sum = incomingGain + outgoingGain
                  return if (sum <= 1.0) 1.0 else 1.0 / sqrt(sum)
              }

              private fun handover(p: Double, at: Double, width: Double) = ((p - (at - width)) / width).coerceIn(0.0, 1.0)

              /** Both decks' filter and EQ settings at progress [p]: the old `rideStyle`, then the echo's override. */
              private fun ride(shape: Shape, p: Double, out: Side, into: Side) {
                  when (shape.style) {
                      TransitionStyle.DJ_FILTER -> when (shape.filterVariant) {
                          FilterTransitionVariant.BASS_HANDOFF -> bassHandoff(shape, p, out, into)
                          FilterTransitionVariant.SWEEP,
                          FilterTransitionVariant.ECHO_RIDE,
                          -> filterSweep(shape, p, out, into)
                      }
                      TransitionStyle.DJ_BLEND -> if (shape.bassSwap) bassSwap(shape, p, out, into) else vocalSeparation(shape, p, out, into)
                      TransitionStyle.GAPLESS -> Unit
                      TransitionStyle.EQUAL_POWER -> vocalSeparation(shape, p, out, into)
                  }
                  // A vocal collision also pulls the two songs' midrange apart on the EQ's mid and high bands.
                  if (shape.clash > 0.0) {
                      out.midDb = CLASH_MID_DB * shape.clash * p.pow(FILTER_SWEEP_SHAPE)
                      out.highDb = CLASH_HIGH_DB * shape.clash * p
                      into.midDb = CLASH_ENTRY_MID_DB * shape.clash * (1.0 - p / shape.vocalEntryOpenBy).coerceIn(0.0, 1.0).pow(ENTRY_SHAPE)
                  }
                  if (shape.echo) {
                      // The outgoing track stays open (an echo of a muffled signal is only mud), its low end handed off on the echo beat.
                      out.lowPassHz = OPEN_HZ
                      out.highPassHz = OFF_HZ
                      out.bassKill = handover(p, shape.echoAt, shape.swapWidth)
                  }
              }

              private fun vocalSeparation(shape: Shape, p: Double, out: Side, into: Side) {
                  val amount = shape.clash
                  if (amount <= 0.0) return
                  val floor = glide(OPEN_HZ, VOCAL_SEPARATION_FLOOR_HZ, amount)
                  out.lowPassHz = glide(OPEN_HZ, floor, p.pow(FILTER_SWEEP_SHAPE))
                  into.highPassHz = entryHighPass(p, amount, VOCAL_SEPARATION_HIGH_PASS_HZ, ENTRY_OPEN_BY)
              }

              private fun filterSweep(shape: Shape, p: Double, out: Side, into: Side) {
                  val sweep = shape.filterSweep.coerceIn(0.0, 1.0)
                  if (sweep <= 0.0) return
                  val entry = glide(OPEN_HZ, FILTER_ENTRY_HZ, sweep)
                  val floor = glide(OPEN_HZ, FILTER_FLOOR_HZ, sweep)
                  val cutoff = glide(entry, floor, p.pow(FILTER_SWEEP_SHAPE))
                  val entryCorner = entryHighPass(
                      p,
                      sweep,
                      glide(ENTRY_HIGH_PASS_HZ, VOCAL_SAFE_ENTRY_HIGH_PASS_HZ, shape.clash),
                      shape.vocalEntryOpenBy,
                  )
                  // Two tempi that don't match are two kicks that flam, so the low end changes hands once, on a beat.
                  val h = handover(p, shape.filterSwapAt, shape.swapWidth)
                  out.lowPassHz = cutoff
                  out.bassKill = h
                  into.highPassHz = entryCorner
                  into.bassKill = 1.0 - h
              }

              private fun bassHandoff(shape: Shape, p: Double, out: Side, into: Side) {
                  val h = handover(p, shape.filterSwapAt, shape.swapWidth)
                  val exitAmount = ((p - shape.filterSwapAt) / (1.0 - shape.filterSwapAt)).coerceIn(0.0, 1.0)
                  val handoffTone = glide(OPEN_HZ, FALLBACK_HANDOFF_FLOOR_HZ, exitAmount.pow(FALLBACK_HANDOFF_SHAPE))
                  val vocalTone = glide(OPEN_HZ, VOCAL_SEPARATION_FLOOR_HZ, shape.clash * p.pow(VOCAL_SAFE_EXIT_SHAPE))
                  out.lowPassHz = min(handoffTone, vocalTone)
                  out.bassKill = h
                  into.highPassHz = entryHighPass(
                      p,
                      1.0,
                      glide(FALLBACK_HANDOFF_ENTRY_HZ, VOCAL_SAFE_ENTRY_HIGH_PASS_HZ, shape.clash),
                      shape.vocalEntryOpenBy,
                  )
                  into.bassKill = 1.0 - h
              }

              private fun bassSwap(shape: Shape, p: Double, out: Side, into: Side) {
                  val h = ((p - shape.swapFrom) / shape.swapWidth).coerceIn(0.0, 1.0)
                  val clash = shape.clash
                  into.highPassHz = entryHighPass(
                      p,
                      1.0,
                      glide(BLEND_ENTRY_HIGH_PASS_HZ, BLEND_ENTRY_CLASH_HIGH_PASS_HZ, clash),
                      shape.blendEntryOpenBy,
                  )
                  into.bassKill = 1.0 - h
                  val from = shape.blendExitFrom
                  val amount = ((p - from) / (1.0 - from)).coerceIn(0.0, 1.0)
                  out.lowPassHz = glide(OPEN_HZ, glide(BLEND_EXIT_LOW_PASS_HZ, BLEND_EXIT_CLASH_LOW_PASS_HZ, clash), amount)
                  out.bassKill = h
              }

              // ---- The renderer's curves -----------------------------------------------------------------

              /** Fractions of the blend that carry a kink in some curve, sampled exactly rather than interpolated across. */
              private fun keyFractions(shape: Shape): List<Double> {
                  val keys = ArrayList<Double>()
                  keys += shape.swapAt; keys += shape.swapFrom; keys += shape.fallFrom
                  keys += shape.filterSwapAt; keys += shape.filterSwapAt - shape.swapWidth
                  keys += shape.blendEntryOpenBy; keys += shape.vocalEntryOpenBy; keys += shape.blendExitFrom
                  if (shape.echo) {
                      keys += shape.echoFrom; keys += shape.echoAt; keys += shape.echoAt - shape.swapWidth
                      keys += shape.echoAt + shape.echoKill
                  }
                  return keys.filter { it > 0.0 && it < 1.0 }
              }

              /**
               * The curves for [plan]: the old rides sampled across the blend. [handover] is the seconds the outgoing
               * deck takes to fade in at the takeover, over the sink's own audio.
               */
              fun curves(plan: Plan, handover: Double): Curves {
                  val shape = plan.shape
                  val fade = plan.fadeSeconds
                  val fractions = (0..CURVE_POINTS).map { it.toDouble() / CURVE_POINTS }.toMutableList()
                  fractions += keyFractions(shape)
                  val ps = fractions.sorted().fold(ArrayList<Double>()) { acc, f -> if (acc.isEmpty() || f - acc.last() > 1e-6) acc.add(f); acc }

                  val times = ps.map { plan.fadeStart + it * fade }
                  val outGainV = ArrayList<Float>()
                  val inGainV = ArrayList<Float>()
                  val outS = ps.map { Side() }
                  val inS = ps.map { Side() }
                  ps.forEachIndexed { i, p ->
                      val rise = mixRise(shape, p)
                      val fall = if (shape.echo) echoDry(shape, p) else mixFall(shape, p)
                      val headroom = headroomFor(rise, outgoingLevel(shape, p, fade))
                      outGainV += (fall * headroom).toFloat()
                      inGainV += (rise * headroom).toFloat()
                      ride(shape, p, outS[i], inS[i])
                  }
                  // The last incoming point is exact: full. The outgoing deck is closed just after the end (an echo's
                  // repeats ring on their own, outside this gain).
                  inGainV[inGainV.size - 1] = 1f

                  fun gainCurve(values: List<Float>, lead: List<Pair<Double, Float>>, trail: List<Pair<Double, Float>>): Curve {
                      val t = ArrayList<Double>()
                      val v = ArrayList<Float>()
                      for ((time, value) in lead) { t += time; v += value }
                      for (i in values.indices) { t += times[i]; v += values[i] }
                      for ((time, value) in trail) { t += time; v += value }
                      return Curve(t.toDoubleArray(), v.toFloatArray())
                  }

                  val outGain = gainCurve(
                      outGainV,
                      listOf(-handover to 0f, 0.0 to 1f, plan.fadeStart - 1e-3 to 1f),
                      listOf(plan.fadeEnd + ECHO_CLOSE_SECONDS to 0f),
                  )
                  val inGain = gainCurve(inGainV, listOf(0.0 to 0f, plan.fadeStart - 1e-3 to 0f), emptyList())

                  fun side(sides: List<Side>, pick: (Side) -> Double, neutral: Float, scale: (Double) -> Float): Curve? {
                      val t = ArrayList<Double>()
                      val v = ArrayList<Float>()
                      t += 0.0; v += scale(pick(sides.first()))
                      for (i in sides.indices) { t += times[i]; v += scale(pick(sides[i])) }
                      t += plan.fadeEnd + plan.tail + 1.0; v += scale(pick(sides.last()))
                      val curve = Curve(t.toDoubleArray(), v.toFloatArray())
                      return if (curve.isFlat(neutral, if (neutral > 1f) 1f else 0.01f)) null else curve
                  }

                  val db: (Double) -> Float = { it.toFloat() }
                  val kill: (Double) -> Float = { (BASS_KILL_DB * it).toFloat() }
                  val hz: (Double) -> Float = { it.toFloat() }
                  val send = echoSend(plan)
                  return Curves(
                      outGain = outGain,
                      inGain = inGain,
                      outLowDb = side(outS, { it.bassKill }, 0f, kill),
                      outMidDb = side(outS, { it.midDb }, 0f, db),
                      outHighDb = side(outS, { it.highDb }, 0f, db),
                      outLowPassHz = side(outS, { it.lowPassHz }, OPEN_HZ.toFloat(), hz),
                      outHighPassHz = side(outS, { it.highPassHz }, OFF_HZ.toFloat(), hz),
                      inLowDb = side(inS, { it.bassKill }, 0f, kill),
                      inMidDb = side(inS, { it.midDb }, 0f, db),
                      inHighDb = side(inS, { it.highDb }, 0f, db),
                      inLowPassHz = side(inS, { it.lowPassHz }, OPEN_HZ.toFloat(), hz),
                      inHighPassHz = side(inS, { it.highPassHz }, OFF_HZ.toFloat(), hz),
                      echoSend = send,
                  )
              }

              /**
               * What the outgoing deck feeds its echo: nothing until the beat before the echo beat, a ramp up across that
               * beat, then closed on the echo beat so what repeats is that one beat. Null when the blend has no echo.
               */
              fun echoSend(plan: Plan): Curve? {
                  if (!plan.echo) return null
                  val shape = plan.shape
                  val from = plan.fadeStart + shape.echoFrom * plan.fadeSeconds
                  val at = plan.fadeStart + shape.echoAt * plan.fadeSeconds
                  return Curve(
                      doubleArrayOf(0.0, from, at, at + ECHO_CLOSE_SECONDS),
                      floatArrayOf(0f, 0f, 1f, 0f),
                  )
              }

              // ---- The clock -------------------------------------------------------------------------------

              class Clock(val plan: Plan) : MixTimeline {
                  override val takeoverSeconds: Double get() = plan.takeover
                  override val releaseAt: Double get() = plan.fadeEnd
                  override val handoffAt: Double get() = plan.fadeStart + plan.shape.handoffAt * plan.fadeSeconds
                  override val elementAt: Double = plan.easeEnd + SETTLE_SECONDS
                  override val elementTrackTime: Double = plan.inCue + plan.inElapsed(plan.easeEnd + SETTLE_SECONDS)

                  /** The outgoing song's beats up to the end of the blend, the incoming song's after it, at their tempi of the moment. */
                  override val beatTimes: DoubleArray = run {
                      val times = ArrayList<Double>()
                      var t = 0.0
                      times += t
                      while (t < elementAt + 1.0 && times.size < MAX_BEATS) {
                          t += if (t < plan.fadeEnd - 1e-9) plan.outBeat / plan.outSpeed(t) else plan.inBeat / plan.inSpeed(t)
                          times += t
                      }
                      times.toDoubleArray()
                  }

                  override fun beatAt(t: Double): Pair<Int, Double> {
                      if (t < 0) return -1 to 0.0
                      var low = 0
                      var high = beatTimes.size - 1
                      while (low < high) {
                          val mid = (low + high + 1) ushr 1
                          if (beatTimes[mid] <= t) low = mid else high = mid - 1
                      }
                      val k = low
                      if (k + 1 >= beatTimes.size) return k to 0.0
                      return k to minOf(1.0, (t - beatTimes[k]) / (beatTimes[k + 1] - beatTimes[k]))
                  }

                  override fun positionAt(side: LoopMix.Side, t: Double): Double? {
                      if (t < 0) return null
                      return when (side) {
                          LoopMix.Side.OUT -> if (t < plan.fadeEnd + plan.tail) plan.takeover + plan.outElapsed(t) else null
                          LoopMix.Side.IN -> if (t >= plan.fadeStart) plan.inCue + plan.inElapsed(t) else null
                      }
                  }

                  /**
                   * The tempo knots for one deck over mix seconds [from]..[to]: (mix second, track second) pairs, dense enough
                   * that the renderer's straight lines between them follow the tempo ramps, and exact at their corners.
                   */
                  fun knots(side: LoopMix.Side, from: Double, to: Double): Pair<DoubleArray, DoubleArray> {
                      val times = ArrayList<Double>()
                      var t = from
                      while (t < to) { times += t; t += KNOT_STEP }
                      times += to
                      for (corner in doubleArrayOf(plan.rampStart, plan.fadeStart, plan.fadeEnd, plan.easeEnd)) {
                          if (corner > from && corner < to) times += corner
                      }
                      times.sort()
                      val unique = ArrayList<Double>()
                      for (x in times) if (unique.isEmpty() || x - unique.last() > 1e-6) unique += x
                      val positions = unique.map { x ->
                          if (side == LoopMix.Side.OUT) plan.takeover + plan.outElapsed(x) else plan.inCue + plan.inElapsed(x)
                      }
                      return unique.toDoubleArray() to positions.toDoubleArray()
                  }
              }
          }
          BLEND_MIX_EOF
          mkdir -p "$(dirname 'shared/src/commonTest/kotlin/com/music/bitchord/playback/smart/BlendMixTest.kt')"
