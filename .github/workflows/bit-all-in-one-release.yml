          package com.music.bitchord.playback.smart

          import kotlin.math.abs
          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertNotNull
          import kotlin.test.assertNull
          import kotlin.test.assertTrue

          class BlendMixTest {

              private fun plan(
                  style: TransitionStyle = TransitionStyle.DJ_BLEND,
                  bassSwap: Boolean = true,
                  start: Double = 120.0,
                  fade: Double = 16.0,
                  beat: Double = 0.5,
                  cue: Double = 8.0,
                  outRate: Double = 1.0,
                  inRate: Double = 1.0,
                  echo: Double = 0.0,
                  clash: Double = 0.0,
                  variant: FilterTransitionVariant = FilterTransitionVariant.SWEEP,
                  sweep: Double = 0.0,
                  reason: String = "smart-dj-blend",
              ) = TransitionPlan(
                  shouldStart = true,
                  reason = reason,
                  transitionStart = start,
                  transitionEnd = start + fade,
                  fadeSeconds = fade,
                  transitionStyle = style,
                  incomingCueTime = cue,
                  incomingPlaybackRate = inRate,
                  outgoingPlaybackRate = outRate,
                  transitionBeats = (fade / beat).toInt(),
                  bassSwap = bassSwap,
                  bassSwapFraction = 0.7,
                  filterSweep = sweep,
                  filterVariant = variant,
                  vocalOverlap = clash,
                  beatSeconds = beat,
                  echoSeconds = echo,
              )

              private inline fun <T> blendOn(enabled: Boolean = true, block: () -> T): T {
                  val before = BlendMix.enabled
                  BlendMix.enabled = enabled
                  try {
                      return block()
                  } finally {
                      BlendMix.enabled = before
                  }
              }

              private fun blendOf(plan: TransitionPlan): BlendMix.Plan? =
                  BlendMix.fromPlan(plan, TrackAnalysis(), TrackAnalysis(), 240.0, 240.0)

              @Test
              fun offByDefaultAndForCutsLoopsAndGapless() {
                  assertNull(blendOf(plan()))
                  blendOn {
                      assertNotNull(blendOf(plan()))
                      assertNull(blendOf(plan(reason = "smart-cut-quick")))
                      assertNull(blendOf(plan(reason = "smart-loop-mix")))
                      assertNull(blendOf(plan(reason = "smart-analysis-fallback")))
                      assertNull(blendOf(plan(style = TransitionStyle.GAPLESS)))
                      assertNull(blendOf(plan().copy(blocked = true)))
                  }
              }

              @Test
              fun theBlendStartsOnTheOutgoingBeatTheRendererWasToldTo() = blendOn {
                  val p = assertNotNull(blendOf(plan()))
                  assertEquals(116.0, p.takeover, 1e-9)
                  assertEquals(p.fadeStart, 4.0, 1e-9)
                  assertEquals(20.0, p.fadeEnd, 1e-9)
                  assertEquals(120.0, p.takeover + p.outElapsed(p.fadeStart), 1e-9)
                  assertEquals(8.0, p.inCue + p.inElapsed(p.fadeStart), 1e-9)
                  val clock = BlendMix.Clock(p)
                  assertEquals(8.0 + (clock.elementAt - p.fadeStart), clock.elementTrackTime, 1e-9)
              }

              @Test
              fun theGainsAreAnEqualPowerSwapWithHeadroom() = blendOn {
                  val p = assertNotNull(blendOf(plan(style = TransitionStyle.EQUAL_POWER, bassSwap = false)))
                  val c = BlendMix.curves(p, 0.05)
                  assertEquals(1f, c.outGain.values[2], 1e-4f)
                  assertEquals(0f, c.inGain.values[0], 1e-4f)
                  assertEquals(1f, c.inGain.values.last(), 1e-4f)
                  assertEquals(0f, c.outGain.values.last(), 1e-4f)
                  // Never louder than the two faders' power sum allows.
                  for (i in c.inGain.times.indices) {
                      val t = c.inGain.times[i]
                      val out = c.outGain.values.indices.minByOrNull { abs(c.outGain.times[it] - t) }!!
                      val power = c.inGain.values[i] * c.inGain.values[i] + c.outGain.values[out] * c.outGain.values[out]
                      assertTrue(power <= 1.3f, "power $power at $t")
                  }
                  assertNull(c.outLowDb)
                  assertNull(c.echoSend)
              }

              @Test
              fun aBassSwapHandsTheLowEndOverOnTheEq() = blendOn {
                  val p = assertNotNull(blendOf(plan()))
                  val c = BlendMix.curves(p, 0.05)
                  val inLow = assertNotNull(c.inLowDb)
                  val outLow = assertNotNull(c.outLowDb)
                  // The incoming song starts with its bass killed and ends with it open; the outgoing one the other way round.
                  assertEquals(BlendMix.BASS_KILL_DB, inLow.values[1], 0.01f)
                  assertEquals(0f, inLow.values.last(), 0.01f)
                  assertEquals(0f, outLow.values[1], 0.01f)
                  assertEquals(BlendMix.BASS_KILL_DB, outLow.values.last(), 0.01f)
              }

              @Test
              fun aFilterRideSweepsTheLowPassAndOpensTheIncomingHighPass() = blendOn {
                  val p = assertNotNull(
                      blendOf(plan(style = TransitionStyle.DJ_FILTER, bassSwap = false, sweep = 1.0, start = 90.0, cue = 12.0)),
                  )
                  val c = BlendMix.curves(p, 0.05)
                  val lp = assertNotNull(c.outLowPassHz)
                  val hp = assertNotNull(c.inHighPassHz)
                  assertTrue(lp.values.last() < 600f, "low-pass ends closed: ${lp.values.last()}")
                  assertTrue(lp.values.first() > 5_000f)
                  assertTrue(hp.values[1] > 500f, "the incoming song enters high-passed: ${hp.values[1]}")
                  assertTrue(hp.values.last() <= 21f, "and opens out")
              }

              @Test
              fun aVocalCollisionPullsTheMidsApart() = blendOn {
                  val clear = assertNotNull(blendOf(plan()))
                  assertNull(BlendMix.curves(clear, 0.05).outMidDb)
                  val collide = assertNotNull(blendOf(plan(clash = 1.0)))
                  val mid = assertNotNull(BlendMix.curves(collide, 0.05).outMidDb)
                  assertTrue(mid.values.last() < -3f)
              }

              @Test
              fun anEchoOutSendsOneBeatAndKillsTheDryOutgoing() = blendOn {
                  val p = assertNotNull(blendOf(plan(style = TransitionStyle.DJ_FILTER, bassSwap = false, sweep = 1.0, echo = 0.5, variant = FilterTransitionVariant.ECHO_RIDE)))
                  assertTrue(p.echo)
                  assertEquals(echoTailSeconds(0.5), p.tail, 1e-9)
                  val c = BlendMix.curves(p, 0.05)
                  val send = assertNotNull(c.echoSend)
                  assertEquals(1f, send.values[2], 1e-6f)
                  assertEquals(0f, send.values.last(), 1e-6f)
                  // The outgoing song stays open for its echo.
                  assertNull(c.outLowPassHz)
                  assertEquals(0f, c.outGain.values.last(), 1e-6f)
              }

              @Test
              fun theTempoRampsLandOnTheSameBeats() = blendOn {
                  val p = assertNotNull(blendOf(plan(outRate = 1.06, inRate = 1.0)))
                  // The outgoing song is sped up before the blend, so the takeover is earlier than the plain lead.
                  assertTrue(p.takeover < 116.0)
                  assertEquals(120.0, p.takeover + p.outElapsed(p.fadeStart), 1e-9)
                  assertEquals(1.06, p.outSpeed(p.fadeStart), 1e-9)
                  assertEquals(1.0, p.outSpeed(p.rampStart), 1e-9)
                  val q = assertNotNull(blendOf(plan(outRate = 1.0, inRate = 1.05)))
                  assertTrue(q.easeSeconds > 0.0)
                  assertEquals(1.05, q.inSpeed(q.fadeStart + 1.0), 1e-9)
                  assertEquals(1.0, q.inSpeed(q.easeEnd + 0.01), 1e-9)
                  // The incoming song is back at its own tempo when its player takes over.
                  val clock = BlendMix.Clock(q)
                  assertEquals(1.0, q.inSpeed(clock.elementAt), 1e-9)
                  // The knots run forward and agree with the closed form.
                  val (times, positions) = clock.knots(LoopMix.Side.IN, q.fadeStart - 0.6, clock.elementAt)
                  for (i in 1 until times.size) assertTrue(positions[i] > positions[i - 1])
                  assertEquals(clock.elementTrackTime, positions.last(), 1e-9)
              }

              @Test
              fun aBlendThatDoesNotFitIsRefused() = blendOn {
                  // Too early in the song to take over before it.
                  assertNull(blendOf(plan(start = 3.0)))
                  // Too little of the incoming song left after the handover.
                  assertNull(BlendMix.fromPlan(plan(cue = 200.0), TrackAnalysis(), TrackAnalysis(), 240.0, 215.0))
                  // An echo tail that would run past the file.
                  assertNull(BlendMix.fromPlan(plan(echo = 0.5, start = 225.0), TrackAnalysis(), TrackAnalysis(), 240.0, 240.0))
              }
          }
          BLEND_MIX_TEST_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/music/bitchord/playback/loopmix/BlendMixSession.kt')"
