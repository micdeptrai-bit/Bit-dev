          /**
           * The clock faces the lock-screen player can wear (v2: every one of them is made
           * of the same liquid glass as the transport card).
           *
           * The choice is stored by [name] (see [com.music.bitchord.data.settings.AppSettings.lockScreenClockStyle]),
           * so faces can be added anywhere in this list without moving anybody's saved
           * choice onto a different one. A name that no longer exists (the faces v2
           * retired) falls back to [LIQUID].
           *
           * [previewScale] is how far a face is shrunk to fit its tile in the picker.
           */
          enum class LockClockStyle(@StringRes val labelRes: Int, val previewScale: Float) {
              LIQUID(R.string.lock_clock_liquid, 0.27f),
              GLASS(R.string.lock_clock_glass, 0.25f),
              LEON(R.string.lock_clock_leon, 0.30f),
              FROSTED(R.string.lock_clock_frosted, 0.40f),
              CARDS(R.string.lock_clock_cards, 0.32f),
              COMPACT(R.string.lock_clock_compact, 0.80f),
              RING(R.string.lock_clock_ring, 0.30f),
              ANALOG(R.string.lock_clock_analog, 0.28f),
              ;

              /** Whether the face shows seconds, so the host has to tick every second. */
              val usesSeconds: Boolean
                  get() = this == RING || this == ANALOG

              fun next(): LockClockStyle = LockClockStyle.entries[(ordinal + 1) % LockClockStyle.entries.size]

              companion object {
                  fun from(name: String?): LockClockStyle = LockClockStyle.entries.firstOrNull { it.name == name } ?: LIQUID
              }
          }

          /**
           * The time as the clock should show it: truncated to the minute unless
           * [withSeconds]. Stops ticking while the screen is not [active].
           */
          @Composable
          internal fun rememberClockTime(withSeconds: Boolean, active: Boolean = true): LocalDateTime {
              var now by remember { mutableStateOf(LocalDateTime.now().truncated(withSeconds)) }
              LaunchedEffect(withSeconds, active) {
                  if (!active) return@LaunchedEffect
                  while (true) {
                      now = LocalDateTime.now().truncated(withSeconds)
                      delay(if (withSeconds) 200L else 1_000L)
                  }
              }
              return now
          }

          private fun LocalDateTime.truncated(withSeconds: Boolean): LocalDateTime =
              if (withSeconds) withNano(0) else withSecond(0).withNano(0)

          // --- typefaces -------------------------------------------------------------
          //
          // The system's own families, picked by name. Nothing is bundled: a face the
          // phone lacks quietly falls back to its regular sans.

          private val BlackFamily = FontFamily(Typeface.create("sans-serif-black", Typeface.NORMAL))
          private val BoldFamily = FontFamily(Typeface.create("sans-serif", Typeface.BOLD))
          private val MediumFamily = FontFamily(Typeface.create("sans-serif-medium", Typeface.NORMAL))

          /** A soft drop shadow so a face still reads over a bright cover. */
          private val ClockShadow = Shadow(
              color = Color.Black.copy(alpha = 0.30f),
              offset = Offset(0f, 3f),
              blurRadius = 22f,
          )

          private fun scaledSp(value: Float, scale: Float) = (value * scale).sp

          private fun face(
              size: Float,
              scale: Float,
              family: FontFamily? = null,
              weight: FontWeight = FontWeight.Normal,
              spacing: Float = 0f,
              color: Color = Color.White,
              shadow: Boolean = true,
          ): TextStyle = TextStyle(
              color = color,
              fontSize = scaledSp(size, scale),
              fontFamily = family,
              fontWeight = weight,
              letterSpacing = scaledSp(spacing, scale),
              // Fixed-width digits, so the face does not shuffle sideways each minute.
              fontFeatureSettings = "tnum",
              shadow = if (shadow) ClockShadow else null,
              textAlign = TextAlign.Center,
          )

          @Composable
          private fun ClockText(text: String, style: TextStyle, modifier: Modifier = Modifier, maxLines: Int = 1) {
              BasicText(
                  text = text,
                  style = style,
                  modifier = modifier,
                  maxLines = maxLines,
                  softWrap = false,
                  overflow = TextOverflow.Visible,
              )
          }

          @Composable
          private fun DateLine(text: String, scale: Float, alpha: Float = 0.90f, size: Float = 20f) {
              ClockText(
                  text = text,
                  style = face(
                      size = size,
                      scale = scale,
                      weight = FontWeight.Medium,
                      color = Color.White.copy(alpha = alpha),
                  ),
              )
          }

          // --- liquid glass digits -------------------------------------------------------

          /**
           * Digits as a pane of liquid glass, built from four passes of the same text:
           *
           *  1. a fill that is brightest at the top and clears toward the bottom ([fill]
           *     scales it; 0 leaves clear glass with only an edge),
           *  2. the lit rim, bright where the light strikes and again opposite,
           *  3. a thin highlight lifted a hair above the rim, which is what gives the
           *     edge its bevel,
           *  4. a soft shadow under the whole, carried by the fill pass.
           *
           * Nothing is opaque, so the cover shows straight through the numerals.
           */
          @Composable
          private fun LiquidText(
              text: String,
              size: Float,
              scale: Float,
              family: FontFamily,
              modifier: Modifier = Modifier,
              spacing: Float = 0f,
              fill: Float = 1f,
              rim: Float = 1f,
              lineHeight: Float? = null,
              maxLines: Int = 1,
          ) {
              val density = LocalDensity.current
              val rimPx = with(density) { (1.6f * scale * rim).coerceAtLeast(0.7f).dp.toPx() }
              val glintPx = with(density) { (0.9f * scale).coerceAtLeast(0.5f).dp.toPx() }
              val liftPx = with(density) { (1.5f * scale).dp.toPx() }
              var base = face(size, scale, family = family, spacing = spacing, shadow = false)
              if (lineHeight != null) base = base.copy(lineHeight = scaledSp(lineHeight, scale))

              val fillBrush = Brush.verticalGradient(
                  0f to Color.White.copy(alpha = 0.52f * fill),
                  0.55f to Color.White.copy(alpha = 0.20f * fill),
                  1f to Color.White.copy(alpha = 0.34f * fill),
              )
              val rimBrush = Brush.linearGradient(
                  0f to Color.White.copy(alpha = 0.98f),
                  0.45f to Color.White.copy(alpha = 0.30f),
                  1f to Color.White.copy(alpha = 0.78f),
              )
              val glintBrush = Brush.verticalGradient(
                  0f to Color.White.copy(alpha = 0.80f),
                  0.42f to Color.Transparent,
                  1f to Color.Transparent,
              )

              Box(modifier, contentAlignment = Alignment.Center) {
                  ClockText(
                      text,
                      base.copy(brush = fillBrush, shadow = ClockShadow),
                      maxLines = maxLines,
                  )
                  ClockText(
                      text,
                      base.copy(brush = rimBrush, drawStyle = Stroke(width = rimPx, join = StrokeJoin.Round)),
                      maxLines = maxLines,
                  )
                  ClockText(
                      text,
                      base.copy(brush = glintBrush, drawStyle = Stroke(width = glintPx, join = StrokeJoin.Round)),
                      modifier = Modifier.graphicsLayer { translationY = -liftPx },
                      maxLines = maxLines,
                  )
              }
          }

          /** The date in a small capsule of glass. */
          @Composable
          private fun GlassCapsule(text: String, scale: Float) {
              val shape = RoundedCornerShape(50)
              Box(
                  modifier = Modifier
                      .glassPane(shape, strength = 1.1f)
                      .padding(horizontal = (16f * scale).dp, vertical = (6f * scale).dp),
                  contentAlignment = Alignment.Center,
              ) {
                  ClockText(
                      text,
                      face(
                          size = 14f,
                          scale = scale,
                          weight = FontWeight.SemiBold,
                          spacing = 2.4f,
                          color = Color.White.copy(alpha = 0.94f),
                          shadow = false,
                      ),
                  )
              }
          }

          /**
           * One clock face.
           *
           * [scale] shrinks the whole face (type, rings, paddings) in one go; the picker
           * uses it to draw a live miniature of each face. A preview passes
           * `live = false` and a fixed [time], so nothing in it ticks. A host that is
           * off screen passes `live = false` too, which stops the per-frame seconds.
           */
          @Composable
          internal fun LockClock(
              style: LockClockStyle,
              time: LocalDateTime,
              is24h: Boolean,
              modifier: Modifier = Modifier,
              scale: Float = 1f,
              showDate: Boolean = true,
              live: Boolean = true,
          ) {
              val locale = Locale.getDefault()
              val hourText = remember(time, is24h) {
                  time.format(DateTimeFormatter.ofPattern(if (is24h) "HH" else "h", locale))
              }
              val minuteText = remember(time) { time.format(DateTimeFormatter.ofPattern("mm", locale)) }
              val hm = "$hourText:$minuteText"
              val date = remember(time.toLocalDate(), locale) {
                  time.format(DateTimeFormatter.ofPattern("EEEE, d MMMM", locale))
              }
              val shortDate = remember(time.toLocalDate(), locale) {
                  time.format(DateTimeFormatter.ofPattern("EEE, d MMM", locale))
              }

              when (style) {
                  // Heavy numerals, filled glass: the signature face.
                  LockClockStyle.LIQUID -> Column(modifier, horizontalAlignment = Alignment.CenterHorizontally) {
                      if (showDate) DateLine(date, scale)
                      LiquidText(hm, size = 122f, scale = scale, family = BlackFamily, spacing = -2f, fill = 1f)
                  }

                  // Lighter strokes, mostly clear: an etched pane with a bright edge.
                  LockClockStyle.GLASS -> Column(modifier, horizontalAlignment = Alignment.CenterHorizontally) {
                      if (showDate) DateLine(date, scale, alpha = 0.78f)
                      LiquidText(hm, size = 132f, scale = scale, family = MediumFamily, spacing = -1f, fill = 0.42f, rim = 1.25f)
                  }

                  // Leon: hours as a solid bead of glass over minutes as clear glass, tight
                  // and tall, with the date in a capsule on top.
                  LockClockStyle.LEON -> Column(modifier, horizontalAlignment = Alignment.CenterHorizontally) {
                      if (showDate) {
                          GlassCapsule(shortDate.uppercase(locale), scale)
                          Spacer(Modifier.height((10f * scale).dp))
                      }
                      LiquidText(
                          hourText.padStart(2, '0'),
                          size = 142f,
                          scale = scale,
                          family = BlackFamily,
                          spacing = -4f,
                          fill = 1f,
                          lineHeight = 120f,
                      )
                      LiquidText(
                          minuteText,
                          size = 142f,
                          scale = scale,
                          family = BlackFamily,
                          spacing = -4f,
                          fill = 0.16f,
                          rim = 1.35f,
                          lineHeight = 120f,
                          modifier = Modifier.offset(y = (-14f * scale).dp),
                      )
                  }

                  LockClockStyle.FROSTED -> {
                      val panel = RoundedCornerShape((30f * scale).dp)
                      Column(
                          modifier = modifier
                              .glassPane(panel, strength = 1.2f)
                              .padding(horizontal = (30f * scale).dp, vertical = (14f * scale).dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                      ) {
                          if (showDate) DateLine(shortDate, scale, alpha = 0.86f, size = 16f)
                          LiquidText(hm, size = 74f, scale = scale, family = MediumFamily, fill = 0.55f)
                      }
                  }

                  // Each pair of digits on its own tile of glass, with a gloss over the top
                  // half and the hinge line of a flip clock.
                  LockClockStyle.CARDS -> Column(modifier, horizontalAlignment = Alignment.CenterHorizontally) {
                      if (showDate) DateLine(date, scale)
                      Row(
                          horizontalArrangement = Arrangement.spacedBy((12f * scale).dp),
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          GlassTile(hourText.padStart(2, '0'), scale)
                          GlassTile(minuteText, scale)
                      }
                  }

                  LockClockStyle.COMPACT -> {
                      val pill = RoundedCornerShape(50)
                      Row(
                          modifier = modifier
                              .glassPane(pill, strength = 1.3f)
                              .padding(horizontal = (22f * scale).dp, vertical = (10f * scale).dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy((10f * scale).dp),
                      ) {
                          if (showDate) {
                              ClockText(
                                  shortDate,
                                  face(17f, scale, weight = FontWeight.Medium, color = Color.White.copy(alpha = 0.88f), shadow = false),
                              )
                              Box(
                                  Modifier
                                      .size((4f * scale).dp)
                                      .clip(CircleShape)
                                      .background(Color.White.copy(alpha = 0.6f)),
                              )
                          }
                          ClockText(hm, face(26f, scale, weight = FontWeight.Bold, shadow = false))
                      }
                  }

                  LockClockStyle.RING -> RingFace(modifier, time, hm, shortDate, scale, showDate, live)

                  LockClockStyle.ANALOG -> AnalogFace(modifier, time, date, scale, showDate, live)
              }
          }

          /** One tile of a flip clock, in glass. */
          @Composable
          private fun GlassTile(text: String, scale: Float) {
              val shape = RoundedCornerShape((24f * scale).dp)
              Box(
                  modifier = Modifier
                      .glassPane(shape, strength = 1.2f)
                      .padding(horizontal = (20f * scale).dp, vertical = (8f * scale).dp),
                  contentAlignment = Alignment.Center,
              ) {
                  // Gloss across the top half.
                  Box(
                      Modifier
                          .align(Alignment.TopCenter)
                          .fillMaxWidth()
                          .fillMaxHeight(0.5f)
                          .background(
                              Brush.verticalGradient(
                                  0f to Color.White.copy(alpha = 0.20f),
                                  1f to Color.White.copy(alpha = 0.02f),
                              ),
                          ),
                  )
                  ClockText(text, face(96f, scale, family = BlackFamily, color = Color.White.copy(alpha = 0.96f)))
                  // The hinge.
                  Box(
                      Modifier
                          .fillMaxWidth()
                          .height((2f * scale).dp)
                          .background(Color.Black.copy(alpha = 0.32f)),
                  )
              }
          }

          // --- smooth seconds ---------------------------------------------------------

          /**
           * Wall-clock milliseconds, refreshed every frame while [live].
           *
           * Handed back as state and read only inside draw blocks, so a frame costs a
           * redraw of the dial and no recomposition at all.
           */
          @Composable
          private fun rememberSmoothMillis(live: Boolean): LongState {
              val state = remember { mutableLongStateOf(System.currentTimeMillis()) }
              LaunchedEffect(live) {
                  if (!live) return@LaunchedEffect
                  while (true) {
                      withFrameMillis { state.longValue = System.currentTimeMillis() }
                  }
              }
              return state
          }

          /** Seconds since local midnight at [epochMs], with the fraction. */
          private fun secondsOfDay(epochMs: Long): Double {
              val local = epochMs + TimeZone.getDefault().getOffset(epochMs)
              return Math.floorMod(local, 86_400_000L) / 1000.0
          }

          // --- ring -------------------------------------------------------------------

          @Composable
          private fun RingFace(
              modifier: Modifier,
              time: LocalDateTime,
              hm: String,
              shortDate: String,
              scale: Float,
              showDate: Boolean,
              live: Boolean,
          ) {
              val smooth = rememberSmoothMillis(live)
              val fixedSeconds = time.second.toDouble()
              Box(modifier.size((232f * scale).dp), contentAlignment = Alignment.Center) {
                  Canvas(Modifier.size((232f * scale).dp)) {
                      val stroke = 9.dp.toPx() * scale
                      val inset = stroke / 2f
                      val arcSize = Size(size.width - stroke, size.height - stroke)
                      val center = Offset(size.width / 2f, size.height / 2f)
                      val ringRadius = (size.width - stroke) / 2f

                      // The pane inside the ring.
                      drawCircle(
                          brush = Brush.linearGradient(
                              0f to Color.White.copy(alpha = 0.20f),
                              1f to Color.White.copy(alpha = 0.04f),
                          ),
                          radius = ringRadius - stroke * 0.9f,
                          center = center,
                      )
                      // The groove the seconds run in.
                      drawArc(
                          color = Color.White.copy(alpha = 0.14f),
                          startAngle = 0f,
                          sweepAngle = 360f,
                          useCenter = false,
                          topLeft = Offset(inset, inset),
                          size = arcSize,
                          style = Stroke(width = stroke),
                      )
                      val seconds = if (live) secondsOfDay(smooth.longValue) % 60.0 else fixedSeconds
                      val sweep = (seconds / 60.0 * 360.0).toFloat().coerceAtLeast(2f)
                      // The bead of glass that fills the groove: faint at its tail, bright at its head.
                      rotate(degrees = -90f, pivot = center) {
                          drawArc(
                              brush = Brush.sweepGradient(
                                  0f to Color.White.copy(alpha = 0.22f),
                                  1f to Color.White.copy(alpha = 0.98f),
                                  center = center,
                              ),
                              startAngle = 0f,
                              sweepAngle = sweep,
                              useCenter = false,
                              topLeft = Offset(inset, inset),
                              size = arcSize,
                              style = Stroke(width = stroke, cap = StrokeCap.Round),
                          )
                      }
                      // A bright head with a small catch of light on it.
                      val headRad = Math.toRadians((sweep - 90f).toDouble())
                      val head = Offset(
                          center.x + cos(headRad).toFloat() * ringRadius,
                          center.y + sin(headRad).toFloat() * ringRadius,
                      )
                      drawCircle(Color.White, radius = stroke * 0.46f, center = head)
                      drawCircle(Color.White.copy(alpha = 0.55f), radius = stroke * 0.22f, center = head + Offset(-stroke * 0.10f, -stroke * 0.12f))
                  }
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      LiquidText(hm, size = 60f, scale = scale, family = BlackFamily, spacing = -1f, fill = 0.9f)
                      if (showDate) {
                          ClockText(
                              shortDate,
                              face(14f, scale, weight = FontWeight.Medium, color = Color.White.copy(alpha = 0.84f)),
                          )
                      }
                  }
              }
          }

          // --- analog -----------------------------------------------------------------

          @Composable
          private fun AnalogFace(
              modifier: Modifier,
              time: LocalDateTime,
              date: String,
              scale: Float,
              showDate: Boolean,
              live: Boolean,
          ) {
              val smooth = rememberSmoothMillis(live)
              val fixedSeconds = time.toLocalTime().toSecondOfDay().toDouble()
              Column(modifier, horizontalAlignment = Alignment.CenterHorizontally) {
                  Canvas(Modifier.size((250f * scale).dp)) {
                      val u = 1.dp.toPx() * scale
                      val center = Offset(size.width / 2f, size.height / 2f)
                      val radius = size.minDimension / 2f - 2f * u
                      val secs = if (live) secondsOfDay(smooth.longValue) else fixedSeconds

                      // The pane: lit from the top-left, clearer toward the far edge.
                      drawCircle(
                          brush = Brush.radialGradient(
                              colors = listOf(
                                  Color.White.copy(alpha = 0.26f),
                                  Color.White.copy(alpha = 0.07f),
                                  Color.White.copy(alpha = 0.13f),
                              ),
                              center = Offset(center.x - radius * 0.25f, center.y - radius * 0.35f),
                              radius = radius * 1.4f,
                          ),
                          radius = radius,
                          center = center,
                      )
                      // The lit rim.
                      drawCircle(
                          brush = Brush.linearGradient(
                              colors = listOf(
                                  Color.White.copy(alpha = 0.90f),
                                  Color.White.copy(alpha = 0.14f),
                                  Color.White.copy(alpha = 0.55f),
                              ),
                              start = Offset(0f, 0f),
                              end = Offset(size.width, size.height),
                          ),
                          radius = radius,
                          center = center,
                          style = Stroke(width = 1.7f * u),
                      )
                      // A crescent of reflected light on the upper left.
                      drawArc(
                          color = Color.White.copy(alpha = 0.46f),
                          startAngle = 205f,
                          sweepAngle = 65f,
                          useCenter = false,
                          topLeft = Offset(center.x - radius + 6f * u, center.y - radius + 6f * u),
                          size = Size((radius - 6f * u) * 2f, (radius - 6f * u) * 2f),
                          style = Stroke(width = 3f * u, cap = StrokeCap.Round),
                      )

                      // Ticks: the hours long and bright, the minutes short and faint.
                      for (i in 0 until 60) {
                          val hour = i % 5 == 0
                          val outer = radius - 8f * u
                          val inner = outer - (if (hour) 13f else 5f) * u
                          drawRadial(
                              center = center,
                              angleDeg = i * 6.0,
                              from = inner,
                              to = outer,
                              color = Color.White.copy(alpha = if (hour) 0.95f else 0.40f),
                              width = (if (hour) 2.6f else 1.1f) * u,
                          )
                      }

                      val hourAngle = (secs / 3600.0 % 12.0) * 30.0
                      val minuteAngle = (secs / 60.0 % 60.0) * 6.0
                      val secondAngle = (secs % 60.0) * 6.0

                      // Hands cast a soft shadow on the pane.
                      val drop = Offset(1.5f * u, 2.6f * u)
                      drawRadial(center + drop, hourAngle, 0f, radius * 0.50f, Color.Black.copy(alpha = 0.26f), 6.5f * u)
                      drawRadial(center + drop, minuteAngle, 0f, radius * 0.76f, Color.Black.copy(alpha = 0.26f), 4.2f * u)
                      drawRadial(center, hourAngle, 0f, radius * 0.50f, Color.White, 6.5f * u)
                      drawRadial(center, minuteAngle, 0f, radius * 0.76f, Color.White, 4.2f * u)
                      val accent = Color(0xFFFF9F0A)
                      drawRadial(center, secondAngle, -radius * 0.16f, radius * 0.84f, accent, 1.8f * u)
                      drawCircle(accent, radius = 4.6f * u, center = center)
                      drawCircle(Color.Black.copy(alpha = 0.55f), radius = 1.6f * u, center = center)
                  }
                  if (showDate) {
                      Spacer(Modifier.height((8f * scale).dp))
                      DateLine(date, scale, size = 19f)
                  }
              }
          }

          /** A line along the dial's radius, [from]..[to] away from the centre; 0° is twelve o'clock. */
          private fun DrawScope.drawRadial(
              center: Offset,
              angleDeg: Double,
              from: Float,
              to: Float,
              color: Color,
              width: Float,
          ) {
              val rad = Math.toRadians(angleDeg)
              val dx = sin(rad).toFloat()
              val dy = -cos(rad).toFloat()
              drawLine(
                  color = color,
                  start = Offset(center.x + dx * from, center.y + dy * from),
                  end = Offset(center.x + dx * to, center.y + dy * to),
                  strokeWidth = width,
                  cap = StrokeCap.Round,
              )
          }
          KT_EOF

