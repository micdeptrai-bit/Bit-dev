name: Dọn workflow thừa (xoá file không cần rồi tự xoá luôn)

# ======================================================================================
# CÁCH DÙNG (làm 1 lần):
#   1. Tạo token: GitHub -> Settings -> Developer settings -> Personal access tokens -> Tokens (classic) -> Generate new token,
#      tick 2 quyền "repo" và "workflow". Copy token.
#      (GITHUB_TOKEN mặc định KHÔNG được phép sửa/xoá file trong .github/workflows, nên bắt buộc phải có token này.)
#   2. Repo -> Settings -> Secrets and variables -> Actions -> New repository secret: tên WORKFLOW_PAT, dán token vào.
#   3. Actions -> "Dọn workflow thừa" -> Run workflow. LẦN ĐẦU để nguyên dry_run = bật: chỉ liệt kê, chưa xoá gì.
#      Xem bảng Summary của lần chạy: mục GIỮ và mục XOÁ. Ổn rồi thì chạy lại, tắt dry_run.
#   4. Chạy thật xong: các file thừa bị xoá, file này tự xoá luôn (delete_self). Xong thì xoá secret WORKFLOW_PAT cho an toàn.
#
# AN TOÀN:
#   - Ô keep: danh sách file GIỮ, cách nhau bằng dấu phẩy. Mọi file còn lại bị xoá.
#   - Workflow tự giữ THÊM mọi file mà các file keep có nhắc tên (vd gemini-vi-lyrics-lite.yml cần automix-manual-mix (2).yml
#     và automix-all-in-one (2).yml), nên không lỡ xoá file mà workflow khác đang cần.
#   - Không giữ được file nào (keep sai tên hết) thì DỪNG, không xoá gì.
#   - Chỉ xoá file, không đụng mã nguồn. File xoá nằm trong lịch sử commit, khôi phục lại được.
#   - Lịch sử các lần chạy (runs) của workflow đã xoá vẫn còn trong tab Actions cho tới khi bạn dọn.
# ======================================================================================

on:
  workflow_dispatch:
    inputs:
      keep:
        description: "File workflow GIỮ LẠI, cách nhau bằng dấu phẩy (workflow tự giữ thêm các file mà chúng nhắc tới)"
        type: string
        default: "gemini-vi-lyrics-lite.yml,bit-all-in-one-release.yml,repo-optimize.yml"
      dry_run:
        description: "Chỉ liệt kê, KHÔNG xoá. Tắt đi để xoá thật"
        type: boolean
        default: true
      delete_self:
        description: "Xoá luôn file workflow này sau khi dọn xong"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: cleanup-workflows
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT || github.token }}

      - name: Lập kế hoạch (giữ gì, xoá gì)
        env:
          KEEP: ${{ inputs.keep }}
          DELETE_SELF: ${{ inputs.delete_self }}
        run: |
          python3 - <<'PY'
          import os, sys

          WF = ".github/workflows"
          me = os.environ["GITHUB_WORKFLOW_REF"].split("@")[0].rsplit("/", 1)[-1]
          allf = sorted(f for f in os.listdir(WF) if f.endswith((".yml", ".yaml")))
          asked = [k.strip() for k in os.environ.get("KEEP", "").split(",") if k.strip()]

          keep, why = [], {}
          for k in asked:
              if k == me:
                  continue
              if k in allf:
                  keep.append(k); why[k] = "bạn chọn giữ"
              else:
                  print(f"::warning::Không có file '{k}' trong {WF}, bỏ qua.")
          if not keep:
              print("::error::Không có file nào để giữ (keep sai tên?). Dừng, không xoá gì.")
              sys.exit(1)

          # Giữ thêm mọi file mà file đang giữ có nhắc tên (lặp tới khi hết)
          i = 0
          while i < len(keep):
              text = open(os.path.join(WF, keep[i]), encoding="utf-8", errors="replace").read()
              for other in allf:
                  if other != me and other not in keep and other in text:
                      keep.append(other); why[other] = f"được '{keep[i]}' nhắc tới"
              i += 1

          delete = [f for f in allf if f != me and f not in keep]
          self_del = os.environ.get("DELETE_SELF") == "true"

          open("/tmp/delete.txt", "w", encoding="utf-8").write("\n".join(delete) + ("\n" if delete else ""))
          lines = ["## GIỮ"] + [f"- `{f}` ({why[f]})" for f in keep]
          lines += ["", "## XOÁ"] + ([f"- `{f}`" for f in delete] or ["- (không có file nào thừa)"])
          if self_del:
              lines += ["", f"## Tự xoá file này: `{me}`"]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          with open(os.environ["GITHUB_ENV"], "a") as e:
              e.write(f"SELF_FILE={me}\nN_DELETE={len(delete)}\n")
          PY

      - name: Xoá thật và đẩy lên repo
        if: ${{ !inputs.dry_run }}
        env:
          PAT: ${{ secrets.WORKFLOW_PAT }}
          DELETE_SELF: ${{ inputs.delete_self }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "::error::Chưa có secret WORKFLOW_PAT (token có quyền repo + workflow). Không có nó GitHub không cho workflow xoá file trong .github/workflows. Xem hướng dẫn ở đầu file."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r f; do
            [ -n "$f" ] && git rm -q -- ".github/workflows/$f"
          done < /tmp/delete.txt
          if [ "$DELETE_SELF" = "true" ]; then
            git rm -q -- ".github/workflows/$SELF_FILE"
          fi
          if git diff --cached --quiet; then
            echo "Không có gì để xoá."
            exit 0
          fi
          git commit -q -m "Dọn workflow thừa ($N_DELETE file)$([ "$DELETE_SELF" = "true" ] && echo ' và tự xoá workflow dọn dẹp')"
          git push origin "HEAD:$BRANCH"
          echo "Đã xoá $N_DELETE file workflow thừa$([ "$DELETE_SELF" = "true" ] && echo ", workflow này cũng đã tự xoá")." >> "$GITHUB_STEP_SUMMARY"
