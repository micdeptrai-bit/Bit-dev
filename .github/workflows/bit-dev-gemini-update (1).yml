      - name: Narrow the Automix tempo window (no more fast-forward)
        env:
          TEMPO_PERCENT: ${{ inputs.tempo_percent }}
        run: |
          cat > "$RUNNER_TEMP/tempo_patch.py" <<'TEMPO_EOF'
          #!/usr/bin/env python3
          # Chạy ở thư mục gốc repo, sau khi bản nền đã dựng xong.
          # Automix beatmatch bằng cách đổi tốc độ phát của bài sắp vào: mặc định từ -10% đến +25%, rồi hạ dần về 1x
          # mỗi nhịp, nên nghe như nhạc "tua nhanh". Patch này thu hẹp cửa sổ đó (mặc định +-4%); cặp bài lệch BPM nhiều
          # hơn thì không beatmatch nữa mà rơi về kiểu mix lọc/crossfade có sẵn.
          import os
          import re
          import sys

          ROOT = os.getcwd()


          def path(*parts):
              return os.path.join(ROOT, *parts)


          def once(src, old, new, label):
              n = src.count(old)
              if n != 1:
                  sys.exit(f"::error::Vá '{label}': cần đúng 1 chỗ khớp, thấy {n}. Mã nguồn đã khác bản dùng để viết patch.")
              return src.replace(old, new, 1)


          raw = os.environ.get("TEMPO_PERCENT", "4").strip() or "4"
          try:
              percent = float(raw.replace(",", "."))
          except ValueError:
              sys.exit(f"::error::tempo_percent '{raw}' không phải số.")
          if not 0.0 <= percent <= 10.0:
              sys.exit("::error::tempo_percent phải từ 0 đến 10.")

          low = round(1.0 - percent / 100.0, 4)
          high = round(1.0 + percent / 100.0, 4)
          # Chỉnh nhịp (phase-lock) nhích tối đa thêm một chút; 0 sẽ chia cho 0 trong CrossfadeController nên có sàn 0.5%.
          nudge = max(0.005, round(percent * 0.00375, 4))
          total = round(high + nudge, 4)

          POLICY = path("shared", "src", "commonMain", "kotlin", "com", "music", "bitchord", "playback", "smart", "TransitionPolicy.kt")
          CTRL = path("app", "src", "main", "java", "com", "music", "bitchord", "playback", "CrossfadeController.kt")

          with open(POLICY, encoding="utf8") as f:
              s = f.read()
          if "Bit Dev: tempo window" in s:
              print("Cửa sổ tốc độ đã được vá, bỏ qua.")
          else:
              s = once(
                  s,
                  "const val MIN_INCOMING_RATE = 0.9\nconst val MAX_INCOMING_RATE = 1.25\n",
                  f"// Bit Dev: tempo window narrowed to +-{percent:g}% (was -10% / +25%) so a song never audibly speeds up.\n"
                  f"const val MIN_INCOMING_RATE = {low}\nconst val MAX_INCOMING_RATE = {high}\n",
                  "TransitionPolicy: cửa sổ tốc độ",
              )
              with open(POLICY, "w", encoding="utf8") as f:
                  f.write(s)

              with open(CTRL, encoding="utf8") as f:
                  c = f.read()
              c = once(c, "        const val NUDGE = 0.03f\n", f"        const val NUDGE = {nudge}f\n", "CrossfadeController: NUDGE")
              c = once(
                  c,
                  "        const val MAX_TOTAL_SPEED_UP = 1.12\n",
                  f"        const val MAX_TOTAL_SPEED_UP = {total}\n",
                  "CrossfadeController: MAX_TOTAL_SPEED_UP",
              )
              with open(CTRL, "w", encoding="utf8") as f:
                  f.write(c)

              for p, must in [(POLICY, [f"MAX_INCOMING_RATE = {high}"]), (CTRL, [f"NUDGE = {nudge}f", f"MAX_TOTAL_SPEED_UP = {total}"])]:
                  with open(p, encoding="utf8") as f:
                      t = f.read()
                  for m in must:
                      if m not in t:
                          sys.exit(f"::error::Sau khi vá thiếu '{m}' trong {os.path.basename(p)}")
              print(f"Đã vá tốc độ Automix: bài vào chỉ đổi trong {low}..{high} (+-{percent:g}%), nhích chỉnh nhịp {nudge}, tổng tối đa {total}.")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf8") as f:
                  f.write(
                      "## Automix: hết tua nhanh\n\n"
                      f"- Cửa sổ tốc độ bài vào: {low}..{high} (trước là 0.9..1.25)\n"
                      f"- Chỉnh nhịp tối đa thêm {nudge}, tổng không quá {total} (trước 0.03 và 1.12)\n"
                      "- Cặp bài lệch BPM quá cửa sổ: không beatmatch, dùng kiểu mix lọc/crossfade có sẵn\n"
                  )
          TEMPO_EOF
          python3 "$RUNNER_TEMP/tempo_patch.py"

      - name: Check which repo the app will update from
        run: |
          if [ "${{ github.repository }}" != "micdeptrai-bit/Bit-dev" ]; then
            echo "::warning::Workflow đang chạy trong ${{ github.repository }}, không phải micdeptrai-bit/Bit-dev. App sẽ cập nhật từ repo đang chạy này."
          fi
          echo "Bản mới sẽ đăng lên Releases của ${{ github.repository }}; app Bit Dev tự phát hiện lúc mở app." >> "$GITHUB_STEP_SUMMARY"

      - name: Pick a build number newer than every existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # "Bit Dev APK" dùng run_number của nó làm số bản dựng. Lấy số lớn hơn mọi tag hiện có để versionCode
          # luôn cao hơn bản đang cài, nếu không Android từ chối cài đè (coi là hạ phiên bản).
          LAST="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' 2>/dev/null | grep -oE '[0-9]+$' | sort -n | tail -n 1 || true)"
          N="$GITHUB_RUN_NUMBER"
          if [ -n "$LAST" ] && [ "$LAST" -ge "$N" ]; then N=$((LAST + 1)); fi
          echo "BUILD_N=$N" >> "$GITHUB_ENV"
          echo "Số bản dựng: $N (số lớn nhất trong các tag trước đó: ${LAST:-không có})" >> "$GITHUB_STEP_SUMMARY"

      - name: Patch (rename, version, updater)
        env:
          RUN: ${{ env.BUILD_N }}
        run: |
          sed -i 's/com\.dev\.bitchord/com.bit.dev/g; s/BitChord Dev/Bit Dev/g' \
            app/build.gradle.kts app/src/dev/AndroidManifest.xml wearos/build.gradle.kts tv/build.gradle.kts
          sed -i '/UPDATE_APK_PREFIX/s/BitChord-/Bit-/' app/build.gradle.kts
          sed -i 's#repos/[A-Za-z0-9_-]*/[A-Za-z0-9_-]*/releases/latest#repos/${{ github.repository }}/releases/latest#' \
            app/src/main/java/com/music/bitchord/data/AppUpdateChecker.kt
          python3 - <<'PY'
          import os, re
          run = int(os.environ["RUN"])
          s = open("build.gradle.kts").read()
          m = re.search(r'(?:bitchordVersionName"\] = |baseVersion = )"([0-9.]+)"', s)
          ver = f"{m.group(1)}.{run}"
          s = re.sub(r'extra\["bitchordVersionCode"\][^\n]*', f'extra["bitchordVersionCode"] = {39 + run}', s)
          s = re.sub(r'extra\["bitchordVersionName"\] = [^\n]*(\n    if [^\n]*)?',
                     f'extra["bitchordVersionName"] = "{ver}"', s)
          open("build.gradle.kts", "w").write(s)
          open(os.environ["GITHUB_ENV"], "a").write(f"VER={ver}\n")
          PY

      # Neu repo co secret thi dung secret, khong thi dung key dev nhung san ben duoi.

      - name: Setup Secrets (Keystore & local.properties)
        env:
          S_LASTFM_KEY: ${{ secrets.LASTFM_API_KEY }}
          S_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          S_LISTEN: ${{ secrets.LISTEN_TOGETHER_SERVER }}
          S_KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "LASTFM_API_KEY=$S_LASTFM_KEY"
            echo "LASTFM_SECRET=$S_LASTFM_SECRET"
            echo "LISTEN_TOGETHER_SERVER=$S_LISTEN"
          } > local.properties
          KS_B64="$S_KS_B64"; KS_PASS="$S_KS_PASS"; KEY_ALIAS="$S_KEY_ALIAS"; KEY_PASS="$S_KEY_PASS"
          if [ -z "$KS_B64" ]; then
            KS_B64=''
            KS_PASS='M8rnSCC3C4TkChAh'
            KEY_ALIAS='bitdev'
            KEY_PASS='M8rnSCC3C4TkChAh'
          fi
          echo "$KS_B64" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - run: chmod +x gradlew
      - name: Pre-fetch libusb (GitHub release downloads keep returning 504)
        run: |
          # CMake tai libusb 1.0.27 tu trang release cua GitHub luc cau hinh, va trang do dang tra 504.
          # Thu lan luot: GitHub, SourceForge, kho goi Debian (cung mot file, kiem tra bang ma bam SHA256 ma
          # CMakeLists da ghim). Het cach thi git clone dung tag v1.0.27 va dong goi lai (khi do bo dong ghim ma bam).
          D="$HOME/libusb-cache"
          F="$D/libusb-1.0.27.tar.bz2"
          SHA="ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575"
          GH="https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2"
          CM=app/src/main/cpp/CMakeLists.txt
          mkdir -p "$D"
          OK=0
          for round in 1 2; do
            for U in "$GH" \
                     "https://downloads.sourceforge.net/project/libusb/libusb-1.0/libusb-1.0.27/libusb-1.0.27.tar.bz2" \
                     "https://deb.debian.org/debian/pool/main/libu/libusb-1.0/libusb-1.0_1.0.27.orig.tar.bz2"; do
              if curl -fsSL --retry 2 --retry-delay 3 --max-time 120 -o "$F" "$U" \
                 && echo "$SHA  $F" | sha256sum -c - > /dev/null 2>&1; then
                echo "Da tai libusb tu: $U"
                OK=1
                break 2
              fi
              echo "Khong tai duoc (hoac sai ma bam) tu: $U"
              rm -f "$F"
            done
            sleep 15
          done
          if [ "$OK" = 1 ]; then
            sed -i "s#$GH#file://$F#" "$CM"
          else
            echo "Ca ba nguon tai deu hong, thu git clone tag v1.0.27"
            for i in 1 2 3; do
              rm -rf "$D/libusb-1.0.27"
              if git clone --depth 1 --branch v1.0.27 https://github.com/libusb/libusb.git "$D/libusb-1.0.27"; then
                rm -rf "$D/libusb-1.0.27/.git"
                tar -C "$D" -cjf "$D/libusb-git.tar.bz2" libusb-1.0.27
                # Ban dong goi lai khong cung ma bam voi ban phat hanh, nen bo dong ghim ma bam.
                sed -i "s#$GH#file://$D/libusb-git.tar.bz2#; s#URL_HASH SHA256=$SHA)#)#" "$CM"
                echo "Da dung libusb tu git clone"
                break
              fi
              sleep 20
            done
          fi
          sed -n '/FetchContent_Declare(libusb/,/FetchContent_MakeAvailable(libusb)/p' "$CM"

      - name: Build the dev release APK (thu lai khi GitHub tra loi loi tam thoi)
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleDevRelease; then
              exit 0
            fi
            echo "Build attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: Upload the APK (chỉ khi bật keep_apk_artifact)
        if: ${{ inputs.keep_apk_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: bit-dev-gemini-arm64
          path: app/build/outputs/apk/dev/release/*.apk
          if-no-files-found: error

      - name: Check the APK updates the installed app (same package, same signature, higher version)
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT="$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -n 1)"
          APK="$(ls app/build/outputs/apk/dev/release/*.apk | head -n 1)"
          if [ -z "$BT" ] || [ ! -x "$BT/aapt2" ] || [ ! -x "$BT/apksigner" ]; then
            echo "::warning::Không thấy aapt2/apksigner trên runner, bỏ qua bước kiểm tra cập nhật đè."
            exit 0
          fi
          info() { # $1 = apk -> "package versionCode sha256"
            local line pkg code sha
            line="$("$BT/aapt2" dump badging "$1" | grep -m1 '^package:')"
            pkg="$(echo "$line" | sed -E "s/.*name='([^']+)'.*/\1/")"
            code="$(echo "$line" | sed -E "s/.*versionCode='([0-9]+)'.*/\1/")"
            sha="$("$BT/apksigner" verify --print-certs "$1" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
            echo "$pkg $code $sha"
          }
          read -r NEW_PKG NEW_CODE NEW_SHA <<< "$(info "$APK")"
          echo "APK mới: package=$NEW_PKG versionCode=$NEW_CODE chữ ký=${NEW_SHA:0:16}..."
          {
            echo "## Kiểm tra cập nhật đè"
            echo
            echo "- APK mới: package \`$NEW_PKG\`, versionCode \`$NEW_CODE\`, chữ ký SHA-256 \`${NEW_SHA:0:16}...\`"
          } >> "$GITHUB_STEP_SUMMARY"
          PREV_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            echo "Chưa có bản nào trên Releases, không có gì để so sánh." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p prev
          if ! gh release download "$PREV_TAG" --pattern 'Bit-*.apk' --dir prev --clobber 2>/dev/null || ! ls prev/*.apk >/dev/null 2>&1; then
            echo "::warning::Không tải được APK của $PREV_TAG để so sánh, bỏ qua."
            exit 0
          fi
          read -r OLD_PKG OLD_CODE OLD_SHA <<< "$(info "$(ls prev/*.apk | head -n 1)")"
          echo "Bản trước ($PREV_TAG): package=$OLD_PKG versionCode=$OLD_CODE chữ ký=${OLD_SHA:0:16}..."
          echo "- Bản trước \`$PREV_TAG\`: package \`$OLD_PKG\`, versionCode \`$OLD_CODE\`, chữ ký \`${OLD_SHA:0:16}...\`" >> "$GITHUB_STEP_SUMMARY"
          FAIL=0
          if [ "$NEW_PKG" != "$OLD_PKG" ]; then
            echo "::error::Khác package ($NEW_PKG so với $OLD_PKG): Android sẽ coi đây là app MỚI, không cập nhật đè."; FAIL=1
          fi
          if [ "$NEW_SHA" != "$OLD_SHA" ]; then
            echo "::error::Khác chữ ký: Android sẽ từ chối cài đè lên bản cũ."; FAIL=1
          fi
          if [ "$NEW_CODE" -le "$OLD_CODE" ]; then
            echo "::error::versionCode $NEW_CODE không lớn hơn $OLD_CODE: Android coi là hạ phiên bản và từ chối."; FAIL=1
          fi
          if [ "$FAIL" = 1 ]; then
            echo "- KẾT QUẢ: SAI, đã dừng, không đăng bản này." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- KẾT QUẢ: ĐÚNG, cùng package, cùng chữ ký, versionCode tăng ($OLD_CODE -> $NEW_CODE). Cài đè được." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/dev/release/*.apk | head -1)
          # Tên file phải bắt đầu bằng UPDATE_APK_PREFIX ("Bit-") thì hộp thoại cập nhật trong app mới nhận.
          cp "$APK" "Bit-v${VER}_arm64-v8a.apk"
          gh release delete "v${VER}" --cleanup-tag --yes || true
          gh release create "v${VER}" "Bit-v${VER}_arm64-v8a.apk" \
            --target "$GITHUB_SHA" --latest --title "Bit Dev v${VER}" \
            --notes "Build #${{ github.run_number }}: Gemini hiện token đã dùng và giới hạn token mỗi ngày, chọn dịch bằng AI hay Google Dịch, AI lỗi thì có nút Google Dịch riêng trên phần lời, Automix không còn tăng giảm tốc độ nhiều khi chuyển bài. Cùng app Bit Dev (com.bit.dev), cập nhật ngay trong app, không cần tải APK. Cài đặt, Dịch lời bằng Gemini, dán mã API."
          echo "Đã đăng lên Releases: v${VER}. Mở app Bit Dev để nhận cập nhật ngay trong app." >> "$GITHUB_STEP_SUMMARY"
