          import android.content.Context
          import android.content.SharedPreferences
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow

          /**
           * What the Gemini lyric translation has cost so far, counted from the usageMetadata of every reply, plus the two
           * choices that sit next to it: AI or Google Translate, and an optional daily token cap.
           *
           * Google does not expose the real quota through the API, so these numbers are this app's own count, per device and
           * per local day. The cap is soft: a song already being translated is allowed to finish.
           */
          object GeminiUsageStore {
              data class Usage(
                  val day: String = "",
                  val todayPrompt: Long = 0L,
                  val todayTotal: Long = 0L,
                  val todayRequests: Int = 0,
                  val allPrompt: Long = 0L,
                  val allTotal: Long = 0L,
                  val allRequests: Long = 0L,
                  val lastTotal: Long = 0L,
                  /** Tokens per day the listener allows; 0 for no cap. */
                  val dailyLimit: Long = 0L,
                  /** True: the AI translates (and a separate Google button shows when it fails). False: Google Translate only. */
                  val useAi: Boolean = true,
              ) {
                  val todayOutput: Long get() = (todayTotal - todayPrompt).coerceAtLeast(0L)
                  val allOutput: Long get() = (allTotal - allPrompt).coerceAtLeast(0L)
                  val limitReached: Boolean get() = dailyLimit > 0L && todayTotal >= dailyLimit
              }

              private const val PREFS = "gemini_usage"
              private const val K_DAY = "day"
              private const val K_TODAY_PROMPT = "today_prompt"
              private const val K_TODAY_TOTAL = "today_total"
              private const val K_TODAY_REQUESTS = "today_requests"
              private const val K_ALL_PROMPT = "all_prompt"
              private const val K_ALL_TOTAL = "all_total"
              private const val K_ALL_REQUESTS = "all_requests"
              private const val K_LAST_TOTAL = "last_total"
              private const val K_LIMIT = "daily_limit"
              private const val K_USE_AI = "use_ai"

              private var prefs: SharedPreferences? = null
              private val state = MutableStateFlow(Usage())
              val usage: StateFlow<Usage> = state

              @Synchronized
              fun init(context: Context) {
                  val p = context.applicationContext.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  prefs = p
                  state.value = rolled(
                      Usage(
                          day = p.getString(K_DAY, "").orEmpty(),
                          todayPrompt = p.getLong(K_TODAY_PROMPT, 0L),
                          todayTotal = p.getLong(K_TODAY_TOTAL, 0L),
                          todayRequests = p.getInt(K_TODAY_REQUESTS, 0),
                          allPrompt = p.getLong(K_ALL_PROMPT, 0L),
                          allTotal = p.getLong(K_ALL_TOTAL, 0L),
                          allRequests = p.getLong(K_ALL_REQUESTS, 0L),
                          lastTotal = p.getLong(K_LAST_TOTAL, 0L),
                          dailyLimit = p.getLong(K_LIMIT, 0L),
                          useAi = p.getBoolean(K_USE_AI, true),
                      ),
                  )
              }

              /** One Gemini reply: [promptTokens] went in, [totalTokens] is everything it cost (answer and thinking included). */
              @Synchronized
              fun record(promptTokens: Long, totalTokens: Long) {
                  val u = rolled(state.value)
                  store(
                      u.copy(
                          todayPrompt = u.todayPrompt + promptTokens,
                          todayTotal = u.todayTotal + totalTokens,
                          todayRequests = u.todayRequests + 1,
                          allPrompt = u.allPrompt + promptTokens,
                          allTotal = u.allTotal + totalTokens,
                          allRequests = u.allRequests + 1L,
                          lastTotal = totalTokens,
                      ),
                  )
              }

              @Synchronized
              fun resetUsage() {
                  store(
                      rolled(state.value).copy(
                          todayPrompt = 0L,
                          todayTotal = 0L,
                          todayRequests = 0,
                          allPrompt = 0L,
                          allTotal = 0L,
                          allRequests = 0L,
                          lastTotal = 0L,
                      ),
                  )
              }

              @Synchronized
              fun setDailyLimit(limit: Long) {
                  store(rolled(state.value).copy(dailyLimit = limit.coerceAtLeast(0L)))
              }

              @Synchronized
              fun setUseAi(useAi: Boolean) {
                  store(rolled(state.value).copy(useAi = useAi))
              }

              /** False once today's tokens have reached the daily cap. A new day starts the count again. */
              @Synchronized
              fun budgetLeft(): Boolean {
                  val u = rolled(state.value)
                  if (u != state.value) state.value = u
                  return !u.limitReached
              }

              /** 950 -> "950", 12 345 -> "12.3K", 1 250 000 -> "1.25M". */
              fun format(tokens: Long): String = when {
                  tokens < 1_000L -> tokens.toString()
                  tokens < 1_000_000L -> String.format(Locale.US, "%.1fK", tokens / 1_000.0)
                  else -> String.format(Locale.US, "%.2fM", tokens / 1_000_000.0)
              }

              private fun rolled(u: Usage): Usage {
                  val today = today()
                  return if (u.day == today) u else u.copy(day = today, todayPrompt = 0L, todayTotal = 0L, todayRequests = 0)
              }

              private fun store(u: Usage) {
                  state.value = u
                  prefs?.edit()
                      ?.putString(K_DAY, u.day)
                      ?.putLong(K_TODAY_PROMPT, u.todayPrompt)
                      ?.putLong(K_TODAY_TOTAL, u.todayTotal)
                      ?.putInt(K_TODAY_REQUESTS, u.todayRequests)
                      ?.putLong(K_ALL_PROMPT, u.allPrompt)
                      ?.putLong(K_ALL_TOTAL, u.allTotal)
                      ?.putLong(K_ALL_REQUESTS, u.allRequests)
                      ?.putLong(K_LAST_TOTAL, u.lastTotal)
                      ?.putLong(K_LIMIT, u.dailyLimit)
                      ?.putBoolean(K_USE_AI, u.useAi)
                      ?.apply()
              }

              private fun today(): String = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
          }
          '''
