      - name: Apply the patch
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/automix-stems.patch"
          if git apply --reverse --check "$P" 2>/dev/null; then
            echo "::notice::Patch đã có sẵn trong nhánh này, bỏ qua bước áp."
            echo "APPLIED=already" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! git apply --check "$P"; then
            echo "::error::Patch không áp được lên nhánh này (file đã bị sửa khác bản gốc). Chạy trên bản main gốc, hoặc gỡ các thay đổi xung đột."
            exit 1
          fi
          git apply "$P"
          echo "APPLIED=yes" >> "$GITHUB_ENV"
          git apply --stat "$P"
          {
            echo "## Automix stem separation"
            echo
            echo "Đã áp patch:"
            echo
            git diff --stat | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the patch locally
        if: ${{ env.APPLIED == 'yes' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- native shared app
          git commit -m "Automix: separate vocals and instrumental stems with the open-unmix model"

      - name: Native self-test (stem separation core)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -I native \
            native/analyzer/tests/stem_separation_test.cpp \
            native/analyzer/stem_separation.cpp \
            native/analyzer/vocal_spectrogram.cpp \
            -o "$RUNNER_TEMP/stem_test"
          "$RUNNER_TEMP/stem_test" | tee "$RUNNER_TEMP/stem_test.log"
          {
            echo "### Stem separation self-test"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/stem_test.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=" > local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=" >> local.properties

      - run: chmod +x gradlew

      - name: Shared tests
        if: ${{ inputs.run_tests }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest 2>&1 | tee build.log

      - name: Build the release-like dev APK
        if: ${{ inputs.build_apk }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDevBenchmark 2>&1 | tee -a build.log

      - name: Upload the arm64 APK
        if: ${{ inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-automix-stems-arm64
          path: app/build/outputs/apk/dev/benchmark/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload the test reports
        if: ${{ always() && inputs.run_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-reports
          path: shared/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload the build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Push the patched code to a branch
        if: ${{ inputs.push_branch && env.APPLIED == 'yes' }}
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin "HEAD:refs/heads/${FIX_BRANCH}"
          echo "Đã đẩy sang nhánh \`${FIX_BRANCH}\`. Mở PR từ nhánh đó vào ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
