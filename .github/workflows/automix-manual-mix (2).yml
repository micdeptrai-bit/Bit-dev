          -                    end = (plan.transitionEnd * 1000.0 / duration).toFloat().coerceIn(0f, 1f),
          +                AppSettings.smartTransitionWindow.value = markerWindow(
          +                    (plan.transitionStart * 1000.0 / duration).toFloat().coerceIn(0f, 1f),
          +                    (plan.transitionEnd * 1000.0 / duration).toFloat().coerceIn(0f, 1f),
          +                    plan, duration, currentItem, nextItem, pairOverride,
                           )
                           if (markerOnly) return
                           plannedTransition = currentItem.mediaId to takeoverMs
          @@ -1192,9 +1213,10 @@ class CrossfadeController(
                   )?.let { blend ->
                       if (nextStreamReady(nextItem)) {
                           val takeoverMs = (blend.takeover * 1000).roundToLong()
          -                AppSettings.smartTransitionWindow.value = TransitionWindow(
          -                    start = (plan.transitionStart * 1000.0 / duration).toFloat().coerceIn(0f, 1f),
          -                    end = (plan.transitionEnd * 1000.0 / duration).toFloat().coerceIn(0f, 1f),
          +                AppSettings.smartTransitionWindow.value = markerWindow(
          +                    (plan.transitionStart * 1000.0 / duration).toFloat().coerceIn(0f, 1f),
          +                    (plan.transitionEnd * 1000.0 / duration).toFloat().coerceIn(0f, 1f),
          +                    plan, duration, currentItem, nextItem, pairOverride,
                           )
                           if (markerOnly) return
                           plannedTransition = currentItem.mediaId to takeoverMs
          @@ -1235,8 +1257,10 @@ class CrossfadeController(
                   val markable = !plan.blocked &&
                       plan.markerVisible &&
                       duration > 0L &&
          -            analysisState.current == TrackAnalysisState.ANALYSED &&
          -            analysisState.next in MEASURED_ENOUGH_TO_ENTER_ON &&
          +            // No longer waits for the songs to be analysed: a listener who wants to place the mix by hand
          +            // cannot do it from a marker that only appears once the analysis has finished, and a song whose
          +            // analysis never finishes would never get one. Before the analysis lands the window is the plain
          +            // fade's, at the end of the song, and it moves to the analysed one when it does.
                       // Last, because it is the only one that can read the cache.
