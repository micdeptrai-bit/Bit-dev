      - name: Write the stem separation patch
        if: ${{ inputs.stem_separation }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/automix-stems.patch" <<'PATCH_EOF'
          diff --git a/native/analyzer/stem_separation.h b/native/analyzer/stem_separation.h
          new file mode 100644
          --- /dev/null
          +++ b/native/analyzer/stem_separation.h
          @@ -0,0 +1,37 @@
          +// Turns the open-unmix "vocals" magnitude estimate into an actual vocal signal.
          +//
          +// vocal_spectrogram.h feeds the model the magnitude STFT of the mix; the model
          +// answers with the magnitude of the vocals. A magnitude is not audio, so this
          +// takes the mix's *complex* STFT (same settings, same padding), scales every
          +// bin by the ratio mask target / mix, and inverts it. The instrumental is what
          +// is left: mix - vocals, formed by the caller, which makes the two sum back to
          +// the original exactly instead of to whatever a second model would guess.
          +//
          +// Same constants as the front end because they are the network's, not ours.
          +// Planar stereo Float32 in, at kVocalSpectrogramSampleRate; the caller owns
          +// resampling. Reentrant, allocates, O(n log n): a worker thread's job.
          +
          +#pragma once
          +
          +#include <cstddef>
          +#include <vector>
          +
          +#include "vocal_spectrogram.h"
          +
          +namespace bitchord::smart {
          +
          +// `target` is the model's output tensor, [channel][bin][target_stride], i.e.
          +// bin-major with `target_stride` frames per bin (the model's fixed width, which
          +// is at least the number of frames the input produced). Returns the vocals as
          +// planar stereo, the same length as the input; empty on any mismatch.
          +std::vector<std::vector<float>> ExtractVocals(
          +  const std::vector<std::vector<float>>& channels,
          +  const float* target,
          +  size_t target_stride
          +);
          +
          +// The mask applied to one bin: how much of the mix the model says is vocal.
          +// Exposed so the test can pin the exact rule.
          +float VocalMask(float target_magnitude, float mix_magnitude);
          +
          +}  // namespace bitchord::smart
          diff --git a/native/analyzer/stem_separation.cpp b/native/analyzer/stem_separation.cpp
          new file mode 100644
          --- /dev/null
          +++ b/native/analyzer/stem_separation.cpp
          @@ -0,0 +1,140 @@
          +#include "stem_separation.h"
          +
          +#include <algorithm>
          +#include <cmath>
          +#include <complex>
          +
          +namespace bitchord::smart {
          +namespace {
          +
          +constexpr double kPi = 3.14159265358979323846;
          +using Complex = std::complex<double>;
          +
          +// Unnormalized in-place radix-2 FFT, forward (negative exponent). Each
          +// translation unit in this directory carries its own copy.
          +void Fft(std::vector<Complex>& values) {
          +  const size_t size = values.size();
          +  for (size_t index = 1, swapped = 0; index < size; ++index) {
          +    size_t bit = size >> 1;
          +    for (; swapped & bit; bit >>= 1) swapped ^= bit;
          +    swapped ^= bit;
          +    if (index < swapped) std::swap(values[index], values[swapped]);
          +  }
          +  for (size_t length = 2; length <= size; length <<= 1) {
          +    const Complex root = std::polar(1.0, -2.0 * kPi / length);
          +    for (size_t start = 0; start < size; start += length) {
          +      Complex weight(1, 0);
          +      for (size_t offset = 0; offset < length / 2; ++offset) {
          +        const auto even = values[start + offset];
          +        const auto odd = values[start + offset + length / 2] * weight;
          +        values[start + offset] = even + odd;
          +        values[start + offset + length / 2] = even - odd;
          +        weight *= root;
          +      }
          +    }
          +  }
          +}
          +
          +// Periodic Hann, torch.hann_window(periodic=True): same as the front end.
          +std::vector<double> HannWindow(size_t size) {
          +  std::vector<double> window(size);
          +  for (size_t index = 0; index < size; ++index) {
          +    window[index] = 0.5 - 0.5 * std::cos(2.0 * kPi * static_cast<double>(index) / size);
          +  }
          +  return window;
          +}
          +
          +// Reflect padding, exactly as ComputeVocalSpectrogram does it.
          +std::vector<float> ReflectPad(const std::vector<float>& in, size_t pad) {
          +  const size_t n = in.size();
          +  std::vector<float> out;
          +  out.reserve(n + 2 * pad);
          +  for (size_t index = pad; index >= 1; --index) out.push_back(in[index]);
          +  out.insert(out.end(), in.begin(), in.end());
          +  for (size_t index = 1; index <= pad; ++index) out.push_back(in[n - 1 - index]);
          +  return out;
          +}
          +
          +}  // namespace
          +
          +float VocalMask(float target_magnitude, float mix_magnitude) {
          +  // A bin with no energy has no vocal to keep, and dividing by it would turn
          +  // quantisation noise in the model's output into a full-scale mask.
          +  if (mix_magnitude <= 1e-6f) return 0.0f;
          +  return std::min(1.0f, std::max(0.0f, target_magnitude / mix_magnitude));
          +}
          +
          +std::vector<std::vector<float>> ExtractVocals(
          +  const std::vector<std::vector<float>>& channels,
          +  const float* target,
          +  size_t target_stride
          +) {
          +  constexpr size_t kFft = kVocalSpectrogramFft;
          +  constexpr size_t kHop = kVocalSpectrogramHop;
          +  constexpr size_t kBins = kVocalSpectrogramBins;
          +  constexpr size_t kPad = kFft / 2;
          +
          +  if (target == nullptr) return {};
          +  if (channels.size() != kVocalSpectrogramChannels) return {};
          +  const size_t length = channels.front().size();
          +  if (channels[1].size() != length) return {};
          +  if (length <= kPad + 1) return {};
          +
          +  const size_t padded_length = length + 2 * kPad;
          +  const size_t frames = (padded_length - kFft) / kHop + 1;
          +  // The model's output carries at least the frames the input produced.
          +  if (frames > target_stride) return {};
          +
          +  const auto window = HannWindow(kFft);
          +  std::vector<std::vector<float>> vocals(kVocalSpectrogramChannels);
          +  std::vector<Complex> spectrum(kFft);
          +
          +  for (size_t channel = 0; channel < kVocalSpectrogramChannels; ++channel) {
          +    const std::vector<float> padded = ReflectPad(channels[channel], kPad);
          +    // Overlap-add accumulators: the signal, and the squared window it was
          +    // weighted by, so the edges (where fewer frames overlap) still come out at
          +    // the right level.
          +    std::vector<double> signal(padded_length, 0.0);
          +    std::vector<double> weight(padded_length, 0.0);
          +    const size_t channel_base = channel * kBins * target_stride;
          +
          +    for (size_t frame = 0; frame < frames; ++frame) {
          +      const size_t start = frame * kHop;
          +      for (size_t index = 0; index < kFft; ++index) {
          +        spectrum[index] = Complex(padded[start + index] * window[index], 0.0);
          +      }
          +      Fft(spectrum);
          +
          +      // Mask the positive half, mirror it as the conjugate: the vocal of a
          +      // real signal is real.
          +      for (size_t bin = 0; bin < kBins; ++bin) {
          +        const float mix = static_cast<float>(std::abs(spectrum[bin]));
          +        const float estimate = target[channel_base + bin * target_stride + frame];
          +        spectrum[bin] *= static_cast<double>(VocalMask(estimate, mix));
          +      }
          +      for (size_t bin = 1; bin < kFft / 2; ++bin) {
          +        spectrum[kFft - bin] = std::conj(spectrum[bin]);
          +      }
          +
          +      // Inverse FFT through the forward one: ifft(x) = conj(fft(conj(x))) / n.
          +      for (auto& value : spectrum) value = std::conj(value);
          +      Fft(spectrum);
          +
          +      for (size_t index = 0; index < kFft; ++index) {
          +        const double sample = std::conj(spectrum[index]).real() / static_cast<double>(kFft);
          +        signal[start + index] += sample * window[index];
          +        weight[start + index] += window[index] * window[index];
          +      }
          +    }
          +
          +    auto& out = vocals[channel];
          +    out.resize(length);
          +    for (size_t index = 0; index < length; ++index) {
          +      const double w = weight[kPad + index];
          +      out[index] = w > 1e-8 ? static_cast<float>(signal[kPad + index] / w) : 0.0f;
          +    }
          +  }
          +  return vocals;
          +}
          +
          +}  // namespace bitchord::smart
          diff --git a/native/analyzer/tests/stem_separation_test.cpp b/native/analyzer/tests/stem_separation_test.cpp
          new file mode 100644
          --- /dev/null
          +++ b/native/analyzer/tests/stem_separation_test.cpp
          @@ -0,0 +1,92 @@
          +// Host self-test for the stem separation core (no Android, no model needed).
          +//
          +//   g++ -std=c++17 -O2 -I native native/analyzer/tests/stem_separation_test.cpp
          +//       native/analyzer/stem_separation.cpp native/analyzer/vocal_spectrogram.cpp
          +//       -o stem_test && ./stem_test  (one command; wrapped here for width)
          +//
          +// The properties that make the stems trustworthy whatever the model says:
          +//   1. a mask of 1 everywhere gives the mix back (the STFT/ISTFT pair is exact),
          +//   2. a mask of 0 gives silence,
          +//   3. a flat mask of 0.5 gives exactly half the mix (the mask really scales the signal),
          +//   4. the model's output being wider than the input (its fixed width) is handled.
          +
          +#include <cmath>
          +#include <cstdio>
          +#include <vector>
          +
          +#include "analyzer/stem_separation.h"
          +
          +using namespace bitchord::smart;
          +
          +namespace {
          +
          +int failures = 0;
          +
          +void Check(bool ok, const char* what, double value) {
          +  std::printf("%s %-58s %.3g\n", ok ? "PASS" : "FAIL", what, value);
          +  if (!ok) ++failures;
          +}
          +
          +double MaxAbsDiff(const std::vector<float>& a, const std::vector<float>& b, float scale) {
          +  double worst = 0;
          +  for (size_t i = 0; i < a.size(); ++i) {
          +    worst = std::max(worst, std::abs(static_cast<double>(a[i]) - scale * static_cast<double>(b[i])));
          +  }
