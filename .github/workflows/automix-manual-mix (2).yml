          +        }
                   if (loop != null && nextStreamReady(nextItem)) {
                       val loopStartMs = (loop.out.loopStart * 1000).roundToLong()
          -            AppSettings.smartTransitionWindow.value = TransitionWindow(
          -                start = (loopStartMs.toFloat() / duration).coerceIn(0f, 1f),
          -                end = 1f,
          +            AppSettings.smartTransitionWindow.value = markerWindow(
          +                (loopStartMs.toFloat() / duration).coerceIn(0f, 1f), 1f, plan, duration, currentItem, nextItem, pairOverride,
                       )
                       if (markerOnly) return
                       plannedTransition = currentItem.mediaId to loopStartMs
          @@ -1170,9 +1190,10 @@ class CrossfadeController(
                   )?.let { overlap ->
                       if (nextStreamReady(nextItem)) {
                           val takeoverMs = (overlap.takeover * 1000).roundToLong()
          -                AppSettings.smartTransitionWindow.value = TransitionWindow(
