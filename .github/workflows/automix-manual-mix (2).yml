          new file mode 100644
          index 0000000..bb040ac
          --- /dev/null
          +++ b/native/loopmix/tests/stem_mix_test.cpp
          @@ -0,0 +1,151 @@
          +// Host test for the stem split in the mix engine's deck: a deck given its region's vocals and a vocal gain
          +// plays the song as recorded at gain 1 and the instrumental alone at gain 0. Measured on two tones, an
          +// "instrument" and a "voice", through a real deck. Built and run by the workflow.
          +#include <algorithm>
          +#include <cmath>
          +#include <cstdio>
          +#include <vector>
          +
          +#include "loopmix/loop_mix_renderer.h"
          +
          +using bitchord::loopmix::Deck;
          +using bitchord::loopmix::Renderer;
          +
          +namespace {
          +
          +constexpr int kRate = 48000;
          +constexpr double kPi = 3.14159265358979323846;
          +constexpr double kInstrumentHz = 220.0;
          +constexpr double kVoiceHz = 1760.0;
          +constexpr double kSeconds = 8.0;
          +
          +std::vector<float> tone(double hz, double seconds, float amplitude) {
          +  std::vector<float> out(size_t(seconds * kRate));
          +  for (size_t i = 0; i < out.size(); ++i) out[i] = amplitude * float(std::sin(2 * kPi * hz * double(i) / kRate));
          +  return out;
          +}
          +
          +struct Source {
          +  std::vector<float> mix, voice;
          +};
          +
          +Source source() {
          +  Source s;
          +  s.mix = tone(kInstrumentHz, kSeconds + 1.0, 0.3f);
          +  s.voice = tone(kVoiceHz, kSeconds + 1.0, 0.3f);
          +  for (size_t i = 0; i < s.mix.size(); ++i) s.mix[i] += s.voice[i];
          +  return s;
          +}
          +
          +void play(Deck& deck, const std::vector<float>& samples) {
          +  deck.left = samples;
          +  deck.right = samples;
          +  deck.regionStart = 0;
          +  deck.loopStart = 0;
          +  deck.loopEnd = 0;
          +  deck.releaseAt = 1e18;
          +  deck.knotTimes = {0.0, kSeconds * kRate};
          +  deck.knotPositions = {0.0, kSeconds * kRate};
          +  deck.runOn = false;
          +  deck.stopAt = kSeconds;
          +  deck.preroll = 0.4;
          +  deck.level = 1.f;
          +}
          +
          +std::vector<float> render(Renderer& renderer) {
          +  renderer.prepare();
          +  std::vector<float> interleaved(2 * 1024), left;
          +  const int64_t first = renderer.firstFrame();
          +  for (int64_t frame = first; frame < int64_t(kSeconds * kRate); frame += 1024) {
          +    renderer.render(frame, interleaved.data(), 1024);
          +    for (int i = 0; i < 1024; ++i) left.push_back(interleaved[2 * i]);
          +  }
          +  return std::vector<float>(left.begin() + std::min<int64_t>(-first, left.size()), left.end());
          +}
          +
          +/** The amplitude of a [hz] tone in x over [from, to) seconds (one-bin DFT). */
          +double amplitude(const std::vector<float>& x, double hz, double from, double to) {
          +  const size_t a = size_t(from * kRate), b = std::min(x.size(), size_t(to * kRate));
          +  double re = 0, im = 0;
          +  for (size_t i = a; i < b; ++i) {
          +    const double phase = 2 * kPi * hz * double(i) / kRate;
          +    re += x[i] * std::cos(phase);
          +    im += x[i] * std::sin(phase);
          +  }
          +  return 2 * std::sqrt(re * re + im * im) / double(std::max<size_t>(1, b - a));
          +}
          +
          +double db(double value, double reference) { return 20 * std::log10(std::max(value, 1e-9) / reference); }
          +
          +void gainRamp(bitchord::loopmix::Envelope& e, double t0, float v0, double t1, float v1) {
          +  e.times = {t0, t1};
          +  e.values = {v0, v1};
          +}
          +
          +std::vector<float> run(const Source& s, bool split, double t0, float v0, double t1, float v1) {
          +  Renderer renderer(kRate);
          +  play(renderer.deck(0), s.mix);
          +  if (split) {
          +    renderer.deck(0).vocalLeft = s.voice;
          +    renderer.deck(0).vocalRight = s.voice;
          +    gainRamp(renderer.deck(0).vocalGain, t0, v0, t1, v1);
          +  }
          +  return render(renderer);
          +}
          +
          +}  // namespace
          +
          +int main() {
          +  int failures = 0;
          +  auto expect = [&](bool ok, const char* what, double value) {
          +    std::printf("%s  %-66s %8.2f\n", ok ? "ok  " : "FAIL", what, value);
          +    if (!ok) ++failures;
          +  };
          +  const Source s = source();
          +
          +  // Reference: no stems. Both tones come through at 0.3.
          +  const auto plain = run(s, false, 0, 1.f, 0, 1.f);
          +  const double voice0 = amplitude(plain, kVoiceHz, 1.0, 2.0);
          +  const double band0 = amplitude(plain, kInstrumentHz, 1.0, 2.0);
          +  expect(std::fabs(db(voice0, 0.3)) < 1.0, "plain deck: the voice tone is at 0.3 (dB off)", db(voice0, 0.3));
          +
          +  // Gain 1 throughout: transparent.
          +  const auto full = run(s, true, 0, 1.f, 100, 1.f);
          +  expect(std::fabs(db(amplitude(full, kVoiceHz, 1.0, 2.0), voice0)) < 0.1, "vocal gain 1: the voice is untouched (dB)",
          +         db(amplitude(full, kVoiceHz, 1.0, 2.0), voice0));
          +  expect(std::fabs(db(amplitude(full, kInstrumentHz, 1.0, 2.0), band0)) < 0.1, "vocal gain 1: the instrument is untouched (dB)",
          +         db(amplitude(full, kInstrumentHz, 1.0, 2.0), band0));
          +
          +  // Gain 1 -> 0 over 3..5 s: the voice leaves, the instrument stays.
          +  const auto leaving = run(s, true, 3.0, 1.f, 5.0, 0.f);
          +  const double early = amplitude(leaving, kVoiceHz, 1.0, 2.0);
          +  const double mid = amplitude(leaving, kVoiceHz, 3.9, 4.1);
          +  const double late = amplitude(leaving, kVoiceHz, 6.0, 7.0);
          +  expect(std::fabs(db(early, voice0)) < 0.1, "leaving: before the ramp the voice is whole (dB)", db(early, voice0));
          +  expect(std::fabs(db(mid, voice0) + 6.0) < 1.5, "leaving: halfway through the ramp the voice is at half (dB)", db(mid, voice0));
          +  expect(db(late, voice0) < -40.0, "leaving: after the ramp the voice is gone (dB)", db(late, voice0));
          +  expect(std::fabs(db(amplitude(leaving, kInstrumentHz, 6.0, 7.0), band0)) < 0.3, "leaving: the instrument is untouched at the end (dB)",
          +         db(amplitude(leaving, kInstrumentHz, 6.0, 7.0), band0));
          +
          +  // Gain 0 -> 1 over 4..6 s: the voice is absent, then comes in.
          +  const auto entering = run(s, true, 4.0, 0.f, 6.0, 1.f);
          +  expect(db(amplitude(entering, kVoiceHz, 1.0, 2.0), voice0) < -40.0, "entering: the voice is absent at the start (dB)",
          +         db(amplitude(entering, kVoiceHz, 1.0, 2.0), voice0));
          +  expect(std::fabs(db(amplitude(entering, kVoiceHz, 6.5, 7.5), voice0)) < 0.2, "entering: the voice is whole at the end (dB)",
          +         db(amplitude(entering, kVoiceHz, 6.5, 7.5), voice0));
          +  expect(std::fabs(db(amplitude(entering, kInstrumentHz, 1.0, 2.0), band0)) < 0.3, "entering: the instrument plays from the start (dB)",
          +         db(amplitude(entering, kInstrumentHz, 1.0, 2.0), band0));
          +
          +  // Vocals of the wrong length are ignored rather than read out of bounds.
          +  Renderer odd(kRate);
          +  play(odd.deck(0), s.mix);
          +  odd.deck(0).vocalLeft.assign(1000, 0.1f);
          +  odd.deck(0).vocalRight.assign(1000, 0.1f);
          +  gainRamp(odd.deck(0).vocalGain, 0, 0.f, 1, 0.f);
          +  const auto oddOut = render(odd);
          +  expect(std::fabs(db(amplitude(oddOut, kVoiceHz, 1.0, 2.0), voice0)) < 0.1, "mismatched vocal length: the deck plays as recorded (dB)",
          +         db(amplitude(oddOut, kVoiceHz, 1.0, 2.0), voice0));
          +
          +  std::printf(failures == 0 ? "stem mix test OK\n" : "stem mix test FAILED\n");
          +  return failures == 0 ? 0 : 1;
          +}
          PATCH_EOF

      - name: Apply the patches
        shell: bash
        env:
          NO_SPEEDUP: ${{ inputs.no_speedup }}
          STEMS: ${{ inputs.stem_separation }}
          STEM_MIX: ${{ inputs.stem_mix }}
        run: |
          set -euo pipefail
          # dev-benchmark (1).yml chạy lại bước này chỉ với CHAIN_FILE, không có hai biến dưới: mặc định tắt.
          NO_SPEEDUP="${NO_SPEEDUP:-false}"
          STEMS="${STEMS:-false}"
          STEM_MIX="${STEM_MIX:-false}"
          APPLIED=already
          PATCHES=("$RUNNER_TEMP/automix-manual-mix.patch")
          if [ "$NO_SPEEDUP" = "true" ]; then PATCHES+=("$RUNNER_TEMP/automix-no-speedup.patch"); fi
          if [ "$STEMS" = "true" ]; then PATCHES+=("$RUNNER_TEMP/automix-stems.patch"); fi
          # Nối tách giọng vào mix cần chính khả năng tách, nên đi sau patch tách giọng.
          if [ "$STEMS" = "true" ] && [ "$STEM_MIX" = "true" ]; then PATCHES+=("$RUNNER_TEMP/automix-stem-mix.patch"); fi
          # 1) Gỡ tạm những patch đã có sẵn trong cây (patch cuối trước), vì các patch sau chồng lên cùng file với
          #    patch trước nên kiểm tra "đã áp" từng patch riêng lẻ sẽ sai.
          PEELED=()
          for (( i=${#PATCHES[@]}-1; i>=0; i-- )); do
            P="${PATCHES[$i]}"
            if git apply --reverse --check "$P" 2>/dev/null; then
              git apply --reverse "$P"
              PEELED=("$P" "${PEELED[@]}")
            else
              break
            fi
          done
          # 2) Áp lần lượt tất cả. Patch vừa gỡ tạm chỉ là đưa về chỗ cũ; patch khác là mới.
          for P in "${PATCHES[@]}"; do
            if ! git apply --check "$P"; then
              echo "::error::Patch $(basename "$P") không áp được lên bản này (một trong các file đã bị sửa so với bản dùng để viết patch). Gửi lại các file bị báo lệch ở trên để chỉnh patch."
              exit 1
            fi
            git apply "$P"
            if [[ " ${PEELED[*]-} " == *" $P "* ]]; then
              echo "Đã có sẵn trong repo: $(basename "$P")"
            else
              APPLIED=yes
              echo "Đã áp: $(basename "$P")"
            fi
          done
          echo "APPLIED=$APPLIED" >> "$GITHUB_ENV"
          {
            echo "## Automix: các patch đã áp"
            echo
            printf '    %s\n' "${PATCHES[@]##*/}"
            echo
            echo "Kết quả áp patch: $APPLIED"
            echo
            git status --short | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the patch locally
        if: ${{ env.APPLIED == 'yes' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app shared sharedUi native docs
          git commit -m "Automix: manual mix window, no tempo change, stem separation and handover (as enabled)"

      - name: Native self-test (stem separation core)
        if: ${{ inputs.stem_separation }}
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -I native \
            native/analyzer/tests/stem_separation_test.cpp \
            native/analyzer/stem_separation.cpp \
            native/analyzer/vocal_spectrogram.cpp \
            -o "$RUNNER_TEMP/stem_test"
          "$RUNNER_TEMP/stem_test" | tee "$RUNNER_TEMP/stem_test.log"
          {
            echo "### Stem separation self-test"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/stem_test.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Native self-test (stem handover in the mix engine)
        if: ${{ inputs.stem_separation && inputs.stem_mix }}
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -Wall -Wextra -I native \
            -I native/third_party/signalsmith-stretch -I native/third_party/signalsmith-linear -I native/third_party \
            native/loopmix/tests/stem_mix_test.cpp native/loopmix/loop_mix_renderer.cpp \
            -o "$RUNNER_TEMP/stem_mix_test"
          "$RUNNER_TEMP/stem_mix_test" | tee "$RUNNER_TEMP/stem_mix_test.log"
          {
            echo "### Stem handover self-test (mix engine)"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/stem_mix_test.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        env:
          S_LASTFM_KEY: ${{ secrets.LASTFM_API_KEY }}
          S_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          S_LISTEN: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          {
            echo "LASTFM_API_KEY=$S_LASTFM_KEY"
            echo "LASTFM_SECRET=$S_LASTFM_SECRET"
            echo "LISTEN_TOGETHER_SERVER=$S_LISTEN"
          } > local.properties

      - run: chmod +x gradlew

      - name: Shared tests
        if: ${{ inputs.run_tests }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :shared:jvmTest 2>&1 | tee build.log

      - name: Pre-fetch libusb (GitHub release downloads keep returning 504)
        run: |
          # CMake tai libusb 1.0.27 tu trang release cua GitHub luc cau hinh, va trang do dang tra 504.
          # Thu lan luot: GitHub, SourceForge, kho goi Debian (cung mot file, kiem tra bang ma bam SHA256 ma
          # CMakeLists da ghim). Het cach thi git clone dung tag v1.0.27 va dong goi lai (khi do bo dong ghim ma bam).
          D="$HOME/libusb-cache"
          F="$D/libusb-1.0.27.tar.bz2"
          SHA="ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575"
          GH="https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2"
          CM=app/src/main/cpp/CMakeLists.txt
          mkdir -p "$D"
          OK=0
          for round in 1 2; do
            for U in "$GH" \
                     "https://downloads.sourceforge.net/project/libusb/libusb-1.0/libusb-1.0.27/libusb-1.0.27.tar.bz2" \
                     "https://deb.debian.org/debian/pool/main/libu/libusb-1.0/libusb-1.0_1.0.27.orig.tar.bz2"; do
              if curl -fsSL --retry 2 --retry-delay 3 --max-time 120 -o "$F" "$U" \
                 && echo "$SHA  $F" | sha256sum -c - > /dev/null 2>&1; then
                echo "Da tai libusb tu: $U"
                OK=1
                break 2
              fi
              echo "Khong tai duoc (hoac sai ma bam) tu: $U"
              rm -f "$F"
            done
            sleep 15
          done
          if [ "$OK" = 1 ]; then
            sed -i "s#$GH#file://$F#" "$CM"
          else
            echo "Ca ba nguon tai deu hong, thu git clone tag v1.0.27"
            for i in 1 2 3; do
              rm -rf "$D/libusb-1.0.27"
              if git clone --depth 1 --branch v1.0.27 https://github.com/libusb/libusb.git "$D/libusb-1.0.27"; then
                rm -rf "$D/libusb-1.0.27/.git"
                tar -C "$D" -cjf "$D/libusb-git.tar.bz2" libusb-1.0.27
                # Ban dong goi lai khong cung ma bam voi ban phat hanh, nen bo dong ghim ma bam.
                sed -i "s#$GH#file://$D/libusb-git.tar.bz2#; s#URL_HASH SHA256=$SHA)#)#" "$CM"
                echo "Da dung libusb tu git clone"
                break
              fi
              sleep 20
            done
          fi
          sed -n '/FetchContent_Declare(libusb/,/FetchContent_MakeAvailable(libusb)/p' "$CM"

      - name: Rename to the same app as Bit Dev APK (so the update installs over it)
        if: ${{ inputs.build_apk }}
        shell: bash
        env:
          APP_PACKAGE: ${{ inputs.app_package }}
        run: |
          set -euo pipefail
          APP_PACKAGE="${APP_PACKAGE:-com.bit.dev}"
          sed -i "s/com\.dev\.bitchord/${APP_PACKAGE}/g; s/BitChord Dev/Bit Dev/g" \
            app/build.gradle.kts app/src/dev/AndroidManifest.xml wearos/build.gradle.kts tv/build.gradle.kts
          grep -q "applicationId = \"${APP_PACKAGE}\"" app/build.gradle.kts
          echo "Tên gói app: ${APP_PACKAGE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup signing key (same as Bit Dev APK)
        if: ${{ inputs.build_apk }}
        env:
          S_KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_B64="$S_KS_B64"; KS_PASS="$S_KS_PASS"; KEY_ALIAS="$S_KEY_ALIAS"; KEY_PASS="$S_KEY_PASS"
          if [ -z "$KS_B64" ]; then
            KS_B64=''
            KS_PASS='M8rnSCC3C4TkChAh'
            KEY_ALIAS='bitdev'
            KEY_PASS='M8rnSCC3C4TkChAh'
          fi
          echo "$KS_B64" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - name: Make the in-app updater follow this repo's releases
        if: ${{ inputs.build_apk }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKER=app/src/main/java/com/music/bitchord/data/AppUpdateChecker.kt
          BASE="$(grep -oP 'bitchordVersionName"\] = "\K[0-9]+(\.[0-9]+)*' build.gradle.kts)"
          CODE="$(grep -oP 'bitchordVersionCode"\] = \K[0-9]+' build.gradle.kts)"
          # Số bản tiếp theo = số lớn nhất trong MỌI tag release của repo (kể cả của workflow Bit Dev APK) + 1, để luôn
          # cao hơn app đang cài. Không dùng run_number vì mỗi workflow đếm riêng.
          TAGS="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq '.[].tag_name' 2>/dev/null || true)"
          MAX=-1
          while IFS= read -r T; do
            case "$T" in
              "v${BASE}."*|"${BASE}."*)
                X="${T##*.}"
                if [[ "$X" =~ ^[0-9]+$ ]] && (( 10#$X > MAX )); then MAX=$(( 10#$X )); fi
                ;;
            esac
          done <<< "$TAGS"
          N="${GITHUB_RUN_NUMBER}"
          if (( MAX >= 0 )); then N=$(( MAX + 1 )); fi
          VER="${BASE}.${N}"
          # 1) Hỏi release mới nhất của CHÍNH repo này thay vì repo gốc.
          sed -i "s#repos/[A-Za-z0-9_.-]*/[A-Za-z0-9_.-]*/releases/latest#repos/${GITHUB_REPOSITORY}/releases/latest#" "$CHECKER"
          grep -q "repos/${GITHUB_REPOSITORY}/releases/latest" "$CHECKER"
          # 2) Tăng số phiên bản (1.9.1.N) để app đã cài thấy bản mới hơn.
          sed -i "s#\(bitchordVersionName\"\] = \"\)[^\"]*#\1${VER}#; s#\(bitchordVersionCode\"\] = \)[0-9]*#\1$((CODE + N))#" build.gradle.kts
          grep -q "bitchordVersionName\"\] = \"${VER}\"" build.gradle.kts
          echo "APP_VERSION=${VER}" >> "$GITHUB_ENV"
          echo "Phiên bản app: ${VER} (số lớn nhất trước đó: ${MAX})" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the release-like dev APK
        if: ${{ inputs.build_apk }}
        shell: bash
        run: |
          set -o pipefail
          # GitHub tra loi 504 tam thoi cho cac lan tai: thu lai toi 3 lan, moi lan cach 30 giay.
          for attempt in 1 2 3; do
            if ./gradlew assembleDevRelease 2>&1 | tee -a build.log; then
              exit 0
            fi
            echo "Build attempt $attempt failed" | tee -a build.log
            sleep 30
          done
          exit 1

      - name: Upload the arm64 APK
        if: ${{ inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-automix-manual-mix-arm64
          path: app/build/outputs/apk/dev/release/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Publish the APK as a GitHub release
        if: ${{ inputs.build_apk && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          NO_SPEEDUP: ${{ inputs.no_speedup }}
          STEMS: ${{ inputs.stem_separation }}
          STEM_MIX: ${{ inputs.stem_mix }}
        run: |
          set -euo pipefail
          SRC="$(ls app/build/outputs/apk/dev/release/*arm64-v8a*.apk 2>/dev/null | head -n 1 || true)"
          if [ -z "$SRC" ]; then SRC="$(ls app/build/outputs/apk/dev/release/*.apk | head -n 1)"; fi
          # App chỉ nhận file .apk có tên bắt đầu bằng UPDATE_APK_PREFIX của chính nó: đọc thẳng từ app/build.gradle.kts.
          PREFIX="$(grep -oP 'UPDATE_APK_PREFIX", "\\"\K[^\\]+' app/build.gradle.kts | head -n 1)"
          if [ -z "$PREFIX" ]; then
            echo "::error::Không đọc được UPDATE_APK_PREFIX trong app/build.gradle.kts."
            exit 1
          fi
          APK="$RUNNER_TEMP/${PREFIX}v${APP_VERSION}_arm64-v8a.apk"
          cp "$SRC" "$APK"
          TAG="v${APP_VERSION}"
          NOTES="APK arm64 dựng từ workflow automix-manual-mix. Gồm: chỉnh tay điểm mix từng cặp bài (popup Automix overview và nhấn giữ vệt sáng trên thanh tua), dịch lời bằng Gemini."
          if [ "$NO_SPEEDUP" = "true" ]; then NOTES="$NOTES Automix không còn đổi tốc độ nhạc khi chuyển bài (loop mix chỉ chạy khi hai bài cùng tempo)."; fi
          if [ "$STEMS" = "true" ] && [ "$STEM_MIX" = "true" ]; then
            NOTES="$NOTES Automix tách giọng khi chuyển bài: ở blend dài từ 4 giây, giọng bài cũ ra trước, nhạc nền hai bài hòa vào nhau, giọng bài mới vào sau."
          elif [ "$STEMS" = "true" ]; then
            NOTES="$NOTES Thêm khả năng tách giọng và nhạc nền (chưa nối vào phần mix)."
          fi
          # Chạy lại (re-run) có thể trùng tag: xóa bản cũ cùng tag rồi tạo lại.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Automix tất cả trong một (${TAG})" \
            --notes "$NOTES"
          echo "Đã đăng lên Releases: $TAG ($(basename "$APK"))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test reports
        if: ${{ always() && inputs.run_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-reports
          path: shared/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload the build log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Push the patched code to a branch
        if: ${{ inputs.push_branch && env.APPLIED == 'yes' }}
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin "HEAD:refs/heads/${FIX_BRANCH}"
          echo "Đã đẩy sang nhánh \`${FIX_BRANCH}\`. Mở PR từ nhánh đó vào ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
