name: "Automix - chỉnh tay điểm mix + không đổi tốc độ + tách giọng (APK)"

# Chạy tay: tab Actions -> chọn workflow này -> Run workflow.
# Một file duy nhất, KHÔNG commit gì vào repo (trừ khi bật "push_branch"). Mặc định có đăng APK lên Releases
# (tạo một tag mới, không đổi mã nguồn); tắt bằng input "publish_release".
#
# LƯU Ý: dev-benchmark (1).yml tìm file này theo chữ "chỉnh tay điểm mix" trong dòng name và chạy lại hai bước
# "Rebuild the all-in-one features", "Write the patch", "Apply the patches". Đừng đổi tên dòng name hay tên các bước đó.
#
# BẢN GỘP: file này thay cho cả automix-khong-tua-nhanh.yml và automix-tach-giong.yml (xoá hai file đó đi,
# không chạy chung). Hai patch đó đã được dựng lại để áp chồng được lên chuỗi all-in-one + manual-mix.
#   - Công tắc "no_speedup": Automix không bao giờ đổi tốc độ nhạc (cặp lệch BPM rơi về crossfade thường).
#   - Công tắc "stem_separation": thêm khả năng tách giọng / nhạc nền bằng model open-unmix có sẵn.
#   - Công tắc "stem_mix" (cần stem_separation): nối khả năng tách đó vào Automix. Ở mọi blend dài từ 4 giây,
#     giọng bài cũ ra trước, nhạc nền hai bài hòa vào nhau, giọng bài mới vào sau, nên hai giọng không đè lên nhau.
#     Bộ trộn native tự bỏ giọng khỏi từng bài theo thời gian (patch viết cho bộ trộn có sẵn, đã có test chạy
#     trên máy). Không tách được (lỗi, bài quá dài) thì blend đó chạy như cũ.
#   Thứ tự áp: chuỗi all-in-one -> manual-mix -> no_speedup -> stem_separation -> stem_mix. Patch nào không áp được thì
#   workflow dừng và báo đúng tên patch đó.
#
# CẬP NHẬT ĐÈ LÊN APP CŨ: build đúng app của workflow "Bit Dev APK" (dev-benchmark): cùng tên gói (mặc định
# com.bit.dev, đổi bằng input "app_package"), cùng nhãn "Bit Dev", cùng khoá ký (secret KEYSTORE_BASE64... hoặc khoá
# dev nhúng sẵn trong dev-benchmark), nên APK cài ĐÈ lên app cũ thay vì thành một app mới. Android chỉ cài đè khi
# tên gói VÀ khoá ký trùng nhau.
# APK đăng lên Releases của CHÍNH repo này, tên file bắt đầu bằng UPDATE_APK_PREFIX của app (đọc từ
# app/build.gradle.kts, hiện là "Bit-"), tag v1.9.1.N với N = số lớn nhất trong các tag release của repo + 1.
#
# NỀN: bản APK thật của bạn (all-in-one + dòng trạng thái loop mix + gom cài đặt "Nâng cao").
# Workflow này gồm đủ cả ba, nên dùng NÓ THAY CHO automix-verdict-line, không chạy chung hai cái.
#   0. Dựng lại chuỗi all-in-one: đọc .github/workflows/<chain_file> trong repo rồi chạy các bước áp patch
#      của nó (mọi công tắc ở mặc định = bật hết). Bỏ qua nếu main đã có AutomixMixStyle.kt.
#   1. Áp MỘT patch (diff chữ thường nằm ngay dưới, đọc được từng dòng) gồm:
#      - dòng trạng thái loop mix + gom cài đặt (như automix-verdict-line, đã sửa cho khớp main hiện tại:
#        main mới có thêm popup Automix overview nên một dòng import trong PlayerHost.kt bị lệch)
#      - MỚI: chỉnh tay điểm mix từng cặp bài trong popup "Automix overview".
#
# CHỈNH TAY LÀM GÌ (mở popup bằng nhãn "Mixing" dưới thanh tua hoặc menu "Automix overview"; chỉ sửa được
# khi đang xem KẾ HOẠCH, tức là trước khi mix bắt đầu):
#   - Kéo ngang hai waveform: dời cả đoạn mix; thả tay thì làm tròn thành nhịp. Có nhãn +/- giây khi kéo.
#   - DỊCH LỜI BẰNG GEMINI: Cài đặt, "Dịch lời bằng Gemini", dán mã API (tạo miễn phí ở aistudio.google.com/apikey).
#     Có mã thì lời bài hát được Gemini dịch theo ngữ cảnh cả bài; lỗi hoặc hết hạn mức thì tự quay về Google Dịch.
#   - TRÊN THANH TUA: nhấn giữ vào vệt sáng (đoạn mix dự kiến) rồi kéo sang trái/phải, thả tay thì làm tròn thành nhịp
#     và lưu cho cặp bài đó. Chạm hoặc kéo thường vẫn là tua bài như cũ. Vệt sáng hiện cả khi bài còn "analysing" (lúc đó là đoạn crossfade thường ở cuối bài, và nó nhảy sang vị trí phân tích khi xong).
#   - Phần chỉnh hiện cả khi bài còn "analysing" (lúc đó chỉnh tính từ kiểu crossfade thường).
#   - Nút ‹ › dời 1 nhịp, « » dời 1 ô nhịp (bar = 4 nhịp). Dòng "Độ dài" có nút - và + để kéo dài/rút ngắn từng nhịp.
#     Nếu bài chưa có lưới nhịp tin cậy thì 1 bước = 0,5 giây.
#   - Chọn kiểu riêng cho cặp này: Tự động / Plain crossfade / Cắt nhanh / Fade dài / Không mix.
#   - "Đặt lại về tự động" xoá mọi chỉnh tay của cặp đó.
#   Lưu theo cặp (id bài ra, id bài vào), tối đa 500 cặp, sống qua lần mở app sau. Cặp đã dời tay KHÔNG dùng loop mix
#   (loop mix tự chọn điểm loop riêng), nó dùng blend theo đúng vị trí bạn đặt.
#   KHÔNG có nút "Nghe thử" riêng: muốn nghe thì tua bài đang phát tới ~15 giây trước điểm mix.
#
# File đụng tới: CrossfadeController.kt, TransitionOverrideStore.kt, TransitionOverride.kt, TrackAnalysisState.kt,
# AndroidPlayerHost.kt, PlayerHost.kt, MixViewPopup.kt, PlayerControls.kt, AppSettings.kt, SettingsSheet.kt,
# AutomixVerdict.kt, chuỗi tiếng Anh/Việt, và test TransitionOverrideTest.kt.
# Nếu patch không áp được, workflow dừng và báo file nào lệch.

on:
  workflow_dispatch:
    inputs:
      chain_file:
        description: "Tên file workflow trong .github/workflows chứa chuỗi all-in-one cần dựng lại"
        type: string
        default: "automix-all-in-one (2).yml"
      run_tests:
        description: "Chạy test của module shared trước khi build"
        type: boolean
        default: false
      build_apk:
        description: "Build APK dev release (R8, ký bằng khoá của Bit Dev APK, cài đè lên app cũ)"
        type: boolean
        default: true
      publish_release:
        description: "Đăng APK lên mục Releases của repo (bản nháp trước-phát-hành), tải thẳng về điện thoại được, không hết hạn như artifact"
        type: boolean
        default: true
      no_speedup:
        description: "Gộp patch \"không tua nhanh\": Automix không đổi tốc độ nhạc khi chuyển bài"
        type: boolean
        default: true
      stem_separation:
        description: "Gộp patch \"tách giọng\": thêm khả năng tách giọng / nhạc nền (open-unmix)"
        type: boolean
        default: true
      stem_mix:
        description: "Nối tách giọng vào Automix: giọng bài cũ ra trước, giọng bài mới vào sau (cần stem_separation)"
        type: boolean
        default: true
      app_package:
        description: "Tên gói của app cần cài đè lên (mặc định com.bit.dev = app build từ workflow Bit Dev APK)"
        type: string
        default: "com.bit.dev"
      push_branch:
        description: "Đẩy bản đã vá sang nhánh automix-manual-mix (để bạn mở PR). Tắt = không commit gì"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: automix-manual-mix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-mix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FIX_BRANCH: automix-manual-mix
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild the all-in-one features
        shell: bash
        env:
          CHAIN_FILE: ${{ inputs.chain_file }}
        run: |
          set -euo pipefail
          if [ -f shared/src/commonMain/kotlin/com/music/bitchord/data/settings/AutomixMixStyle.kt ]; then
            echo "Repo đã chứa sẵn các tính năng all-in-one, bỏ qua bước dựng lại."
            exit 0
          fi
          cat > "$RUNNER_TEMP/replay.py" <<'REPLAY_EOF'
          import os, re, subprocess, sys
          
          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "--break-system-packages", "pyyaml"])
              import yaml
          
          name = os.environ["CHAIN_FILE"]
          path = os.path.join(".github", "workflows", name)
          if not os.path.isfile(path):
              sys.exit(f"::error::Không thấy .github/workflows/{name}. Workflow này cần file đó để dựng lại các tính năng Automix (hoặc để input chain_file đúng tên).")
          
          doc = yaml.safe_load(open(path, encoding="utf8"))
          steps = next(iter(doc["jobs"].values()))["steps"]
          first = next((i for i, s in enumerate(steps) if s.get("name") == "Apply the combined changes"), None)
          last = next((i for i, s in enumerate(steps) if str(s.get("uses", "")).startswith("actions/setup-java")), None)
          if first is None or last is None or last <= first:
              sys.exit(f"::error::{name} không có cấu trúc như mong đợi (bước 'Apply the combined changes' ... 'Set up JDK'). Gửi lại file đó để mình chỉnh.")
          
          todo = [s for s in steps[first:last] if s.get("run")]
          print(f"Dựng lại {len(todo)} bước từ {name}")
          for s in todo:
              run = s["run"]
              # Mọi công tắc của workflow gốc chạy ở giá trị mặc định (tất cả bật).
              run = re.sub(r"\$\{\{\s*inputs\.\w+(\s*&&\s*inputs\.\w+)*\s*\}\}", "true", run)
              if "$" + "{{" in run:
                  sys.exit(f"::error::Bước '{s.get('name')}' còn biểu thức GitHub chưa xử lý được.")
              print(f"::group::{s.get('name')}", flush=True)
              r = subprocess.run(["bash", "-eo", "pipefail", "-c", run])
              print("::endgroup::", flush=True)
              if r.returncode != 0:
                  sys.exit(f"::error::Bước '{s.get('name')}' của {name} lỗi (mã {r.returncode}).")
          print("Đã dựng xong bản all-in-one.")
          REPLAY_EOF
          python3 "$RUNNER_TEMP/replay.py"

      - name: Write the patch
        run: |
          cat > "$RUNNER_TEMP/automix-manual-mix.patch" <<'PATCH_EOF'
          diff --git a/app/src/main/java/com/music/bitchord/BitChordApplication.kt b/app/src/main/java/com/music/bitchord/BitChordApplication.kt
          index 2f1ad94..e521d04 100644
          --- a/app/src/main/java/com/music/bitchord/BitChordApplication.kt
          +++ b/app/src/main/java/com/music/bitchord/BitChordApplication.kt
          @@ -100,6 +100,9 @@ class BitChordApplication : Application(), SingletonImageLoader.Factory, Configu
                   Innertube.appLanguage = { AppCompatDelegate.getApplicationLocales().get(0)?.toLanguageTag() }
                   migrateScriptOnlyAppLocale()
                   LyricsTranslation.cacheDir = cacheDir
          +        LyricsTranslation.gemini = {
          +            com.music.bitchord.data.lyrics.GeminiSettings(AppSettings.geminiApiKey.value, AppSettings.geminiModel.value)
          +        }
                   // PlaybackService shares this process, so seeding the cookie here means
                   // stream resolution is authenticated from the first play onwards.
                   authStore = AuthStore(this)
          diff --git a/app/src/main/java/com/music/bitchord/data/settings/AppSettings.kt b/app/src/main/java/com/music/bitchord/data/settings/AppSettings.kt
          index 91d0ad5..1c55b7a 100644
          --- a/app/src/main/java/com/music/bitchord/data/settings/AppSettings.kt
          +++ b/app/src/main/java/com/music/bitchord/data/settings/AppSettings.kt
          @@ -562,6 +562,10 @@ object AppSettings {
                */
               val translationLanguage = MutableStateFlow("")
           
          +    /** Gemini key and model for translating lyrics; a blank key keeps Google Translate. Stored on the device only. */
          +    val geminiApiKey = MutableStateFlow("")
          +    val geminiModel = MutableStateFlow("")
          +
               /**
                * Plays a looping video behind the cover art on the player when one is
                * published for the track — Spotify's Canvas, Apple's motion artwork.
          @@ -951,6 +955,14 @@ object AppSettings {
                */
               val automixDetail = MutableStateFlow<String?>(null)
           
          +    /**
          +     * Automix's short, listener-facing line about the next song change: that a
          +     * loop mix is coming, or why the pair gets none. Published by the crossfade
          +     * controller once the change is near; null the rest of the time and while
          +     * Automix is off.
          +     */
          +    val automixVerdict = MutableStateFlow<AutomixVerdict?>(null)
          +
               /**
                * Where on the *playing* track the next transition is planned to happen, as
                * fractions of its duration, or null when there is nothing worth drawing.
          @@ -1163,6 +1175,8 @@ object AppSettings {
                   lyricsOffsetMs.value = prefs.getInt(KEY_LYRICS_OFFSET_MS, 0)
                       .coerceIn(MIN_LYRICS_OFFSET_MS, MAX_LYRICS_OFFSET_MS)
                   translationLanguage.value = prefs.getString(KEY_TRANSLATION_LANGUAGE, "").orEmpty()
          +        geminiApiKey.value = prefs.getString(KEY_GEMINI_API_KEY, "").orEmpty()
          +        geminiModel.value = prefs.getString(KEY_GEMINI_MODEL, "").orEmpty()
                   if (highPerformanceMode.value) {
                       reduceAnimation.value = false
                       reduceDynamicBlur.value = false
          @@ -1734,6 +1748,12 @@ object AppSettings {
                   prefs.edit().putString(KEY_TRANSLATION_LANGUAGE, value).apply()
               }
           
          +    fun setGeminiTranslation(apiKey: String, model: String) {
          +        geminiApiKey.value = apiKey
          +        geminiModel.value = model
          +        prefs.edit().putString(KEY_GEMINI_API_KEY, apiKey).putString(KEY_GEMINI_MODEL, model).apply()
          +    }
          +
               fun setSyncedLyrics(value: Boolean) {
                   syncedLyrics.value = value
                   prefs.edit().putBoolean(KEY_SYNCED_LYRICS, value).apply()
          @@ -2524,6 +2544,8 @@ object AppSettings {
               private const val KEY_LYRICS_BLUR = "lyrics_blur"
               private const val KEY_LYRICS_OFFSET_MS = "lyrics_offset_ms"
               private const val KEY_TRANSLATION_LANGUAGE = "translation_language"
          +    private const val KEY_GEMINI_API_KEY = "gemini_api_key"
          +    private const val KEY_GEMINI_MODEL = "gemini_model"
               private const val KEY_ANIMATED_CANVAS = "animated_canvas"
               private const val KEY_CANVAS_OVER_CELLULAR = "canvas_over_cellular"
               private const val KEY_SPOTIFY_CANVAS_AUTO_HIDE = "spotify_canvas_auto_hide"
          diff --git a/app/src/main/java/com/music/bitchord/playback/CrossfadeController.kt b/app/src/main/java/com/music/bitchord/playback/CrossfadeController.kt
          index 1bdc427..a6f1493 100644
          --- a/app/src/main/java/com/music/bitchord/playback/CrossfadeController.kt
          +++ b/app/src/main/java/com/music/bitchord/playback/CrossfadeController.kt
          @@ -11,6 +11,7 @@ import androidx.media3.common.util.UnstableApi
           import androidx.media3.exoplayer.ExoPlayer
           import com.music.bitchord.data.listentogether.ListenTogether
           import com.music.bitchord.data.settings.AppSettings
          +import com.music.bitchord.data.settings.AutomixVerdict
           import com.music.bitchord.data.settings.MixBlend
           import com.music.bitchord.data.settings.MixDeck
           import com.music.bitchord.data.settings.MixTransitionView
          @@ -29,6 +30,10 @@ import com.music.bitchord.playback.smart.CrossfadeMode
           import com.music.bitchord.playback.smart.BlendMix
           import com.music.bitchord.playback.smart.LoopMix
           import com.music.bitchord.playback.smart.OverlapMix
          +import com.music.bitchord.playback.smart.OverrideStyle
          +import com.music.bitchord.playback.smart.REASON_USER_OFF
          +import com.music.bitchord.playback.smart.TransitionOverride
          +import com.music.bitchord.playback.smart.manualWindowUnit
           import com.music.bitchord.playback.smart.FILTER_ECHO_AT
           import com.music.bitchord.playback.smart.FilterTransitionVariant
           import com.music.bitchord.playback.smart.MixWaveform
          @@ -1106,8 +1111,8 @@ class CrossfadeController(
                   // settings; with neither this is the planner's own plan, unchanged.
                   val pairOverride = TransitionOverrideStore.forPair(currentItem.mediaId, nextItem.mediaId)
                   val mixStyle = AppSettings.automixMixStyle.value
          -        val overridden = planTransitionWithOverride(
          -            pairOverride = pairOverride,
          +        fun planWith(choice: TransitionOverride?) = planTransitionWithOverride(
          +            pairOverride = choice,
                       analysis = currentAnalysis,
                       nextAnalysis = nextAnalysis,
                       currentTrack = currentItem.toTransitionInfo(duration),
          @@ -1121,7 +1126,15 @@ class CrossfadeController(
                       preferredFilterVariant = AppSettings.automixGesture.value.variant,
                       tuning = AppSettings.mixTuning(),
                   )
          +        val overridden = planWith(pairOverride)
                   val plan = overridden.plan
          +        // A pair the listener switched off has no window to draw, but the popup still has to show
          +        // one so the mix can be switched back on: it gets the plan the pair would have had.
          +        val previewPlan = if (plan.reason == REASON_USER_OFF && pairOverride != null) {
          +            planWith(pairOverride.copy(enabled = true)).plan
          +        } else {
          +            plan
          +        }
                   // One line per distinct verdict rather than one per 250ms tick, so the
                   // log says what the planner decided for this pair without burying it.
                   val verdict = "${plan.reason}|${plan.transitionStyle}|fade=${plan.fadeMs}" +
          @@ -1142,17 +1155,24 @@ class CrossfadeController(
           
                   lastSmartPlan = plan
                   lastSmartPlanStartMs = (plan.transitionStart * 1000).roundToLong()
          -        publishMixPreview(currentItem, nextItem, duration, nextDuration, currentAnalysis, nextAnalysis, analysisState, plan, advanced)
          -
          -        // The loop mix first: a pair it can do never reaches the blend below.
          -        val loop = loopPlanFor(
          -            player, currentItem, nextItem, currentAnalysis, nextAnalysis, duration, nextDuration, analysisState,
          +        publishMixPreview(
          +            currentItem, nextItem, duration, nextDuration, currentAnalysis, nextAnalysis, analysisState,
          +            previewPlan, advanced, pairOverride,
                   )
          +
          +        // The loop mix first: a pair it can do never reaches the blend below. It picks its own
          +        // loop points, so a pair the listener placed by hand goes to the blend they placed.
          +        val loop = if (pairOverride?.hasManualWindow == true) {
          +            null
          +        } else {
          +            loopPlanFor(
          +                player, currentItem, nextItem, currentAnalysis, nextAnalysis, duration, nextDuration, analysisState,
