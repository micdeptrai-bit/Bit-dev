          +## Optional: translate with Gemini
          +
          +Settings, **Translate lyrics with Gemini**, takes a Gemini API key (a free one comes from
          +aistudio.google.com/apikey) and an optional model id (default `gemini-flash-latest`). With a key set,
          +`LyricsTranslation` sends the whole lyric to Gemini's `generateContent` endpoint as one JSON array of lines
          +(split in order only for very long lyrics) and asks for a JSON object with the same number of translated
          +lines plus the source language. The answer is checked line for line exactly like a Google batch; if the
          +request fails or the reply does not match, Google Translate answers instead.
          +
          +Gemini's results are cached under their own key (target language plus model), so enabling it never serves a
          +translation Google cached earlier. The key is stored in the app's preferences on the device. Lyrics are
          +sent to Google's Gemini API, and the call has a 45-second deadline instead of 12 seconds.
          +
           ## Failure behaviour
           
           - Network failure: a localized message is shown and the original stays visible.
