name: Gemini dịch lời sang tiếng Việt - prompt dịch giả (APK)

# Chạy tay: tab Actions -> chọn workflow này -> Run workflow.
# Một file duy nhất, KHÔNG commit gì vào repo. APK đăng lên Releases (tạo một tag mới, không đổi mã nguồn).
#
# APK RA ĐÂY LÀ CÙNG APP VỚI WORKFLOW "Bit Dev APK": package com.bit.dev, tên "Bit Dev", cùng khoá ký, tên file
# Bit-v<số>_arm64-v8a.apk. Nên cài là CẬP NHẬT ĐÈ lên app đang dùng (giữ nguyên dữ liệu), và hộp thoại cập nhật
# trong app tải + cài được ngay trong app. Các bước build/ký/đăng bên dưới chép nguyên từ "Bit Dev APK".
#
# LÀM GÌ:
#   0. Dựng lại nền: chạy các bước của "automix-manual-mix (2).yml" (nó tự dựng all-in-one rồi áp patch có sẵn
#      tính năng "Dịch lời bằng Gemini"). Bỏ qua nếu LyricsTranslation.kt trong repo đã có Gemini.
#   1. Vá LyricsTranslation.kt (bản v3), khi dịch sang TIẾNG VIỆT:
#      - Prompt dịch giả/lyricist siết xưng hô: Gemini phải chốt người hát, người nghe và MỘT cặp xưng hô (trường
#        "analysis" + "pair") TRƯỚC khi viết lời. Cho phép biến tấu từ ngữ bay bổng, hợp ngữ cảnh.
#      - Lượt rà xưng hô: sau khi dịch, một lời gọi riêng chỉ có việc sửa đại từ lệch khỏi cặp đã chốt. Lỗi/hết giờ/lệch
#        số dòng thì giữ bản dịch đầu. Bài dài chia nhiều đoạn: cặp xưng hô đoạn trước được truyền sang đoạn sau.
#      - Tra cứu bài hát bằng Google Search (input use_search, mặc định TẮT cho nhanh): nhận diện bài, câu chuyện, ai
#        hát cho ai, nghĩa tiếng lóng. Một lần cho cả bài. Lỗi/hết giờ thì dịch như cũ.
#      - Thời gian chờ tối đa: dịch 150 giây (nâng cả readTimeout, vì Http.client mặc định chỉ 30 giây), rà 60 giây,
#        tra cứu 75 giây. Các ngôn ngữ đích khác vẫn dùng prompt tiếng Anh cũ.
#      - Dòng Gemini trả về rỗng: giữ dòng gốc thay vì bỏ cả bài rồi rơi về Google Dịch.
#      - CACHE_VERSION 3 -> 4: bản dịch cũ (làm bằng prompt cũ) không còn được dùng lại.
#      - safetySettings: HARASSMENT, HATE_SPEECH, SEXUALLY_EXPLICIT, DANGEROUS_CONTENT đều BLOCK_NONE. temperature 0.4.
#   2. Đổi tên gói/phiên bản/updater y như "Bit Dev APK", build assembleDevRelease, đăng lên Releases.
#
# Số bản dựng luôn LỚN HƠN mọi tag hiện có của repo (kể cả tag do "Bit Dev APK" tạo), để versionCode cao hơn bản đang
# cài và Android cho cài đè. SAU KHI CÀI APK: Cài đặt, "Dịch lời bằng Gemini", dán mã API.
#
# CẦN CÓ trong .github/workflows: "automix-manual-mix (2).yml" và "automix-all-in-one (2).yml" (đúng tên, hoặc đổi ở input).

on:
  workflow_dispatch:
    inputs:
      base_file:
        description: "Workflow chứa phần Gemini cần dựng lại (trong .github/workflows)"
        type: string
        default: "automix-manual-mix (2).yml"
      chain_file:
        description: "Workflow all-in-one mà base_file cần (trong .github/workflows)"
        type: string
        default: "automix-all-in-one (2).yml"
      skip_base:
        description: "Bỏ qua bước dựng lại nền (chỉ bật khi repo đã chứa sẵn phần Gemini)"
        type: boolean
        default: false
      use_search:
        description: "Tra cứu bài hát bằng Google Search trước khi dịch (chính xác hơn nhưng chậm hơn, tốn quota). Tắt = nhanh hơn"
        type: boolean
        default: false
      publish_release:
        description: "Đăng APK lên mục Releases (cần để app cập nhật trong app được). Tắt = chỉ có file ở Artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: gemini-vi-lyrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gemini-vi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BIT_DEV_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Rebuild the base (all-in-one + Gemini translation)
        if: ${{ !inputs.skip_base }}
        shell: bash
        env:
          BASE_FILE: ${{ inputs.base_file }}
          CHAIN_FILE: ${{ inputs.chain_file }}
        run: |
          set -euo pipefail
          LT=shared/src/jvmSharedMain/kotlin/com/music/bitchord/data/lyrics/LyricsTranslation.kt
          if grep -q "GEMINI_ENDPOINT" "$LT"; then
            echo "Repo đã có Gemini trong LyricsTranslation.kt, bỏ qua bước dựng lại."
            exit 0
          fi
          cat > "$RUNNER_TEMP/replay_base.py" <<'REPLAY_EOF'
          import os, re, subprocess, sys

          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "--break-system-packages", "pyyaml"])
              import yaml

          name = os.environ["BASE_FILE"]
          chain = os.environ["CHAIN_FILE"]
          path = os.path.join(".github", "workflows", name)
          if not os.path.isfile(path):
              sys.exit(f"::error::Không thấy .github/workflows/{name}. Workflow này cần file đó để có sẵn phần Gemini (hoặc nhập đúng tên ở input base_file).")

          doc = yaml.safe_load(open(path, encoding="utf8"))
          steps = next(iter(doc["jobs"].values()))["steps"]
          first = next((i for i, s in enumerate(steps) if s.get("name") == "Rebuild the all-in-one features"), None)
          last = next((i for i, s in enumerate(steps) if s.get("name") == "Commit the patch locally"), None)
          if first is None or last is None or last <= first:
              sys.exit(f"::error::{name} không có cấu trúc như mong đợi (bước 'Rebuild the all-in-one features' ... 'Commit the patch locally'). Gửi lại file đó để mình chỉnh.")

          EXPR = "$" + "{{"
          CHAIN_RE = re.compile(r"\$\{\{\s*inputs\.chain_file\s*\}\}")
          OTHER_RE = re.compile(r"\$\{\{\s*inputs\.\w+(\s*&&\s*inputs\.\w+)*\s*\}\}")

          todo = [s for s in steps[first:last] if s.get("run")]
          print(f"Dựng lại {len(todo)} bước từ {name}")
          for s in todo:
              run = CHAIN_RE.sub(lambda m: chain, s["run"])
              run = OTHER_RE.sub("true", run)
              if EXPR in run:
                  sys.exit(f"::error::Bước '{s.get('name')}' còn biểu thức GitHub chưa xử lý được.")
              env = dict(os.environ)
              for k, v in (s.get("env") or {}).items():
                  env[k] = CHAIN_RE.sub(lambda m: chain, str(v))
              print(f"::group::{s.get('name')}", flush=True)
              r = subprocess.run(["bash", "-eo", "pipefail", "-c", run], env=env)
              print("::endgroup::", flush=True)
              if r.returncode != 0:
                  sys.exit(f"::error::Bước '{s.get('name')}' của {name} lỗi (mã {r.returncode}).")
          print("Đã dựng xong bản nền (all-in-one + Gemini).")

          REPLAY_EOF
          python3 "$RUNNER_TEMP/replay_base.py"

      - name: Apply the Vietnamese lyricist prompt to Gemini (xưng hô nhất quán + lượt rà xưng hô)
        shell: bash
        env:
          USE_SEARCH: ${{ inputs.use_search }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/vi_prompt.py" <<'VI_EOF'
          import os, re, sys

          USE_SEARCH = os.environ.get("USE_SEARCH", "false").strip().lower() == "true"

          PATH = "shared/src/jvmSharedMain/kotlin/com/music/bitchord/data/lyrics/LyricsTranslation.kt"
          src = open(PATH, encoding="utf8").read()

          if "GEMINI_CONTEXT_INSTRUCTION" in src:
              print("Bản vá Gemini v2 đã có sẵn, bỏ qua.")
              sys.exit(0)
          if "GEMINI_ENDPOINT" not in src or "requestGemini" not in src:
              sys.exit("::error::LyricsTranslation.kt chưa có phần Gemini (patch automix-manual-mix chưa được áp).")

          BRACES_BEFORE = src.count("{") - src.count("}")
          PARENS_BEFORE = src.count("(") - src.count(")")


          def once(text, old, new, what):
              n = text.count(old)
              if n != 1:
                  sys.exit(f"::error::Không vá được '{what}': tìm thấy {n} chỗ khớp (cần đúng 1). Gửi lại LyricsTranslation.kt để mình chỉnh.")
              return text.replace(old, new)


          def line_bounds(text, needle, what):
              n = text.count(needle)
              if n != 1:
                  sys.exit(f"::error::Không vá được '{what}': tìm thấy {n} chỗ khớp (cần đúng 1).")
              pos = text.index(needle)
              start = text.rfind("\n", 0, pos) + 1
              end = text.index("\n", pos) + 1
              indent = re.match(r"[ \t]*", text[start:end]).group(0)
              return start, end, indent


          def replace_line(text, needle, lines, what):
              start, end, indent = line_bounds(text, needle, what)
              return text[:start] + "".join((indent + l if l else "") + "\n" for l in lines) + text[end:]


          def insert_before(text, needle, lines, what):
              start, _, indent = line_bounds(text, needle, what)
              return text[:start] + "".join((indent + l if l else "") + "\n" for l in lines) + text[start:]


          def insert_after(text, needle, lines, what):
              _, end, indent = line_bounds(text, needle, what)
              return text[:end] + "".join((indent + l if l else "") + "\n" for l in lines) + text[end:]


          # ---------------------------------------------------------------------------------------------
          # 1) Hằng số: prompt dịch giả tiếng Việt (v2) + prompt tra cứu bài hát
          # ---------------------------------------------------------------------------------------------
          CONSTS = r'''    private const val GEMINI_MAX_CHARS = 7_000
              private const val GEMINI_CONTEXT_MAX_CHARS = 2_500
              // Tra cứu bài hát bằng Google Search trước khi dịch: chính xác hơn nhưng chậm hơn và tốn quota (chọn lúc chạy workflow).
              private const val GEMINI_USE_SEARCH = __USE_SEARCH__

              // Lời dịch giả/lyricist tiếng Việt (dùng khi ngôn ngữ đích là tiếng Việt), bản chú trọng xưng hô nhất quán.
              // Phần sau là hợp đồng JSON mà app cần (analysis để chốt xưng hô trước, rồi mỗi dòng gốc một dòng dịch).
              private val GEMINI_VI_INSTRUCTION = """
                  Bạn là một dịch giả âm nhạc và người viết lời bài hát (lyricist) chuyên nghiệp, cực kỳ kỹ tính về xưng hô và ngữ cảnh. Khi dịch lời bài hát sang tiếng Việt, hãy tuân thủ tuyệt đối các nguyên tắc sau:

                  1. Đọc hiểu và chốt xưng hô TRƯỚC khi dịch
                  - Đọc toàn bài, nắm câu chuyện, mạch cảm xúc, xác định rõ ai đang hát (giới tính, vai, độ tuổi nếu suy ra được) và hát cho ai (người yêu, người cũ, bạn bè, gia đình, đối thủ, chính mình, đấng thiêng liêng...).
                  - Nếu có phần GHI CHÚ VỀ BÀI HÁT ở cuối hướng dẫn này, hãy ưu tiên nó khi chốt giới tính, quan hệ và cặp xưng hô. Ghi chú không phải lời bài hát, không được dịch hay đưa vào kết quả.
                  - Chốt MỘT cặp xưng hô cho mỗi cặp người nói - người nghe, theo đúng quan hệ và sắc thái: ví dụ anh - em, em - anh, tôi - em, tôi - anh, tao - mày, tớ - cậu, mình - bạn, ta - người, ta - em... Không mặc định bài nào cũng là anh - em; không mặc định người hát là nam.
                  - Nếu lời gốc không lộ giới tính hay quan hệ và ghi chú cũng không nói rõ, chọn cặp phổ biến và tự nhiên nhất của thể loại bài, rồi GIỮ NGUYÊN, không đổi giữa chừng.

                  2. Xưng hô: quy tắc cứng
                  - Cặp xưng hô đã chốt phải dùng nhất quán ở MỌI dòng. Tuyệt đối không nhảy lung tung giữa tôi, anh, em, mình, tao, tớ, cậu, mày giữa các dòng hay các đoạn.
                  - Chỉ đổi cặp xưng hô khi bài thật sự đổi người nói hoặc đổi người nghe (đối thoại hai nhân vật, đoạn rap nói với người khác, đoạn tự nhủ). Khi đó phải ghi rõ trong analysis, và trong cùng một đoạn vẫn giữ nhất quán.
                  - Ngôi thứ ba (he, she, they) dịch đúng giới tính và nhất quán (anh ấy, cô ấy, họ, hắn, nó...). Giữ nhất quán thì (quá khứ, hiện tại, tương lai) và giọng điệu xuyên suốt cả bài.
                  - Tiếng Việt được phép bỏ chủ ngữ khi nhịp câu cần, nhưng nếu đã dùng đại từ thì phải đúng cặp đã chốt.

                  3. Văn phong bay bổng nhưng đúng ý
                  - Dịch sát nghĩa và cảm xúc nhưng tuyệt đối không dịch word-by-word gây ngượng ép. Được phép biến tấu từ ngữ, đổi hình ảnh, ẩn dụ sang cách nói tự nhiên và giàu chất thơ của tiếng Việt, tạo nhịp và vần nhẹ khi hợp, miễn là giữ đúng ý, đúng cảm xúc và hợp ngữ cảnh bài. Không bịa thêm tình tiết hay thông tin không có trong lời gốc.
                  - Chuẩn chất lời bài hát: câu từ ngắn gọn, cô đọng, có nhịp điệu, giàu cảm xúc, không như văn bản hành chính.
                  - Tiếng lóng và nghĩa đôi: toàn bộ tiếng lóng (slang), từ đường phố, từ chửi thề và câu chữ nghĩa đôi (double entendre) phải được dịch bằng tiếng lóng tiếng Việt tự nhiên có cùng mức độ và sắc thái. Không làm nhẹ từ, không nói giảm nói tránh, không kiểm duyệt.
                  - Tên riêng và thương hiệu: giữ nguyên 100% như bản gốc.

                  4. Tự soát lỗi trước khi trả lời
                  - Đọc lại toàn bộ các dòng đã dịch. Chỗ nào xưng hô lệch khỏi cặp đã chốt, hoặc sai giới tính, hoặc sai thì, thì sửa ngay.
                  - Đầu ra chỉ gồm lời bài hát đã dịch, không thêm lời giải thích hay mở đầu nào.
              """.trimIndent() + "\n\n" + """
                  Định dạng bắt buộc của ứng dụng: người dùng gửi một mảng JSON, mỗi phần tử là một dòng lời bài hát. Hãy trả về một đối tượng JSON gồm bốn trường theo đúng thứ tự: "analysis", "pair", "source", "lines".
                  - "analysis": viết TRƯỚC, bằng tiếng Việt, tối đa khoảng 80 từ, ghi: người hát là ai (giới tính, vai), hát cho ai và quan hệ giữa hai bên, cặp xưng hô đã chốt cho cả bài và lý do ngắn, các đoạn đổi người nói hoặc đổi đối tượng kèm cặp xưng hô riêng (nếu có), thì chủ đạo. Phần này chỉ để bạn chốt xưng hô, đừng đưa nó vào "lines".
                  - "pair": đúng MỘT cặp xưng hô chủ đạo của cả bài, dạng "người hát tự xưng - gọi người nghe", ví dụ "anh - em" hoặc "tao - mày". Mọi dòng trong "lines" phải bám cặp này (trừ đoạn đổi người nói đã nêu trong "analysis").
                  - "source": mã ISO 639-1 của ngôn ngữ mà bài hát chủ yếu được hát (bỏ qua các dòng ngoại ngữ xen vào).
                  - "lines": mảng các chuỗi đã dịch, bám đúng "analysis". Đúng một chuỗi cho mỗi dòng đầu vào, cùng thứ tự, tuyệt đối không gộp, tách, bỏ hay thêm dòng, không để dòng nào trống.
                  Các dòng hoặc cụm ngôn ngữ khác xen vào bài cũng phải được dịch theo đúng các nguyên tắc trên; chỉ giữ nguyên tiếng đệm thuần túy (oh, yeah, la la la) và những dòng vốn đã là tiếng Việt. Các nguyên tắc trên áp dụng cho nội dung từng chuỗi trong "lines"; không thêm lời giải thích hay mở đầu vào chuỗi nào.
              """.trimIndent()

              // Bước tra cứu (có Google Search) chạy trước khi dịch: ai hát cho ai, câu chuyện, nghĩa tiếng lóng, cặp xưng hô nên dùng.
              private val GEMINI_CONTEXT_INSTRUCTION = """
                  Bạn là chuyên gia âm nhạc. Người dùng gửi lời một bài hát. Hãy dùng Google Search để nhận diện bài hát (tên, nghệ sĩ, năm nếu tìm được), tìm câu chuyện, bối cảnh, ý nghĩa, nhân vật, và nghĩa của tiếng lóng hay ẩn dụ khó trong bài. Chỉ tin thông tin tra được hoặc suy ra chắc chắn từ lời; chỗ nào không chắc thì ghi "chưa rõ", không bịa.
                  Trả lời bằng tiếng Việt, tối đa khoảng 220 từ, gạch đầu dòng ngắn, gồm các mục: Bài hát; Câu chuyện và cảm xúc; Người hát và người nghe (giới tính, quan hệ); Cặp xưng hô tiếng Việt nên dùng (kèm ngoại lệ theo đoạn nếu có); Tiếng lóng, ẩn dụ cần lưu ý (kèm nghĩa).
                  Không dịch lời bài hát và không chép nguyên văn lời bài hát.
              """.trimIndent()

              // Lượt rà xưng hô: một lời gọi riêng, chỉ có một việc là bắt và sửa đại từ lệch khỏi cặp đã chốt.
              private val GEMINI_REVIEW_INSTRUCTION = """
                  Bạn là biên tập viên chuyên rà xưng hô cho lời bài hát tiếng Việt. Người dùng gửi một đối tượng JSON gồm "plan" (cặp xưng hô đã chốt cùng phân tích), "original" (các dòng gốc) và "translated" (các dòng đã dịch sang tiếng Việt).
                  Nhiệm vụ DUY NHẤT của bạn: tìm và sửa mọi chỗ trong "translated" xưng hô lệch khỏi "plan". Đại từ tự xưng, đại từ gọi người nghe và ngôi thứ ba phải nhất quán xuyên suốt, đúng giới tính, trừ đoạn mà "plan" nói rõ là đổi người nói hoặc đổi người nghe. Đối chiếu "original" để hiểu dòng đó đang nói về ai, nói với ai.
                  Giữ nguyên mọi thứ khác: ý nghĩa, nhịp, vần, tiếng lóng, độ thô, từ ngữ. Chỉ sửa tối thiểu những từ cần sửa. Dòng nào đã đúng thì chép lại y nguyên từng chữ.
                  Trả về JSON dạng {"lines": [...]}: đúng số dòng của "translated", cùng thứ tự, không dòng nào trống, không thêm giải thích.
              """.trimIndent()
          '''
          src = once(src, "    private const val GEMINI_MAX_CHARS = 7_000\n", CONSTS.replace("__USE_SEARCH__", "true" if USE_SEARCH else "false"), "hằng GEMINI_MAX_CHARS")

          # ---------------------------------------------------------------------------------------------
          # 2) Prompt tiếng Anh cũ vẫn dùng cho ngôn ngữ đích khác; chọn prompt theo ngôn ngữ đích
          # ---------------------------------------------------------------------------------------------
          src = once(src, 'val instruction = "You translate song lyrics.', 'val englishInstruction = "You translate song lyrics.', "prompt tiếng Anh")

          m = re.search(r'^([ \t]*)\+?[^\n]*ignoring the mixed-in foreign lines\."\n', src, re.M)
          if not m or len(re.findall(r'ignoring the mixed-in foreign lines\."\n', src)) != 1:
              sys.exit("::error::Không tìm thấy cuối prompt tiếng Anh trong requestGemini.")
          base_ind = re.search(r'^([ \t]*)val englishInstruction', src, re.M).group(1)
          pick = (
              base_ind + 'val vietnamese = target.startsWith("vi", ignoreCase = true)\n'
              + base_ind + 'val instruction = if (vietnamese) GEMINI_VI_INSTRUCTION else englishInstruction\n'
              + base_ind + '// Tiếng Việt: buộc Gemini chốt xưng hô vào trường "analysis" trước khi viết các dòng dịch.\n'
              + base_ind + 'val planFirst = vietnamese\n'
          )
          src = src[:m.end()] + pick + src[m.end():]

          # Ghi chú tra cứu được nối vào system instruction.
          src = once(src, 'put("text", instruction)', 'put("text", withSongNotes(instruction, context))', "systemInstruction")

          # requestGemini nhận thêm ghi chú bài hát (mặc định null).
          rg = re.compile(r"(private suspend fun requestGemini\(\n(?P<i>[ \t]*)slots: List<TextSlot>,\n[ \t]*target: String,\n[ \t]*settings: GeminiSettings,\n)")
          mm = rg.search(src)
          if not mm or len(rg.findall(src)) != 1:
              sys.exit("::error::Không tìm thấy chữ ký hàm requestGemini để thêm tham số ghi chú.")
          src = src[:mm.end()] + mm.group("i") + "context: String? = null,\n" + src[mm.end():]

          # ---------------------------------------------------------------------------------------------
          # 3) Schema: thêm "analysis" (đứng đầu) khi dịch tiếng Việt
          # ---------------------------------------------------------------------------------------------
          src = insert_after(src, 'putJsonObject("properties") {', [
              '    if (planFirst) putJsonObject("analysis") { put("type", "STRING") }',
              '    if (planFirst) putJsonObject("pair") { put("type", "STRING") }',
          ], 'schema properties')
          # "required" trước (khi 'add(JsonPrimitive("source"))' còn duy nhất), rồi mới chèn propertyOrdering.
          src = insert_before(src, 'add(JsonPrimitive("source"))', [
              'if (planFirst) add(JsonPrimitive("analysis"))',
              'if (planFirst) add(JsonPrimitive("pair"))',
          ], 'required analysis')
          src = insert_before(src, 'putJsonArray("required") {', [
              'if (planFirst) putJsonArray("propertyOrdering") {',
              '    add(JsonPrimitive("analysis"))',
              '    add(JsonPrimitive("pair"))',
              '    add(JsonPrimitive("source"))',
              '    add(JsonPrimitive("lines"))',
              '}',
          ], 'propertyOrdering')

          # ---------------------------------------------------------------------------------------------
          # 4) temperature, safetySettings
          # ---------------------------------------------------------------------------------------------
          src = once(src, 'put("temperature", 0.3)', 'put("temperature", 0.4)', "temperature")

          gm = re.findall(r'^([ \t]*)putJsonObject\("generationConfig"\) \{\n', src, re.M)
          if len(gm) != 1:
              sys.exit(f"::error::Không vá được 'generationConfig': tìm thấy {len(gm)} chỗ (cần đúng 1).")
          i = gm[0]
          SAFETY = (
              f'{i}putJsonArray("safetySettings") {{\n'
              f'{i}    // Lời bài hát đầy tiếng lóng, chửi thề và nghĩa đôi: không để bộ lọc của Gemini chặn.\n'
              f'{i}    listOf(\n'
              f'{i}        "HARM_CATEGORY_HARASSMENT",\n'
              f'{i}        "HARM_CATEGORY_HATE_SPEECH",\n'
              f'{i}        "HARM_CATEGORY_SEXUALLY_EXPLICIT",\n'
              f'{i}        "HARM_CATEGORY_DANGEROUS_CONTENT",\n'
              f'{i}    ).forEach {{ category ->\n'
              f'{i}        addJsonObject {{\n'
              f'{i}            put("category", category)\n'
              f'{i}            put("threshold", "BLOCK_NONE")\n'
              f'{i}        }}\n'
              f'{i}    }}\n'
              f'{i}}}\n'
          )
          anchor = f'{i}putJsonObject("generationConfig") {{\n'
          src = once(src, anchor, SAFETY + anchor, "generationConfig")

          # ---------------------------------------------------------------------------------------------
          # 5) Timeout dài hơn. Http.client có readTimeout 30 giây: Gemini chỉ trả về khi viết xong cả bài,
          #    nên phải nâng cả readTimeout chứ không chỉ callTimeout.
          # ---------------------------------------------------------------------------------------------
          src = once(
              src,
              ".callTimeout(45, TimeUnit.SECONDS)\n",
              ".callTimeout(150, TimeUnit.SECONDS)\n            .readTimeout(150, TimeUnit.SECONDS)\n",
              "callTimeout Gemini",
          )
          src = once(src, ".connectTimeout(8, TimeUnit.SECONDS)\n", ".connectTimeout(10, TimeUnit.SECONDS)\n", "connectTimeout Gemini")
          src = insert_before(src, "private val client by lazy {", [
              "// Bước tra cứu bài hát (Google Search) cũng cần thời gian; hết giờ thì dịch tiếp không có ghi chú.",
              "private val geminiContextClient by lazy {",
              "    geminiClient.newBuilder()",
              "        .callTimeout(75, TimeUnit.SECONDS)",
              "        .readTimeout(75, TimeUnit.SECONDS)",
              "        .build()",
              "}",
              "// Lượt rà xưng hô ngắn hơn lượt dịch; hết giờ thì giữ bản dịch đầu.",
              "private val geminiReviewClient by lazy {",
              "    geminiClient.newBuilder()",
              "        .callTimeout(60, TimeUnit.SECONDS)",
              "        .readTimeout(60, TimeUnit.SECONDS)",
              "        .build()",
              "}",
          ], "client Google")

          # ---------------------------------------------------------------------------------------------
          # 6) Tra cứu bài hát một lần cho cả bài (mọi đoạn chia nhỏ dùng chung một ghi chú, nên xưng hô khớp nhau)
          # ---------------------------------------------------------------------------------------------
          src = insert_before(src, "val texts = mutableListOf<String>()", [
              "// Chỉ tiếng Việt cần chốt xưng hô. Tra cứu (nếu bật) chạy một lần, dùng chung cho mọi đoạn; lỗi hay hết giờ thì dịch không có ghi chú.",
              'val vietnamese = target.startsWith("vi", ignoreCase = true)',
              "val context = if (GEMINI_USE_SEARCH && vietnamese) researchSong(slots, settings) else null",
              "var carried = context",
          ], "researchSong call")
          src = replace_line(src, "val answer = requestGemini(chunk, target, settings) ?: return null", [
              "val first = requestGemini(chunk, target, settings, carried) ?: return null",
              "// Tiếng Việt: một lượt rà riêng chỉ để bắt lỗi xưng hô. Lỗi hay lệch số dòng thì giữ bản dịch đầu.",
              "val answer = if (vietnamese && first.plan.isNotBlank()) {",
              "    reviewPronouns(chunk, first.texts, first.plan, settings)",
              "        ?.let { GeminiAnswer(it, first.sourceLanguage, first.plan) } ?: first",
              "} else {",
              "    first",
              "}",
              "// Đoạn sau giữ đúng cặp xưng hô đã chốt ở đoạn trước.",
              "if (answer.plan.isNotBlank()) {",
              '    carried = listOfNotNull(context, "XƯNG HÔ ĐÃ CHỐT Ở ĐOẠN TRƯỚC, GIỮ NGUYÊN:\\n" + answer.plan).joinToString("\\n\\n")',
              "}",
          ], "gọi requestGemini")

          HELPERS = r'''    /** Ghi chú tra cứu nối vào cuối system instruction; không có ghi chú thì giữ nguyên. */
              private fun withSongNotes(instruction: String, notes: String?): String =
                  if (notes.isNullOrBlank()) {
                      instruction
                  } else {
                      instruction + "\n\nGHI CHÚ VỀ BÀI HÁT (đã tra cứu; dùng để chốt xưng hô và hiểu ngữ cảnh, không dịch phần này, không đưa vào kết quả):\n" + notes
                  }

              /**
               * Hỏi Gemini (có Google Search) về bài hát trước khi dịch: tên, câu chuyện, ai hát cho ai, nghĩa tiếng lóng,
               * cặp xưng hô nên dùng. Null khi lỗi hay hết giờ, khi đó vẫn dịch bình thường, chỉ thiếu ghi chú.
               */
              private suspend fun researchSong(slots: List<TextSlot>, settings: GeminiSettings): String? {
                  val lyric = slots.joinToString("\n") { it.text }.take(GEMINI_MAX_CHARS)
                  val body = buildJsonObject {
                      putJsonObject("systemInstruction") {
                          putJsonArray("parts") { addJsonObject { put("text", GEMINI_CONTEXT_INSTRUCTION) } }
                      }
                      putJsonArray("contents") {
                          addJsonObject {
                              put("role", "user")
                              putJsonArray("parts") { addJsonObject { put("text", lyric) } }
                          }
                      }
                      putJsonArray("tools") {
                          addJsonObject { putJsonObject("google_search") {} }
                      }
                      putJsonArray("safetySettings") {
                          listOf(
                              "HARM_CATEGORY_HARASSMENT",
                              "HARM_CATEGORY_HATE_SPEECH",
                              "HARM_CATEGORY_SEXUALLY_EXPLICIT",
                              "HARM_CATEGORY_DANGEROUS_CONTENT",
                          ).forEach { category ->
                              addJsonObject {
                                  put("category", category)
                                  put("threshold", "BLOCK_NONE")
                              }
                          }
                      }
                      putJsonObject("generationConfig") { put("temperature", 0.3) }
                  }
                  val request = Request.Builder()
                      .url("$GEMINI_ENDPOINT${geminiModel(settings)}:generateContent")
                      .header("x-goog-api-key", settings.apiKey.trim())
                      .header("User-Agent", "BitChord/1.7.1")
                      .post(body.toString().toRequestBody("application/json".toMediaType()))
                      .build()
                  val response = try {
                      geminiContextClient.newCall(request).awaitBody()
                  } catch (cancelled: CancellationException) {
                      throw cancelled
                  } catch (_: IOException) {
                      return null
                  }
                  return runCatching {
                      val root = json.parseToJsonElement(response).jsonObject
                      root["candidates"]!!.jsonArray[0].jsonObject["content"]!!.jsonObject["parts"]!!.jsonArray
                          .joinToString("") { it.jsonObject["text"]?.jsonPrimitive?.contentOrNull.orEmpty() }
                          .trim()
                          .takeIf { it.isNotEmpty() }
                          ?.take(GEMINI_CONTEXT_MAX_CHARS)
                  }.getOrNull()
              }

          '''
          REVIEW = r'''    /**
               * Lượt rà xưng hô: một lời gọi riêng, chỉ có một việc là sửa đại từ lệch khỏi cặp đã chốt. Null khi lỗi hay
               * lệch số dòng, khi đó giữ bản dịch đầu.
               */
              private suspend fun reviewPronouns(
                  original: List<TextSlot>,
                  translated: List<String>,
                  plan: String,
                  settings: GeminiSettings,
              ): List<String>? {
                  val payload = buildJsonObject {
                      put("plan", plan)
                      putJsonArray("original") { original.forEach { add(JsonPrimitive(it.text)) } }
                      putJsonArray("translated") { translated.forEach { add(JsonPrimitive(it)) } }
                  }
                  val body = buildJsonObject {
                      putJsonObject("systemInstruction") {
                          putJsonArray("parts") { addJsonObject { put("text", GEMINI_REVIEW_INSTRUCTION) } }
                      }
                      putJsonArray("contents") {
                          addJsonObject {
                              put("role", "user")
                              putJsonArray("parts") { addJsonObject { put("text", payload.toString()) } }
                          }
                      }
                      putJsonArray("safetySettings") {
                          listOf(
                              "HARM_CATEGORY_HARASSMENT",
                              "HARM_CATEGORY_HATE_SPEECH",
                              "HARM_CATEGORY_SEXUALLY_EXPLICIT",
                              "HARM_CATEGORY_DANGEROUS_CONTENT",
                          ).forEach { category ->
                              addJsonObject {
                                  put("category", category)
                                  put("threshold", "BLOCK_NONE")
                              }
                          }
                      }
                      putJsonObject("generationConfig") {
                          put("temperature", 0.1)
                          put("responseMimeType", "application/json")
                          putJsonObject("responseSchema") {
                              put("type", "OBJECT")
                              putJsonObject("properties") {
                                  putJsonObject("lines") {
                                      put("type", "ARRAY")
                                      putJsonObject("items") { put("type", "STRING") }
                                  }
                              }
                              putJsonArray("required") { add(JsonPrimitive("lines")) }
                          }
                      }
                  }
                  val request = Request.Builder()
                      .url("$GEMINI_ENDPOINT${geminiModel(settings)}:generateContent")
                      .header("x-goog-api-key", settings.apiKey.trim())
                      .header("User-Agent", "BitChord/1.7.1")
                      .post(body.toString().toRequestBody("application/json".toMediaType()))
                      .build()
                  val response = try {
                      geminiReviewClient.newCall(request).awaitBody()
                  } catch (cancelled: CancellationException) {
                      throw cancelled
                  } catch (_: IOException) {
                      return null
                  }
                  return runCatching {
                      val root = json.parseToJsonElement(response).jsonObject
                      val text = root["candidates"]!!.jsonArray[0].jsonObject["content"]!!.jsonObject["parts"]!!.jsonArray
                          .joinToString("") { it.jsonObject["text"]?.jsonPrimitive?.contentOrNull.orEmpty() }
                      val lines = json.parseToJsonElement(text).jsonObject["lines"]!!.jsonArray.map { it.jsonPrimitive.content.trim() }
                      lines.takeIf { it.size == translated.size && it.none { line -> line.isBlank() } }
                  }.getOrNull()
              }

          '''
          HELPERS = HELPERS + REVIEW
          helper_lines = [l[4:] if l.startswith("    ") else l for l in HELPERS.rstrip("\n").split("\n")] + [""]
          src = insert_before(src, "private class GeminiAnswer(", helper_lines, "helpers")

          # ---------------------------------------------------------------------------------------------
          # 6b) GeminiAnswer mang theo "plan" (cặp xưng hô + phân tích) để lượt rà và các đoạn sau dùng lại
          # ---------------------------------------------------------------------------------------------
          src = once(
              src,
              "private class GeminiAnswer(val texts: List<String>, val sourceLanguage: String)",
              "private class GeminiAnswer(val texts: List<String>, val sourceLanguage: String, val plan: String = \"\")",
              "GeminiAnswer",
          )
          src = insert_after(src, 'val source = answer["source"]?.jsonPrimitive?.contentOrNull.orEmpty()', [
              "val plan = listOfNotNull(",
              '    answer["pair"]?.jsonPrimitive?.contentOrNull?.takeIf { it.isNotBlank() }?.let { "Cặp xưng hô đã chốt: " + it },',
              '    answer["analysis"]?.jsonPrimitive?.contentOrNull?.takeIf { it.isNotBlank() }?.let { "Phân tích: " + it },',
              ').joinToString("\\n")',
          ], "đọc plan")

          # ---------------------------------------------------------------------------------------------
          # 7) Dòng Gemini trả về rỗng: giữ lại dòng gốc thay vì bỏ cả bài rồi rơi về Google Dịch
          # ---------------------------------------------------------------------------------------------
          src = once(
              src,
              "if (translated.size != slots.size || translated.any { it.isBlank() }) return@runCatching null",
              "if (translated.size != slots.size) return@runCatching null",
              "kiểm tra dòng rỗng",
          )
          src = once(
              src,
              "GeminiAnswer(translated, source)",
              "GeminiAnswer(translated.mapIndexed { index, text -> text.ifBlank { slots[index].text } }, source, plan)",
              "dòng rỗng giữ gốc",
          )

          # ---------------------------------------------------------------------------------------------
          # 8) Bản dịch cũ trong cache (làm bằng prompt cũ) không còn dùng: tăng phiên bản cache
          # ---------------------------------------------------------------------------------------------
          src = once(src, "CACHE_VERSION = 3", "CACHE_VERSION = 4", "CACHE_VERSION")

          # ---------------------------------------------------------------------------------------------
          # Kiểm tra: ngoặc phải cân bằng như trước, các khối mới phải có mặt
          # ---------------------------------------------------------------------------------------------
          if src.count("{") - src.count("}") != BRACES_BEFORE:
              sys.exit("::error::Sau khi vá, số ngoặc nhọn bị lệch, dừng lại để khỏi build hỏng.")
          if src.count("(") - src.count(")") != PARENS_BEFORE:
              sys.exit("::error::Sau khi vá, số ngoặc tròn bị lệch, dừng lại để khỏi build hỏng.")
          for must in ("withSongNotes(instruction, context)", "researchSong(slots, settings)", "geminiContextClient", "planFirst", "CACHE_VERSION = 4"):
              if must not in src:
                  sys.exit(f"::error::Thiếu '{must}' sau khi vá.")

          open(PATH, "w", encoding="utf8").write(src)
          print("Đã vá LyricsTranslation.kt (v3): xưng hô chốt trước (analysis + pair), lượt rà xưng hô riêng, "
                "timeout 150s, dòng rỗng giữ gốc, cache v4, temperature 0.4, safetySettings BLOCK_NONE.")
          VI_EOF
          python3 "$RUNNER_TEMP/vi_prompt.py"
          {
            echo "## Gemini dịch lời: prompt dịch giả tiếng Việt v3"
            echo
            echo "- Chốt xưng hô trước (analysis + pair), rồi một lượt rà xưng hô riêng sau khi dịch"
            echo "- Bài dài chia nhiều đoạn: cặp xưng hô đã chốt ở đoạn trước được truyền sang đoạn sau"
            echo "- Tra cứu bài hát bằng Google Search: ${USE_SEARCH}"
            echo "- Timeout dịch 150 giây, rà 60 giây, tra cứu 75 giây"
            echo "- temperature = 0.4, safetySettings = BLOCK_NONE (4 mục), cache v4"
            echo
            git status --short | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pick a build number newer than every existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # "Bit Dev APK" dùng run_number của nó làm số bản dựng. Lấy số lớn hơn mọi tag hiện có để versionCode
          # luôn cao hơn bản đang cài, nếu không Android từ chối cài đè (coi là hạ phiên bản).
          LAST="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' 2>/dev/null | grep -oE '[0-9]+$' | sort -n | tail -n 1 || true)"
          N="$GITHUB_RUN_NUMBER"
          if [ -n "$LAST" ] && [ "$LAST" -ge "$N" ]; then N=$((LAST + 1)); fi
          echo "BUILD_N=$N" >> "$GITHUB_ENV"
          echo "Số bản dựng: $N (số lớn nhất trong các tag trước đó: ${LAST:-không có})" >> "$GITHUB_STEP_SUMMARY"

      - name: Patch (rename, version, updater)
        env:
          RUN: ${{ env.BUILD_N }}
        run: |
          sed -i 's/com\.dev\.bitchord/com.bit.dev/g; s/BitChord Dev/Bit Dev/g' \
            app/build.gradle.kts app/src/dev/AndroidManifest.xml wearos/build.gradle.kts tv/build.gradle.kts
          sed -i '/UPDATE_APK_PREFIX/s/BitChord-/Bit-/' app/build.gradle.kts
          sed -i 's#repos/[A-Za-z0-9_-]*/[A-Za-z0-9_-]*/releases/latest#repos/${{ github.repository }}/releases/latest#' \
            app/src/main/java/com/music/bitchord/data/AppUpdateChecker.kt
          python3 - <<'PY'
          import os, re
          run = int(os.environ["RUN"])
          s = open("build.gradle.kts").read()
          m = re.search(r'(?:bitchordVersionName"\] = |baseVersion = )"([0-9.]+)"', s)
          ver = f"{m.group(1)}.{run}"
          s = re.sub(r'extra\["bitchordVersionCode"\][^\n]*', f'extra["bitchordVersionCode"] = {39 + run}', s)
          s = re.sub(r'extra\["bitchordVersionName"\] = [^\n]*(\n    if [^\n]*)?',
                     f'extra["bitchordVersionName"] = "{ver}"', s)
          open("build.gradle.kts", "w").write(s)
          open(os.environ["GITHUB_ENV"], "a").write(f"VER={ver}\n")
          PY

      # Neu repo co secret thi dung secret, khong thi dung key dev nhung san ben duoi.

      - name: Setup Secrets (Keystore & local.properties)
        env:
          S_LASTFM_KEY: ${{ secrets.LASTFM_API_KEY }}
          S_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          S_LISTEN: ${{ secrets.LISTEN_TOGETHER_SERVER }}
          S_KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          S_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "LASTFM_API_KEY=$S_LASTFM_KEY"
            echo "LASTFM_SECRET=$S_LASTFM_SECRET"
            echo "LISTEN_TOGETHER_SERVER=$S_LISTEN"
          } > local.properties
          KS_B64="$S_KS_B64"; KS_PASS="$S_KS_PASS"; KEY_ALIAS="$S_KEY_ALIAS"; KEY_PASS="$S_KEY_PASS"
          if [ -z "$KS_B64" ]; then
            KS_B64=''
            KS_PASS='M8rnSCC3C4TkChAh'
            KEY_ALIAS='bitdev'
            KEY_PASS='M8rnSCC3C4TkChAh'
          fi
          echo "$KS_B64" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      - run: chmod +x gradlew
      - name: Pre-fetch libusb (GitHub release downloads keep returning 504)
        run: |
          # CMake tai libusb 1.0.27 tu trang release cua GitHub luc cau hinh, va trang do dang tra 504.
          # Thu lan luot: GitHub, SourceForge, kho goi Debian (cung mot file, kiem tra bang ma bam SHA256 ma
          # CMakeLists da ghim). Het cach thi git clone dung tag v1.0.27 va dong goi lai (khi do bo dong ghim ma bam).
          D="$HOME/libusb-cache"
          F="$D/libusb-1.0.27.tar.bz2"
          SHA="ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575"
          GH="https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2"
          CM=app/src/main/cpp/CMakeLists.txt
          mkdir -p "$D"
          OK=0
          for round in 1 2; do
            for U in "$GH" \
                     "https://downloads.sourceforge.net/project/libusb/libusb-1.0/libusb-1.0.27/libusb-1.0.27.tar.bz2" \
                     "https://deb.debian.org/debian/pool/main/libu/libusb-1.0/libusb-1.0_1.0.27.orig.tar.bz2"; do
              if curl -fsSL --retry 2 --retry-delay 3 --max-time 120 -o "$F" "$U" \
                 && echo "$SHA  $F" | sha256sum -c - > /dev/null 2>&1; then
                echo "Da tai libusb tu: $U"
                OK=1
                break 2
              fi
              echo "Khong tai duoc (hoac sai ma bam) tu: $U"
              rm -f "$F"
            done
            sleep 15
          done
          if [ "$OK" = 1 ]; then
            sed -i "s#$GH#file://$F#" "$CM"
          else
            echo "Ca ba nguon tai deu hong, thu git clone tag v1.0.27"
            for i in 1 2 3; do
              rm -rf "$D/libusb-1.0.27"
              if git clone --depth 1 --branch v1.0.27 https://github.com/libusb/libusb.git "$D/libusb-1.0.27"; then
                rm -rf "$D/libusb-1.0.27/.git"
                tar -C "$D" -cjf "$D/libusb-git.tar.bz2" libusb-1.0.27
                # Ban dong goi lai khong cung ma bam voi ban phat hanh, nen bo dong ghim ma bam.
                sed -i "s#$GH#file://$D/libusb-git.tar.bz2#; s#URL_HASH SHA256=$SHA)#)#" "$CM"
                echo "Da dung libusb tu git clone"
                break
              fi
              sleep 20
            done
          fi
          sed -n '/FetchContent_Declare(libusb/,/FetchContent_MakeAvailable(libusb)/p' "$CM"

      - name: Build the dev release APK (thu lai khi GitHub tra loi loi tam thoi)
        run: |
          for attempt in 1 2 3; do
            if ./gradlew assembleDevRelease; then
              exit 0
            fi
            echo "Build attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: bit-dev-gemini-arm64
          path: app/build/outputs/apk/dev/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/dev/release/*.apk | head -1)
          # Tên file phải bắt đầu bằng UPDATE_APK_PREFIX ("Bit-") thì hộp thoại cập nhật trong app mới nhận.
          cp "$APK" "Bit-v${VER}_arm64-v8a.apk"
          gh release delete "v${VER}" --cleanup-tag --yes || true
          gh release create "v${VER}" "Bit-v${VER}_arm64-v8a.apk" \
            --target "$GITHUB_SHA" --latest --title "Bit Dev v${VER}" \
            --notes "Build #${{ github.run_number }}: dịch lời bằng Gemini với prompt dịch giả tiếng Việt (BLOCK_NONE, temperature 0.7). Cùng app Bit Dev, cài đè lên bản cũ. Cài đặt, Dịch lời bằng Gemini, dán mã API."
          echo "Đã đăng lên Releases: v${VER}" >> "$GITHUB_STEP_SUMMARY"
