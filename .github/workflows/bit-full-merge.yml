                      }
          '''),
                  (r'''/** The cover at its own resolution, easing smaller while the music is paused. */
          ''', r'''/**
           * The soft edge of a boxed Canvas clip: the same blurred copy of the cover as the backdrop's own, laid over
           * the clip's top and bottom edges and fading out inward, so the clip dissolves into the backdrop like a
           * square cover does. A video texture takes no mask, so the soft copy goes over it. Above and below the clip it
           * is identical to the backdrop, so it shows no seam there.
           */
          @Composable
          private fun LockClipFeather(url: String?, aspect: Float) {
              val context = LocalContext.current
              val saturate = remember { ColorFilter.colorMatrix(ColorMatrix().apply { setToSaturation(1.25f) }) }
              Box(
                  Modifier
                      .fillMaxSize()
                      .graphicsLayer { compositingStrategy = CompositingStrategy.Offscreen }
                      .drawWithContent {
                          drawContent()
                          val h = size.height
                          val clipH = size.width * CoverWidthFrac / aspect
                          val clipTop = (h - clipH) * (1f + CoverVerticalBias) / 2f
                          val clipBottom = clipTop + clipH
                          drawRect(
                              clipFeatherBrush(
                                  clipTop / h,
                                  (clipTop + clipH * CoverFeatherTop) / h,
                                  (clipBottom - clipH * CoverFeatherBottom) / h,
                                  clipBottom / h,
                              ),
                              blendMode = BlendMode.DstIn,
                          )
                      },
              ) {
                  AsyncImage(
                      model = remember(url) { ImageRequest.Builder(context).data(url).size(360, 360).build() },
                      contentDescription = null,
                      contentScale = ContentScale.Crop,
                      colorFilter = saturate,
                      modifier = Modifier.fillMaxSize().blur(36.dp),
                  )
              }
          }

          /** Opaque down to the clip's top edge, easing to clear inside it; clear, then easing back to opaque at its bottom edge. */
          private fun clipFeatherBrush(topEdge: Float, topEnd: Float, bottomStart: Float, bottomEdge: Float): Brush {
              val steps = 10
              fun at(x: Float) = x.coerceIn(0f, 1f)
              val stops = ArrayList<Pair<Float, Color>>()
              stops += 0f to Color.Black
              for (i in 0..steps) {
                  val k = i / steps.toFloat()
                  stops += at(topEdge + k * (topEnd - topEdge)) to Color.Black.copy(alpha = 1f - smoothstep(k))
              }
              for (i in 0..steps) {
                  val k = i / steps.toFloat()
                  stops += at(bottomStart + k * (bottomEdge - bottomStart)) to Color.Black.copy(alpha = smoothstep(k))
              }
              stops += 1f to Color.Black
              return Brush.verticalGradient(*stops.toTypedArray())
          }

          /** The cover at its own resolution, easing smaller while the music is paused. */
          '''),
              ]
