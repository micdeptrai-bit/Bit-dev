name: Gộp tất cả tính năng - Automix chỉnh tay + không đổi tốc độ + tách giọng + Gemini xưng hô + màn khóa v2 (APK, cập nhật đè)

# Chạy tay: tab Actions -> chọn workflow này -> Run workflow. Không commit gì vào repo.
#
# VIỆC NÓ LÀM: GitHub tự gộp mọi tính năng rồi build MỘT APK, theo thứ tự:
#   1. Dựng chuỗi all-in-one (Automix, Canvas, màn khoá, AI DJ, engine native) từ file chain_file.
#   2. Chạy lại đúng các bước của file base_file (automix-manual-mix): ghi và áp patch chỉnh tay điểm mix,
#      patch không đổi tốc độ, patch tách giọng, patch nối tách giọng vào mix, rồi hai bài test native.
#      Mỗi patch bật/tắt bằng input no_speedup / stem_separation / stem_mix (mặc định bật hết).
#   2b. Màn khoá Liquid Glass v2: lấy đúng bước "Màn hình khóa v2" từ lockscreen_file (bản ALL-IN-ONE release) và chạy
#      NGAY SAU khi các patch ở bước 2 đã áp. Phải đặt sau, vì bước đó thêm chuỗi vào strings.xml và nếu chạy trước thì
#      patch chỉnh tay điểm mix bị lệch ngữ cảnh ở strings.xml (đã chạy thử, lỗi "patch does not apply"). Tắt bằng lockscreen_v2.
#   3. Áp prompt dịch lời tiếng Việt cho Gemini (nhận diện xưng hô + lượt rà xưng hô).
#   4. Kiểm tra từng tính năng đã vào cây mã nguồn (thiếu cái nào là DỪNG ngay, không build ra APK thiếu tính năng),
#      đặt tên gói + số phiên bản giống app đang cài, ký, build, kiểm tra APK cài đè được, đăng lên Releases.
# Màn khoá cũ của chuỗi all-in-one vẫn nằm trong chuỗi; bước v2 ghi đè lên nó đúng như workflow ALL-IN-ONE đang làm,
# nên KHÔNG có bản thứ hai (thêm bản thứ ba là lỗi Duplicate resources lock_screen_player).
#
# PHỤ THUỘC: trong .github/workflows phải có base_file, chain_file và lockscreen_file. Tên file được dò linh hoạt:
# thừa khoảng trắng hoặc hậu tố " (2)" (do tải về đổi tên) vẫn tìm ra. Đừng đổi tên các bước "Rebuild the all-in-one features",
# "Write the patch*", "Apply the patches", "Commit the patch locally", "Native self-test*" trong base_file và bước
# "Màn hình khóa v2*" trong lockscreen_file, workflow này tìm chúng theo tên.
# Không có tên "điểm mix" trong dòng name ở trên là CỐ Ý: dev-benchmark tìm file automix-manual-mix theo cụm đó.
# Workflow này thay cho cả hai file gemini-vi-lyrics-lite và automix-manual-mix khi bạn cần đủ cả bộ; không chạy chung với chúng.

on:
  workflow_dispatch:
    inputs:
      base_file:
        description: "Workflow chứa các patch chỉnh tay / không đổi tốc độ / tách giọng (trong .github/workflows)"
        type: string
        default: "automix-manual-mix.yml"
      chain_file:
        description: "Workflow all-in-one mà base_file cần (trong .github/workflows)"
        type: string
        default: "automix-all-in-one.yml"
      lockscreen_v2:
        description: "Màn khoá Liquid Glass v2 (đồng hồ mới có Leon), lấy từ lockscreen_file. Tắt nếu build lỗi để về màn khoá cũ"
        type: boolean
        default: true
      lockscreen_file:
        description: "Workflow ALL-IN-ONE release chứa bước Màn hình khóa v2 (trong .github/workflows)"
        type: string
        default: "bit-all-in-one-release.yml"
      canvas_fit:
        description: "Ảnh bìa động vuông (Apple motion artwork...) ở màn khoá hiện đúng tỉ lệ, thấy trọn ảnh như ảnh bìa tĩnh, không phóng to cắt kín màn hình. Canvas của Spotify (clip dọc) GIỮ NGUYÊN. Cần lockscreen_v2"
        type: boolean
        default: true
      transparent_player:
        description: "Thẻ trình phát ở màn khoá trong suốt như thẻ đồng hồ (bỏ lớp nền màu cover đặc). Cần lockscreen_v2. Tắt = thẻ màu cover như cũ"
        type: boolean
        default: true
      no_speedup:
        description: "Gộp patch không tua nhanh: Automix không đổi tốc độ nhạc khi chuyển bài"
        type: boolean
        default: true
      stem_separation:
        description: "Gộp patch tách giọng / nhạc nền (open-unmix)"
        type: boolean
        default: true
      stem_mix:
        description: "Nối tách giọng vào Automix: giọng bài cũ ra trước, giọng bài mới vào sau (cần stem_separation)"
        type: boolean
        default: true
      use_search:
        description: "Tra cứu bài hát bằng Google Search trước khi dịch (chính xác hơn nhưng chậm hơn, tốn quota). Tắt = nhanh hơn"
        type: boolean
        default: false
      review_pass:
        description: "Bật lượt rà xưng hô riêng sau khi dịch (chính xác hơn nhưng tốn thêm một lời gọi). Tắt = tiết kiệm token"
        type: boolean
        default: false
      thinking_budget:
        description: "Giới hạn token suy nghĩ của Gemini. Để trống = không đổi. Gemini Flash: 0 = tắt suy nghĩ, 1024 = nhẹ. Gemini Pro: không nhập 0"
        type: string
        default: ""
      installed_version:
        description: "Phiên bản app ĐANG CÀI trên máy (vd 1.9.1.42). Workflow đọc tên gói + versionCode từ APK của release v<phiên bản> này để cập nhật ĐÈ chứ không đẻ app mới. Để trống = theo release mới nhất"
        type: string
        default: ""
      package_name:
        description: "Tên gói của APK. Mặc định com.bit.dev = app tên Bit Dev. auto = đọc từ APK của release installed_version. Ép tay thì chọn đúng gói của app đang cài: Bit Dev = com.bit.dev | BitChord = com.music.bitchord | BitChord Dev = com.dev.bitchord"
        type: choice
        options:
          - com.bit.dev
          - auto
          - com.music.bitchord
          - com.dev.bitchord
        default: com.bit.dev
      publish_release:
        description: "Đăng APK lên mục Releases (cần để app cập nhật trong app được). Tắt = chỉ có file ở Artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bit-full-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BIT_DEV_BUILD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle


      - name: Decide the package name from the INSTALLED app (sai gói = Android cài thành app MỚI)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_PKG: ${{ inputs.package_name }}
          INSTALLED_VERSION: ${{ inputs.installed_version }}
        run: |
          set -uo pipefail
          set +e   # runner chạy bash với -e; tắt đi để lệnh ls/grep không tìm thấy gì không làm cả bước chết im lặng
          WANT_PKG="${WANT_PKG:-auto}"
          INST="${INSTALLED_VERSION:-}"; INST="${INST//[[:space:]]/}"; INST="${INST#v}"
          if [ -n "$INST" ] && ! [[ "$INST" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::installed_version '$INST' sai định dạng (ví dụ đúng: 1.9.1.31)."
            exit 1
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2="$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$AAPT2" ]; then
            AAPT2="$(find /usr/local/lib/android /opt /usr/lib/android-sdk -name aapt2 -type f 2>/dev/null | sort -V | tail -n 1)"
          fi
          echo "SDK=$SDK | aapt2=${AAPT2:-không thấy}"
          if [ -z "$AAPT2" ]; then
            if [ "$WANT_PKG" = "auto" ]; then
              echo "::error::Không thấy aapt2 trên runner nên không đọc được tên gói của APK. Chọn tay package_name."
              exit 1
            fi
            echo "::warning::Không thấy aapt2 trên runner, bỏ qua bước đọc APK cũ, dùng gói chọn tay."
          fi
          badge() { "$AAPT2" dump badging "$1" 2>/dev/null; }
          apk_pkg() { badge "$1" | grep -oP "package: name='\K[^']+" | head -n 1; }
          apk_code() { badge "$1" | grep -oP "versionCode='\K[0-9]+" | head -n 1; }

          # 1) APK của đúng bản đang cài (release tag v<installed_version>): tên gói + versionCode của app trên máy.
          REF_PKG=""; REF_CODE=0
          if [ -n "$INST" ] && [ -n "$AAPT2" ]; then
            RD="$RUNNER_TEMP/installed-apk"; rm -rf "$RD"; mkdir -p "$RD"
            # Thử tag v<ver> và <ver>; không có thì tìm release nào có tag / tên / tên file chứa đúng số phiên bản.
            TAGS_TRY="v$INST $INST"
            FOUND_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[] | select(((.tag_name // "") + " " + (.name // "") + " " + ([.assets[].name] | join(" "))) | contains("'"$INST"'")) | .tag_name' 2>/dev/null | head -n 1)"
            if [ -n "$FOUND_TAG" ]; then TAGS_TRY="$FOUND_TAG $TAGS_TRY"; fi
            for T in $TAGS_TRY; do
              gh release download "$T" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RD" --clobber > /dev/null 2>&1 && break
            done
            RF="$(ls "$RD"/Bit-*.apk "$RD"/*.apk 2>/dev/null | head -n 1)"
            if [ -n "$RF" ]; then
              REF_PKG="$(apk_pkg "$RF")"; REF_CODE="$(apk_code "$RF")"; REF_CODE="${REF_CODE:-0}"
              echo "REF_APK=$RF" >> "$GITHUB_ENV"
            fi
          fi

          # 2) Chọn gói: chọn tay > gói của bản đang cài > gói của release mới nhất.
          PKG=""; SRC=""
          if [ "$WANT_PKG" != "auto" ]; then
            PKG="$WANT_PKG"; SRC="chọn tay ở input package_name"
          elif [ -n "$REF_PKG" ]; then
            PKG="$REF_PKG"; SRC="đọc từ APK của release v$INST (bản đang cài trên máy)"
          elif [ -n "$INST" ]; then
            REL="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 2>&1 | head -n 40)"
            echo "Các release hiện có trong repo:"; echo "$REL"
            {
              echo "### Không thấy APK của bản đang cài v$INST"
              echo "Release hiện có trong repo:"
              echo '```'; echo "$REL"; echo '```'
              echo "Cách làm: chạy lại và chọn package_name theo TÊN app trên máy: Bit Dev = com.bit.dev | BitChord = com.music.bitchord | BitChord Dev = com.dev.bitchord. Hoặc sửa installed_version cho đúng một phiên bản có trong danh sách trên."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Không thấy release nào chứa APK của v$INST nên không biết app trên máy là gói nào. Chạy lại và chọn tay package_name (theo tên app trên máy), hoặc sửa installed_version. Danh sách release ở trên và ở Summary."
            exit 1
          fi

          # 3) APK của release mới nhất: dùng làm gói dự phòng (khi installed_version để trống) và để biết versionCode cao nhất cùng gói.
          LAT_PKG=""; LAT_CODE=0
          if [ -n "$AAPT2" ]; then
            LD="$RUNNER_TEMP/latest-apk"; rm -rf "$LD"; mkdir -p "$LD"
            if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'Bit-*.apk' --dir "$LD" --clobber > /dev/null 2>&1; then
              LF="$(ls "$LD"/*.apk 2>/dev/null | head -n 1)"
              if [ -n "$LF" ]; then LAT_PKG="$(apk_pkg "$LF")"; LAT_CODE="$(apk_code "$LF")"; LAT_CODE="${LAT_CODE:-0}"; fi
            fi
          fi
          if [ -z "$PKG" ]; then
            if [ -n "$LAT_PKG" ]; then
              PKG="$LAT_PKG"; SRC="đọc từ APK của release mới nhất"
            else
              PKG="com.bit.dev"; SRC="mặc định (không đọc được APK nào)"
              echo "::warning::Không đọc được tên gói từ release nào, dùng mặc định com.bit.dev. Nếu app trên máy là gói khác, chạy lại và chọn tay package_name."
            fi
          fi
          if ! [[ "$PKG" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "::error::Tên gói '$PKG' không hợp lệ."
            exit 1
          fi

          # 4) versionCode phải cao hơn mọi bản cùng gói đã biết (bản đang cài + release mới nhất), nếu không Android báo hạ phiên bản.
          MAXC=0
          if [ "$REF_PKG" = "$PKG" ] && (( REF_CODE > MAXC )); then MAXC=$REF_CODE; fi
          if [ "$LAT_PKG" = "$PKG" ] && (( LAT_CODE > MAXC )); then MAXC=$LAT_CODE; fi
          MIN_CODE=0; if (( MAXC > 0 )); then MIN_CODE=$(( MAXC + 1 )); fi

          echo "APP_PKG=$PKG" >> "$GITHUB_ENV"
          echo "MIN_CODE=$MIN_CODE" >> "$GITHUB_ENV"
          {
            echo "- Tên gói của APK: $PKG ($SRC). App trên máy phải cùng gói này thì mới cập nhật đè, khác gói là Android cài thêm app mới."
            echo "- Bản đang cài (installed_version): ${INST:-không khai} | gói đọc được: ${REF_PKG:-?} (versionCode ${REF_CODE}) | release mới nhất: gói ${LAT_PKG:-?} (versionCode ${LAT_CODE}) | versionCode tối thiểu cho bản này: ${MIN_CODE}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Tên gói: $PKG ($SRC) | versionCode tối thiểu: $MIN_CODE"
          if [ -n "$REF_PKG" ] && [ -n "$LAT_PKG" ] && [ "$REF_PKG" != "$LAT_PKG" ]; then
            echo "::warning::Release mới nhất ($LAT_PKG) KHÁC gói bản đang cài ($REF_PKG): có workflow khác đã đăng APK gói khác vào kênh cập nhật. Bản build lần này dùng gói $PKG."
          fi


      - name: Merge all features (all-in-one + chỉnh tay + không đổi tốc độ + tách giọng)
        shell: bash
        env:
          BASE_FILE: ${{ inputs.base_file }}
          CHAIN_FILE: ${{ inputs.chain_file }}
          LOCKSCREEN_V2: ${{ inputs.lockscreen_v2 }}
          LOCKSCREEN_FILE: ${{ inputs.lockscreen_file }}
          TRANSPARENT_PLAYER: ${{ inputs.transparent_player }}
          CANVAS_FIT: ${{ inputs.canvas_fit }}
          NO_SPEEDUP: ${{ inputs.no_speedup }}
          STEM_SEP: ${{ inputs.stem_separation }}
          STEM_MIX_IN: ${{ inputs.stem_mix }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/merge.py" <<'MERGE_EOF'
          import os, re, subprocess, sys, unicodedata

          try:
              import yaml
          except ImportError:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "--break-system-packages", "pyyaml"])
              import yaml

          WF = os.path.join(".github", "workflows")


          def resolve(label, name):
              # Tìm file workflow theo tên; chịu được khoảng trắng thừa và hậu tố " (2)" do tải về đổi tên.
              name = (name or "").strip()
              if name and os.path.isfile(os.path.join(WF, name)):
                  return name
              def norm(s): return re.sub(r"\s+|\(\d+\)", "", s).lower()
              want = norm(name)
              hits = sorted((f for f in os.listdir(WF) if want and norm(f) == want), key=lambda f: (len(f), f))
              if not hits:
                  sys.exit(f"::error::Không thấy .github/workflows/{name} (input {label}). Các file đang có: {', '.join(sorted(os.listdir(WF)))}")
              print(f"Input {label} = '{name}' không có đúng tên đó, dùng '{hits[0]}'.", flush=True)
              return hits[0]


          def flag(v): return "true" if str(v).strip().lower() == "true" else "false"


          name = resolve("base_file", os.environ["BASE_FILE"])
          chain = resolve("chain_file", os.environ["CHAIN_FILE"])
          path = os.path.join(WF, name)
          INPUTS = {
              "chain_file": chain,
              "no_speedup": flag(os.environ["NO_SPEEDUP"]),
              "stem_separation": flag(os.environ["STEM_SEP"]),
              "stem_mix": flag(os.environ["STEM_MIX_IN"]),
              "lockscreen_v2": flag(os.environ["LOCKSCREEN_V2"]),
              "transparent_player": flag(os.environ["TRANSPARENT_PLAYER"]),
              "canvas_fit": flag(os.environ["CANVAS_FIT"]),
          }
          # stem_mix cần chính khả năng tách giọng
          if INPUTS["stem_separation"] != "true":
              INPUTS["stem_mix"] = "false"
          print("Công tắc:", {k: v for k, v in INPUTS.items() if k != "chain_file"}, "| chuỗi all-in-one:", chain, flush=True)

          EXPR = "$" + "{{"
          REF = re.compile(r"\$\{\{\s*inputs\.(\w+)\s*\}\}")


          def sub(text):
              def one(m):
                  k = m.group(1)
                  if k not in INPUTS:
                      sys.exit(f"::error::{name} dùng input '{k}' mà workflow gộp chưa biết. Gửi lại file đó để mình chỉnh.")
                  return INPUTS[k]
              out = REF.sub(one, text)
              if EXPR in out:
                  sys.exit(f"::error::Còn biểu thức GitHub chưa xử lý được trong: {out[:80]!r}")
              return out


          def should_run(cond):
              if cond is None:
                  return True
              c = str(cond).strip()
              m = re.fullmatch(r"\$\{\{\s*(inputs\.\w+(?:\s*&&\s*inputs\.\w+)*)\s*\}\}", c)
              if not m:
                  print(f"::warning::Điều kiện lạ '{c}', cứ chạy bước này.")
                  return True
              for part in re.split(r"\s*&&\s*", m.group(1)):
                  k = part.split(".", 1)[1]
                  if INPUTS.get(k, "false") != "true":
                      return False
              return True


          def nfc(s): return unicodedata.normalize("NFC", str(s or ""))


          def make_player_transparent():
              # Thẻ trình phát v2 vẽ một bản cover làm mờ + tăng bão hoà ngay trong thẻ nên ra màu đỏ/cam đặc.
              # Bỏ lớp đó (showCover = false) và giảm lớp phủ đen: thẻ chỉ còn kính trong như thẻ đồng hồ.
              d = os.path.join("app", "src", "main", "java", "com", "music", "bitchord", "lockscreen")
              def edit(fname, pairs):
                  p = os.path.join(d, fname)
                  s = open(p, encoding="utf8").read()
                  for old, new in pairs:
                      n = s.count(old)
                      if n != 1:
                          sys.exit(f"::error::Thẻ trình phát trong suốt: {fname} có {n} chỗ khớp với {old[:48]!r} (cần đúng 1). Tắt transparent_player hoặc gửi lại file màn khoá.")
                      s = s.replace(old, new)
                  open(p, "w", encoding="utf8").write(s)
              edit("LockGlass.kt", [
                  ("    tint: Float = 0.20f,\n    contentPadding", "    tint: Float = 0.20f,\n    showCover: Boolean = true,\n    contentPadding"),
                  ("        if (glass.width > 0 && glass.height > 0) {\n            GlassBackdropCopy", "        if (showCover && glass.width > 0 && glass.height > 0) {\n            GlassBackdropCopy"),
              ])
              edit("LockTransport.kt", [
                  ("        shape = shape,\n        modifier = modifier\n            .fillMaxWidth()\n            .padding(horizontal = 28.dp),",
                   "        shape = shape,\n        tint = 0.10f,\n        showCover = false,\n        modifier = modifier\n            .fillMaxWidth()\n            .padding(horizontal = 28.dp),"),
              ])

          def make_canvas_fit():
              # Màn khoá phát ảnh bìa động vuông (Apple motion artwork...) bằng chế độ CROP kín màn hình dọc nên bị phóng 2-3 lần.
              # Cách mới: clip vuông nằm đúng tỉ lệ trên chiều ngang như ảnh bìa tĩnh, hai mép trên/dưới tan vào bản cover làm mờ.
              # Canvas của Spotify (CanvasSource.SPOTIFY, clip dọc làm cho màn điện thoại) KHÔNG bị đụng tới: vẫn kín màn hình như cũ.
              p = os.path.join("app", "src", "main", "java", "com", "music", "bitchord", "lockscreen", "LockScreenActivity.kt")
              s = open(p, encoding="utf8").read()
              pairs = [
                  (r'''    val canvasClip = canvas
          ''', r'''    val canvasClip = canvas
              // The Canvas clip's own aspect: 0 until the decoder reports it.
              var canvasAspect by remember(canvasClip) { mutableStateOf(0f) }
              // Spotify's Canvas is a vertical clip made for a phone screen: it keeps filling the screen exactly as before.
              // The other providers' animated covers (Apple's motion artwork and the like) are square, and are shown at
              // their own proportions across the width, like a square cover, instead of being cropped to fill a tall
              // screen and magnified two or three times over.
              val canvasBoxed = canvasClip != null &&
                  canvasClip.source != com.music.bitchord.data.canvas.CanvasSource.SPOTIFY &&
