          src = once(src, "CACHE_VERSION = 3", "CACHE_VERSION = 5", "CACHE_VERSION")

          # ---------------------------------------------------------------------------------------------
          # Kiểm tra: ngoặc phải cân bằng như trước, các khối mới phải có mặt
          # ---------------------------------------------------------------------------------------------
          if src.count("{") - src.count("}") != BRACES_BEFORE:
              sys.exit("::error::Sau khi vá, số ngoặc nhọn bị lệch, dừng lại để khỏi build hỏng.")
          if src.count("(") - src.count(")") != PARENS_BEFORE:
              sys.exit("::error::Sau khi vá, số ngoặc tròn bị lệch, dừng lại để khỏi build hỏng.")
          for must in ("withSongNotes(instruction, context)", "researchSong(slots, settings)", "geminiContextClient", "planFirst", "CACHE_VERSION = 5", "GEMINI_USE_REVIEW", "GEMINI_VI_PRONOUN_PLAN", "GEMINI_VI_PRONOUN_FORMS"):
              if must not in src:
                  sys.exit(f"::error::Thiếu '{must}' sau khi vá.")

          open(PATH, "w", encoding="utf8").write(src)
          print("Đã vá LyricsTranslation.kt (v4): nhận diện người hát/người nghe + chọn cặp xưng hô, lượt rà xưng hô riêng, "
                "timeout 150s, dòng rỗng giữ gốc, cache v5, temperature 0.3, safetySettings BLOCK_NONE.")
          VI_EOF
          python3 "$RUNNER_TEMP/vi_prompt.py"
          {
