name: "Tối ưu & dọn rác repo (ảnh lossless, file rác, runs/cache/artifact cũ)"

# ======================================================================================
# MỘT FILE, tự chạy mỗi Chủ nhật 03:17 UTC, hoặc chạy tay: Actions -> workflow này -> Run workflow.
#
# NGUYÊN TẮC: chỉ dọn RÁC, KHÔNG cắt tính năng, KHÔNG giới hạn gì, KHÔNG đụng logic code.
#   - Mọi thay đổi vào repo đi qua một Pull Request (nhánh bot/repo-optimize) để bạn xem rồi mới merge.
#   - Không bao giờ sửa/xoá .github/workflows/* (GitHub cũng cấm GITHUB_TOKEN làm việc đó).
#   - Không xoá/sửa Releases cũ (app tự cập nhật đọc APK từ Releases). Chỉ THÊM release mới ở JOB 3.
#
# JOB 1 - github-cleanup (dọn thứ chỉ nằm trên GitHub, không đổi mã nguồn)
#   * Xoá workflow run đã xong, cũ hơn N ngày, nhưng LUÔN giữ K run mới nhất của mỗi workflow.
#   * Xoá Actions cache lâu không dùng (mặc định 7 ngày).
#   * Xoá artifact (APK build thử, test-log...) cũ hơn N ngày. Mỗi APK ~70 MB nên chúng ăn dung lượng nhanh.
#   * Có ô dry_run: chỉ liệt kê, không xoá.
#
# JOB 2 - repo-optimize (dọn thứ nằm trong repo, mở PR nếu có thay đổi)
#   * File rác đang bị track: .DS_Store, Thumbs.db, *.orig, *.rej, *.bak, *.swp, *.log, *.hprof,
#     thư mục build/.gradle/.idea/.cxx/.kotlin/node_modules lỡ commit. Danh sách cố định, không đoán mò.
#   * Ảnh PNG/JPG nén LẠI KHÔNG MẤT CHẤT LƯỢNG (optipng -o3, jpegoptim không đụng chất lượng).
#     Mỗi ảnh được giải mã lại và so từng điểm ảnh với bản gốc; khác dù chỉ 1 điểm là trả về bản gốc.
#     Bỏ qua *.9.png (nine-patch), web/fixtures và .github.
#   * gradle.properties: thêm org.gradle.caching=true nếu chưa có (build CI nhanh hơn, ít CPU hơn).
#     Cố ý KHÔNG bật org.gradle.parallel vì project có task tự viết, chưa kiểm chứng được.
#
# JOB 3 - release (build + đăng Release để app tự cập nhật, không cần ký/cài tay)
#   * Sau khi dọn xong, gọi workflow "Bit Dev APK" (dev-benchmark (1).yml). Workflow đó tự build, tự ký bằng
#     khoá dev có sẵn trong file của nó, tự tính số bản kế tiếp rồi đăng Release mới (--latest).
#     Không cần tạo keystore hay thêm secret nào. Dùng đúng workflow đó nên cùng khoá ký -> app đang cài
#     cập nhật đè được, không phải gỡ ra cài lại.
#   * App mở lại (onStart) là hỏi releases/latest, thấy bản mới thì hiện popup -> tải -> cài (Android vẫn hiện
#     màn hình xác nhận cài của hệ thống, app thường không cài âm thầm được).
#   * Có thay đổi và đã đẩy nhánh bot/repo-optimize: build từ nhánh đó. Không có gì thay đổi: build từ nhánh hiện tại.
#   * Chạy tự động mỗi tuần thì chỉ release khi có thay đổi (tránh tuần nào cũng bắt người dùng cập nhật).
#     Chạy tay thì chọn ô release: always / if-changed / off.
#   * Build lỗi thì Bit Dev APK không đăng gì, app giữ nguyên bản cũ.
#
# KHÔNG LÀM (cố ý): không xoá font SF Pro, không xoá model ONNX, không xoá libffmpegJNI của ABI khác,
#   không minify JSON fixtures, không đổi tên các workflow "(1)/(2)" vì chúng tham chiếu lẫn nhau.
#
# YÊU CẦU 1 LẦN: Settings -> Actions -> General -> Workflow permissions: bật
#   "Allow GitHub Actions to create and approve pull requests". Chưa bật thì workflow vẫn đẩy nhánh
#   bot/repo-optimize và in link để bạn tự bấm tạo PR.
# ======================================================================================

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      clean_github:
        description: "Dọn workflow run / cache / artifact cũ trên GitHub"
        type: boolean
        default: true
      dry_run:
        description: "Chỉ liệt kê những gì sẽ xoá trên GitHub, không xoá thật"
        type: boolean
        default: false
      keep_runs:
        description: "Số run mới nhất luôn giữ lại cho MỖI workflow"
        type: string
        default: "10"
      older_than_days:
        description: "Run và artifact cũ hơn bao nhiêu ngày thì xoá"
        type: string
        default: "14"
      cache_days:
        description: "Cache không được dùng quá bao nhiêu ngày thì xoá"
        type: string
        default: "7"
      clean_junk_files:
        description: "Gỡ file rác đang bị track trong repo"
        type: boolean
        default: true
      optimize_images:
        description: "Nén lại ảnh PNG/JPG không mất chất lượng (có kiểm tra từng điểm ảnh)"
        type: boolean
        default: true
      gradle_cache:
        description: "Thêm org.gradle.caching=true vào gradle.properties nếu thiếu"
        type: boolean
        default: true
      apply:
        description: "pull-request = mở PR cho bạn duyệt; report-only = chỉ báo cáo, không đẩy gì"
        type: choice
        options: [pull-request, report-only]
        default: pull-request
      release:
        description: "Build + đăng Release cho app tự cập nhật: always = luôn, if-changed = chỉ khi có thay đổi, off = không"
        type: choice
        options: [always, if-changed, off]
        default: always

permissions:
  contents: read

concurrency:
  group: repo-optimize
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------------------------
  github-cleanup:
    name: Dọn runs / cache / artifact cũ trên GitHub
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.clean_github }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      KEEP_RUNS: ${{ inputs.keep_runs || '10' }}
      DAYS: ${{ inputs.older_than_days || '14' }}
      CACHE_DAYS: ${{ inputs.cache_days || '7' }}
    steps:
      - name: Xoá workflow run cũ (giữ lại K run mới nhất mỗi workflow)
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          echo "Xoá run đã xong, tạo trước ${cutoff}, giữ ${KEEP_RUNS} run mới nhất mỗi workflow (dry_run=${DRY_RUN})"

          gh api --paginate "repos/${REPO}/actions/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[] | [.id, .workflow_id, .created_at] | @tsv' > runs.tsv

          python3 - "$KEEP_RUNS" "$cutoff" <<'PY' > run_ids.txt
          import collections, sys
          keep, cutoff = int(sys.argv[1]), sys.argv[2]
          by = collections.defaultdict(list)
          for line in open("runs.tsv"):
              line = line.rstrip("\n")
              if not line:
                  continue
              rid, wid, created = line.split("\t")
              by[wid].append((created, rid))
          for rows in by.values():
              rows.sort(reverse=True)
              for created, rid in rows[keep:]:
                  if created < cutoff:
                      print(rid)
          PY

          total=$(wc -l < runs.tsv | tr -d ' ')
          n=0
          while read -r id; do
            [ -z "$id" ] && continue
            if [ "$DRY_RUN" != "true" ]; then
              gh api -X DELETE "repos/${REPO}/actions/runs/${id}" --silent || echo "::warning::Không xoá được run ${id}"
            fi
            n=$((n + 1))
          done < run_ids.txt
          echo "RUNS_DELETED=${n}" >> "$GITHUB_ENV"
          echo "RUNS_TOTAL=${total}" >> "$GITHUB_ENV"
          echo "Run: ${n}/${total} $( [ "$DRY_RUN" = "true" ] && echo 'sẽ bị xoá' || echo 'đã xoá' )"

      - name: Xoá Actions cache lâu không dùng
        run: |
          set -uo pipefail
          cutoff=$(date -u -d "-${CACHE_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          gh cache list --limit 1000 --json id,lastAccessedAt,sizeInBytes \
            --jq '.[] | [.id, .lastAccessedAt, .sizeInBytes] | @tsv' > caches.tsv || true
          awk -F'\t' -v c="$cutoff" '$2 < c {print $1 "\t" $3}' caches.tsv > old_caches.tsv
          n=0; bytes=0
          while IFS=$'\t' read -r id size; do
            [ -z "$id" ] && continue
            if [ "$DRY_RUN" != "true" ]; then
              gh cache delete "$id" || echo "::warning::Không xoá được cache ${id}"
            fi
            n=$((n + 1)); bytes=$((bytes + size))
          done < old_caches.tsv
          echo "CACHES_DELETED=${n}" >> "$GITHUB_ENV"
          echo "CACHES_MB=$((bytes / 1048576))" >> "$GITHUB_ENV"
          echo "Cache: ${n} cái, $((bytes / 1048576)) MB $( [ "$DRY_RUN" = "true" ] && echo 'sẽ bị xoá' || echo 'đã xoá' )"

      - name: Xoá artifact cũ
        run: |
          set -uo pipefail
          cutoff=$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | [.id, .created_at, .size_in_bytes] | @tsv' > artifacts.tsv || true
          awk -F'\t' -v c="$cutoff" '$2 < c {print $1 "\t" $3}' artifacts.tsv > old_artifacts.tsv
          n=0; bytes=0
          while IFS=$'\t' read -r id size; do
            [ -z "$id" ] && continue
            if [ "$DRY_RUN" != "true" ]; then
              gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}" --silent || echo "::warning::Không xoá được artifact ${id}"
            fi
            n=$((n + 1)); bytes=$((bytes + size))
          done < old_artifacts.tsv
          echo "ARTIFACTS_DELETED=${n}" >> "$GITHUB_ENV"
          echo "ARTIFACTS_MB=$((bytes / 1048576))" >> "$GITHUB_ENV"
          echo "Artifact: ${n} cái, $((bytes / 1048576)) MB $( [ "$DRY_RUN" = "true" ] && echo 'sẽ bị xoá' || echo 'đã xoá' )"

      - name: Tóm tắt
        if: always()
        run: |
          {
            echo "### Dọn trên GitHub $( [ "$DRY_RUN" = "true" ] && echo '(dry-run, chưa xoá gì)' )"
            echo "| Mục | Số lượng | Dung lượng |"
            echo "|---|---|---|"
            echo "| Workflow run cũ | ${RUNS_DELETED:-0} / ${RUNS_TOTAL:-0} | - |"
            echo "| Cache lâu không dùng | ${CACHES_DELETED:-0} | ${CACHES_MB:-0} MB |"
            echo "| Artifact cũ | ${ARTIFACTS_DELETED:-0} | ${ARTIFACTS_MB:-0} MB |"
            echo ""
            echo "Releases không bị đụng tới."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------------------
  repo-optimize:
    name: Dọn file rác + nén ảnh lossless (mở PR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pushed: ${{ steps.pr.outputs.pushed }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ inputs.release || 'if-changed' }}
      DO_JUNK: ${{ github.event_name != 'workflow_dispatch' || inputs.clean_junk_files }}
      DO_IMAGES: ${{ github.event_name != 'workflow_dispatch' || inputs.optimize_images }}
      DO_GRADLE: ${{ github.event_name != 'workflow_dispatch' || inputs.gradle_cache }}
      APPLY: ${{ inputs.apply || 'pull-request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Gỡ file rác đang bị track
        if: ${{ env.DO_JUNK == 'true' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import fnmatch, os, subprocess

          NAMES = [".DS_Store", "Thumbs.db", "desktop.ini", "*.swp", "*.swo", "*.orig",
                   "*.rej", "*.bak", "*.tmp", "*~", "*.hprof", "*.log"]
          DIRS = {".gradle", ".idea", ".cxx", ".externalNativeBuild", ".kotlin",
                  "__pycache__", "node_modules"}
          PREFIXES = ("build/", "app/build/", "wearos/build/", "tv/build/",
                      "shared/build/", "sharedUi/build/")
          PROTECTED = (".github/", "gradle/wrapper/", "web/fixtures/")

          files = [f for f in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0") if f]
          junk = []
          for f in files:
              if f.startswith(PROTECTED):
                  continue
              parts = f.split("/")
              base = parts[-1]
              if (any(fnmatch.fnmatch(base, p) for p in NAMES)
                      or any(d in DIRS for d in parts[:-1])
                      or f.startswith(PREFIXES)):
                  junk.append(f)

          listing = os.path.join(os.environ["RUNNER_TEMP"], "junk_removed.txt")
          with open(listing, "w") as out:
              out.write("\n".join(junk) + ("\n" if junk else ""))
          if junk:
              subprocess.run(["git", "rm", "-q", "--ignore-unmatch", f"--pathspec-from-file={listing}"],
                             check=True)
          print(f"Gỡ {len(junk)} file rác")
          for f in junk[:50]:
              print("  -", f)
          PY

      - name: Bật Gradle build cache nếu thiếu
        if: ${{ env.DO_GRADLE == 'true' }}
        run: |
          set -euo pipefail
          if [ -f gradle.properties ] && ! grep -qE '^[[:space:]]*org\.gradle\.caching[[:space:]]*=' gradle.properties; then
            printf '\n# Build cache: dùng lại kết quả task giữa các lần build CI, đỡ tốn CPU.\norg.gradle.caching=true\n' >> gradle.properties
            echo "GRADLE_CACHE_ADDED=true" >> "$GITHUB_ENV"
            echo "Đã thêm org.gradle.caching=true"
          else
            echo "gradle.properties đã có org.gradle.caching hoặc không tồn tại, bỏ qua"
          fi

      - name: Cài công cụ nén ảnh
        if: ${{ env.DO_IMAGES == 'true' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends optipng jpegoptim python3-venv
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow

      - name: Nén lại ảnh (lossless, so từng điểm ảnh)
        if: ${{ env.DO_IMAGES == 'true' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import concurrent.futures as cf, os, shutil, subprocess, tempfile
          from PIL import Image

          SKIP_PREFIX = (".github/", "web/fixtures/")
          exts = (".png", ".jpg", ".jpeg")
          files = [f for f in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
                   if f and f.lower().endswith(exts) and not f.startswith(SKIP_PREFIX)
                   and not f.lower().endswith(".9.png") and os.path.isfile(f)]

          backup = tempfile.mkdtemp()

          def pixels(path):
              with Image.open(path) as im:
                  if getattr(im, "is_animated", False):
                      return None
                  im.load()
                  return im.size, im.convert("RGBA").tobytes()

          def run(path):
              before = os.path.getsize(path)
              saved = os.path.join(backup, path.replace("/", "__"))
              shutil.copy2(path, saved)
              try:
                  ref = pixels(saved)
                  if ref is None:
                      return path, before, before, "bỏ qua (ảnh động)"
                  if path.lower().endswith(".png"):
                      cmd = ["optipng", "-o3", "-quiet", "--", path]
                  else:
                      cmd = ["jpegoptim", "--strip-com", "--quiet", "--", path]
                  subprocess.run(cmd, check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  after = os.path.getsize(path)
                  if after >= before:
                      shutil.copy2(saved, path)
                      return path, before, before, "không giảm thêm"
                  if pixels(path) != ref:
                      shutil.copy2(saved, path)
                      return path, before, before, "KHÁC điểm ảnh -> trả về bản gốc"
                  return path, before, after, "ok"
              except Exception as e:  # ảnh hỏng/không đọc được: giữ nguyên bản gốc
                  shutil.copy2(saved, path)
                  return path, before, before, f"lỗi, giữ bản gốc ({type(e).__name__})"

          with cf.ThreadPoolExecutor(max_workers=os.cpu_count() or 2) as ex:
              results = list(ex.map(run, files))

          changed = [(p, b, a) for p, b, a, s in results if s == "ok"]
          reverted = [(p, s) for p, b, a, s in results if s.startswith("KHÁC") or s.startswith("lỗi")]
          saved_bytes = sum(b - a for _, b, a in changed)
          report = os.path.join(os.environ["RUNNER_TEMP"], "images_report.md")
          with open(report, "w") as out:
              out.write(f"- Ảnh đã kiểm tra: {len(files)}, nén được: {len(changed)}, "
                        f"tiết kiệm: {saved_bytes / 1024:.0f} KB\n")
              for p, b, a in sorted(changed, key=lambda x: x[1] - x[2], reverse=True)[:15]:
                  out.write(f"  - `{p}`: {b / 1024:.0f} KB -> {a / 1024:.0f} KB\n")
              for p, s in reverted:
                  out.write(f"  - `{p}`: {s}\n")
          print(open(report).read())
          PY

      - name: Xem có gì thay đổi không
        id: diff
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Không có gì để dọn." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Viết báo cáo
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          {
            echo "## Dọn rác & tối ưu tự động"
            echo
            echo "Chỉ gồm thay đổi an toàn, không đụng logic code, không cắt tính năng."
            echo
            if [ -s "$RUNNER_TEMP/junk_removed.txt" ]; then
              echo "### File rác đã gỡ ($(wc -l < "$RUNNER_TEMP/junk_removed.txt" | tr -d ' '))"
              sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/junk_removed.txt" | head -50
              echo
            fi
            if [ -s "$RUNNER_TEMP/images_report.md" ]; then
              echo "### Ảnh nén lossless"
              cat "$RUNNER_TEMP/images_report.md"
              echo
            fi
            if [ "${GRADLE_CACHE_ADDED:-false}" = "true" ]; then
              echo "### Gradle"
              echo "- Thêm \`org.gradle.caching=true\` vào gradle.properties."
              echo
            fi
            if [ "$RELEASE" != "off" ] && [ "$APPLY" = "pull-request" ]; then
              echo "### Release"
              echo "- Sau khi mở PR, workflow gọi \"Bit Dev APK\" build từ nhánh này và đăng Release, app sẽ tự báo cập nhật."
              echo
            fi
            echo "Merge vào main thì workflow Android Release APK tự build lại để kiểm tra."
          } > "$RUNNER_TEMP/pr_body.md"
          cat "$RUNNER_TEMP/pr_body.md" >> "$GITHUB_STEP_SUMMARY"
          { echo; echo '```'; git diff --cached --stat | tail -8; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Mở Pull Request
        id: pr
        if: steps.diff.outputs.changed == 'true' && env.APPLY == 'pull-request'
        run: |
          set -euo pipefail
          BR="bot/repo-optimize"
          BASE="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$BR"
          git add -A
          git commit -q -m "chore: dọn rác và tối ưu tự động (ảnh lossless, file rác, gradle cache)"
          git push --force -q origin "$BR"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          if [ "$(gh pr list --head "$BR" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base "$BASE" --head "$BR" \
              --title "chore: dọn rác và tối ưu tự động" --body-file "$RUNNER_TEMP/pr_body.md" \
              || echo "::warning::Chưa tạo được PR (bật 'Allow GitHub Actions to create pull requests' trong Settings -> Actions -> General). Nhánh ${BR} đã được đẩy lên, vào tab Pull requests để tạo tay."
          else
            gh pr edit "$BR" --body-file "$RUNNER_TEMP/pr_body.md" || true
          fi

  # ------------------------------------------------------------------------------------
  release:
    name: Build + đăng Release (app tự cập nhật)
    needs: repo-optimize
    if: ${{ needs.repo-optimize.result == 'success' && (inputs.release || 'if-changed') != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.release || 'if-changed' }}
      PUSHED: ${{ needs.repo-optimize.outputs.pushed }}
      BASE: ${{ github.ref_name }}
    steps:
      - name: Gọi workflow "Bit Dev APK" (build, ký, đăng Release)
        run: |
          set -euo pipefail
          if [ "$PUSHED" = "true" ]; then
            REF="bot/repo-optimize"
          elif [ "$MODE" = "always" ]; then
            REF="$BASE"
          else
            echo "Không có thay đổi nào nên không release (chế độ if-changed)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh workflow view "Bit Dev APK" --repo "$GITHUB_REPOSITORY" > /dev/null \
            || { echo "::error::Không thấy workflow \"Bit Dev APK\" (file dev-benchmark (1).yml) trong .github/workflows"; exit 1; }

          # workflow_dispatch bằng GITHUB_TOKEN vẫn kích hoạt được workflow khác (khác với push).
          gh workflow run "Bit Dev APK" --repo "$GITHUB_REPOSITORY" --ref "$REF"
          {
            echo "### Release"
            echo "Đã gọi **Bit Dev APK** trên nhánh \`${REF}\`. Build xong sẽ tự đăng Release mới (latest)."
            echo "Xem tiến độ: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/dev-benchmark%20(1).yml"
            echo "App tự thấy bản mới khi mở lại (cách nhau tối thiểu 10 phút giữa 2 lần hỏi)."
          } | tee -a "$GITHUB_STEP_SUMMARY"
