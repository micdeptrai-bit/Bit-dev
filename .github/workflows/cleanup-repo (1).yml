name: Dọn workflow rác và file rác

# Cách dùng (làm trên điện thoại được):
#  1. Secret WORKFLOW_PAT phải có sẵn (token classic, tick "repo" và "workflow").
#     GITHUB_TOKEN mặc định không được sửa thư mục .github/workflows nên bắt buộc dùng token này.
#  2. Thêm file này vào .github/workflows/cleanup-repo.yml
#  3. Actions -> "Dọn workflow rác và file rác" -> Run workflow:
#       dry_run = true  -> chỉ liệt kê sẽ xóa gì, chưa đụng tới gì (mặc định, nên chạy lần này trước)
#       dry_run = false -> xóa thật rồi commit thẳng vào nhánh đang chạy
#
# XÓA (danh sách ghi cứng, file nào không có thì bỏ qua):
#   Workflow trùng/cũ:
#     - automix-manual-mix.yml, (2), (3), (4): bản cũ của workflow chỉnh tay điểm mix (chỉ giữ bản (5), mới nhất,
#       có đăng APK lên Releases và tải libusb dự phòng). Bản giữ được đổi tên thành automix-manual-mix.yml.
#     - automix-verdict-line (1), (2), (2) (1): bản manual-mix đã chứa sẵn toàn bộ phần này.
#     - cleanup-old-workflows (1).yml: workflow dọn đời cũ (nó còn đòi file verdict-line nên giờ sẽ tự dừng).
#   File lạc:
#     - changed-files-only.zip, bitchord-changed-files.zip: bản nén cũ các file đã sửa, không ai tham chiếu.
#     - automix-stage1-curves.yml ở thư mục gốc: workflow cũ nằm ngoài .github/workflows nên không chạy được.
#     - shared/src/commonMain/kotlin/com/music/bitchord/automix-bpm-key.yml: workflow cũ lạc trong thư mục mã nguồn.
#   Tùy chọn (mặc định KHÔNG xóa): automix-fixes.yml (patch độ tin cậy beat/Camelot, chạy riêng được).
#
# GIỮ NGUYÊN: android.yml, dev-benchmark (1).yml, automix-all-in-one (2).yml (workflow manual-mix bắt buộc cần nó),
# bản manual-mix mới nhất, và toàn bộ mã nguồn, ảnh, tài liệu. Thiếu file bắt buộc là dừng, chưa xóa gì.
# Mọi file xóa vẫn còn trong lịch sử git nên khôi phục lại được.
#
# Tùy chọn delete_old_runs: sau khi xóa file workflow, các lần chạy cũ của nó vẫn nằm trong tab Actions
# thành mục "ma". Bật thì dọn luôn các lần chạy đó (lỗi ở bước này không làm hỏng việc xóa file).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chỉ liệt kê, chưa xóa (bỏ tick để xóa thật)"
        type: boolean
        default: true
      keep_manual_mix:
        description: "Bản workflow manual-mix cần GIỮ (các bản còn lại bị xóa)"
        type: string
        default: "automix-manual-mix (5).yml"
      delete_fixes:
        description: "Xóa luôn automix-fixes.yml"
        type: boolean
        default: false
      delete_stray_files:
        description: "Xóa các file zip/yml lạc ở thư mục gốc và trong mã nguồn"
        type: boolean
        default: true
      delete_old_runs:
        description: "Xóa các lần chạy cũ của workflow bị xóa (dọn mục ma trong tab Actions)"
        type: boolean
        default: true
      delete_self:
        description: "Xóa luôn file dọn dẹp này sau khi xong"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra token
        env:
          PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::Chưa có secret WORKFLOW_PAT (xem hướng dẫn đầu file)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Dọn workflow và file rác
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          DRY: ${{ inputs.dry_run }}
          KEEP_MM: ${{ inputs.keep_manual_mix }}
          DEL_FIXES: ${{ inputs.delete_fixes }}
          DEL_STRAY: ${{ inputs.delete_stray_files }}
          DEL_RUNS: ${{ inputs.delete_old_runs }}
          DEL_SELF: ${{ inputs.delete_self }}
          TARGET_BRANCH: ${{ github.ref_name }}
          WF_REF: ${{ github.workflow_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          WF=".github/workflows"
          # Đường dẫn file này, lấy từ chính lần chạy nên đúng cả khi bạn lưu tên khác (vd có "(1)").
          SELF="$(echo "$WF_REF" | sed -E 's#^[^/]+/[^/]+/(.*)@.*#\1#')"

          # ---- Kiểm tra file bắt buộc: thiếu là dừng, chưa xóa gì ----
          for must in "android.yml" "automix-all-in-one (2).yml" "$KEEP_MM"; do
            if [ ! -f "$WF/$must" ]; then
              echo "::error::Thiếu file bắt buộc '$must'. Dừng, chưa xóa gì. Các workflow hiện có:"
              ls -1 "$WF"
              exit 1
            fi
          done
          # Bản giữ phải đúng là workflow manual-mix và là bản mới (có bước đăng Releases), tránh giữ nhầm bản cũ.
          if ! grep -q "publish_release" "$WF/$KEEP_MM"; then
            echo "::error::'$KEEP_MM' không có phần publish_release, có vẻ là bản cũ. Hãy nhập đúng bản mới nhất vào keep_manual_mix. Dừng."
            exit 1
          fi

          # ---- Danh sách xóa ----
          WF_DELETE=()
          for f in "automix-manual-mix.yml" \
                   "automix-manual-mix (2).yml" "automix-manual-mix (3).yml" \
                   "automix-manual-mix (4).yml" "automix-manual-mix (5).yml" \
                   "automix-verdict-line.yml" "automix-verdict-line (1).yml" \
                   "automix-verdict-line (2).yml" "automix-verdict-line (2) (1).yml" \
                   "cleanup-old-workflows.yml" "cleanup-old-workflows (1).yml"; do
            [ "$f" = "$KEEP_MM" ] && continue
            WF_DELETE+=("$WF/$f")
          done
          if [ "$DEL_FIXES" = "true" ]; then WF_DELETE+=("$WF/automix-fixes.yml"); fi

          STRAY_DELETE=()
          if [ "$DEL_STRAY" = "true" ]; then
            STRAY_DELETE+=(
              "changed-files-only.zip"
              "bitchord-changed-files.zip"
              "automix-stage1-curves.yml"
              "shared/src/commonMain/kotlin/com/music/bitchord/automix-bpm-key.yml"
            )
          fi

          # Chốt an toàn: không bao giờ xóa file bắt buộc giữ, file giữ lại hay chính file này.
          PROTECT=("$WF/android.yml" "$WF/automix-all-in-one (2).yml" "$WF/dev-benchmark (1).yml" "$WF/dev-benchmark.yml" "$WF/$KEEP_MM")
          for f in "${WF_DELETE[@]}" "${STRAY_DELETE[@]}"; do
            for k in "${PROTECT[@]}"; do
              if [ "$f" = "$k" ]; then
                echo "::error::'$f' nằm trong danh sách xóa nhưng là file cần giữ. Dừng."
                exit 1
              fi
            done
          done

          # ---- Liệt kê ----
          echo "=== Workflow sẽ xóa ==="
          found_wf=()
          for f in "${WF_DELETE[@]}"; do
            if [ -e "$f" ]; then echo "  xóa: $f"; found_wf+=("$f"); else echo "  (không có) $f"; fi
          done
          echo "=== File lạc sẽ xóa ==="
          found_stray=()
          for f in "${STRAY_DELETE[@]}"; do
            if [ -e "$f" ]; then echo "  xóa: $f"; found_stray+=("$f"); else echo "  (không có) $f"; fi
          done
          if [ "$KEEP_MM" != "automix-manual-mix.yml" ]; then
            echo "=== Đổi tên ==="
            echo "  '$KEEP_MM' -> 'automix-manual-mix.yml'"
          fi
          echo "=== Workflow còn lại sau khi dọn ==="
          for existing in "$WF"/*; do
            skip=0
            for d in "${found_wf[@]}"; do [ "$existing" = "$d" ] && skip=1; done
            [ "$DEL_SELF" = "true" ] && [ "$existing" = "$SELF" ] && skip=1
            [ "$skip" = "1" ] && continue
            label="$(basename "$existing")"
            [ "$label" = "$KEEP_MM" ] && label="automix-manual-mix.yml (đổi tên từ '$KEEP_MM')"
            echo "  $label"
          done

          if [ "$DRY" = "true" ]; then
            echo "Dry run: chưa xóa gì. Chạy lại với dry_run bỏ tick để xóa thật."
            exit 0
          fi

          # ---- Xóa các lần chạy cũ của workflow bị xóa (trước khi xóa file, vì cần tên file để tìm) ----
          if [ "$DEL_RUNS" = "true" ]; then
            for f in "${found_wf[@]}"; do
              name="$(basename "$f")"
              [ "$f" = "$SELF" ] && continue
              echo "Dọn lần chạy cũ của: $name"
              ids="$(gh run list --repo "$REPO" --workflow "$name" --limit 500 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
              for id in $ids; do
                gh run delete "$id" --repo "$REPO" >/dev/null 2>&1 || echo "  không xóa được lần chạy $id (bỏ qua)"
              done
            done
          fi

          # ---- Xóa thật ----
          for f in "${found_wf[@]}" "${found_stray[@]}"; do
            git rm -q -f -- "$f"
          done
          if [ "$KEEP_MM" != "automix-manual-mix.yml" ]; then
            git mv -f -- "$WF/$KEEP_MM" "$WF/automix-manual-mix.yml"
          fi
          if [ "$DEL_SELF" = "true" ] && [ -e "$SELF" ]; then
            git rm -q -f -- "$SELF"
          fi

          if git diff --cached --quiet; then
            echo "Không có gì để commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove duplicate workflows and stray files"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "Đã xóa và commit vào ${TARGET_BRANCH}."
